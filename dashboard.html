<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin | Future Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --admin-bg: #0f172a; --card-bg: #1e293b; --accent: #38bdf8; --danger: #f43f5e; --success: #10b981; --warning: #fbbf24; }
        body { font-family: 'Cairo', sans-serif; background: var(--admin-bg); color: white; margin: 0; padding: 10px; direction: rtl; }
        
        .resources-panel {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 20px; padding: 20px; margin-bottom: 25px; border: 1px solid #334155;
            display: flex; justify-content: space-around; flex-wrap: wrap; gap: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .resource-box { text-align: center; flex: 1; min-width: 140px; }
        
        .circle-progress {
            width: 90px; height: 90px; border-radius: 50%;
            background: conic-gradient(var(--accent) calc(var(--percent) * 1%), #334155 0deg);
            display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; position: relative;
        }

        .circle-progress::before { content: ""; position: absolute; width: 75px; height: 75px; background: var(--card-bg); border-radius: 50%; }
        .percent-text { position: relative; z-index: 10; font-size: 1.1rem; font-weight: 900; }

        .resource-label { font-size: 0.8rem; color: #94a3b8; }

        .search-container { position: sticky; top: 0; z-index: 100; background: var(--admin-bg); padding: 10px 0; }
        .search-box { background: var(--card-bg); border: 1px solid #334155; border-radius: 12px; display: flex; align-items: center; padding: 5px 15px; }
        .search-box input { background: transparent; border: none; color: white; padding: 10px; width: 100%; font-family: 'Cairo'; outline: none; }

        #authScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--admin-bg); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-box { background: var(--card-bg); padding: 40px 30px; border-radius: 25px; text-align: center; width: 85%; max-width: 400px; border: 1px solid #334155; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        h1 { text-align: center; color: var(--accent); font-size: 1.5rem; margin: 15px 0; font-weight: 900; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--card-bg); padding: 15px 10px; border-radius: 15px; text-align: center; border-bottom: 3px solid var(--accent); }
        .stat-card h3 { font-size: 0.75rem; margin: 0; color: #94a3b8; }
        .stat-card p { font-size: 1.2rem; margin: 5px 0 0; font-weight: 900; }
        
        .store-card { background: var(--card-bg); border-radius: 20px; padding: 18px; margin-bottom: 15px; border: 1px solid #334155; transition: 0.3s; position: relative; }
        .store-card.active-border { border-right: 6px solid var(--success); }
        .store-card.stopped-border { border-right: 6px solid var(--danger); }
        .store-card.pending-border { border-right: 6px solid var(--warning); }

        .store-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        
        .info-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; color: #cbd5e1; }
        .edit-input { background: #0f172a; border: 1px solid #334155; color: white; padding: 8px; border-radius: 8px; width: 100px; text-align: center; font-family: 'Cairo'; }
        
        .btn { padding: 12px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-family: 'Cairo'; font-size: 0.8rem; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }
        .btn-update { background: var(--accent); color: #0f172a; padding: 8px 12px; }
        
        .reports-mini { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; display: flex; justify-content: space-between; margin: 10px 0; font-size: 0.8rem; }
        .timer-info { background: rgba(251, 191, 36, 0.1); color: var(--warning); padding: 8px; border-radius: 10px; font-size: 0.75rem; text-align: center; margin-top: 5px; font-weight: bold; }
        
        .approval-badge { position: absolute; top: -10px; left: 10px; background: var(--warning); color: #000; padding: 2px 10px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; }
    </style>
</head>
<body>

    <div id="authScreen">
        <div class="auth-box">
            <i class="fas fa-user-shield" style="font-size: 3rem; color: var(--accent); margin-bottom: 15px;"></i>
            <h2>دخول المدير حسام 🔐</h2>
            <input type="password" id="adminPass" placeholder="كلمة المرور" style="width:100%; padding:15px; margin-bottom:15px; border-radius:12px; background:#0f172a; border:1px solid #334155; color:white; text-align:center; font-size: 1.2rem;">
            <button id="loginBtn" class="btn" style="width:100%; background: var(--accent); color: #0f172a;">تأكيد الدخول</button>
        </div>
    </div>

    <h1>لوحة الإدارة المركزية 🚀</h1>

    <div class="resources-panel">
        <div class="resource-box">
            <div class="circle-progress" id="dbCircle" style="--percent: 0; --accent: #10b981;">
                <span class="percent-text" id="dbPercent">0%</span>
            </div>
            <span class="resource-label">قاعدة البيانات</span>
        </div>
        <div class="resource-box">
            <div class="circle-progress" id="storageCircle" style="--percent: 0; --accent: #38bdf8;">
                <span class="percent-text" id="stPercent">0%</span>
            </div>
            <span class="resource-label">مساحة الصور</span>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><h3>المتاجر</h3><p id="totalStores">0</p></div>
        <div class="stat-card"><h3>نشطة</h3><p id="activeStores">0</p></div>
        <div class="stat-card"><h3>الطلبات</h3><p id="totalOrders">0</p></div>
    </div>

    <div class="search-container">
        <div class="search-box">
            <input type="text" id="storeSearch" onkeyup="filterStores()" placeholder="🔍 ابحث عن متجر باسمه أو إيميله...">
        </div>
    </div>

    <div id="storesContainer"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
            authDomain: "futuresite-74037.firebaseapp.com",
            databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
            projectId: "futuresite-74037",
            storageBucket: "futuresite-74037.firebasestorage.app",
            appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        document.getElementById('loginBtn').onclick = () => {
            if(document.getElementById('adminPass').value === '2026') document.getElementById('authScreen').style.display='none';
            else alert('كلمة المرور خاطئة!');
        };

        onValue(ref(db, 'stores'), (snapshot) => {
            const data = snapshot.val();
            if(!data) return;

            const container = document.getElementById('storesContainer');
            container.innerHTML = '';
            let total = 0, active = 0, ordersTotal = 0;

            for (let id in data) {
                total++;
                const s = data[id];
                const ordersCount = s.orders ? Object.keys(s.orders).length : 0;
                ordersTotal += ordersCount;

                const isApproved = s.isApproved === true;
                const now = Date.now();
                const expiry = s.expiryDate || 0;
                const isExpired = expiry < now;
                const isRunning = isApproved && s.status === 'active' && !isExpired;

                if(isRunning) active++;
                let daysLeft = !isExpired ? Math.ceil((expiry - now) / 86400000) : 0;

                container.innerHTML += `
                    <div class="store-card ${!isApproved ? 'pending-border' : (isRunning ? 'active-border' : 'stopped-border')}" data-name="${s.name || ''}" data-email="${s.email || ''}">
                        ${!isApproved ? '<span class="approval-badge">في انتظار الموافقة</span>' : ''}
                        
                        <div class="store-header">
                            <div>
                                <b style="color:var(--accent); font-size:1.1rem;">${s.name || 'متجر جديد'}</b><br>
                                <small style="color:#94a3b8;">${s.email || ''}</small>
                            </div>
                            <span style="color:${isRunning ? 'var(--success)' : 'var(--danger)'}; font-size:0.8rem; font-weight:bold;">
                                ${!isApproved ? '● غير مفعل ⚠️' : (isRunning ? '● يعمل ✅' : '● متوقف 🛑')}
                            </span>
                        </div>

                        <div class="reports-mini">
                            <span>مبيعات اليوم: <b style="color:white">${s.reports?.day || 0}</b></span>
                            <span>الطلبات: <b style="color:white">${ordersCount}</b></span>
                        </div>

                        <div class="info-row">
                            <span>كلمة المرور:</span>
                            <input type="text" value="${s.password}" class="edit-input" onchange="up('${id}','password',this.value)">
                        </div>

                        <div class="info-row" style="margin-top:10px; background: rgba(56, 189, 248, 0.05); padding: 10px; border-radius: 12px;">
                            <span>الإشتراك (أيام):</span>
                            <div style="display:flex; gap:5px;">
                                <input type="number" id="days_${id}" placeholder="أيام" class="edit-input" style="width:60px; background:#0f172a;">
                                <button onclick="approveStore('${id}')" class="btn btn-update">${!isApproved ? 'موافقة وتفعيل ✅' : 'تجديد'}</button>
                            </div>
                        </div>

                        <div class="timer-info">
                            <i class="fas fa-clock"></i> ${isApproved ? (daysLeft > 0 ? `باقي ${daysLeft} يوم` : 'الاشتراك منتهي') : 'بانتظار تفعيلك'}
                        </div>

                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:15px;">
                            <button onclick="tog('${id}','${s.status}')" class="btn" style="background:${s.status === 'active' ? '#334155' : 'var(--success)'}; color:white;" ${!isApproved ? 'disabled style="opacity:0.5"' : ''}>
                                ${s.status === 'active' ? 'إيقاف مؤقت 🛑' : 'تشغيل الآن ✅'}
                            </button>
                            <button onclick="del('${id}')" class="btn" style="background:rgba(244, 63, 94, 0.1); color:var(--danger);">حذف المتجر</button>
                        </div>
                    </div>`;
            }
            document.getElementById('totalStores').innerText = total;
            document.getElementById('activeStores').innerText = active;
            document.getElementById('totalOrders').innerText = ordersTotal;
        });

        window.up = (id, f, v) => { const o={}; o[f]=v; update(ref(db, `stores/${id}`), o); };

        // دالة التفعيل والموافقة الموحدة
        window.approveStore = (id) => {
            const daysInput = document.getElementById(`days_${id}`).value;
            if(!daysInput || daysInput <= 0) return alert("من فضلك أدخل عدد أيام الاشتراك أولاً");
            
            const newExpiry = Date.now() + (parseInt(daysInput) * 24 * 60 * 60 * 1000);
            
            update(ref(db, `stores/${id}`), { 
                isApproved: true, 
                expiryDate: newExpiry, 
                status: 'active' 
            }).then(() => {
                alert("تم تفعيل المتجر والموافقة عليه بنجاح! الرابط يعمل الآن ✅");
            });
        };

        window.tog = (id, currentStatus) => {
            const newStatus = (currentStatus === 'active') ? 'stopped' : 'active';
            update(ref(db, `stores/${id}`), { status: newStatus });
        };

        window.del = (id) => { if(confirm('هل تريد حذف المتجر نهائياً؟')) remove(ref(db, `stores/${id}`)); };

        window.filterStores = () => {
            let val = document.getElementById('storeSearch').value.toLowerCase();
            let cards = document.getElementsByClassName('store-card');
            for (let card of cards) {
                let name = card.getAttribute('data-name').toLowerCase();
                let email = card.getAttribute('data-email').toLowerCase();
                card.style.display = (name.includes(val) || email.includes(val)) ? "block" : "none";
            }
        };
    </script>
</body>
</html>
