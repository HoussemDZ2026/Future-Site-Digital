<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Site | دخول التجار</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main: #1e3c72; --accent: #4facfe; --grad: linear-gradient(135deg, #1e3c72 0%, #4facfe 100%); }
        body { font-family: 'Cairo', sans-serif; background: #f0f2f5; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { width: 95%; max-width: 400px; }
        .card { background: white; padding: 30px; border-radius: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: var(--main); margin-bottom: 20px; }
        .input-group { text-align: right; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--main); }
        input { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-family: 'Cairo'; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; font-family: 'Cairo'; font-size: 1.1rem; }
        .btn-login { background: var(--grad); color: white; margin-top: 10px; }
        .btn-outline { background: transparent; border: 2px solid var(--main); color: var(--main); margin-top: 15px; }
        #loginSection, #registerSection { display: none; }
        .loading { display: none; color: var(--main); font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div id="welcomeSection" class="card">
            <div style="font-size: 50px;">🏪</div>
            <h1>Future Site</h1>
            <p>أهلاً بك في منصتك التجارية</p>
            <button class="btn-main btn-login" onclick="showForm('loginSection')">🔑 الدخول إلى متجري</button>
            <button class="btn-main btn-outline" onclick="showForm('registerSection')">✨ إنشاء متجر جديد</button>
        </div>

        <div id="loginSection" class="card">
            <button onclick="showForm('welcomeSection')" style="float:left; border:none; background:#f0f0f0; cursor:pointer; padding:5px 10px; border-radius:5px;">رجوع</button>
            <h2>تسجيل الدخول</h2>
            <div class="input-group">
                <label>اسم المتجر أو البريد الإلكتروني</label>
                <input type="text" id="loginUser" placeholder="أدخل اسم متجرك أو إيميلك">
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="loginPass" placeholder="••••••••">
            </div>
            <button class="btn-main btn-login" id="loginSubmitBtn" onclick="processLogin()">دخول 🚀</button>
            <div id="loader" class="loading">جاري التحقق...</div>
        </div>

        <div id="registerSection" class="card">
            <button onclick="showForm('welcomeSection')" style="float:left; border:none; background:#f0f0f0; cursor:pointer; padding:5px 10px; border-radius:5px;">رجوع</button>
            <h2>فتح متجر جديد</h2>
            <input type="text" id="regName" placeholder="اسم المتجر بالعربي" style="margin-bottom:10px">
            <input type="text" id="regSlug" placeholder="رابط المتجر (انجليزي)" style="margin-bottom:10px; direction:ltr">
            <input type="password" id="regPass" placeholder="كلمة المرور" style="margin-bottom:10px">
            <button class="btn-main btn-login" onclick="processRegister()">إنشاء الآن ✅</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
            authDomain: "futuresite-74037.firebaseapp.com",
            databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
            projectId: "futuresite-74037",
            storageBucket: "futuresite-74037.firebasestorage.app",
            appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // وظيفة التبديل بين الأقسام
        window.showForm = (id) => {
            document.getElementById('welcomeSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('registerSection').style.display = 'none';
            document.getElementById(id).style.display = 'block';
        };

        // تسجيل الدخول
        window.processLogin = async () => {
            const userInput = document.getElementById('loginUser').value.trim().toLowerCase();
            const pass = document.getElementById('loginPass').value;

            if(!userInput || !pass) return alert("من فضلك أدخل البيانات");

            document.getElementById('loginSubmitBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            try {
                const snapshot = await get(ref(db, `stores`));
                if (snapshot.exists()) {
                    const stores = snapshot.val();
                    let foundKey = null;

                    for (let key in stores) {
                        if (key.toLowerCase() === userInput || (stores[key].email && stores[key].email.toLowerCase() === userInput)) {
                            if (stores[key].password === pass) {
                                foundKey = key;
                                break;
                            }
                        }
                    }

                    if (foundKey) {
                        localStorage.setItem('myStoreId', foundKey);
                        // التوجيه لصفحة التاجر
                        window.location.href = 'user-dashboard.html';
                    } else {
                        alert("بيانات الدخول غير صحيحة");
                        resetLoginBtn();
                    }
                } else {
                    alert("لا توجد متاجر مسجلة");
                    resetLoginBtn();
                }
            } catch (e) {
                alert("حدث خطأ في الاتصال");
                resetLoginBtn();
            }
        };

        function resetLoginBtn() {
            document.getElementById('loginSubmitBtn').style.display = 'block';
            document.getElementById('loader').style.display = 'none';
        }

        // تسجيل متجر جديد
        window.processRegister = async () => {
            const name = document.getElementById('regName').value;
            const slug = document.getElementById('regSlug').value.trim().toLowerCase();
            const pass = document.getElementById('regPass').value;

            if(!name || !slug || !pass) return alert("املاً البيانات");

            const check = await get(ref(db, `stores/${slug}`));
            if(check.exists()) return alert("هذا الرابط مستخدم بالفعل");

            set(ref(db, `stores/${slug}`), {
                name: name,
                password: pass,
                date: new Date().toISOString(),
                status: 'نشط'
            }).then(() => {
                localStorage.setItem('myStoreId', slug);
                window.location.href = 'user-dashboard.html';
            });
        };
    </script>
</body>
</html>
