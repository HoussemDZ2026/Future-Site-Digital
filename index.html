<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Site | بوابة التجار</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main: #1e3c72; --accent: #4facfe; --grad: linear-gradient(135deg, #1e3c72 0%, #4facfe 100%); }
        body { font-family: 'Cairo', sans-serif; background: #f0f2f5; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        .container { width: 95%; max-width: 450px; position: relative; }
        .card { background: white; padding: 40px 30px; border-radius: 30px; box-shadow: 0 25px 50px rgba(0,0,0,0.15); text-align: center; }
        h1 { color: var(--main); font-weight: 900; font-size: 2rem; margin-bottom: 10px; }
        .main-btns { display: flex; flex-direction: column; gap: 15px; margin-top: 25px; }
        .btn { width: 100%; padding: 18px; border-radius: 15px; font-weight: bold; font-size: 1.1rem; cursor: pointer; border: none; font-family: 'Cairo'; transition: 0.3s; }
        .btn-create { background: var(--grad); color: white; }
        .btn-login { background: white; color: var(--main); border: 2px solid var(--main); }
        #registrationForm, #loginForm { display: none; text-align: right; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--main); }
        input { width: 100%; padding: 14px; border: 2px solid #eee; border-radius: 12px; font-family: 'Cairo'; box-sizing: border-box; }
        .btn-confirm { background: #2ecc71; color: white; width: 100%; padding: 18px; border-radius: 15px; border: none; font-size: 1.2rem; font-weight: 900; cursor: pointer; margin-top: 10px; }
        .loading-ring { display: none; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid var(--main); border-radius: 50%; animation: spin 1s linear infinite; margin: auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div id="mainGate" class="card">
            <div style="font-size: 60px;">🚀</div>
            <h1>Future Site</h1>
            <p>منصة احترافية لإدارة متجرك الإلكتروني</p>
            <div class="main-btns">
                <button class="btn btn-create" onclick="showForm('registrationForm')">✨ إنشاء متجر جديد</button>
                <button class="btn btn-login" onclick="handleLoginDirect()">🔑 الدخول إلى متجري</button>
            </div>
        </div>

        <div id="loginForm" class="card">
            <button onclick="showGate()" style="float:left; border:none; background:#eee; padding:5px 10px; border-radius:5px;">رجوع</button>
            <h2>تسجيل الدخول</h2>
            <div class="input-group">
                <label>اسم المتجر (الرابط)</label>
                <input type="text" id="l_id" placeholder="مثال: my-store" style="direction:ltr">
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="l_pass" placeholder="••••••••">
            </div>
            <button class="btn-confirm" id="loginBtn" onclick="processLogin()">دخول الآن</button>
            <div id="loader" class="loading-ring"></div>
        </div>

        <div id="registrationForm" class="card">
            <button onclick="showGate()" style="float:left; border:none; background:#eee; padding:5px 10px; border-radius:5px;">رجوع</button>
            <h2>متجر جديد</h2>
            <input type="text" id="r_name" placeholder="اسم المتجر العربي" style="margin-bottom:10px">
            <input type="text" id="r_id" placeholder="رابط المتجر (English)" style="margin-bottom:10px; direction:ltr">
            <input type="password" id="r_pass" placeholder="كلمة المرور" style="margin-bottom:10px">
            <button class="btn-confirm" onclick="processRegister()">إنشاء وتفعيل</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
            authDomain: "futuresite-74037.firebaseapp.com",
            databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
            projectId: "futuresite-74037",
            storageBucket: "futuresite-74037.firebasestorage.app",
            appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.showForm = (id) => { document.getElementById('mainGate').style.display='none'; document.getElementById(id).style.display='block'; };
        window.showGate = () => { document.getElementById('registrationForm').style.display='none'; document.getElementById('loginForm').style.display='none'; document.getElementById('mainGate').style.display='block'; };

        // زر الدخول المباشر
        window.handleLoginDirect = () => {
            const sid = localStorage.getItem('myStoreId');
            if(sid) {
                window.location.href = 'dashboard.html';
            } else {
                showForm('loginForm');
            }
        };

        // عملية تسجيل الدخول
        window.processLogin = async () => {
            const id = document.getElementById('l_id').value.trim().toLowerCase();
            const pass = document.getElementById('l_pass').value;
            if(!id || !pass) return alert("املاً البيانات");

            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            const snapshot = await get(ref(db, `stores/${id}`));
            if(snapshot.exists() && snapshot.val().password === pass) {
                localStorage.setItem('myStoreId', id);
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 500);
            } else {
                alert("بيانات خاطئة!");
                document.getElementById('loginBtn').style.display = 'block';
                document.getElementById('loader').style.display = 'none';
            }
        };

        // عملية التسجيل
        window.processRegister = async () => {
            const name = document.getElementById('r_name').value;
            const id = document.getElementById('r_id').value.trim().toLowerCase();
            const pass = document.getElementById('r_pass').value;
            if(!name || !id || !pass) return alert("املاً البيانات");

            const check = await get(ref(db, `stores/${id}`));
            if(check.exists()) return alert("الرابط محجوز");

            set(ref(db, `stores/${id}`), {
                name: name,
                password: pass,
                date: new Date().toISOString()
            }).then(() => {
                localStorage.setItem('myStoreId', id);
                window.location.href = 'dashboard.html';
            });
        };
    </script>
</body>
</html>
