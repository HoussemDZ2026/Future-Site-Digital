<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة تجار Future Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1e3c72; --secondary: #4facfe; --success: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: white; padding: 35px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h1 { color: var(--primary); margin-bottom: 25px; font-weight: 900; }
        .btn-group { display: flex; flex-direction: column; gap: 15px; }
        .btn { padding: 16px; border-radius: 12px; border: none; font-family: 'Cairo'; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        .btn-login { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; }
        .btn-reg { background: white; color: var(--primary); border: 2px solid var(--primary); }
        .btn-submit { background: var(--success); color: white; width: 100%; margin-top: 15px; font-size: 1.1rem; }
        .form-section { display: none; text-align: right; animation: fadeIn 0.4s; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; }
        input { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-family: 'Cairo'; box-sizing: border-box; outline: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="card">
        <div id="mainView">
            <div style="font-size: 50px; margin-bottom: 10px;">🚀</div>
            <h1>Future Site</h1>
            <div class="btn-group">
                <button class="btn btn-login" onclick="toggleView('loginForm')">🔑 الدخول إلى متجري</button>
                <button class="btn btn-reg" onclick="toggleView('regForm')">✨ إنشاء متجر جديد</button>
            </div>
        </div>

        <div id="loginForm" class="form-section">
            <button onclick="toggleView('mainView')" style="float:left; border:none; background:none; cursor:pointer; color:#888;">✖ إغلاق</button>
            <h2 style="text-align:center">تسجيل الدخول</h2>
            <div class="input-group">
                <label>اسم المتجر أو البريد الإلكتروني</label>
                <input type="text" id="l_input" placeholder="أدخل اليوزر أو الإيميل" style="direction: ltr;">
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="l_pass" placeholder="••••••••">
            </div>
            <button class="btn btn-submit" id="loginBtn" onclick="doLogin()">دخول 🚀</button>
        </div>

        <div id="regForm" class="form-section">
            <button onclick="toggleView('mainView')" style="float:left; border:none; background:none; cursor:pointer; color:#888;">✖ إغلاق</button>
            <h2 style="text-align:center">متجر جديد</h2>
            <input type="text" id="r_name" placeholder="اسم المتجر (بالعربي)" style="margin-bottom:10px; width:100%; padding:12px; border:2px solid #eee; border-radius:10px; font-family:Cairo; box-sizing:border-box;">
            <input type="email" id="r_email" placeholder="البريد الإلكتروني" style="margin-bottom:10px; width:100%; padding:12px; border:2px solid #eee; border-radius:10px; direction:ltr; box-sizing:border-box;">
            <input type="text" id="r_id" placeholder="رابط المتجر (English)" style="margin-bottom:10px; width:100%; padding:12px; border:2px solid #eee; border-radius:10px; direction:ltr; box-sizing:border-box;">
            <input type="password" id="r_pass" placeholder="كلمة المرور" style="margin-bottom:10px; width:100%; padding:12px; border:2px solid #eee; border-radius:10px; box-sizing:border-box;">
            <button class="btn btn-submit" style="background:var(--primary)" onclick="doRegister()">إنشاء وتفعيل ✅</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
            authDomain: "futuresite-74037.firebaseapp.com",
            databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
            projectId: "futuresite-74037",
            storageBucket: "futuresite-74037.firebasestorage.app",
            appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.toggleView = (id) => {
            document.getElementById('mainView').style.display='none';
            document.getElementById('loginForm').style.display='none';
            document.getElementById('regForm').style.display='none';
            document.getElementById(id).style.display='block';
        };

        // وظيفة الدخول الذكي (اسم أو إيميل)
        window.doLogin = async () => {
            const input = document.getElementById('l_input').value.trim().toLowerCase();
            const pass = document.getElementById('l_pass').value;
            if(!input || !pass) return alert("املاً البيانات");

            const snapshot = await get(ref(db, `stores`));
            if(snapshot.exists()) {
                const allStores = snapshot.val();
                let foundId = null;

                for(let id in allStores) {
                    // التحقق هل المدخل يساوي الـ ID أو الإيميل المسجل
                    if(id.toLowerCase() === input || (allStores[id].email && allStores[id].email.toLowerCase() === input)) {
                        if(allStores[id].password === pass) {
                            foundId = id;
                            break;
                        }
                    }
                }

                if(foundId) {
                    localStorage.setItem('myStoreId', foundId);
                    window.location.href = 'user-dashboard.html';
                } else {
                    alert("البيانات خاطئة!");
                }
            }
        };

        window.doRegister = async () => {
            const name = document.getElementById('r_name').value;
            const email = document.getElementById('r_email').value;
            const id = document.getElementById('r_id').value.trim().toLowerCase();
            const pass = document.getElementById('r_pass').value;
            if(!name || !email || !id || !pass) return alert("املاً كل الخانات");

            set(ref(db, `stores/${id}`), {
                name, email, password: pass, status: 'نشط', date: new Date().toISOString()
            }).then(() => {
                localStorage.setItem('myStoreId', id);
                window.location.href = 'user-dashboard.html';
            });
        };
    </script>
</body>
</html>
