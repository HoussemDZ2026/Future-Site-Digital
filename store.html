<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">متجر المستقبل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --primary-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --accent: #3498db; 
            --success: #00b894; 
            --bg: #f4f7f6; 
            --timer-bg: linear-gradient(90deg, #ff4757, #e67e22);
        }
        
        body { font-family: 'Cairo', sans-serif; background: var(--bg); margin: 0; color: #333; overflow-x: hidden; }
        
        #disabledOverlay {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%; 
            background: white; z-index: 99999; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }

        .header { 
            background: var(--primary-gradient); 
            color: white; padding: 50px 20px 80px 20px; text-align: center; 
            border-radius: 0 0 50px 50px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
            border-bottom: 5px solid #FFD700;
        }

        .header h1 { margin: 0; font-size: 2.5rem; font-weight: 900; }

        .welcome-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px; padding: 12px 20px; display: inline-block; margin-top: 15px;
        }

        .container { padding: 30px 15px; max-width: 1100px; margin: -40px auto 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        
        .card { background: white; border-radius: 30px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #eee; transition: 0.4s; position: relative; }
        .card img { width: 100%; height: 280px; object-fit: cover; display: block; }

        .mid-timer {
            background: var(--timer-bg); display: flex; justify-content: space-around;
            padding: 10px 5px; color: white; font-weight: bold;
        }
        .t-section { text-align: center; flex: 1; }
        .t-val { display: block; font-size: 1.2rem; font-weight: 900; }
        .t-txt { display: block; font-size: 0.65rem; opacity: 0.9; }

        .card-content { padding: 20px; text-align: center; }
        .card-content h3 { margin: 10px 0; font-size: 1.4rem; color: #2c3e50; font-weight: 900; }
        .product-desc { font-size: 0.95rem; color: #7f8c8d; margin-bottom: 15px; display: block; white-space: pre-wrap; background: #fdfdfd; padding: 10px; border-radius: 12px; }
        .price { color: #e67e22; font-weight: 900; font-size: 1.7rem; margin-bottom: 15px; display: block; }
        
        .btn-buy { background: var(--success); color: white; border: none; width: 100%; padding: 16px; border-radius: 15px; font-weight: 900; font-size: 1.3rem; cursor: pointer; transition: 0.3s; }
        .btn-buy:hover { transform: scale(1.02); filter: brightness(1.1); }

        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:10000; align-items:center; justify-content:center; padding: 15px; backdrop-filter: blur(5px); }
        .modal-content { background:white; padding:30px; border-radius:30px; width:100%; max-width:450px; position: relative; }
        input { width:100%; padding:15px; margin:10px 0; border:1px solid #eee; border-radius:15px; font-family:'Cairo'; box-sizing:border-box; background: #f9f9f9; font-weight: bold; }
        .btn-send { background: var(--success); color:white; border:none; width:100%; padding:18px; border-radius:15px; font-weight:900; font-size: 1.3rem; cursor:pointer; box-shadow: 0 10px 20px rgba(0, 184, 148, 0.2); }
    </style>
</head>
<body>

    <div id="disabledOverlay">
        <i class="fas fa-store-slash" style="font-size: 4rem; color: #ccc; margin-bottom: 20px;"></i>
        <h2 style="font-weight: 900;">هذا المتجر متوقف حالياً</h2>
        <p style="color: #777;">نعتذر منك، المتجر غير متاح حالياً.</p>
    </div>

    <header class="header">
        <h1 id="storeNameDisplay">تحميل المتجر...</h1>
        <div class="welcome-card">
            <p style="margin:0; color:#fff; font-weight:700;">✨ أهلاً بك.. عروضنا حصرية ولفترة محدودة 🛍️</p>
        </div>
    </header>

    <div class="container">
        <div class="grid" id="productsGrid"></div>
    </div>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h2 style="text-align:center; font-weight:900;">تأكيد الطلبية 🛍️</h2>
            <div style="background:#f0f7ff; padding:15px; border-radius:15px; text-align:center; margin-bottom:15px; border: 1px solid #d1e9ff;">
                <span style="display:block; font-size:0.8rem; color:#666;">المنتج المختار:</span>
                <strong id="targetProduct" style="font-size: 1.2rem; color:#2a5298;">...</strong>
            </div>
            <input type="text" id="cName" placeholder="الاسم واللقب الكامل">
            <input type="number" id="cPhone" placeholder="رقم الهاتف">
            <div style="display:flex; gap:10px;">
                <input type="text" id="cState" placeholder="الولاية">
                <input type="text" id="cCity" placeholder="البلدية">
            </div>
            <input type="number" id="cQty" value="1" min="1" title="الكمية">
            <button class="btn-send" id="submitOrderBtn">إرسال الطلب الآن ✅</button>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:#999; margin-top:15px; cursor:pointer; font-weight:bold;">إلغاء</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, update, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
            authDomain: "futuresite-74037.firebaseapp.com",
            databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
            projectId: "futuresite-74037",
            storageBucket: "futuresite-74037.firebasestorage.app",
            appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const params = new URLSearchParams(window.location.search);
        const storeId = params.get('id');

        if (storeId) {
            onValue(ref(db, `stores/${storeId}`), (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                const now = Date.now();
                const expiry = data.expiryDate || data.expiryTimestamp || 0;
                if (expiry < now) {
                    document.getElementById('disabledOverlay').style.display = 'flex';
                    return;
                }

                document.getElementById('storeNameDisplay').innerText = data.name;
                document.title = data.name;
                
                const grid = document.getElementById('productsGrid');
                grid.innerHTML = "";
                
                if (data.products) {
                    Object.entries(data.products).forEach(([pKey, p]) => {
                        const timerDate = p.timerDate; 
                        const timerId = `timer-${pKey}`;
                        
                        grid.innerHTML += `
                            <div class="card">
                                <img src="${p.image}">
                                ${timerDate ? `
                                <div class="mid-timer" id="${timerId}">
                                    <div class="t-section"><span class="t-val d">0</span><span class="t-txt">يوم</span></div>
                                    <div class="t-section"><span class="t-val h">0</span><span class="t-txt">سا</span></div>
                                    <div class="t-section"><span class="t-val m">0</span><span class="t-txt">د</span></div>
                                    <div class="t-section"><span class="t-val s">0</span><span class="t-txt">ثا</span></div>
                                </div>` : ''}
                                <div class="card-content">
                                    <h3>${p.name}</h3>
                                    <span class="product-desc">${p.description || 'جودة ممتازة - توصيل سريع لمكتبكم'}</span>
                                    <span class="price">${p.price} دج</span>
                                    <button class="btn-buy" onclick="openOrder('${pKey}', '${p.name.replace(/'/g, "\\'")}', '${p.price}')">
                                        اطلب الآن
                                    </button>
                                </div>
                            </div>`;

                        if(timerDate) startTimer(timerDate, timerId);
                    });
                }
            });
        }

        function startTimer(targetTime, elementId) {
            const targetDate = new Date(targetTime).getTime();
            const interval = setInterval(() => {
                const diff = targetDate - Date.now();
                const el = document.getElementById(elementId);
                if (!el || diff < 0) { 
                    if(el) el.style.display = 'none';
                    clearInterval(interval); 
                    return; 
                }
                el.querySelector('.d').innerText = Math.floor(diff / 86400000);
                el.querySelector('.h').innerText = Math.floor((diff % 86400000) / 3600000);
                el.querySelector('.m').innerText = Math.floor((diff % 3600000) / 60000);
                el.querySelector('.s').innerText = Math.floor((diff % 60000) / 1000);
            }, 1000);
        }

        let currentP = {};
        window.openOrder = (key, name, price) => {
            currentP = { key, name, price };
            document.getElementById('targetProduct').innerText = name;
            document.getElementById('orderModal').style.display = 'flex';
        };

        window.closeModal = () => document.getElementById('orderModal').style.display = 'none';

        document.getElementById('submitOrderBtn').onclick = () => {
            const name = document.getElementById('cName').value, phone = document.getElementById('cPhone').value, 
                  state = document.getElementById('cState').value, city = document.getElementById('cCity').value, 
                  qty = document.getElementById('cQty').value;

            if(!name || !phone || !state || !city) return alert("يرجى ملء كافة البيانات!");

            const orderRef = ref(db, `stores/${storeId}/orders`);
            const reportRef = ref(db, `stores/${storeId}/reports`);

            push(orderRef, {
                productName: currentP.name, 
                productPrice: currentP.price,
                customerName: name, 
                customerPhone: phone, 
                customerState: state, 
                customerAddress: city, // تم التعديل ليتوافق مع لوحة التحكم
                quantity: qty, 
                timestamp: Date.now()
            }).then(() => {
                // تحديث التقارير: زيادة عدد المبيعات (+1)
                update(reportRef, {
                    day: increment(1),
                    week: increment(1),
                    month: increment(1)
                });
                alert("شكراً لك! تم استلام طلبك بنجاح ✅");
                closeModal();
            });
        };
    </script>
</body>
</html>
