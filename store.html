<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">متجر المستقبل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --primary-gradient: linear-gradient(135deg, #1e3c72, #2a5298);
            --accent: #3498db; 
            --success: #00b894; 
            --bg: #f4f7f6; 
            --timer-bg: linear-gradient(90deg, #ff4757, #e67e22);
        }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); margin: 0; color: #333; overflow-x: hidden; }
        #disabledOverlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: white; z-index: 99999; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .header { background: var(--primary-gradient); color: white; padding: 50px 20px 80px 20px; text-align: center; border-radius: 0 0 50px 50px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); border-bottom: 5px solid #FFD700; }
        .header h1 { margin: 0; font-size: 2.5rem; font-weight: 900; }
        .welcome-card { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 20px; padding: 12px 20px; display: inline-block; margin-top: 15px; }
        .container { padding: 30px 15px; max-width: 1100px; margin: -40px auto 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .card { background: white; border-radius: 30px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #eee; transition: 0.4s; position: relative; }
        .card img { width: 100%; height: 280px; object-fit: cover; display: block; }
        .mid-timer { background: var(--timer-bg); display: flex; justify-content: space-around; padding: 10px 5px; color: white; font-weight: bold; }
        .t-section { text-align: center; flex: 1; }
        .t-val { display: block; font-size: 1.2rem; font-weight: 900; }
        .t-txt { display: block; font-size: 0.65rem; opacity: 0.9; }
        .card-content { padding: 20px; text-align: center; }
        .card-content h3 { margin: 10px 0; font-size: 1.4rem; color: #2c3e50; font-weight: 900; }
        .product-desc { font-size: 0.95rem; color: #7f8c8d; margin-bottom: 15px; display: block; white-space: pre-wrap; background: #fdfdfd; padding: 10px; border-radius: 12px; }
        .price { color: #e67e22; font-weight: 900; font-size: 1.7rem; margin-bottom: 15px; display: block; }
        .btn-buy { background: var(--success); color: white; border: none; width: 100%; padding: 16px; border-radius: 15px; font-weight: 900; font-size: 1.3rem; cursor: pointer; transition: 0.3s; }
        
        /* Modal Style */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:10000; align-items:center; justify-content:center; padding: 15px; backdrop-filter: blur(5px); }
        .modal-content { background:white; padding:30px; border-radius:30px; width:100%; max-width:450px; position: relative; }
        input { width:100%; padding:15px; margin:10px 0; border:1px solid #eee; border-radius:15px; font-family:'Cairo'; box-sizing:border-box; background: #f9f9f9; font-weight: bold; }
        .btn-send { background: var(--success); color:white; border:none; width:100%; padding:18px; border-radius:15px; font-weight:900; font-size: 1.3rem; cursor:pointer; }

        .success-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 20000; justify-content: center; align-items: center; }
        .success-content { background: white; padding: 40px 20px; border-radius: 35px; text-align: center; max-width: 400px; width: 90%; animation: popIn 0.5s; border-bottom: 10px solid var(--success); }
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div id="disabledOverlay">
        <i class="fas fa-store-slash" style="font-size: 4rem; color: #ccc; margin-bottom: 20px;"></i>
        <h2 style="font-weight: 900;">المتجر غير متاح</h2>
        <p>نعتذر، انتهت صلاحية هذا المتجر.</p>
    </div>

    <div id="successModal" class="success-modal">
        <div class="success-content">
            <i class="fas fa-check-circle" style="font-size: 70px; color: var(--success);"></i>
            <h2>تم الطلب بنجاح!</h2>
            <p>سوف نتصل بك لتأكيد الطلب قريباً.</p>
            <button onclick="closeSuccessModal()" style="background:var(--success); color:white; border:none; padding:15px; border-radius:15px; width:100%; font-weight:900; margin-top:20px; cursor:pointer;">موافق</button>
        </div>
    </div>

    <header class="header">
        <h1 id="storeNameDisplay">...</h1>
        <div class="welcome-card"><p>✨ أهلاً بك.. عروضنا حصرية لفترة محدودة 🛍️</p></div>
    </header>

    <div class="container">
        <div class="grid" id="productsGrid"></div>
    </div>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h2 style="text-align:center;">تأكيد الطلبية 🛍️</h2>
            <div style="background:#f0f7ff; padding:10px; border-radius:12px; text-align:center; margin-bottom:10px;">
                <strong id="targetProduct">...</strong>
            </div>
            <input type="text" id="cName" placeholder="الاسم الكامل">
            <input type="number" id="cPhone" placeholder="رقم الهاتف">
            <input type="text" id="cState" placeholder="الولاية">
            <input type="text" id="cCity" placeholder="البلدية">
            <button class="btn-send" id="submitOrderBtn">إرسال الطلب ✅</button>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:#999; margin-top:10px; cursor:pointer;">إلغاء</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, update, increment, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
            authDomain: "futuresite-74037.firebaseapp.com",
            databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
            projectId: "futuresite-74037",
            storageBucket: "futuresite-74037.firebasestorage.app",
            appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const params = new URLSearchParams(window.location.search);
        const storeId = params.get('id');

        if (storeId) {
            onValue(ref(db, `stores/${storeId}`), (snapshot) => {
                const data = snapshot.val();
                if (!data) return;
                const now = Date.now();
                const expiry = data.expiryDate || data.expiryTimestamp || 0;
                if (expiry < now) { document.getElementById('disabledOverlay').style.display = 'flex'; return; }
                document.getElementById('storeNameDisplay').innerText = data.name;
                const grid = document.getElementById('productsGrid'); grid.innerHTML = "";
                if (data.products) {
                    Object.entries(data.products).forEach(([pKey, p]) => {
                        grid.innerHTML += `
                            <div class="card">
                                <img src="${p.image}">
                                <div class="card-content">
                                    <h3>${p.name}</h3>
                                    <span class="product-desc">${p.description || ''}</span>
                                    <span class="price">${p.price} دج</span>
                                    <button class="btn-buy" onclick="openOrder('${pKey}', '${p.name.replace(/'/g, "\\'")}', '${p.price}')">اطلب الآن</button>
                                </div>
                            </div>`;
                    });
                }
            });
        }

        let currentP = {};
        window.openOrder = (key, name, price) => {
            currentP = { key, name, price };
            document.getElementById('targetProduct').innerText = name;
            document.getElementById('orderModal').style.display = 'flex';
        };
        window.closeModal = () => document.getElementById('orderModal').style.display = 'none';
        window.closeSuccessModal = () => document.getElementById('successModal').style.display = 'none';

        document.getElementById('submitOrderBtn').onclick = async () => {
            const name = document.getElementById('cName').value, phone = document.getElementById('cPhone').value, state = document.getElementById('cState').value, city = document.getElementById('cCity').value;
            if(!name || !phone || !state || !city) return alert("يرجى ملء كافة البيانات!");
            
            try {
                await push(ref(db, `stores/${storeId}/orders`), {
                    productName: currentP.name, customerName: name, customerPhone: phone, customerState: state, customerAddress: city, timestamp: Date.now()
                });
                closeModal();
                document.getElementById('successModal').style.display = 'flex';
            } catch (e) { alert("خطأ في الإرسال"); }
        };
    </script>
</body>
</html>
