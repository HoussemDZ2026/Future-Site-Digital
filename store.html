<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">متجر المستقبل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --primary-gradient: linear-gradient(135deg, #1e3799 0%, #0984e3 100%);
            --accent: #00f2fe; 
            --success: #2ecc71; 
            --bg: #f4f7f6; 
            --price-color: #e67e22;
        }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); margin: 0; color: #333; overflow-x: hidden; }
        
        /* شاشة التوقف المحدثة */
        #disabledOverlay { 
            display: none; position: fixed; top:0; left:0; width:100%; height:100%; 
            background: white; z-index: 99999; flex-direction: column; 
            align-items: center; justify-content: center; text-align: center; padding: 20px;
        }
        
        .header { background: var(--primary-gradient); color: white; padding: 40px 20px 70px 20px; text-align: center; border-radius: 0 0 40px 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); position: relative; }
        .header h1 { margin: 0; font-size: 2rem; font-weight: 900; letter-spacing: -1px; }
        .welcome-card { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border-radius: 15px; padding: 10px 20px; display: inline-block; margin-top: 15px; font-weight: bold; font-size: 0.9rem; }
        
        .container { padding: 20px 15px; max-width: 1000px; margin: -30px auto 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        
        /* كرت المنتج المطور */
        .card { background: white; border-radius: 25px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border: 1px solid #f0f0f0; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 250px; object-fit: cover; }
        .card-content { padding: 20px; text-align: center; }
        .card-content h3 { margin: 0 0 10px 0; font-size: 1.3rem; color: #2c3e50; font-weight: 800; }
        .product-desc { font-size: 0.9rem; color: #7f8c8d; margin-bottom: 15px; display: block; height: 40px; overflow: hidden; }
        .price { color: var(--price-color); font-weight: 900; font-size: 1.6rem; margin-bottom: 15px; display: block; }
        
        .btn-buy { background: var(--success); color: white; border: none; width: 100%; padding: 14px; border-radius: 15px; font-weight: 900; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .btn-buy:active { transform: scale(0.95); }

        /* Modal */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:10000; align-items:center; justify-content:center; padding: 15px; backdrop-filter: blur(5px); }
        .modal-content { background:white; padding:25px; border-radius:25px; width:100%; max-width:400px; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .input-group { position: relative; margin-bottom: 10px; }
        .input-group i { position: absolute; right: 15px; top: 15px; color: #aaa; }
        input { width:100%; padding:14px 40px 14px 15px; border:2px solid #f0f0f0; border-radius:12px; font-family:'Cairo'; box-sizing:border-box; font-weight: bold; transition: 0.3s; }
        input:focus { border-color: var(--success); outline: none; background: #fff; }
        
        .btn-send { background: var(--success); color:white; border:none; width:100%; padding:16px; border-radius:15px; font-weight:900; font-size: 1.2rem; cursor:pointer; margin-top: 10px; box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3); }

        /* Success State */
        .success-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 20000; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    </style>
</head>
<body>

    <div id="disabledOverlay">
        <i class="fas fa-store-slash" style="font-size: 4rem; color: #ff4757; margin-bottom: 20px;"></i>
        <h2 id="stopTitle">المتجر متوقف</h2>
        <p id="stopMsg">يرجى العودة لاحقاً</p>
    </div>

    <div id="successModal" class="success-modal">
        <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script> 
        <dotlottie-player src="https://lottie.host/76d97f6c-829d-437b-9190-64295f7004f2/vFzVOnX9yZ.json" background="transparent" speed="1" style="width: 200px; height: 200px;" loop autoplay></dotlottie-player>
        <h2 style="color: var(--success); font-weight: 900;">تم استلام طلبك بنجاح!</h2>
        <p style="font-weight: bold; color: #666;">سنتصل بك هاتفياً لتأكيد العنوان وشحن المنتج 🚚</p>
        <button onclick="location.reload()" style="background:#f0f0f0; border:none; padding:12px 30px; border-radius:50px; font-weight:bold; cursor:pointer; margin-top:20px;">العودة للمتجر</button>
    </div>

    <header class="header">
        <h1 id="storeNameDisplay">جاري التحميل...</h1>
        <div class="welcome-card">🚚 التوصيل متوفر لجميع الولايات</div>
    </header>

    <div class="container">
        <div class="grid" id="productsGrid"></div>
    </div>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h3 style="text-align:center; margin-top:0;">إكمال الطلب 📦</h3>
            <div style="background:#f8f9fa; padding:10px; border-radius:12px; text-align:center; margin-bottom:15px; border-right:5px solid var(--success);">
                <span style="font-size: 0.8rem; color: #777;">المنتج المختار:</span><br>
                <strong id="targetProduct">...</strong>
            </div>
            
            <div class="input-group"><i class="fas fa-user"></i><input type="text" id="cName" placeholder="الاسم الكامل"></div>
            <div class="input-group"><i class="fas fa-phone"></i><input type="number" id="cPhone" placeholder="رقم الهاتف"></div>
            <div class="input-group"><i class="fas fa-map-marker-alt"></i><input type="text" id="cState" placeholder="الولاية"></div>
            <div class="input-group"><i class="fas fa-home"></i><input type="text" id="cCity" placeholder="البلدية والعنوان"></div>
            
            <button class="btn-send" id="submitOrderBtn">تأكيد الطلب الآن</button>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:#aaa; margin-top:15px; cursor:pointer; font-weight:bold;">إغلاق</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
            authDomain: "futuresite-74037.firebaseapp.com",
            databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
            projectId: "futuresite-74037",
            storageBucket: "futuresite-74037.firebasestorage.app",
            appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const params = new URLSearchParams(window.location.search);
        const storeId = params.get('id');

        if (storeId) {
            onValue(ref(db, `stores/${storeId}`), (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                const now = Date.now();
                const expiry = data.expiryDate ? Number(data.expiryDate) : 0;
                if ((expiry > 0 && expiry < now) || data.status === 'stopped') {
                    document.getElementById('disabledOverlay').style.display = 'flex';
                    return;
                }

                document.getElementById('storeNameDisplay').innerText = data.name;
                document.title = data.name + " | المتجر الرسمي";
                
                const grid = document.getElementById('productsGrid'); 
                grid.innerHTML = "";
                if (data.products) {
                    Object.entries(data.products).forEach(([id, p]) => {
                        grid.innerHTML += `
                            <div class="card">
                                <img src="${p.image}" alt="${p.name}">
                                <div class="card-content">
                                    <h3>${p.name}</h3>
                                    <span class="product-desc">${p.description || 'لا يوجد وصف'}</span>
                                    <span class="price">${p.price} دج</span>
                                    <button class="btn-buy" onclick="openOrder('${id}', '${p.name.replace(/'/g, "\\'")}', '${p.price}')">
                                        <i class="fas fa-shopping-cart"></i> اطلب الآن
                                    </button>
                                </div>
                            </div>`;
                    });
                }
            });
        }

        let currentP = {};
        window.openOrder = (id, name, price) => {
            currentP = { name, price };
            document.getElementById('targetProduct').innerText = name;
            document.getElementById('orderModal').style.display = 'flex';
        };
        window.closeModal = () => document.getElementById('orderModal').style.display = 'none';

        document.getElementById('submitOrderBtn').onclick = async () => {
            const btn = document.getElementById('submitOrderBtn');
            const n = document.getElementById('cName').value, 
                  ph = document.getElementById('cPhone').value, 
                  st = document.getElementById('cState').value, 
                  ct = document.getElementById('cCity').value;
            
            if(!n || !ph || !st || !ct) return alert("من فضلك، املأ جميع الخانات!");
            
            btn.disabled = true;
            btn.innerText = "جاري الإرسال...";

            // تم توحيد المسميات هنا لتعمل مع لوحة التحكم المحدثة
            const orderData = {
                productName: currentP.name,
                customerName: n,
                phone: ph,       // تم التغيير ليتوافق مع اللوحة
                wilaya: st,      // تم التغيير ليتوافق مع اللوحة
                baladia: ct,     // تم التغيير ليتوافق مع اللوحة
                date: new Date().toLocaleDateString('ar-DZ'),
                timestamp: Date.now()
            };

            try {
                await push(ref(db, `stores/${storeId}/orders`), orderData);
                document.getElementById('orderModal').style.display = 'none';
                document.getElementById('successModal').style.display = 'flex';
            } catch (e) { 
                alert("عذراً، حدث خطأ. حاول ثانية.");
                btn.disabled = false;
                btn.innerText = "تأكيد الطلب الآن";
            }
        };
    </script>
</body>
</html>
