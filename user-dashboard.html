<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --blue-grad: linear-gradient(135deg, #1e3799 0%, #0984e3 100%);
            --time-bg: #1e272e;
            --support-grad: linear-gradient(135deg, #00b894 0%, #55efc4 100%);
            --tg-color: #0088cc;
            --danger: #d63031;
            --edit-color: #f39c12;
        }

        body { font-family: 'Cairo', sans-serif; background-color: #f1f2f6; margin: 0; padding: 15px; padding-bottom: 50px; }
        .container { max-width: 600px; margin: auto; }

        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .card-name { background: var(--blue-grad); color: white; text-align: center; }
        .card-expiry { background: var(--time-bg); color: #00f2fe; text-align: center; }
        
        /* أزرار العمليات الكبيرة */
        .action-btn { width: 100%; padding: 18px; border-radius: 20px; border: none; font-weight: 900; color: white; cursor: pointer; margin-bottom: 12px; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .btn-add { background: #2ecc71; box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3); }
        .btn-manage { background: #0984e3; box-shadow: 0 5px 15px rgba(9, 132, 227, 0.3); }
        .btn-orders { background: #6c5ce7; box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3); }

        .content-area { display: none; background: white; padding: 15px; border-radius: 20px; margin-bottom: 20px; border: 1px solid #ddd; }

        /* تنسيق قائمة المنتجات في الإدارة */
        .prod-manage-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid #eee; }
        .prod-info { flex: 1; }
        .prod-actions { display: flex; gap: 8px; }
        .btn-circle { width: 35px; height: 35px; border-radius: 50%; border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* المودال */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 92%; max-width: 500px; background: white; padding: 25px; border-radius: 30px; z-index: 2000; box-shadow: 0 0 50px rgba(0,0,0,0.4); }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #ddd; font-family: 'Cairo'; box-sizing: border-box; }
        
        .phone-big { background: #2d3436; color: #00f2fe; font-size: 1.8rem; font-weight: 900; text-align: center; padding: 10px; border-radius: 15px; display: block; text-decoration: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="card card-name"><h1 id="storeName">تحميل...</h1></div>

    <div class="card" style="text-align:center; border: 2px solid #6c5ce7;">
        <h4 style="margin:0; color:#6c5ce7;">🔗 رابط المتجر</h4>
        <div id="storeUrl" style="font-weight:bold; color:#555; margin-top:5px;">...</div>
    </div>

    <div class="card card-expiry">
        <h4 style="margin:0; color:white;">⏳ مدة صلاحية المتجر</h4>
        <div style="display:flex; justify-content:center; gap:8px; margin-top:10px; font-weight:bold;">
            <span id="d">00</span> يوم : <span id="h">00</span> سا : <span id="m">00</span> د : <span id="s">00</span> ثا
        </div>
    </div>

    <a href="https://wa.me/213561150865" class="action-btn" style="background:var(--support-grad);"><i class="fab fa-whatsapp"></i> التواصل مع الإدارة</a>

    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin-bottom:20px;">
        <div class="card" style="text-align:center; padding:10px; margin:0;"><small>اليوم</small><b id="salesToday" style="display:block; color:red;">0</b><button onclick="resetSale('today')" style="font-size:0.6rem;">تصفير</button></div>
        <div class="card" style="text-align:center; padding:10px; margin:0;"><small>الأسبوع</small><b id="salesWeek" style="display:block; color:red;">0</b><button onclick="resetSale('week')" style="font-size:0.6rem;">تصفير</button></div>
        <div class="card" style="text-align:center; padding:10px; margin:0;"><small>الشهر</small><b id="salesMonth" style="display:block; color:red;">0</b><button onclick="resetSale('month')" style="font-size:0.6rem;">تصفير</button></div>
    </div>

    <button class="action-btn btn-orders" onclick="toggleDiv('ordersDiv')"><i class="fas fa-shopping-cart"></i> الطلبيات الواردة</button>
    <div id="ordersDiv" class="content-area"><div id="ordersList"></div></div>

    <button class="action-btn btn-add" onclick="openAddModal()"><i class="fas fa-plus-circle"></i> إضافة منتج جديد</button>

    <button class="action-btn btn-manage" onclick="toggleDiv('manageDiv')"><i class="fas fa-edit"></i> إدارة المنتجات (تعديل/حذف)</button>
    <div id="manageDiv" class="content-area"><div id="productsList"></div></div>
</div>

<div id="overlay" class="overlay" onclick="closeModal()"></div>
<div id="productModal" class="modal">
    <h3 id="modalTitle" style="text-align:center;">إضافة منتج</h3>
    <input type="hidden" id="editKey">
    <input type="text" id="pName" placeholder="اسم المنتج">
    <input type="number" id="pPrice" placeholder="السعر (دج)">
    <textarea id="pDesc" rows="3" placeholder="وصف المنتج..."></textarea>
    <div id="imgSection">
        <input type="file" id="pImage" accept="image/*">
        <small style="color:red;">* اتركه فارغاً عند التعديل إذا كنت لا تريد تغيير الصورة</small>
    </div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:15px;">
        <button id="saveBtn" style="background:#2ecc71; color:white; border:none; padding:15px; border-radius:15px; font-weight:bold;">حفظ ✅</button>
        <button onclick="closeModal()" style="background:#eee; border:none; padding:15px; border-radius:15px;">إلغاء</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storeId = localStorage.getItem('myStoreId');

    if (storeId) {
        // جلب بيانات المتجر
        onValue(ref(db, `stores/${storeId}`), s => {
            if(s.exists()){
                const d = s.val();
                document.getElementById('storeName').innerText = d.name;
                document.getElementById('storeUrl').innerText = "future-site.com/" + storeId;
                document.getElementById('salesToday').innerText = d.sales?.today || 0;
                document.getElementById('salesWeek').innerText = d.sales?.week || 0;
                document.getElementById('salesMonth').innerText = d.sales?.month || 0;
                
                setInterval(() => {
                    const diff = new Date(d.expiryDate).getTime() - new Date().getTime();
                    if(diff > 0){
                        document.getElementById('d').innerText = Math.floor(diff / 864e5);
                        document.getElementById('h').innerText = Math.floor((diff % 864e5) / 36e5);
                        document.getElementById('m').innerText = Math.floor((diff % 36e5) / 6e4);
                        document.getElementById('s').innerText = Math.floor((diff % 6e4) / 1000);
                    }
                }, 1000);
            }
        });

        // قائمة المنتجات مع التعديل والحذف
        onValue(ref(db, `stores/${storeId}/products`), snap => {
            const list = document.getElementById('productsList'); list.innerHTML = "";
            if(snap.exists()) {
                Object.entries(snap.val()).forEach(([k, p]) => {
                    list.innerHTML += `
                    <div class="prod-manage-item">
                        <img src="${p.image}" width="45" height="45" style="border-radius:10px; object-fit:cover;">
                        <div class="prod-info"><b>${p.name}</b><br><small>${p.price} دج</small></div>
                        <div class="prod-actions">
                            <button onclick="editProd('${k}', '${p.name}', '${p.price}', '${p.description}')" class="btn-circle" style="background:var(--edit-color)"><i class="fas fa-pen"></i></button>
                            <button onclick="deleteProd('${k}')" class="btn-circle" style="background:var(--danger)"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>`;
                });
            }
        });

        // قائمة الطلبيات
        onValue(ref(db, `stores/${storeId}/orders`), snap => {
            const list = document.getElementById('ordersList'); list.innerHTML = "";
            if(snap.exists()) {
                Object.entries(snap.val()).reverse().forEach(([k, o]) => {
                    list.innerHTML += `
                    <div class="card" style="border-right:8px solid #6c5ce7; margin-bottom:10px;">
                        <b>👤 ${o.customerName}</b>
                        <a href="tel:${o.customerPhone}" class="phone-big">${o.customerPhone}</a>
                        <div style="font-size:0.8rem; margin-top:5px;">📍 ${o.customerState} | 🛒 ${o.productName}</div>
                        <button onclick="deleteOrder('${k}')" style="margin-top:10px; color:red; border:none; background:none; cursor:pointer;">حذف الطلبية X</button>
                    </div>`;
                });
            }
        });
    }

    // وظيفة الحفظ (إضافة أو تعديل)
    window.saveBtn.onclick = async () => {
        const key = document.getElementById('editKey').value;
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        const desc = document.getElementById('pDesc').value;
        const file = document.getElementById('pImage').files[0];

        if(!name || !price) return alert("أكمل البيانات الأساسية");

        window.saveBtn.disabled = true; window.saveBtn.innerText = "جاري الحفظ...";

        let imgUrl = "";
        if(file) {
            const fd = new FormData(); fd.append("image", file);
            const res = await fetch("https://api.imgbb.com/1/upload?key=e48055a00c4440331de482c9a7b18e01", { method: "POST", body: fd });
            const json = await res.json();
            imgUrl = json.data.url;
        }

        const productData = { name, price, description: desc };
        if(imgUrl) productData.image = imgUrl;

        if(key) { // تعديل
            update(ref(db, `stores/${storeId}/products/${key}`), productData).then(() => closeModal());
        } else { // إضافة جديد
            if(!imgUrl) { alert("يجب اختيار صورة للمنتج الجديد"); window.saveBtn.disabled = false; return; }
            push(ref(db, `stores/${storeId}/products`), productData).then(() => closeModal());
        }
        window.saveBtn.disabled = false; window.saveBtn.innerText = "حفظ ✅";
    };

    // التحكم بالواجهة
    window.openAddModal = () => {
        document.getElementById('modalTitle').innerText = "إضافة منتج جديد";
        document.getElementById('editKey').value = "";
        document.getElementById('pName').value = "";
        document.getElementById('pPrice').value = "";
        document.getElementById('pDesc').value = "";
        document.getElementById('productModal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    };

    window.editProd = (key, name, price, desc) => {
        document.getElementById('modalTitle').innerText = "تعديل المنتج";
        document.getElementById('editKey').value = key;
        document.getElementById('pName').value = name;
        document.getElementById('pPrice').value = price;
        document.getElementById('pDesc').value = desc;
        document.getElementById('productModal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    };

    window.closeModal = () => { document.getElementById('productModal').style.display = 'none'; document.getElementById('overlay').style.display = 'none'; };
    window.toggleDiv = (id) => { const el = document.getElementById(id); el.style.display = (el.style.display === 'block') ? 'none' : 'block'; };
    window.deleteProd = (id) => { if(confirm("حذف المنتج؟")) remove(ref(db, `stores/${storeId}/products/${id}`)); };
    window.deleteOrder = (id) => { if(confirm("حذف الطلب؟")) remove(ref(db, `stores/${storeId}/orders/${id}`)); };
    window.resetSale = (type) => { if(confirm("تصفير؟")) update(ref(db, `stores/${storeId}/sales`), {[type]: 0}); };
</script>
</body>
</html>
