<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --main-grad: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gold-grad: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            --danger-grad: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            --success-grad: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
            --link-box-grad: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --logout-grad: linear-gradient(135deg, #434343 0%, #000000 100%);
        }

        body { font-family: 'Cairo', sans-serif; background-color: #f0f2f5; margin: 0; padding-bottom: 50px; color: #333; }
        .container { max-width: 900px; margin: auto; padding: 15px; }

        .top-nav { display: flex; justify-content: flex-start; padding: 10px 0; margin-bottom: 10px; }
        .btn-logout { background: var(--logout-grad); color: white; border: none; padding: 10px 20px; border-radius: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        .status-warning {
            background: #fff5f5; border: 2px solid #feb2b2; padding: 15px; border-radius: 20px; 
            margin-bottom: 20px; display: none; align-items: center; gap: 15px; 
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0px rgba(245, 101, 101, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(245, 101, 101, 0); }
            100% { box-shadow: 0 0 0 0px rgba(245, 101, 101, 0); }
        }

        .store-title-card { 
            background: var(--main-grad); color: white; padding: 30px; 
            border-radius: 25px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            margin-bottom: 25px; border: 3px solid #fff;
        }

        .support-card {
            background: var(--gold-grad); padding: 20px; border-radius: 25px;
            text-align: center; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(253, 160, 133, 0.4);
            border: 2px solid #fff; text-decoration: none; display: block; transition: 0.3s;
        }
        .wa-btn-inner { background: #fff; color: #25D366; padding: 12px 30px; border-radius: 50px; display: inline-flex; align-items: center; gap: 10px; font-weight: 900; }

        .link-section { background: var(--link-box-grad); padding: 30px 20px; border-radius: 30px; text-align: center; margin-bottom: 25px; }
        .link-box { background: rgba(255, 255, 255, 0.1); padding: 18px; border: 2px dashed rgba(255, 255, 255, 0.4); border-radius: 18px; color: #fff; font-weight: bold; word-break: break-all; margin-bottom: 20px; }
        .btn-copy-new { background: #fff; color: #1e3c72; border: none; padding: 14px 40px; border-radius: 15px; cursor: pointer; font-weight: 900; transition: 0.3s; }

        #copyToast {
            visibility: hidden; min-width: 280px; background: var(--success-grad); color: #fff;
            text-align: center; border-radius: 20px; padding: 20px; position: fixed;
            z-index: 10000; left: 50%; bottom: 30px; transform: translateX(-50%);
            font-weight: 900; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 2px solid #fff;
        }
        #copyToast.show { visibility: visible; animation: fadeInUp 0.5s, fadeOut 0.5s 2.5s; }

        .tg-config-box { background: white; padding: 20px; border-radius: 25px; border: 2px solid #2193b0; margin-bottom: 25px; }
        .tg-controls { display: flex; gap: 10px; margin-top: 15px; }
        .btn-tg-toggle { flex: 1; padding: 10px; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; color: white; }

        .order-card { background: white; border-radius: 25px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); border-right: 12px solid #764ba2; text-align: right; }
        .phone-container { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; background: #f8f9fa; padding: 10px; border-radius: 18px; }
        .display-phone { flex: 1; font-size: 1.4rem; font-weight: 900; text-align: center; }
        .btn-call-now { background: var(--success-grad); color: white; width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        
        .confirm-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; backdrop-filter: blur(10px); justify-content: center; align-items: center; }
        .confirm-box { background: white; padding: 35px 25px; border-radius: 35px; text-align: center; max-width: 380px; width: 90%; }
        
        .modal { background: white; padding: 25px; border-radius: 30px; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 92%; max-width: 500px; z-index: 2000; box-shadow: 0 0 50px rgba(0,0,0,0.3); max-height: 90vh; overflow-y: auto; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; }
        .hidden { display: none; }
        
        input, textarea { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 15px; border: 1px solid #ddd; font-family: 'Cairo'; box-sizing: border-box; }
        .section-btn { width: 100%; padding: 18px; border-radius: 20px; border: none; font-weight: 900; cursor: pointer; margin-bottom: 15px; color: white; font-size: 1.1rem; }

        @keyframes fadeInUp { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
        @keyframes fadeOut { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <button class="btn-logout" onclick="logout()">تسجيل الخروج <i class="fas fa-sign-out-alt"></i></button>
    </div>

    <div id="copyToast">تم نسخ الرابط بنجاح! ✅</div>

    <div id="stopWarning" class="status-warning">
        <i class="fas fa-hand-paper" style="font-size: 2.5rem; color: #f56565;"></i>
        <div style="text-align: right;">
            <h3 style="margin:0; color: #c53030;">تم إيقاف متجرك مؤقتاً 🛑</h3>
            <p style="margin:5px 0 0;">يرجى التواصل مع الإدارة لإعادة تفعيله.</p>
        </div>
    </div>

    <div id="universalDeleteModal" class="confirm-overlay">
        <div class="confirm-box">
            <i class="fas fa-trash" style="font-size:50px; color:red; margin-bottom:15px;"></i>
            <h3>هل أنت متأكد من الحذف؟</h3>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button id="confirmBtn" style="flex:1; background:red; color:white; border:none; padding:15px; border-radius:15px; font-weight:bold;">نعم، حذف</button>
                <button onclick="closeDeleteModal()" style="flex:1; background:#eee; border:none; padding:15px; border-radius:15px;">إلغاء</button>
            </div>
        </div>
    </div>

    <div class="store-title-card"><h1 id="storeNameDisplay">جاري التحميل...</h1></div>

    <a href="https://wa.me/213561150865" class="support-card" target="_blank">
        <h3><i class="fas fa-headset"></i> مركز الدعم والتفعيل</h3>
        <div class="wa-btn-inner"><i class="fab fa-whatsapp"></i> مراسلة الدعم الفني</div>
    </a>

    <div class="link-section">
        <div class="link-box" id="storeUrl">...</div>
        <button class="btn-copy-new" onclick="copyUrl()">نسخ رابط المتجر</button>
    </div>

    <div class="tg-config-box">
        <h3 style="margin:0; color:#2193b0;"><i class="fab fa-telegram"></i> تنبيهات تليجرام</h3>
        <div class="tg-controls">
            <button onclick="toggleTelegramUI(true)" class="btn-tg-toggle" style="background:var(--success-grad);">تفعيل ✅</button>
            <button onclick="toggleTelegramUI(false)" class="btn-tg-toggle" style="background:var(--danger-grad);">إلغاء ❌</button>
        </div>
        <div id="tgDetails" class="hidden" style="margin-top:20px;">
            <input type="text" id="tgToken" placeholder="Bot Token">
            <input type="text" id="tgChatId" placeholder="Chat ID">
            <button onclick="saveTg()" style="width:100%; background:#2d3436; color:white; border:none; padding:12px; border-radius:12px;">حفظ الإعدادات 💾</button>
        </div>
    </div>

    <button class="section-btn" style="background:var(--main-grad);" onclick="toggleSection('ordersDisplay')">📦 الطلبيات الواردة</button>
    <div id="ordersDisplay" class="hidden"></div>

    <button class="section-btn" style="background:var(--success-grad);" onclick="openAddModal()">➕ إضافة منتج جديد</button>
    <div id="productsList"></div>
</div>

<div id="modalOverlay" class="overlay hidden" onclick="closeModal()"></div>
<div id="productModal" class="modal hidden">
    <h2 id="modalTitle">إضافة منتج</h2>
    <input type="text" id="pName" placeholder="اسم المنتج">
    <input type="number" id="pPrice" placeholder="السعر">
    <textarea id="pDesc" placeholder="وصف المنتج..."></textarea>
    <div style="background:#f8f9fa; padding:10px; border-radius:12px; margin-bottom:15px;">
        <label><input type="checkbox" id="hasTimer" onchange="document.getElementById('timerInput').classList.toggle('hidden')"> عداد تنازلي؟</label>
        <input type="datetime-local" id="timerInput" class="hidden" style="margin-top:10px;">
    </div>
    <input type="file" id="pImage" accept="image/*">
    <button id="saveBtn" class="section-btn" style="background:var(--success-grad);">حفظ البيانات ✅</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove, update, push, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storeId = localStorage.getItem('myStoreId');
    const IMGBB_API_KEY = "e48055a00c4440331de482c9a7b18e01";

    let isEdit = false, editKey = null, deleteTarget = null, deleteType = '', currentProductImage = "";

    // دالة ضغط ورفع الصور
    async function uploadToImgBB(file) {
        const reader = new FileReader();
        return new Promise((resolve, reject) => {
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 800;
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob(async (blob) => {
                        const formData = new FormData();
                        formData.append("image", blob);
                        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
                        const data = await res.json();
                        if (data.success) resolve(data.data.url); else reject("فشل الرفع");
                    }, 'image/jpeg', 0.7);
                };
            };
        });
    }

    if (storeId) {
        onValue(ref(db, `stores/${storeId}`), s => {
            if(s.exists()){
                const data = s.val();
                document.getElementById('storeNameDisplay').innerText = data.name;
                document.getElementById('stopWarning').style.display = data.status === 'stopped' ? 'flex' : 'none';
                let customBase = window.location.origin + window.location.pathname.replace('user-dashboard.html', '');
                document.getElementById('storeUrl').innerText = customBase + "store.html?id=" + storeId;
            }
        });

        onValue(ref(db, `stores/${storeId}/orders`), snap => {
            const box = document.getElementById('ordersDisplay'); box.innerHTML = "";
            if(snap.exists()) Object.entries(snap.val()).reverse().forEach(([k, o]) => {
                box.innerHTML += `
                <div class="order-card">
                    <b>👤 ${o.customerName}</b><br>
                    <div class="phone-container">
                        <div class="display-phone">${o.customerPhone}</div>
                        <a href="tel:${o.customerPhone}" class="btn-call-now"><i class="fas fa-phone-alt"></i></a>
                    </div>
                    <p>📦 ${o.productName}</p>
                    <button onclick="askDelete('order', '${k}')" style="color:red; background:none; border:none; cursor:pointer;">حذف الطلب 🗑️</button>
                </div>`;
            });
        });

        onValue(ref(db, `stores/${storeId}/products`), snap => {
            const box = document.getElementById('productsList'); box.innerHTML = "";
            if(snap.exists()) Object.entries(snap.val()).forEach(([k, p]) => {
                box.innerHTML += `
                <div style="background:white; padding:15px; border-radius:20px; display:flex; align-items:center; gap:15px; margin-bottom:10px;">
                    <img src="${p.image}" style="width:60px; height:60px; border-radius:12px; object-fit:cover;">
                    <div style="flex:1; text-align:right;"><b>${p.name}</b><br><small>${p.price} دج</small></div>
                    <button onclick="editProd('${k}')" style="color:blue; background:none; border:none;"><i class="fas fa-edit"></i></button>
                    <button onclick="askDelete('product', '${k}')" style="color:red; background:none; border:none;"><i class="fas fa-trash"></i></button>
                </div>`;
            });
        });
    }

    window.saveBtn.onclick = async () => {
        const file = document.getElementById('pImage').files[0];
        const saveBtn = document.getElementById('saveBtn');
        let imgUrl = currentProductImage;

        if (!file && !isEdit) return alert("يرجى اختيار صورة للمنتج");

        saveBtn.disabled = true;
        saveBtn.innerText = "جاري الحفظ... ⏳";

        try {
            if(file) imgUrl = await uploadToImgBB(file);
            const data = { 
                name: document.getElementById('pName').value, 
                price: document.getElementById('pPrice').value, 
                description: document.getElementById('pDesc').value,
                image: imgUrl,
                timerDate: document.getElementById('hasTimer').checked ? document.getElementById('timerInput').value : null
            };
            if(isEdit) await update(ref(db, `stores/${storeId}/products/${editKey}`), data);
            else await push(ref(db, `stores/${storeId}/products`), data);
            closeModal(); alert("تم الحفظ بنجاح! ✅");
        } catch (e) { alert("حدث خطأ في الرفع"); }
        saveBtn.disabled = false; saveBtn.innerText = "حفظ البيانات ✅";
    };

    // الوظائف المساعدة المسترجعة بالكامل
    window.openModal = () => { document.getElementById('productModal').classList.remove('hidden'); document.getElementById('modalOverlay').classList.remove('hidden'); };
    window.closeModal = () => { document.getElementById('productModal').classList.add('hidden'); document.getElementById('modalOverlay').classList.add('hidden'); };
    window.toggleSection = (id) => document.getElementById(id).classList.toggle('hidden');
    window.openAddModal = () => { isEdit = false; document.getElementById('modalTitle').innerText = "إضافة منتج"; openModal(); };
    window.editProd = (key) => { 
        isEdit = true; editKey = key;
        get(ref(db, `stores/${storeId}/products/${key}`)).then(s => {
            const p = s.val();
            document.getElementById('pName').value = p.name;
            document.getElementById('pPrice').value = p.price;
            currentProductImage = p.image;
            openModal();
        });
    };
    window.askDelete = (type, key) => { deleteType = type; deleteTarget = key; document.getElementById('universalDeleteModal').style.display = 'flex'; };
    window.closeDeleteModal = () => { document.getElementById('universalDeleteModal').style.display = 'none'; };
    document.getElementById('confirmBtn').onclick = () => {
        const path = deleteType === 'order' ? `stores/${storeId}/orders/${deleteTarget}` : `stores/${storeId}/products/${deleteTarget}`;
        remove(ref(db, path)).then(() => closeDeleteModal());
    };
    window.copyUrl = () => { navigator.clipboard.writeText(document.getElementById('storeUrl').innerText); document.getElementById('copyToast').style.visibility = 'visible'; setTimeout(() => document.getElementById('copyToast').style.visibility = 'hidden', 2000); };
    window.logout = () => { localStorage.clear(); window.location.href = "index.html"; };
    window.toggleTelegramUI = (show) => document.getElementById('tgDetails').classList.toggle('hidden', !show);
</script>
</body>
</html>
