<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3799">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --blue-grad: linear-gradient(135deg, #1e3799 0%, #0984e3 100%);
            --green-grad: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            --danger-grad: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            --cloud-grad: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            --royal-grad: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            --copy-grad: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            --accent-neon: #00f2fe;
            --orange-neon: #ff9f43;
        }

        body { font-family: 'Cairo', sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; padding-bottom: 60px; }
        .container { max-width: 500px; margin: auto; }

        .top-header { background: var(--blue-grad); padding: 20px; border-radius: 25px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(30, 55, 153, 0.2); }
        
        .timer-section { background: #1a1a2e; border-radius: 25px; padding: 15px; margin-bottom: 20px; text-align: center; border: 2px solid var(--accent-neon); }
        .timer-grid { display: flex; justify-content: center; gap: 8px; margin-top: 8px; }
        .timer-box { background: rgba(255,255,255,0.1); padding: 8px; border-radius: 12px; min-width: 50px; border-bottom: 3px solid var(--accent-neon); }
        .timer-num { display: block; font-size: 1.1rem; font-weight: 900; color: #fff; }
        .timer-label { display: block; font-size: 0.6rem; color: #aaa; }

        .main-action { width: 100%; padding: 18px; border-radius: 22px; border: none; font-weight: 900; color: white; cursor: pointer; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 1rem; transition: 0.3s; font-family: 'Cairo'; text-decoration: none; box-sizing: border-box; }
        .btn-copy { background: var(--copy-grad); border: 2px solid #fff; }
        .btn-download { background: var(--cloud-grad); border: 2px solid #fff; }
        .btn-support { background: var(--royal-grad); }
        .btn-orders { background: #2d3436; border: 2px solid var(--orange-neon); box-shadow: 0 5px 15px rgba(255, 159, 67, 0.3); }
        .btn-add { background: var(--blue-grad); }
        .btn-manage { background: #57606f; }

        .order-card { background: white; border-radius: 35px; padding: 25px; margin-bottom: 25px; border-top: 8px solid #0984e3; box-shadow: 0 20px 40px rgba(0,0,0,0.12); position: relative; animation: slideUp 0.5s ease; border-right: 2px solid #eee; border-left: 2px solid #eee; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        .order-date-tag { background: #f1f2f6; color: #57606f; padding: 5px 15px; border-radius: 50px; font-size: 0.75rem; font-weight: bold; display: flex; align-items: center; gap: 5px; margin-bottom: 15px; width: fit-content; }
        
        .product-name-badge { background: var(--blue-grad); color: white; padding: 10px 20px; border-radius: 15px; font-weight: 900; font-size: 1.1rem; display: block; text-align: center; margin-bottom: 20px; box-shadow: 0 5px 10px rgba(30, 55, 153, 0.2); }
        
        .customer-info-box { background: #f8f9fa; padding: 15px; border-radius: 20px; margin-bottom: 15px; border-right: 5px solid var(--royal-grad); }
        .name-label { color: #6c5ce7; font-size: 0.8rem; font-weight: bold; display: block; margin-bottom: 2px; }
        .name-val { color: #2d3436; font-size: 1.4rem; font-weight: 900; display: block; }

        .location-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .loc-item { background: #eef2f3; padding: 10px; border-radius: 15px; text-align: center; border-bottom: 3px solid var(--accent-neon); }
        .loc-label { font-size: 0.7rem; color: #7f8c8d; display: block; }
        .loc-val { font-size: 1rem; font-weight: 900; color: #1e3799; }

        .phone-section { background: #fff9c4; color: #f57f17; padding: 15px; border-radius: 20px; text-align: center; margin: 15px 0; border: 2px dashed #f57f17; }
        .phone-val { font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; display: block; }

        .btn-call-neon { background: var(--green-grad); color: white; text-decoration: none; border-radius: 22px; display: flex; align-items: center; justify-content: center; height: 65px; font-weight: 900; font-size: 1.3rem; gap: 10px; box-shadow: 0 10px 20px rgba(46, 204, 113, 0.3); }

        .btn-delete-neon { width: 100%; margin-top: 15px; border: none; background: #fff1f2; color: #ff4757; padding: 15px; border-radius: 20px; cursor: pointer; font-weight: 900; font-family: 'Cairo'; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 10000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: white; padding: 35px; border-radius: 40px; text-align: center; width: 100%; max-width: 400px; animation: popIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); border: 4px solid #f1f2f6; }
        
        .hidden { display: none; }
        #smartLock { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100001; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    </style>
</head>
<body>

<div id="smartLock">
    <i class="fas fa-user-lock" style="font-size: 80px; color: #ff4757; margin-bottom: 20px;"></i>
    <h1 style="font-weight: 900; color: #1e3799;">تنبيه الإدارة</h1>
    <p style="color: #636e72;">المتجر غير مفعّل، يرجى التواصل مع حسام.</p>
    <a href="https://wa.me/213561150865" style="background:#25d366; color:white; padding:15px 30px; border-radius:15px; text-decoration:none; font-weight:bold; margin-top:30px;">تواصل لتفعيل المتجر</a>
</div>

<div class="container" id="mainAppContent">
    <div class="top-header">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div style="background: rgba(255,255,255,0.2); width: 45px; height: 45px; border-radius: 15px; display: flex; align-items: center; justify-content: center;"><i class="fas fa-rocket" style="color: white;"></i></div>
            <div><span style="display: block; font-size: 0.7rem; color: #eee;">مرحباً بك في</span><span id="storeNameDisp" style="display: block; font-size: 1.1rem; font-weight: 900; color: white;">جاري التحميل...</span></div>
        </div>
        <button onclick="logout()" style="background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 8px 12px; border-radius: 12px; font-weight: bold;">خروج</button>
    </div>

    <div class="timer-section">
        <div class="timer-grid">
            <div class="timer-box"><span class="timer-num" id="days">00</span><span class="timer-label">يوم</span></div>
            <div class="timer-box"><span class="timer-num" id="hours">00</span><span class="timer-label">ساعة</span></div>
            <div class="timer-box"><span class="timer-num" id="minutes">00</span><span class="timer-label">دقيقة</span></div>
            <div class="timer-box"><span class="timer-num" id="seconds">00</span><span class="timer-label">ثانية</span></div>
        </div>
    </div>

    <button class="main-action btn-copy" onclick="copyStoreLink()"><i class="fas fa-share-alt"></i> نسخ رابط متجرك 🔗</button>
    <button class="main-action btn-download" onclick="showConfirmModal('download')"><i class="fas fa-cloud-download-alt"></i> تنزيل التطبيق 🔔</button>
    
    <button class="main-action btn-orders" onclick="handleOrdersView()"><i class="fas fa-shopping-basket"></i> <span id="ordersBtnText">عرض الطلبيات الواردة</span></button>
    <div id="ordersSection" class="hidden"><div id="ordersList"></div></div>

    <button class="main-action btn-add" onclick="openAddModal()"><i class="fas fa-plus-circle"></i> إضافة منتج جديد</button>
    <button class="main-action btn-manage" onclick="toggleSec('manageSection')"><i class="fas fa-edit"></i> إدارة المنتجات</button>
    <div id="manageSection" class="hidden"><div id="productsList"></div></div>
</div>

<div id="customModal" class="modal">
    <div class="modal-content">
        <div id="modalIcon" style="font-size: 80px; margin-bottom: 20px;"></div>
        <h3 id="modalTitle" style="font-weight: 900; color: #1e3799;"></h3>
        <p id="modalText" style="color: #636e72; margin-bottom: 30px;"></p>
        <div id="modalBtns" style="display: flex; gap: 15px;"></div>
    </div>
</div>

<div id="productModal" class="modal">
    <div class="modal-content">
        <h2 id="pModalTitle" style="font-weight: 900; color: #1e3799;">بيانات المنتج</h2>
        <input type="hidden" id="editKey">
        <input type="text" id="pName" placeholder="اسم المنتج" style="width:100%; padding:15px; margin-bottom:10px; border-radius:15px; border:1px solid #eee; box-sizing: border-box;">
        <input type="number" id="pPrice" placeholder="سعر المنتج (دج)" style="width:100%; padding:15px; margin-bottom:10px; border-radius:15px; border:1px solid #eee; box-sizing: border-box;">
        <textarea id="pDesc" rows="3" placeholder="وصف المنتج..." style="width:100%; padding:15px; margin-bottom:15px; border-radius:15px; border:1px solid #eee; box-sizing: border-box;"></textarea>
        <div style="display: flex; gap: 10px;">
            <button class="main-action btn-add" id="saveProductBtn" style="flex: 2; margin:0;">حفظ</button>
            <button class="main-action" onclick="closeProductModal()" style="background:#f1f2f6; color:#333; flex: 1; margin:0;">إلغاء</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storeId = localStorage.getItem('myStoreId');

    if(!storeId) window.location.href = "index.html";

    onValue(ref(db, `stores/${storeId}`), (snap) => {
        if (snap.exists()) {
            const data = snap.val();
            document.getElementById('storeNameDisp').innerText = data.name || "متجري";
            
            const expiry = Number(data.expiryDate) || 0;
            if(expiry > 0) startTimer(expiry);
            
            renderOrders(data.orders || {});
            renderProducts(data.products || {});
        }
    });

    function renderOrders(orders) {
        const list = document.getElementById('ordersList');
        const entries = Object.entries(orders);
        if(entries.length === 0) {
            list.innerHTML = `<div style="text-align:center; padding:30px; color:#aaa;">لا توجد طلبيات</div>`;
            return;
        }
        list.innerHTML = "";
        entries.reverse().forEach(([id, o]) => {
            list.innerHTML += `
            <div class="order-card">
                <div class="order-date-tag"><i class="fas fa-calendar-alt"></i> ${o.date || ''}</div>
                <div class="product-name-badge">${o.productName}</div>
                <div class="customer-info-box">
                    <span class="name-label">الزبون:</span>
                    <span class="name-val">${o.customerName}</span>
                </div>
                <div class="location-grid">
                    <div class="loc-item"><span class="loc-label">الولاية</span><span class="loc-val">${o.wilaya || '---'}</span></div>
                    <div class="loc-item"><span class="loc-label">البلدية</span><span class="loc-val">${o.baladia || '---'}</span></div>
                </div>
                <div class="phone-section"><span class="phone-val">${o.phone}</span></div>
                <a href="tel:${o.phone}" class="btn-call-neon"><i class="fas fa-phone-alt"></i> إتصال سريع</a>
                <button onclick="showConfirmModal('deleteOrder', '${id}')" class="btn-delete-neon">حذف الطلبية</button>
            </div>`;
        });
    }

    function renderProducts(products) {
        const list = document.getElementById('productsList'); list.innerHTML = "";
        Object.entries(products).forEach(([id, p]) => {
            list.innerHTML += `
            <div style="background:white; margin:10px 0; padding:15px; border-radius:20px; display:flex; align-items:center; gap:12px; box-shadow:0 5px 15px rgba(0,0,0,0.05);">
                <div style="flex:1"><b style="color:#1e3799;">${p.name}</b><br><small>${p.price} دج</small></div>
                <button onclick="showConfirmModal('deleteProduct', '${id}')" style="background:#ff4757; color:white; border:none; padding:10px; border-radius:10px;"><i class="fas fa-trash"></i></button>
            </div>`;
        });
    }

    window.showConfirmModal = (type, id) => {
        const modal = document.getElementById('customModal');
        modal.style.display = 'flex';
        document.getElementById('modalIcon').innerHTML = "⚠️";
        document.getElementById('modalTitle').innerText = "تأكيد الحذف";
        document.getElementById('modalText').innerText = "هل أنت متأكد من حذف هذه البيانات؟";
        document.getElementById('modalBtns').innerHTML = `
            <button class="main-action" style="background:var(--danger-grad); flex:2; margin:0;" onclick="finalDelete('${type}', '${id}')">نعم، احذف</button>
            <button class="main-action" style="background:#eee; color:#333; flex:1; margin:0;" onclick="closeModal()">لا</button>`;
    };

    window.finalDelete = (type, id) => {
        const path = type === 'deleteOrder' ? `orders/${id}` : `products/${id}`;
        remove(ref(db, `stores/${storeId}/${path}`)).then(() => {
            showSimpleResult("✅", "تم الحذف", "تمت العملية بنجاح.", "var(--green-grad)");
        });
    };

    function showSimpleResult(emoji, title, msg, bg) {
        const modal = document.getElementById('customModal');
        modal.style.display = 'flex';
        document.getElementById('modalIcon').innerHTML = emoji;
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalText').innerText = msg;
        document.getElementById('modalBtns').innerHTML = `<button class="main-action" style="background:${bg}; width:100%; margin:0;" onclick="closeModal()">ممتاز</button>`;
    }

    window.saveProductBtn.onclick = async () => {
        const n = document.getElementById('pName').value, p = document.getElementById('pPrice').value, d = document.getElementById('pDesc').value;
        if(!n || !p) return;
        push(ref(db, `stores/${storeId}/products`), { name: n, price: p, description: d });
        closeProductModal();
    };

    function startTimer(target) {
        setInterval(() => {
            const diff = target - Date.now();
            if(diff <= 0) return;
            document.getElementById('days').innerText = Math.floor(diff/86400000).toString().padStart(2,'0');
            document.getElementById('hours').innerText = Math.floor((diff%86400000)/3600000).toString().padStart(2,'0');
            document.getElementById('minutes').innerText = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
            document.getElementById('seconds').innerText = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
        }, 1000);
    }

    window.handleOrdersView = () => {
        const sec = document.getElementById('ordersSection');
        sec.classList.toggle('hidden');
        document.getElementById('ordersBtnText').innerText = sec.classList.contains('hidden') ? "عرض الطلبيات الواردة" : "إخفاء الطلبيات";
    };

    window.copyStoreLink = () => {
        const link = `https://future-site-digital.netlify.app/store.html?id=${storeId}`;
        navigator.clipboard.writeText(link).then(() => alert("تم نسخ الرابط!"));
    };

    window.closeModal = () => document.getElementById('customModal').style.display = 'none';
    window.openAddModal = () => document.getElementById('productModal').style.display = 'flex';
    window.closeProductModal = () => document.getElementById('productModal').style.display = 'none';
    window.toggleSec = (id) => document.getElementById(id).classList.toggle('hidden');
    window.logout = () => { localStorage.clear(); window.location.href = "index.html"; };

</script>
</body>
            </html>
