<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --blue-grad: linear-gradient(135deg, #1e3799 0%, #0984e3 100%);
            --time-bg: #1e272e;
            --success: #2ecc71;
            --danger: #e74c3c;
            --accent: #00f2fe;
            --tg-color: #0088cc;
            --url-color: #6c5ce7;
        }

        body { font-family: 'Cairo', sans-serif; background-color: #f1f2f6; margin: 0; padding: 20px 10px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1000px; }

        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: 1px solid #eee; transition: 0.3s; }
        .card-name { background: var(--blue-grad); color: white; text-align: center; border: none; }
        .card-expiry { background: var(--time-bg); color: var(--accent); text-align: center; }

        .card-url { border: 2px solid var(--url-color); text-align: center; }
        .url-box { background: #f3f0ff; padding: 12px; border-radius: 12px; font-weight: 900; color: var(--url-color); margin-top: 8px; border: 1px dashed var(--url-color); word-break: break-all; }
        .copy-btn { margin-top: 10px; background: var(--url-color); color: white; border: none; padding: 10px 25px; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .copy-btn:active { transform: scale(0.95); }

        /* تقارير المبيعات سطر واحد */
        .report-grid { display: flex; justify-content: space-between; gap: 8px; margin: 20px 0; }
        .r-box { flex: 1; background: white; padding: 12px 5px; border-radius: 15px; text-align: center; border-bottom: 4px solid var(--danger); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .r-val { font-size: 1.3rem; font-weight: 900; display: block; color: var(--danger); }
        .r-title { font-size: 0.75rem; color: #666; font-weight: bold; }

        .action-btn { width: 100%; padding: 18px; border-radius: 20px; border: none; font-weight: 900; color: white; cursor: pointer; margin-bottom: 12px; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; transition: 0.3s; }
        .action-btn:hover { opacity: 0.9; transform: translateY(-2px); }

        /* الطلبيات المتجاوبة */
        #ordersList { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .order-card { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #eee; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .order-body { padding: 15px; }
        .phone-link { background: #2d3436; color: var(--accent); font-size: 1.5rem; font-weight: 900; text-align: center; padding: 10px; border-radius: 12px; display: block; text-decoration: none; margin: 10px 0; }

        /* المودالات */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 92%; max-width: 500px; background: white; padding: 25px; border-radius: 30px; z-index: 2000; box-shadow: 0 15px 50px rgba(0,0,0,0.3); }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 1000; }
        
        .modal-footer { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn-confirm { background: var(--success); color: white; border: none; padding: 15px; border-radius: 15px; font-weight: 900; cursor: pointer; }
        .btn-close { background: #f1f2f6; color: #555; border: none; padding: 15px; border-radius: 15px; font-weight: 900; cursor: pointer; }

        @media (min-width: 768px) {
            .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
            .r-val { font-size: 1.7rem; }
        }

        input, textarea { width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #ddd; font-family: 'Cairo'; box-sizing: border-box; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="card card-name"><h1 id="storeName" style="margin:0;">...</h1></div>

    <div class="dashboard-grid">
        <div class="right-sec">
            <div class="card card-url">
                <h4 style="margin:0; color:var(--url-color);"><i class="fas fa-link"></i> إضغط لنسخ رابط المتجر</h4>
                <div class="url-box" id="storeUrl">...</div>
                <button class="copy-btn" onclick="copyLink()">نسخ الرابط</button>
            </div>
            <div class="card card-expiry">
                <h4 style="margin:0; color:white;">⏳ صلاحية المتجر</h4>
                <div id="countdown" style="margin-top:10px; font-weight:900; font-size: 1.2rem;">...</div>
            </div>
        </div>
        <div class="left-sec">
            <a href="https://wa.me/0561150865" class="action-btn" style="background:var(--success);">
                <i class="fab fa-whatsapp"></i> التواصل مع الإدارة
            </a>
            <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding:15px;">
                <span style="font-weight:900; color:var(--tg-color);"><i class="fab fa-telegram"></i> خاصية تليجرام</span>
                <i class="fas fa-toggle-on" style="font-size:1.5rem; color:#ccc;"></i>
            </div>
        </div>
    </div>

    <div class="report-grid">
        <div class="r-box"><span class="r-title">اليوم</span><span class="r-val" id="sToday">0</span></div>
        <div class="r-box"><span class="r-title">الأسبوع</span><span class="r-val" id="sWeek">0</span></div>
        <div class="r-box"><span class="r-title">الشهر</span><span class="r-val" id="sMonth">0</span></div>
    </div>

    <button class="action-btn" style="background:var(--url-color);" onclick="toggleSection('ordersSection')"><i class="fas fa-shopping-basket"></i> الطلبيات الواردة</button>
    <div id="ordersSection" class="hidden"><div id="ordersList"></div></div>

    <button class="action-btn" style="background:var(--success);" onclick="openAddModal()"><i class="fas fa-plus-circle"></i> إضافة منتج جديد</button>

    <button class="action-btn" style="background:var(--blue-grad);" onclick="toggleSection('manageSection')"><i class="fas fa-tasks"></i> إدارة المنتجات</button>
    <div id="manageSection" class="hidden"><div id="productsList" style="background:white; border-radius:20px; padding:10px;"></div></div>
</div>

<div id="overlay" class="overlay" onclick="closeAllModals()"></div>
<div id="productModal" class="modal">
    <h3 id="modalTitle" style="text-align:center; margin-top:0;">إضافة منتج</h3>
    <input type="hidden" id="editKey">
    <input type="text" id="pName" placeholder="اسم المنتج">
    <input type="number" id="pPrice" placeholder="السعر (دج)">
    <textarea id="pDesc" rows="3" placeholder="وصف المنتج"></textarea>
    <input type="file" id="pImage" accept="image/*">
    <div class="modal-footer">
        <button id="saveBtn" class="btn-confirm">تأكيد ✅</button>
        <button onclick="closeAllModals()" class="btn-close">تراجع</button>
    </div>
</div>

<div id="copyModal" class="modal" style="text-align:center;">
    <i class="fas fa-check-circle" style="font-size:50px; color:var(--success);"></i>
    <h3>تم النسخ!</h3>
    <p>تم نسخ الرابط بنجاح إلى الحافظة.</p>
    <button onclick="closeAllModals()" class="btn-confirm" style="width:100%;">ممتاز</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storeId = localStorage.getItem('myStoreId') || "demo_store"; // استبدله بـ ID الحقيقي

    if (storeId) {
        // جلب بيانات المتجر
        onValue(ref(db, `stores/${storeId}`), s => {
            if(s.exists()){
                const d = s.val();
                document.getElementById('storeName').innerText = d.name;
                document.getElementById('storeUrl').innerText = "future-site.com/" + storeId;
                document.getElementById('sToday').innerText = d.sales?.today || 0;
                document.getElementById('sWeek').innerText = d.sales?.week || 0;
                document.getElementById('sMonth').innerText = d.sales?.month || 0;
                
                setInterval(() => {
                    const diff = new Date(d.expiryDate).getTime() - new Date().getTime();
                    if(diff > 0){
                        const days = Math.floor(diff / 864e5), hrs = Math.floor((diff % 864e5) / 36e5), mns = Math.floor((diff % 36e5) / 6e4), scs = Math.floor((diff % 6e4) / 1000);
                        document.getElementById('countdown').innerText = `${days}ي : ${hrs}سا : ${mns}د : ${scs}ثا`;
                    }
                }, 1000);
            }
        });

        // جلب الطلبيات
        onValue(ref(db, `stores/${storeId}/orders`), snap => {
            const list = document.getElementById('ordersList'); list.innerHTML = "";
            if(snap.exists()) Object.entries(snap.val()).reverse().forEach(([id, o]) => {
                list.innerHTML += `
                <div class="order-card">
                    <div class="order-body">
                        <small style="color:#666;">${o.date || ''}</small>
                        <div style="font-weight:900; color:var(--url-color);">📦 ${o.productName}</div>
                        <div style="font-size:1.2rem; margin:5px 0;">👤 ${o.customerName}</div>
                        <a href="tel:${o.customerPhone}" class="phone-link">${o.customerPhone}</a>
                        <div style="display:flex; justify-content:space-between; font-size:0.8rem;">
                            <span>📍 ${o.customerState}</span>
                            <button onclick="deleteItem('orders/${id}')" style="border:none; color:red; background:none; cursor:pointer;"><i class="fas fa-trash"></i> حذف</button>
                        </div>
                    </div>
                </div>`;
            });
        });

        // جلب المنتجات
        onValue(ref(db, `stores/${storeId}/products`), snap => {
            const list = document.getElementById('productsList'); list.innerHTML = "";
            if(snap.exists()) Object.entries(snap.val()).forEach(([id, p]) => {
                list.innerHTML += `
                <div style="display:flex; align-items:center; gap:10px; padding:10px; border-bottom:1px solid #eee;">
                    <img src="${p.image}" width="45" height="45" style="border-radius:8px; object-fit:cover;">
                    <div style="flex:1;"><b>${p.name}</b><br><small>${p.price} دج</small></div>
                    <button onclick="editP('${id}','${p.name}','${p.price}','${p.description}')" style="background:#f39c12; color:white; border:none; padding:8px; border-radius:8px;"><i class="fas fa-pen"></i></button>
                    <button onclick="deleteItem('products/${id}')" style="background:red; color:white; border:none; padding:8px; border-radius:8px;"><i class="fas fa-trash"></i></button>
                </div>`;
            });
        });
    }

    // وظائف الواجهة
    window.copyLink = () => {
        navigator.clipboard.writeText(document.getElementById('storeUrl').innerText).then(() => {
            document.getElementById('copyModal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        });
    };

    window.closeAllModals = () => {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        document.getElementById('overlay').style.display = 'none';
    };

    window.toggleSection = (id) => { const el = document.getElementById(id); el.style.display = (el.style.display==='block'?'none':'block'); };
    
    window.openAddModal = () => { 
        document.getElementById('modalTitle').innerText="إضافة منتج"; 
        document.getElementById('editKey').value=""; 
        document.getElementById('productModal').style.display='block'; 
        document.getElementById('overlay').style.display='block'; 
    };

    window.editP = (k, n, p, d) => { 
        document.getElementById('modalTitle').innerText="تعديل المنتج"; 
        document.getElementById('editKey').value=k; 
        document.getElementById('pName').value=n; 
        document.getElementById('pPrice').value=p; 
        document.getElementById('pDesc').value=d; 
        document.getElementById('productModal').style.display='block'; 
        document.getElementById('overlay').style.display='block'; 
    };

    window.deleteItem = (path) => { if(confirm("هل أنت متأكد من الحذف؟")) remove(ref(db, `stores/${storeId}/${path}`)); };

    window.saveBtn.onclick = async () => {
        const k = document.getElementById('editKey').value, n = document.getElementById('pName').value, p = document.getElementById('pPrice').value, d = document.getElementById('pDesc').value, f = document.getElementById('pImage').files[0];
        if(!n || !p) return alert("الرجاء إدخال الاسم والسعر");
        
        window.saveBtn.disabled = true; window.saveBtn.innerText = "جاري الحفظ...";
        let imgUrl = "";

        if(f){
            const fd = new FormData(); fd.append("image", f);
            try {
                const res = await fetch("https://api.imgbb.com/1/upload?key=e48055a00c4440331de482c9a7b18e01", {method:"POST", body:fd});
                const j = await res.json(); imgUrl = j.data.url;
            } catch (e) { alert("خطأ في رفع الصورة"); }
        }

        const data = { name:n, price:p, description:d };
        if(imgUrl) data.image = imgUrl;

        if(k) update(ref(db, `stores/${storeId}/products/${k}`), data).then(()=>closeAllModals());
        else { if(!imgUrl) return alert("اختر صورة للمنتج"); push(ref(db, `stores/${storeId}/products`), data).then(()=>closeAllModals()); }
        
        window.saveBtn.disabled = false; window.saveBtn.innerText = "تأكيد ✅";
    };
</script>
</body>
</html>
