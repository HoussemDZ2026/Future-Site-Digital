<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3799">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --blue-grad: linear-gradient(135deg, #1e3799 0%, #0984e3 100%);
            --green-grad: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            --danger-grad: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            --gold-grad: linear-gradient(135deg, #f1c40f 0%, #f39c12 100%);
            --cloud-grad: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            --accent-neon: #00f2fe;
            --dark-card: #2d3436;
        }

        body { font-family: 'Cairo', sans-serif; background-color: #f8f9fa; margin: 0; padding: 15px; padding-bottom: 60px; }
        .container { max-width: 500px; margin: auto; display: block; }

        /* Loader */
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: 0.5s; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #1e3799; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Header Style */
        .top-header {
            background: var(--blue-grad); 
            padding: 20px; 
            border-radius: 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            box-shadow: 0 10px 20px rgba(30, 55, 153, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* Timer */
        .timer-section { background: #1a1a2e; border-radius: 25px; padding: 15px; margin-bottom: 20px; text-align: center; border: 2px solid var(--accent-neon); }
        .timer-grid { display: flex; justify-content: center; gap: 8px; margin-top: 8px; }
        .timer-box { background: rgba(255,255,255,0.1); padding: 8px; border-radius: 12px; min-width: 50px; border-bottom: 3px solid var(--accent-neon); }
        .timer-num { display: block; font-size: 1.1rem; font-weight: 900; color: #fff; }
        .timer-label { display: block; font-size: 0.6rem; color: #aaa; }

        .activation-card { background: var(--gold-grad); color: #fff; padding: 20px; border-radius: 25px; text-align: center; margin-bottom: 20px; text-decoration: none; display: block; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .main-action { width: 100%; padding: 18px; border-radius: 22px; border: none; font-weight: 900; color: white; cursor: pointer; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 1rem; transition: 0.3s; }
        .btn-orders { background: var(--dark-card); }
        .btn-add { background: var(--blue-grad); }
        .btn-manage { background: #57606f; }
        
        .url-box { background: white; padding: 15px; border-radius: 25px; border: 2px dashed #6c5ce7; text-align: center; margin-bottom: 20px; }
        .hidden { display: none; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 10000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: white; padding: 25px; border-radius: 35px; text-align: center; width: 100%; max-width: 400px; }
        input, textarea { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 15px; border: 1px solid #ddd; font-family: 'Cairo'; box-sizing: border-box; }

        .order-card { background: white; border-radius: 25px; padding: 20px; margin-bottom: 20px; border-top: 8px solid #0984e3; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div id="loadingOverlay"><div class="loader"></div><p style="margin-top:15px; font-weight:900; color:#1e3799;">جاري تحميل لوحة التحكم...</p></div>

<div class="container">
    <div class="top-header">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div style="background: rgba(255,255,255,0.2); width: 45px; height: 45px; border-radius: 15px; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-store-alt" style="color: white; font-size: 1.4rem;"></i>
            </div>
            <div>
                <span style="display: block; font-size: 0.7rem; color: rgba(255,255,255,0.8);">لوحة تحكم</span>
                <span id="storeNameDisp" style="display: block; font-size: 1.2rem; font-weight: 900; color: white;">متجري</span>
            </div>
        </div>
        <button onclick="logout()" style="background: #ff4757; color: white; border: none; padding: 10px 18px; border-radius: 15px; font-weight: 900; cursor: pointer;">خروج</button>
    </div>

    <div class="timer-section">
        <span style="color:var(--accent-neon); font-size:0.8rem; font-weight:900;">⌛ متبقي على صلاحية الرابط:</span>
        <div class="timer-grid">
            <div class="timer-box"><span class="timer-num" id="days">00</span><span class="timer-label">يوم</span></div>
            <div class="timer-box"><span class="timer-num" id="hours">00</span><span class="timer-label">ساعة</span></div>
            <div class="timer-box"><span class="timer-num" id="minutes">00</span><span class="timer-label">دقيقة</span></div>
            <div class="timer-box"><span class="timer-num" id="seconds">00</span><span class="timer-label">ثانية</span></div>
        </div>
    </div>

    <a href="https://wa.me/213561150865" class="activation-card">
        <h3><i class="fab fa-whatsapp"></i> تفعيل المتجر الآن</h3>
        <p>ارفع القيود وابدأ استقبال الطلبات</p>
    </a>

    <div class="url-box">
        <div id="storeUrlDisp" style="font-size: 0.8rem; color: #6c5ce7; font-weight: bold; margin-bottom: 12px; word-break: break-all;">جاري التحميل...</div>
        <button onclick="handleCopy()" class="main-action" style="background: #6c5ce7; margin-bottom: 0;">نسخ رابط المتجر</button>
    </div>

    <button class="main-action" style="background: var(--cloud-grad);" onclick="showConfirmModal('download')">
        <i class="fas fa-bell"></i> تنزيل التطبيق واستقبال الإشعارات 🔔
    </button>

    <button class="main-action btn-orders" onclick="toggleSec('ordersSection')"><i class="fas fa-shopping-basket"></i> الطلبيات الواردة</button>
    <div id="ordersSection" class="hidden"><div id="ordersList"></div></div>

    <button class="main-action btn-add" onclick="openAddModal()"><i class="fas fa-plus-circle"></i> إضافة منتج جديد</button>

    <button class="main-action btn-manage" onclick="toggleSec('manageSection')"><i class="fas fa-tasks"></i> إدارة المنتجات</button>
    <div id="manageSection" class="hidden"><div id="productsList"></div></div>
</div>

<div id="productModal" class="modal">
    <div class="modal-content">
        <h2 id="pModalTitle">بيانات المنتج</h2>
        <input type="hidden" id="editKey">
        <input type="text" id="pName" placeholder="اسم المنتج">
        <input type="number" id="pPrice" placeholder="سعر المنتج">
        <textarea id="pDesc" rows="3" placeholder="وصف المنتج"></textarea>
        <input type="file" id="pImage" accept="image/*">
        <div style="display: flex; gap: 10px;">
            <button class="main-action btn-add" id="saveProductBtn" style="flex: 2;">تأكيد</button>
            <button class="main-action" onclick="closeProductModal()" style="flex: 1; background:#eee; color:#333;">تراجع</button>
        </div>
    </div>
</div>

<div id="customModal" class="modal">
    <div class="modal-content">
        <div id="modalIcon" style="font-size: 50px; margin-bottom: 15px;"></div>
        <h3 id="modalTitle"></h3>
        <p id="modalText"></p>
        <div id="modalBtns" style="display: flex; gap: 10px;"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storeId = localStorage.getItem('myStoreId');

    // 1. طلب إذن الإشعارات وتسجيل الـ Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').then(reg => {
                console.log('SW Registered');
                // طلب الإذن
                if (Notification.permission !== 'granted') {
                    Notification.requestPermission();
                }
            });
        });
    }

    let lastOrderCount = -1; 

    // 2. مراقبة الطلبيات وإرسال تنبيه
    onValue(ref(db, `stores/${storeId}`), (snap) => {
        document.getElementById('loadingOverlay').style.display = 'none';
        if (snap.exists()) {
            const data = snap.val();
            document.getElementById('storeNameDisp').innerText = data.name;
            document.getElementById('storeUrlDisp').innerText = window.location.origin + window.location.pathname.replace('user-dashboard.html', 'store.html') + "?id=" + storeId;
            
            const orders = data.orders || {};
            const currentCount = Object.keys(orders).length;

            // إذا دخلت طلبية جديدة (العدد زاد)
            if (lastOrderCount !== -1 && currentCount > lastOrderCount) {
                sendLocalNotification();
            }
            lastOrderCount = currentCount;

            renderOrders(orders);
            renderProducts(data.products);
        }
    });

    function sendLocalNotification() {
        // تنبيه هز الهاتف (لو كان مدعوم)
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        
        // تشغيل صوت تنبيه
        const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        audio.play().catch(e => console.log("Audio play deferred"));

        // إظهار إشعار النظام
        if (Notification.permission === 'granted') {
            new Notification("طلبية جديدة! 🔔", {
                body: "لديك طلب جديد في متجرك، تحقق منه الآن.",
                icon: "https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
            });
        }
    }

    // باقي الوظائف (تنزيل، حذف، نسخ، إلخ)
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });

    window.showConfirmModal = (type, id = null) => {
        const modal = document.getElementById('customModal');
        const btns = document.getElementById('modalBtns');
        modal.style.display = 'flex';
        
        if(type === 'download') {
            document.getElementById('modalIcon').innerHTML = "📲";
            document.getElementById('modalTitle').innerText = "تنزيل التطبيق؟";
            document.getElementById('modalText').innerText = "هل تريد تثبيت التطبيق وتفعيل الإشعارات؟";
            btns.innerHTML = `<button class="main-action" style="background:var(--blue-grad); flex:1;" onclick="executeDownload()">نعم</button><button class="main-action" style="background:#eee; color:#333; flex:1;" onclick="closeModal()">لا</button>`;
        } else {
            document.getElementById('modalIcon').innerHTML = "🗑️";
            document.getElementById('modalTitle').innerText = "تأكيد الحذف";
            document.getElementById('modalText').innerText = "سيتم المسح نهائياً.";
            btns.innerHTML = `<button class="main-action" style="background:red; flex:1;" onclick="executeDelete('${type}','${id}')">حذف</button><button class="main-action" style="background:#eee; color:#333; flex:1;" onclick="closeModal()">تراجع</button>`;
        }
    };

    window.executeDownload = async () => {
        closeModal();
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt = null;
        } else {
            alert("التطبيق مثبت بالفعل أو المتصفح لا يدعم التنزيل المباشر.");
        }
    };

    window.executeDelete = (type, id) => {
        const path = type === 'product' ? `stores/${storeId}/products/${id}` : `stores/${storeId}/orders/${id}`;
        remove(ref(db, path)).then(() => closeModal());
    };

    window.handleCopy = () => {
        navigator.clipboard.writeText(document.getElementById('storeUrlDisp').innerText);
        showSuccess("تم نسخ الرابط!");
    };

    window.showSuccess = (msg) => {
        document.getElementById('modalIcon').innerHTML = "✅";
        document.getElementById('modalTitle').innerText = "تم بنجاح";
        document.getElementById('modalText').innerText = msg;
        document.getElementById('modalBtns').innerHTML = `<button onclick="closeModal()" class="main-action" style="background:var(--green-grad); width:100%;">موافق</button>`;
        document.getElementById('customModal').style.display = 'flex';
    };

    function renderOrders(orders) {
        const list = document.getElementById('ordersList'); list.innerHTML = "";
        Object.entries(orders).reverse().forEach(([id, o]) => {
            list.innerHTML += `
                <div class="order-card">
                    <b style="color:#6c5ce7;">${o.productName}</b>
                    <p><i class="fas fa-user"></i> ${o.customerName}</p>
                    <div style="background:#f1f2f6; padding:10px; border-radius:12px; text-align:center; font-weight:900;">${o.phone}</div>
                    <a href="tel:${o.phone}" style="background:var(--green-grad); color:white; text-decoration:none; border-radius:15px; display:flex; align-items:center; justify-content:center; height:50px; margin-top:10px; font-weight:bold;">اتصال</a>
                    <button onclick="showConfirmModal('order', '${id}')" style="width:100%; border:none; background:none; color:red; margin-top:10px; cursor:pointer;">حذف الطلبية</button>
                </div>`;
        });
    }

    function renderProducts(products) {
        const list = document.getElementById('productsList'); list.innerHTML = "";
        if(products) {
            Object.entries(products).forEach(([id, p]) => {
                list.innerHTML += `
                    <div style="background:white; margin:10px 0; padding:12px; border-radius:20px; display:flex; align-items:center; gap:12px;">
                        <img src="${p.image || ''}" style="width:50px; height:50px; border-radius:10px; object-fit:cover;">
                        <div style="flex:1"><b>${p.name}</b><br><small>${p.price} دج</small></div>
                        <button onclick="editProduct('${id}','${p.name}','${p.price}','${p.description}')" style="background:#f39c12; color:white; border:none; padding:8px; border-radius:10px;"><i class="fas fa-edit"></i></button>
                        <button onclick="showConfirmModal('product', '${id}')" style="background:#ff4757; color:white; border:none; padding:8px; border-radius:10px;"><i class="fas fa-trash"></i></button>
                    </div>`;
            });
        }
    }

    window.saveProductBtn.onclick = async () => {
        const k = document.getElementById('editKey').value;
        const n = document.getElementById('pName').value;
        const p = document.getElementById('pPrice').value;
        const d = document.getElementById('pDesc').value;
        const f = document.getElementById('pImage').files[0];
        let imgUrl = "";
        if(f){
            const fd = new FormData(); fd.append("image", f);
            const res = await fetch("https://api.imgbb.com/1/upload?key=e48055a00c4440331de482c9a7b18e01", {method:"POST", body:fd});
            const j = await res.json(); imgUrl = j.data.url;
        }
        const prodData = { name: n, price: p, description: d };
        if(imgUrl) prodData.image = imgUrl;
        k ? update(ref(db, `stores/${storeId}/products/${k}`), prodData) : push(ref(db, `stores/${storeId}/products`), prodData);
        closeProductModal();
    };

    window.openAddModal = () => { document.getElementById('pModalTitle').innerText="إضافة منتج"; document.getElementById('editKey').value=""; document.getElementById('pName').value=""; document.getElementById('pPrice').value=""; document.getElementById('pDesc').value=""; document.getElementById('productModal').style.display='flex'; };
    window.editProduct = (id, n, p, d) => { document.getElementById('pModalTitle').innerText="تعديل المنتج"; document.getElementById('editKey').value=id; document.getElementById('pName').value=n; document.getElementById('pPrice').value=p; document.getElementById('pDesc').value=d; document.getElementById('productModal').style.display='flex'; };
    window.closeProductModal = () => document.getElementById('productModal').style.display = 'none';
    window.closeModal = () => document.getElementById('customModal').style.display = 'none';
    window.toggleSec = (id) => document.getElementById(id).classList.toggle('hidden');
    window.logout = () => { localStorage.removeItem('myStoreId'); window.location.href = 'index.html'; };

    const target = new Date("2026-03-30T00:00:00").getTime();
    setInterval(() => {
        const diff = target - new Date().getTime();
        if(diff < 0) return;
        document.getElementById('days').innerText = Math.floor(diff/86400000).toString().padStart(2,'0');
        document.getElementById('hours').innerText = Math.floor((diff%86400000)/3600000).toString().padStart(2,'0');
        document.getElementById('minutes').innerText = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
        document.getElementById('seconds').innerText = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
    }, 1000);
</script>
</body>
    </html>
