<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | Future Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* التنسيقات الأصلية مع تحسين البصريات */
        :root {
            --main-grad: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-grad: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
            --danger-grad: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
        }
        body { font-family: 'Cairo', sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; }
        .container { max-width: 900px; margin: auto; }
        .store-title-card { background: var(--main-grad); color: white; padding: 25px; border-radius: 20px; text-align: center; margin-bottom: 20px; border: 3px solid #fff; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .section-btn { width: 100%; padding: 15px; border-radius: 15px; border: none; font-weight: 900; cursor: pointer; margin-bottom: 10px; color: white; }
        .hidden { display: none; }
        .modal { background: white; padding: 20px; border-radius: 20px; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 450px; z-index: 2000; box-shadow: 0 0 30px rgba(0,0,0,0.3); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <div class="store-title-card">
        <h1 id="storeNameDisplay">جاري التحميل...</h1>
    </div>

    <button class="section-btn" style="background:var(--success-grad);" onclick="openAddModal()">➕ إضافة منتج جديد</button>
    
    <div id="productsList"></div>
    
    <hr>
    <button class="section-btn" style="background:#434343;" onclick="logout()">تسجيل الخروج</button>
</div>

<div id="modalOverlay" class="overlay hidden" onclick="closeModal()"></div>
<div id="productModal" class="modal hidden">
    <h2 id="modalTitle">إضافة منتج</h2>
    <input type="text" id="pName" placeholder="اسم المنتج">
    <input type="number" id="pPrice" placeholder="السعر (دج)">
    <textarea id="pDesc" placeholder="وصف المنتج"></textarea>
    <input type="file" id="pImage" accept="image/*">
    <button id="saveBtn" class="section-btn" style="background:var(--success-grad);">حفظ المنتج ✅</button>
    <button class="section-btn" style="background:#eee; color:#333;" onclick="closeModal()">إلغاء</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // إعدادات Firebase الخاصة بك
    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    // مفتاح ImgBB الخاص بك
    const IMGBB_API_KEY = "e48055a00c4440331de482c9a7b18e01"; 

    // جلب ID المتجر من الرابط أو الذاكرة
    let storeId = new URLSearchParams(window.location.search).get('id') || localStorage.getItem('myStoreId');

    if (!storeId) {
        alert("خطأ: لم يتم العثور على معرّف المتجر. سيتم تحويلك لصفحة الدخول.");
        window.location.href = "index.html";
    } else {
        localStorage.setItem('myStoreId', storeId);
        loadStoreData();
    }

    function loadStoreData() {
        // جلب اسم المتجر
        onValue(ref(db, `stores/${storeId}`), (snapshot) => {
            if (snapshot.exists()) {
                document.getElementById('storeNameDisplay').innerText = snapshot.val().name;
            } else {
                document.getElementById('storeNameDisplay').innerText = "متجر غير موجود";
            }
        });

        // جلب المنتجات
        onValue(ref(db, `stores/${storeId}/products`), (snapshot) => {
            const list = document.getElementById('productsList');
            list.innerHTML = "";
            if (snapshot.exists()) {
                Object.entries(snapshot.val()).forEach(([key, p]) => {
                    list.innerHTML += `
                        <div style="background:white; padding:10px; border-radius:15px; display:flex; align-items:center; gap:10px; margin-bottom:10px; border-left:5px solid #764ba2;">
                            <img src="${p.image}" style="width:50px; height:50px; border-radius:8px; object-fit:cover;">
                            <div style="flex:1"><b>${p.name}</b><br>${p.price} دج</div>
                            <button onclick="deleteProduct('${key}')" style="background:none; border:none; color:red; cursor:pointer;"><i class="fas fa-trash"></i></button>
                        </div>`;
                });
            }
        });
    }

    // رفع الصور وحفظ البيانات
    window.saveBtn.onclick = async () => {
        const file = document.getElementById('pImage').files[0];
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        const btn = document.getElementById('saveBtn');

        if (!name || !price || !file) return alert("اكمل البيانات والصورة أولاً");

        btn.disabled = true;
        btn.innerText = "جاري الرفع... ⏳";

        try {
            // الرفع لـ ImgBB
            const formData = new FormData();
            formData.append("image", file);
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
            const result = await res.json();

            if (result.success) {
                // الحفظ في Firebase
                await push(ref(db, `stores/${storeId}/products`), {
                    name: name,
                    price: price,
                    description: document.getElementById('pDesc').value,
                    image: result.data.url
                });
                alert("تمت الإضافة!");
                closeModal();
            }
        } catch (e) { alert("حدث خطأ"); }
        btn.disabled = false; btn.innerText = "حفظ المنتج ✅";
    };

    // دوال المودال
    window.openAddModal = () => { document.getElementById('productModal').classList.remove('hidden'); document.getElementById('modalOverlay').classList.remove('hidden'); };
    window.closeModal = () => { document.getElementById('productModal').classList.add('hidden'); document.getElementById('modalOverlay').classList.add('hidden'); };
    window.deleteProduct = (key) => { if(confirm("حذف المنتج؟")) remove(ref(db, `stores/${storeId}/products/${key}`)); };
    window.logout = () => { localStorage.clear(); window.location.href = "index.html"; };
</script>
</body>
</html>
