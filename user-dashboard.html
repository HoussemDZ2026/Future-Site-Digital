<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --brand-gradient: linear-gradient(45deg, #1e3c72, #2a5298);
            --gold-gradient: linear-gradient(135deg, #f1c40f, #f39c12);
            --day-grad: linear-gradient(135deg, #00b09b, #96c93d);
            --week-grad: linear-gradient(135deg, #5b247a, #1bcedf);
            --month-grad: linear-gradient(135deg, #ff0844, #ffb199);
            --success: #27ae60;
            --danger: #e74c3c;
            --bg: #f8faff;
        }

        body { font-family: 'Cairo', sans-serif; background: var(--bg); margin: 0; padding-bottom: 50px; }
        .container { max-width: 700px; margin: auto; padding: 15px; }

        /* مستطيل اسم المتجر */
        .store-header-box { 
            background: var(--brand-gradient); padding: 40px 20px; 
            border-radius: 0 0 40px 40px; text-align: center; color: white; 
            box-shadow: 0 15px 35px rgba(30, 60, 114, 0.2); margin-bottom: 25px;
        }
        .store-header-box h1 { margin: 0; font-size: 2.2rem; font-weight: 900; }

        /* مستطيل الرابط */
        .url-box { 
            background: white; padding: 15px; border-radius: 20px; 
            display: flex; align-items: center; justify-content: space-between; 
            border: 2px solid #2a5298; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .url-box span { color: #2a5298; font-weight: bold; font-size: 0.85rem; word-break: break-all; }

        /* زر الإدارة الأصفر */
        .admin-btn { 
            background: var(--gold-gradient); color: #000; text-decoration: none; 
            display: flex; align-items: center; justify-content: center; gap: 12px; 
            padding: 18px; border-radius: 20px; font-weight: 900; font-size: 1.1rem;
            margin: 20px 0; box-shadow: 0 10px 20px rgba(243, 156, 18, 0.3); border: none; cursor: pointer;
        }

        /* عنوان تقارير المبيعات */
        .reports-title {
            text-align: center; margin: 30px 0 20px; padding: 10px;
            background: #fff; border-radius: 15px; border-bottom: 4px solid #2a5298;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .reports-title h2 { margin: 0; color: #2c3e50; font-size: 1.4rem; font-weight: 900; }

        /* الإحصائيات الملونة */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .stat-card { padding: 15px 5px; border-radius: 20px; text-align: center; color: white; box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .stat-card.day { background: var(--day-grad); }
        .stat-card.week { background: var(--week-grad); }
        .stat-card.month { background: var(--month-grad); }
        .stat-card span { font-size: 0.8rem; opacity: 0.9; font-weight: 600; }
        .stat-card strong { font-size: 1.3rem; display: block; margin: 5px 0; }
        .reset-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: white; font-size: 0.65rem; padding: 3px 8px; border-radius: 5px; cursor: pointer; }

        /* رسالة لا توجد طلبيات */
        .empty-state { 
            text-align: center; padding: 40px 20px; background: white; 
            border-radius: 25px; border: 2px dashed #cbd5e0; margin-top: 15px;
        }
        .empty-state i { font-size: 3rem; color: #a0aec0; margin-bottom: 15px; }
        .empty-state p { color: #4a5568; font-weight: 700; margin: 0; font-size: 1.1rem; }

        /* بطاقة الطلبية */
        .card { background: white; border-radius: 25px; padding: 20px; margin-bottom: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); }
        .phone-display { background: #f1f5f9; display: block; text-align: center; padding: 12px; border-radius: 15px; font-size: 1.7rem; font-weight: 900; margin: 10px 0; color: #1e293b; }
        
        .btn-group { display: flex; gap: 8px; }
        .btn-main { flex: 1; padding: 14px; border-radius: 15px; border: none; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
        .btn-call { background: var(--success); color: white; }
        .btn-delete { background: #fee; color: var(--danger); }

        .modal { background: white; padding: 20px; border-radius: 25px; border: 2px solid #f39c12; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #ddd; font-family: 'Cairo'; box-sizing: border-box; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="store-header-box">
    <h1 id="storeName">جاري التحميل...</h1>
</div>

<div class="container">
    <div class="url-box">
        <span id="storeUrl">تحميل الرابط...</span>
        <button onclick="copyUrl()" style="background:none; border:none; color:#2a5298; cursor:pointer;"><i class="far fa-copy"></i></button>
    </div>

    <a href="https://wa.me/213561150865" class="admin-btn">
        <i class="fab fa-whatsapp"></i> تواصل مع الإدارة (Future Site)
    </a>

    <div class="reports-title">
        <h2><i class="fas fa-chart-line"></i> تقارير المبيعات</h2>
    </div>
    <div class="stats">
        <div class="stat-card day"><span>اليوم</span><strong id="dayVal">0</strong><button class="reset-btn" onclick="resetStat('day')">تصفير</button></div>
        <div class="stat-card week"><span>الأسبوع</span><strong id="weekVal">0</strong><button class="reset-btn" onclick="resetStat('week')">تصفير</button></div>
        <div class="stat-card month"><span>الشهر</span><strong id="monthVal">0</strong><button class="reset-btn" onclick="resetStat('month')">تصفير</button></div>
    </div>

    <button class="admin-btn" style="background: #2c3e50; color:white; margin-top:30px;" onclick="toggleSection('ordersBox')">
        <i class="fas fa-list-ul"></i> عرض الطلبيات الواردة
    </button>
    <div id="ordersBox" class="hidden">
        </div>

    <button class="admin-btn" style="background: var(--success); color:white;" onclick="openAddModal()">
        <i class="fas fa-plus-circle"></i> إضافة منتج جديد
    </button>

    <div id="productForm" class="modal hidden">
        <h3 id="formTitle">إضافة منتج</h3>
        <input type="text" id="pTitle" placeholder="اسم المنتج">
        <input type="number" id="pPrice" placeholder="السعر">
        <input type="file" id="pImg" accept="image/*">
        <label><input type="checkbox" id="timerOn" onchange="document.getElementById('timerDate').classList.toggle('hidden')"> عداد زمني؟</label>
        <input type="datetime-local" id="timerDate" class="hidden">
        <button id="saveBtn" class="btn-main" style="background:var(--success); color:white; width:100%; margin-top:10px;">حفظ</button>
        <button onclick="closeModal()" class="btn-main" style="background:#eee; width:100%; margin-top:5px;">إلغاء</button>
    </div>

    <h3 style="margin-top:40px; border-right: 5px solid #2a5298; padding-right: 10px;">📦 إدارة المنتجات:</h3>
    <div id="productsList"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove, update, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);
    const storeId = localStorage.getItem('myStoreId');

    // جلب البيانات
    onValue(ref(db, `stores/${storeId}`), (s) => {
        if(s.exists()){
            document.getElementById('storeName').innerText = s.val().name;
            document.getElementById('storeUrl').innerText = window.location.origin + "/store.html?id=" + storeId;
        }
    });

    // مراقبة الطلبيات ورسالة الفراغ
    onValue(ref(db, `stores/${storeId}/orders`), (snap) => {
        const box = document.getElementById('ordersBox');
        let sums = {day:0, week:0, month:0};
        const now = new Date();

        if(!snap.exists()){
            box.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-Inbox"></i>
                    <p>في الوقت الحالي، لا توجد طلبيات واردة.</p>
                </div>`;
        } else {
            box.innerHTML = "";
            Object.entries(snap.val()).reverse().forEach(([key, o]) => {
                const p = parseFloat(o.productPrice) || 0;
                const d = new Date(o.timestamp);
                if(d.toDateString() === now.toDateString()) sums.day += p;
                
                box.innerHTML += `
                <div class="card">
                    <strong style="color:#2a5298; font-size:1.1rem;">${o.customerName}</strong>
                    <span class="phone-display">${o.customerPhone}</span>
                    <div style="font-size:0.85rem; color:#64748b; margin-bottom:15px;">
                        📍 ${o.customerState} | 🏙️ ${o.customerCity} | 📦 ${o.productName}
                    </div>
                    <div class="btn-group">
                        <a href="tel:${o.customerPhone}" class="btn-main btn-call"><i class="fas fa-phone-alt"></i> إتصال</a>
                        <button onclick="deleteOrder('${key}')" class="btn-main btn-delete"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
            });
        }
        document.getElementById('dayVal').innerText = sums.day;
    });

    // جلب المنتجات
    onValue(ref(db, `stores/${storeId}/products`), (snap) => {
        const list = document.getElementById('productsList'); list.innerHTML = "";
        if(snap.exists()){
            Object.entries(snap.val()).forEach(([key, p]) => {
                list.innerHTML += `
                <div class="card" style="display:flex; align-items:center; gap:15px; padding:12px;">
                    <img src="${p.image}" style="width:65px; height:65px; border-radius:15px; object-fit:cover;">
                    <div style="flex:1"><strong>${p.name}</strong><br><span style="color:var(--success); font-weight:900;">${p.price}</span></div>
                    <div style="display:flex; gap:5px;">
                        <button onclick="openEditModal('${key}', '${p.name}', '${p.price}')" style="border:none; background:#f1f5f9; padding:10px; border-radius:12px; cursor:pointer;"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteProduct('${key}')" style="border:none; background:#fee; color:red; padding:10px; border-radius:12px; cursor:pointer;"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
            });
        }
    });

    window.toggleSection = (id) => document.getElementById(id).classList.toggle('hidden');
    window.copyUrl = () => { navigator.clipboard.writeText(document.getElementById('storeUrl').innerText); alert("تم نسخ رابط متجرك ✅"); };
    window.deleteOrder = (k) => { if(confirm("هل تريد حذف هذه الطلبية؟")) remove(ref(db, `stores/${storeId}/orders/${k}`)); };
    window.deleteProduct = (k) => { if(confirm("حذف المنتج نهائياً؟")) remove(ref(db, `stores/${storeId}/products/${k}`)); };
    window.openAddModal = () => { document.getElementById('productForm').classList.remove('hidden'); };
    window.closeModal = () => { document.getElementById('productForm').classList.add('hidden'); };
</script>
</body>
</html>
