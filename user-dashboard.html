<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم البريميوم | Future Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #f0f2f5;
            --primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent: #00f2fe;
            --success: #00b09b;
            --danger: #ff4b2b;
            --card-bg: #ffffff;
        }

        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); margin: 0; padding-bottom: 50px; color: #333; }
        .container { max-width: 600px; margin: auto; padding: 15px; }

        /* الهيدر ورابط المتجر */
        .header-section { 
            background: var(--primary); color: white; padding: 30px 20px; 
            border-radius: 0 0 40px 40px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .store-url { 
            background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 12px; 
            font-size: 0.9rem; display: inline-flex; align-items: center; gap: 10px; margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.3); cursor: pointer;
        }

        /* عداد الصلاحية */
        .expiry-box {
            background: #1a1a2e; color: white; margin: -25px 20px 20px; padding: 15px;
            border-radius: 25px; display: flex; justify-content: space-around;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15); border: 1px solid var(--accent);
        }
        .timer-unit { text-align: center; }
        .timer-val { display: block; font-size: 1.2rem; font-weight: 900; color: var(--accent); }
        .timer-lab { font-size: 0.6rem; color: #888; }

        /* الأزرار الرئيسية */
        .action-btn {
            width: 100%; padding: 18px; border-radius: 20px; border: none; font-weight: 900;
            font-size: 1.1rem; cursor: pointer; margin-bottom: 12px; color: white;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            transition: transform 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .btn-admin { background: #2d3436; }
        .btn-tg { background: #0088cc; }
        .btn-orders { background: #f5576c; }
        .btn-add { background: var(--success); }
        .btn-prods { background: #4facfe; }

        /* تقارير المبيعات */
        .sales-report {
            background: white; border-radius: 25px; padding: 20px; margin-bottom: 20px;
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
        }
        .report-card { background: #f8f9fa; padding: 10px; border-radius: 15px; text-align: center; border: 1px solid #eee; }
        .report-num { display: block; font-weight: 900; font-size: 1.1rem; color: #764ba2; }
        .btn-reset { font-size: 0.6rem; background: #eee; border: none; padding: 2px 8px; border-radius: 5px; cursor: pointer; margin-top: 5px; }

        /* القوائم القابلة للطي */
        .collapsible-content { display: none; animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* الطلبية الاحترافية */
        .order-item {
            background: white; border-radius: 20px; padding: 15px; margin-bottom: 15px;
            border-right: 8px solid #f5576c; box-shadow: 0 5px 10px rgba(0,0,0,0.02);
        }
        .phone-big { 
            background: #2d3436; color: var(--accent); font-size: 1.8rem; font-weight: 900;
            text-align: center; padding: 10px; border-radius: 15px; display: block; 
            text-decoration: none; margin: 10px 0; letter-spacing: 2px;
        }

        /* المودال */
        .modal { background: white; padding: 25px; border-radius: 30px; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 92%; max-width: 500px; z-index: 2000; display: none; box-shadow: 0 0 50px rgba(0,0,0,0.3); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; display: none; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #ddd; font-family: 'Cairo'; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1 id="storeName" style="margin:0;">تحميل...</h1>
        <div class="store-url" onclick="copyLink()">
            <i class="fas fa-link"></i> <span id="storeUrlDisplay">future-site.com/store/123</span>
        </div>
    </div>

    <div class="expiry-box">
        <div class="timer-unit"><span id="d" class="timer-val">00</span><span class="timer-lab">يوم</span></div>
        <div class="timer-unit"><span id="h" class="timer-val">00</span><span class="timer-lab">ساعة</span></div>
        <div class="timer-unit"><span id="m" class="timer-val">00</span><span class="timer-lab">دقيقة</span></div>
        <div class="timer-unit"><span id="s" class="timer-val">00</span><span class="timer-lab">ثانية</span></div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;">
        <button class="action-btn btn-admin" onclick="window.open('https://wa.me/213561150865')"><i class="fab fa-whatsapp"></i> الإدارة</button>
        <button class="action-btn btn-tg" onclick="openTgModal()"><i class="fab fa-telegram-plane"></i> تليجرام</button>
    </div>

    <div class="sales-report">
        <div class="report-card">
            <span class="report-num" id="salesToday">0</span><span>اليوم</span>
            <button class="btn-reset" onclick="resetSales('today')">تصفير</button>
        </div>
        <div class="report-card">
            <span class="report-num" id="salesWeek">0</span><span>الأسبوع</span>
            <button class="btn-reset" onclick="resetSales('week')">تصفير</button>
        </div>
        <div class="report-card">
            <span class="report-num" id="salesMonth">0</span><span>الشهر</span>
            <button class="btn-reset" onclick="resetSales('month')">تصفير</button>
        </div>
    </div>

    <button class="action-btn btn-orders" onclick="toggleSection('ordersSection')">
        <i class="fas fa-shopping-basket"></i> الطلبيات الواردة
    </button>
    <div id="ordersSection" class="collapsible-content">
        <div id="ordersContainer"></div>
    </div>

    <button class="action-btn btn-add" onclick="openModal('add')">
        <i class="fas fa-plus-circle"></i> إضافة منتج جديد
    </button>

    <button class="action-btn btn-prods" onclick="toggleSection('prodsSection')">
        <i class="fas fa-boxes"></i> قائمة المنتجات
    </button>
    <div id="prodsSection" class="collapsible-content">
        <div id="prodsContainer"></div>
    </div>
</div>

<div id="overlay" class="overlay" onclick="closeModal()"></div>
<div id="mainModal" class="modal">
    <h3 id="modalTitle" style="text-align:center;">إضافة منتج</h3>
    <input type="text" id="pName" placeholder="اسم المنتج">
    <input type="number" id="pPrice" placeholder="السعر">
    <textarea id="pDesc" placeholder="الوصف"></textarea>
    <input type="file" id="pImage" accept="image/*">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button id="saveBtn" class="action-btn btn-add" style="margin:0; padding:10px;">تأكيد ✅</button>
        <button onclick="closeModal()" class="action-btn" style="background:#eee; color:#333; margin:0; padding:10px;">تراجع ❌</button>
    </div>
</div>

<div id="tgModal" class="modal">
    <h3 style="text-align:center;">إعدادات تليجرام</h3>
    <input type="text" id="tgToken" placeholder="Bot Token">
    <input type="text" id="tgChatId" placeholder="Chat ID">
    <button onclick="saveTg()" class="action-btn btn-tg">حفظ الربط ✅</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storeId = localStorage.getItem('myStoreId');

    if (storeId) {
        // تحديث معلومات المتجر والوقت
        onValue(ref(db, `stores/${storeId}`), s => {
            if(s.exists()){
                const d = s.val();
                document.getElementById('storeName').innerText = d.name;
                document.getElementById('storeUrlDisplay').innerText = `future-site.com/${storeId}`;
                
                // تحديث العداد
                setInterval(() => {
                    const diff = new Date(d.expiryDate).getTime() - new Date().getTime();
                    if(diff <= 0) return;
                    document.getElementById('d').innerText = Math.floor(diff / 864e5);
                    document.getElementById('h').innerText = Math.floor((diff % 864e5) / 36e5);
                    document.getElementById('m').innerText = Math.floor((diff % 36e5) / 6e4);
                    document.getElementById('s').innerText = Math.floor((diff % 6e4) / 1000);
                }, 1000);

                // المبيعات
                document.getElementById('salesToday').innerText = d.sales?.today || 0;
                document.getElementById('salesWeek').innerText = d.sales?.week || 0;
                document.getElementById('salesMonth').innerText = d.sales?.month || 0;
            }
        });

        // الطلبيات
        onValue(ref(db, `stores/${storeId}/orders`), snap => {
            const container = document.getElementById('ordersContainer'); container.innerHTML = "";
            if(snap.exists()){
                Object.entries(snap.val()).reverse().forEach(([k, o]) => {
                    container.innerHTML += `
                    <div class="order-item">
                        <div style="font-weight:900; font-size:1.1rem;">👤 ${o.customerName}</div>
                        <a href="tel:${o.customerPhone}" class="phone-big">${o.customerPhone}</a>
                        <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:#666;">
                            <span>📍 ${o.customerState} | ${o.customerAddress}</span>
                            <span>📦 ${o.productName}</span>
                        </div>
                        <div style="display:grid; grid-template-columns:3fr 1fr; gap:10px; margin-top:12px;">
                            <a href="tel:${o.customerPhone}" class="action-btn" style="background:var(--success); padding:10px; margin:0; font-size:0.9rem;">إتصال</a>
                            <button onclick="delOrder('${k}')" class="action-btn" style="background:var(--danger); padding:10px; margin:0;"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>`;
                });
            }
        });

        // المنتجات
        onValue(ref(db, `stores/${storeId}/products`), snap => {
            const container = document.getElementById('prodsContainer'); container.innerHTML = "";
            if(snap.exists()) Object.entries(snap.val()).forEach(([k, p]) => {
                container.innerHTML += `
                <div style="background:white; padding:10px; border-radius:15px; display:flex; align-items:center; gap:12px; margin-bottom:10px; box-shadow:0 3px 6px rgba(0,0,0,0.02);">
                    <img src="${p.image}" style="width:50px; height:50px; border-radius:10px; object-fit:cover;">
                    <div style="flex:1"><b>${p.name}</b><br><small>${p.price} دج</small></div>
                    <button onclick="editProd('${k}')" style="color:blue; background:none; border:none; margin-left:10px;"><i class="fas fa-edit"></i></button>
                    <button onclick="delProd('${k}')" style="color:red; background:none; border:none;"><i class="fas fa-trash"></i></button>
                </div>`;
            });
        });
    }

    // وظائف الواجهة
    window.toggleSection = (id) => {
        const el = document.getElementById(id);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    };

    window.copyLink = () => {
        navigator.clipboard.writeText(document.getElementById('storeUrlDisplay').innerText);
        alert("تم نسخ رابط المتجر!");
    };

    window.resetSales = (type) => {
        if(confirm("هل تريد تصفير تقرير المبيعات هذا؟")) {
            update(ref(db, `stores/${storeId}/sales`), { [type]: 0 });
        }
    };

    window.openModal = (mode) => {
        document.getElementById('mainModal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    };

    window.closeModal = () => {
        document.querySelectorAll('.modal, .overlay').forEach(el => el.style.display = 'none');
    };

    window.openTgModal = () => {
        document.getElementById('tgModal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    };

    window.delOrder = (id) => { if(confirm("حذف الطلبية؟")) remove(ref(db, `stores/${storeId}/orders/${id}`)); };
    window.delProd = (id) => { if(confirm("حذف المنتج؟")) remove(ref(db, `stores/${storeId}/products/${id}`)); };
</script>
</body>
            </html>
