<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --blue-grad: linear-gradient(135deg, #1e3799 0%, #0984e3 100%);
            --time-grad: linear-gradient(45deg, #2c3e50, #000000);
            --success: #2ecc71;
            --danger: #e74c3c;
            --url-color: #6c5ce7;
            --accent: #00f2fe;
        }

        body { font-family: 'Cairo', sans-serif; background-color: #f1f2f6; margin: 0; padding: 15px; padding-bottom: 50px; }
        .container { max-width: 600px; margin: auto; }

        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: 1px solid #eee; }
        
        /* تصميم عداد الوقت الجذاب */
        .expiry-card { background: var(--time-grad); color: white; border-radius: 20px; padding: 15px; text-align: center; margin-bottom: 15px; border: 2px solid var(--accent); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .timer-grid { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        .timer-unit { background: rgba(255,255,255,0.1); padding: 8px; border-radius: 10px; min-width: 50px; }
        .timer-val { display: block; font-size: 1.4rem; font-weight: 900; color: var(--accent); }
        .timer-label { font-size: 0.7rem; opacity: 0.8; }

        /* كرت الطلبية المطور */
        .order-card { background: white; border-radius: 25px; overflow: hidden; margin-bottom: 20px; border: 1px solid #eee; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .order-header { background: #f8f9fa; padding: 10px; font-size: 0.8rem; color: #666; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
        .order-body { padding: 20px; }
        .loc-badge { background: #eef2ff; color: #4338ca; padding: 5px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; margin: 5px; display: inline-block; }
        
        /* النوافذ الجذابة */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 380px; background: white; padding: 25px; border-radius: 30px; z-index: 2000; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.3); animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { from { transform: translate(-50%, -60%) scale(0.9); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 1000; }
        
        .modal-icon { font-size: 3rem; margin-bottom: 15px; }
        .btn-confirm { background: var(--danger); color: white; border: none; padding: 12px 30px; border-radius: 15px; font-weight: 900; cursor: pointer; margin: 5px; }
        .btn-cancel { background: #eee; color: #333; border: none; padding: 12px 30px; border-radius: 15px; font-weight: 900; cursor: pointer; margin: 5px; }

        .action-btn { width: 100%; padding: 18px; border-radius: 20px; border: none; font-weight: 900; color: white; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.1rem; transition: 0.3s; text-decoration: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="card" style="background:var(--blue-grad); color:white; text-align:center;">
        <h1 id="storeName" style="margin:0">جاري التحميل...</h1>
    </div>

    <div class="card" style="text-align:center; border:2px solid var(--url-color);">
        <h4 style="margin:0; color:var(--url-color);"><i class="fas fa-link"></i> رابط المتجر</h4>
        <div id="storeUrl" style="background:#f3f0ff; padding:12px; border-radius:12px; font-weight:900; margin-top:8px; border:1px dashed var(--url-color); word-break:break-all;">...</div>
        <button onclick="copyLink()" style="margin-top:10px; background:var(--url-color); color:white; border:none; padding:10px 25px; border-radius:50px; font-weight:bold; cursor:pointer;"><i class="fas fa-copy"></i> نسخ الرابط</button>
    </div>

    <div class="expiry-card">
        <h4 style="margin:0;"><i class="fas fa-clock"></i> مدة صلاحية المتجر</h4>
        <div class="timer-grid">
            <div class="timer-unit"><span id="days" class="timer-val">00</span><span class="timer-label">يوم</span></div>
            <div class="timer-unit"><span id="hours" class="timer-val">00</span><span class="timer-label">ساعة</span></div>
            <div class="timer-unit"><span id="mins" class="timer-val">00</span><span class="timer-label">دقيقة</span></div>
            <div class="timer-unit"><span id="secs" class="timer-val">00</span><span class="timer-label">ثانية</span></div>
        </div>
    </div>

    <button class="action-btn" style="background:var(--url-color);" onclick="toggleSection('ordersSection')"><i class="fas fa-shopping-basket"></i> الطلبيات الواردة</button>
    <div id="ordersSection" class="hidden"><div id="ordersList"></div></div>

    <button class="action-btn" style="background:var(--success);" onclick="openAddModal()"><i class="fas fa-plus-circle"></i> إضافة منتج جديد</button>

    <button class="action-btn" style="background:var(--blue-grad);" onclick="toggleSection('manageSection')"><i class="fas fa-edit"></i> إدارة المنتجات</button>
    <div id="manageSection" class="hidden"><div id="productsList" style="background:white; border-radius:20px; padding:10px;"></div></div>
</div>

<div id="deleteModal" class="modal">
    <div class="modal-icon"><i class="fas fa-trash-alt" style="color:var(--danger);"></i></div>
    <h2 id="delTitle">هل أنت متأكد؟</h2>
    <p id="delMsg" style="color:#666; margin-bottom:20px;">لا يمكن التراجع عن هذا الإجراء بعد الحذف.</p>
    <div style="display:flex; justify-content:center;">
        <button id="btnConfirmDel" class="btn-confirm">نعم، احذف</button>
        <button onclick="closeDelModal()" class="btn-cancel">لا، إلغاء</button>
    </div>
</div>

<div id="copyModal" class="modal">
    <div class="modal-icon"><i class="fas fa-check-circle" style="color:var(--success);"></i></div>
    <h2 style="color:var(--success);">تم النسخ!</h2>
    <p>رابط متجرك جاهز للمشاركة الآن.</p>
    <button onclick="closeModal('copyModal')" class="btn-confirm" style="background:var(--success);">ممتاز ✅</button>
</div>

<div id="productModal" class="modal" style="text-align:right;">
    <h3 id="modalTitle">إضافة منتج</h3>
    <input type="hidden" id="editKey">
    <input type="text" id="pName" placeholder="اسم المنتج">
    <input type="number" id="pPrice" placeholder="السعر">
    <textarea id="pDesc" placeholder="الوصف"></textarea>
    <input type="file" id="pImage" accept="image/*">
    <button id="saveBtn" class="action-btn" style="background:var(--success);">تأكيد الحفظ</button>
</div>

<div id="overlay" class="overlay" onclick="closeAllModals()"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storeId = localStorage.getItem('myStoreId');
    let pathToDelete = "";

    if (storeId) {
        onValue(ref(db, `stores/${storeId}`), s => {
            if(s.exists()){
                const d = s.val();
                document.getElementById('storeName').innerText = d.name;
                document.getElementById('storeUrl').innerText = "future-site.com/" + storeId;
                
                // تحديث العداد
                setInterval(() => {
                    const diff = new Date(d.expiryDate).getTime() - new Date().getTime();
                    if(diff > 0){
                        document.getElementById('days').innerText = Math.floor(diff / 864e5);
                        document.getElementById('hours').innerText = Math.floor((diff % 864e5) / 36e5);
                        document.getElementById('mins').innerText = Math.floor((diff % 36e5) / 6e4);
                        document.getElementById('secs').innerText = Math.floor((diff % 6e4) / 1000);
                    }
                }, 1000);
            }
        });

        // عرض الطلبيات بالتفاصيل الجديدة
        onValue(ref(db, `stores/${storeId}/orders`), snap => {
            const list = document.getElementById('ordersList'); list.innerHTML = "";
            if(snap.exists()) Object.entries(snap.val()).reverse().forEach(([id, o]) => {
                list.innerHTML += `
                <div class="order-card">
                    <div class="order-header"><span>🆔 طلب #${id.slice(-4)}</span> <span>📅 ${o.date || 'اليوم'}</span></div>
                    <div class="order-body">
                        <strong style="color:var(--url-color)">📦 المنتج: ${o.productName}</strong><br>
                        <span style="font-size:1.3rem; font-weight:900;">👤 ${o.customerName}</span>
                        <div style="margin:10px 0;">
                            <span class="loc-badge">📍 ${o.customerState || 'غير محدد'}</span>
                            <span class="loc-badge">🏘️ ${o.customerAddress || 'غير محدد'}</span>
                        </div>
                        <a href="tel:${o.customerPhone}" style="background:#222; color:var(--accent); display:block; text-align:center; padding:10px; border-radius:12px; font-size:1.6rem; font-weight:900; text-decoration:none; margin-bottom:15px; border:2px solid var(--accent);">${o.customerPhone}</a>
                        <div style="display:grid; grid-template-columns: 3fr 1fr; gap:10px;">
                            <a href="tel:${o.customerPhone}" style="background:var(--success); color:white; text-decoration:none; padding:15px; border-radius:15px; text-align:center; font-weight:900;"><i class="fas fa-phone"></i> إتصال الآن</a>
                            <button onclick="confirmDelete('orders/${id}', 'طلبية')" style="background:var(--danger); color:white; border:none; border-radius:15px; cursor:pointer;"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>`;
            });
        });

        // عرض المنتجات
        onValue(ref(db, `stores/${storeId}/products`), snap => {
            const list = document.getElementById('productsList'); list.innerHTML = "";
            if(snap.exists()) Object.entries(snap.val()).forEach(([id, p]) => {
                list.innerHTML += `
                <div style="display:flex; align-items:center; gap:10px; padding:10px; border-bottom:1px solid #eee;">
                    <img src="${p.image}" width="50" height="50" style="border-radius:10px; object-fit:cover;">
                    <div style="flex:1;"><b>${p.name}</b><br><small>${p.price} دج</small></div>
                    <button onclick="editP('${id}','${p.name}','${p.price}','${p.description}')" style="background:#f39c12; color:white; border:none; padding:8px; border-radius:8px;"><i class="fas fa-pen"></i></button>
                    <button onclick="confirmDelete('products/${id}', 'منتج')" style="background:red; color:white; border:none; padding:8px; border-radius:8px;"><i class="fas fa-trash"></i></button>
                </div>`;
            });
        });
    }

    // وظائف الحذف مع النافذة المنبثقة
    window.confirmDelete = (path, type) => {
        pathToDelete = path;
        document.getElementById('delTitle').innerText = `حذف ${type}؟`;
        document.getElementById('delMsg').innerText = `هل أنت متأكد من رغبتك في حذف هذا الـ ${type}؟`;
        document.getElementById('deleteModal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    };

    document.getElementById('btnConfirmDel').onclick = () => {
        remove(ref(db, `stores/${storeId}/${pathToDelete}`)).then(() => closeDelModal());
    };

    window.closeDelModal = () => { document.getElementById('deleteModal').style.display = 'none'; document.getElementById('overlay').style.display = 'none'; };
    
    // الوظائف العامة
    window.copyLink = () => {
        navigator.clipboard.writeText(document.getElementById('storeUrl').innerText).then(() => {
            document.getElementById('copyModal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        });
    };

    window.closeModal = (id) => { document.getElementById(id).style.display = 'none'; document.getElementById('overlay').style.display = 'none'; };
    window.closeAllModals = () => { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); document.getElementById('overlay').style.display='none'; };
    window.toggleSection = (id) => { document.getElementById(id).classList.toggle('hidden'); };
    window.openAddModal = () => { document.getElementById('modalTitle').innerText="إضافة منتج"; document.getElementById('editKey').value=""; document.getElementById('productModal').style.display='block'; document.getElementById('overlay').style.display='block'; };

    window.editP = (k, n, p, d) => {
        document.getElementById('modalTitle').innerText="تعديل المنتج";
        document.getElementById('editKey').value=k; document.getElementById('pName').value=n;
        document.getElementById('pPrice').value=p; document.getElementById('pDesc').value=d;
        document.getElementById('productModal').style.display='block'; document.getElementById('overlay').style.display='block';
    };

    window.saveBtn.onclick = async () => {
        const k = document.getElementById('editKey').value, n = document.getElementById('pName').value, p = document.getElementById('pPrice').value, d = document.getElementById('pDesc').value, f = document.getElementById('pImage').files[0];
        if(!n || !p) return alert("أدخل البيانات");
        
        window.saveBtn.disabled = true;
        let img = "";
        if(f){
            const fd = new FormData(); fd.append("image", f);
            const res = await fetch("https://api.imgbb.com/1/upload?key=e48055a00c4440331de482c9a7b18e01", {method:"POST", body:fd});
            const j = await res.json(); img = j.data.url;
        }

        const data = { name:n, price:p, description:d }; if(img) data.image = img;
        if(k) update(ref(db, `stores/${storeId}/products/${k}`), data).then(()=>closeModal('productModal'));
        else { if(!img) return alert("اختر صورة"); push(ref(db, `stores/${storeId}/products`), data).then(()=>closeModal('productModal')); }
        window.saveBtn.disabled = false;
    };
</script>
</body>
        </html>
