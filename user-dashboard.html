<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3799">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --blue-grad: linear-gradient(135deg, #1e3799 0%, #0984e3 100%);
            --green-grad: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            --danger-grad: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            --gold-grad: linear-gradient(135deg, #f1c40f 0%, #f39c12 100%);
            --cloud-grad: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            --accent-neon: #00f2fe;
            --dark-card: #2d3436;
        }

        body { font-family: 'Cairo', sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; padding-bottom: 60px; }
        .container { max-width: 500px; margin: auto; }

        /* شاشة القفل والتحميل */
        #smartLock { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100001; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #1e3799; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* الهيدر والتايمر */
        .top-header { background: var(--blue-grad); padding: 20px; border-radius: 25px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; box-shadow: 0 10px 20px rgba(30, 55, 153, 0.2); }
        .timer-section { background: #1a1a2e; border-radius: 25px; padding: 15px; margin-bottom: 20px; text-align: center; border: 2px solid var(--accent-neon); }
        .timer-grid { display: flex; justify-content: center; gap: 8px; margin-top: 8px; }
        .timer-box { background: rgba(255,255,255,0.1); padding: 8px; border-radius: 12px; min-width: 50px; border-bottom: 3px solid var(--accent-neon); }
        .timer-num { display: block; font-size: 1.1rem; font-weight: 900; color: #fff; }
        .timer-label { display: block; font-size: 0.6rem; color: #aaa; }

        .main-action { width: 100%; padding: 18px; border-radius: 22px; border: none; font-weight: 900; color: white; cursor: pointer; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 1rem; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-family: 'Cairo'; }
        .btn-orders { background: var(--dark-card); }
        .btn-add { background: var(--blue-grad); }
        .btn-manage { background: #57606f; }
        .url-box { background: white; padding: 15px; border-radius: 25px; border: 2px dashed #6c5ce7; text-align: center; margin-bottom: 20px; }
        .hidden { display: none; }

        /* بطاقة الطلبية الاحترافية */
        .order-card { 
            background: white; border-radius: 30px; padding: 20px; margin-bottom: 25px; 
            border-right: 10px solid #0984e3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            position: relative; 
        }
        .order-date { background: #f1f2f6; color: #57606f; padding: 5px 15px; border-radius: 50px; font-size: 0.75rem; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .order-title { color: #1e3799; font-size: 1.2rem; font-weight: 900; margin-bottom: 15px; display: block; }
        .info-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .info-row i { color: #0984e3; width: 20px; }
        .name-highlight { color: #1e3799; font-weight: 900; font-size: 1.1rem; }
        .location-highlight { color: #6c5ce7; font-weight: 700; }
        .phone-badge { 
            background: #fff9c4; color: #f57f17; padding: 12px; border-radius: 20px; 
            text-align: center; font-size: 1.4rem; font-weight: 900; margin: 15px 0;
            letter-spacing: 2px; border: 2px dashed #f57f17;
        }
        .btn-call { 
            background: var(--green-grad); color: white; text-decoration: none; 
            border-radius: 20px; display: flex; align-items: center; justify-content: center; 
            height: 55px; font-weight: 900; gap: 12px; font-size: 1.1rem;
            box-shadow: 0 8px 20px rgba(46, 204, 113, 0.4);
        }
        .btn-delete-order { 
            width: 100%; margin-top: 15px; border: none; background: rgba(255, 71, 87, 0.1); 
            color: #ff4757; padding: 10px; border-radius: 15px; cursor: pointer; font-weight: bold;
        }

        /* المودالات الجذابة */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 10000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: white; padding: 30px; border-radius: 35px; text-align: center; width: 100%; max-width: 400px; animation: popIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .btn-confirm { background: var(--danger-grad); flex: 2; margin-bottom: 0; }
        .btn-cancel { background: #eee; color: #333; flex: 1; margin-bottom: 0; }
    </style>
</head>
<body>

<div id="smartLock">
    <i class="fas fa-user-lock" style="font-size: 80px; color: #ff4757; margin-bottom: 20px;"></i>
    <h1 style="font-weight: 900; color: #1e3799;">تنبيه الإدارة</h1>
    <p style="color: #636e72; font-size: 1.1rem; max-width: 300px;">عذراً، قام المدير بإيقاف متجرك أو انتهت صلاحية الرابط.</p>
    <a href="https://wa.me/213561150865" style="background:#25d366; color:white; padding:15px 30px; border-radius:15px; text-decoration:none; font-weight:bold; margin-top:30px; display:inline-block;">تواصل مع الإدارة للتفعيل</a>
</div>

<div id="loadingOverlay">
    <div class="loader"></div>
    <p style="margin-top:15px; font-weight:900; color:#1e3799;">جاري فحص حالة المتجر...</p>
</div>

<div class="container" id="mainAppContent" style="display:none;">
    <div class="top-header">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div style="background: rgba(255,255,255,0.2); width: 45px; height: 45px; border-radius: 15px; display: flex; align-items: center; justify-content: center;"><i class="fas fa-store-alt" style="color: white; font-size: 1.4rem;"></i></div>
            <div><span style="display: block; font-size: 0.7rem; color: rgba(255,255,255,0.8);">لوحة تحكم</span><span id="storeNameDisp" style="display: block; font-size: 1.2rem; font-weight: 900; color: white;">جاري التحميل...</span></div>
        </div>
        <button onclick="logout()" style="background: #ff4757; color: white; border: none; padding: 10px 18px; border-radius: 15px; font-weight: 900; cursor: pointer;">خروج</button>
    </div>

    <div class="timer-section">
        <span style="color:var(--accent-neon); font-size:0.8rem; font-weight:900;">⌛ متبقي على صلاحية الرابط:</span>
        <div class="timer-grid">
            <div class="timer-box"><span class="timer-num" id="days">00</span><span class="timer-label">يوم</span></div>
            <div class="timer-box"><span class="timer-num" id="hours">00</span><span class="timer-label">ساعة</span></div>
            <div class="timer-box"><span class="timer-num" id="minutes">00</span><span class="timer-label">دقيقة</span></div>
            <div class="timer-box"><span class="timer-num" id="seconds">00</span><span class="timer-label">ثانية</span></div>
        </div>
    </div>

    <div class="url-box">
        <div id="storeUrlDisp" style="font-size: 0.8rem; color: #6c5ce7; font-weight: bold; margin-bottom: 12px; word-break: break-all;">رابط متجرك يظهر هنا</div>
        <button onclick="handleCopy()" class="main-action" style="background: #6c5ce7; margin-bottom: 0;">نسخ رابط المتجر</button>
    </div>

    <button class="main-action" style="background: var(--cloud-grad);" onclick="showConfirmModal('download')">
        <i class="fas fa-bell"></i> تنزيل التطبيق واستقبال الإشعارات 🔔
    </button>

    <button class="main-action btn-orders" onclick="toggleSec('ordersSection')"><i class="fas fa-shopping-basket"></i> الطلبيات الواردة</button>
    <div id="ordersSection" class="hidden"><div id="ordersList"></div></div>

    <button class="main-action btn-add" onclick="openAddModal()"><i class="fas fa-plus-circle"></i> إضافة منتج جديد</button>
    <button class="main-action btn-manage" onclick="toggleSec('manageSection')"><i class="fas fa-tasks"></i> إدارة المنتجات</button>
    <div id="manageSection" class="hidden"><div id="productsList"></div></div>
</div>

<div id="customModal" class="modal">
    <div class="modal-content">
        <div id="modalIcon" style="font-size: 70px; margin-bottom: 15px;"></div>
        <h3 id="modalTitle" style="font-weight: 900; color: #1e3799;"></h3>
        <p id="modalText" style="color: #636e72; margin-bottom: 25px;"></p>
        <div id="modalBtns" style="display: flex; gap: 10px;"></div>
    </div>
</div>

<div id="productModal" class="modal">
    <div class="modal-content">
        <h2 id="pModalTitle" style="font-weight: 900; color: #1e3799;">بيانات المنتج</h2>
        <input type="hidden" id="editKey"><input type="text" id="pName" placeholder="اسم المنتج"><input type="number" id="pPrice" placeholder="سعر المنتج"><textarea id="pDesc" rows="3" placeholder="وصف المنتج"></textarea><input type="file" id="pImage" accept="image/*">
        <div style="display: flex; gap: 10px;"><button class="main-action btn-add" id="saveProductBtn" style="flex: 2; margin-bottom:0;">تأكيد</button><button class="main-action btn-cancel" onclick="closeProductModal()">تراجع</button></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storeId = localStorage.getItem('myStoreId');

    // إذا لم يجد المعرف يحوله لصفحة الدخول فوراً بدل التعليق
    if(!storeId) { window.location.href = "index.html"; }

    // مؤقت أمان ينهي شاشة التحميل مهما حدث بعد 3 ثواني
    const loaderTimeout = setTimeout(() => {
        const overlay = document.getElementById('loadingOverlay');
        if(overlay) overlay.style.display = 'none';
        const main = document.getElementById('mainAppContent');
        if(main) main.style.display = 'block';
    }, 3000);

    let timerInterval = null;
    let lastOrderCount = -1;

    onValue(ref(db, `stores/${storeId}`), (snap) => {
        clearTimeout(loaderTimeout);
        document.getElementById('loadingOverlay').style.display = 'none';
        document.getElementById('mainAppContent').style.display = 'block';

        if (snap.exists()) {
            const data = snap.val();
            const status = (data.status || 'active').toLowerCase();
            const expiry = Number(data.expiryDate) || 0;

            if (status === 'stopped' || (expiry > 0 && Date.now() > expiry)) {
                document.getElementById('mainAppContent').style.display = 'none';
                document.getElementById('smartLock').style.display = 'flex';
                return;
            } else {
                document.getElementById('smartLock').style.display = 'none';
            }

            document.getElementById('storeNameDisp').innerText = data.name;
            document.getElementById('storeUrlDisp').innerText = window.location.origin + "/store.html?id=" + storeId;
            if(expiry > 0) startTimer(expiry);
            
            const orders = data.orders || {};
            if(lastOrderCount !== -1 && Object.keys(orders).length > lastOrderCount) playNotif();
            lastOrderCount = Object.keys(orders).length;

            renderOrders(orders);
            renderProducts(data.products || {});
        }
    });

    function startTimer(target) {
        if(timerInterval) clearInterval(timerInterval);
        const update = () => {
            const diff = target - Date.now();
            if(diff <= 0) { location.reload(); return; }
            document.getElementById('days').innerText = Math.floor(diff/86400000).toString().padStart(2,'0');
            document.getElementById('hours').innerText = Math.floor((diff%86400000)/3600000).toString().padStart(2,'0');
            document.getElementById('minutes').innerText = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
            document.getElementById('seconds').innerText = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
        };
        update(); timerInterval = setInterval(update, 1000);
    }

    function renderOrders(orders) {
        const list = document.getElementById('ordersList'); list.innerHTML = "";
        const entries = Object.entries(orders).reverse();
        if(entries.length === 0) { list.innerHTML = "<p style='text-align:center; padding:20px; color:#999;'>لا توجد طلبيات حالياً</p>"; return; }
        
        entries.forEach(([id, o]) => {
            list.innerHTML += `
            <div class="order-card">
                <div class="order-date"><i class="far fa-calendar-alt"></i> وصل في: ${o.date || 'اليوم'}</div>
                <span class="order-title"><i class="fas fa-box"></i> طلبية: ${o.productName}</span>
                <div class="info-row"><i class="fas fa-user-circle"></i> <span class="name-highlight">${o.customerName}</span></div>
                <div class="info-row"><i class="fas fa-map-marker-alt"></i> <span class="location-highlight">${o.wilaya || ''} - ${o.baladia || ''}</span></div>
                <div class="phone-badge">${o.phone}</div>
                <a href="tel:${o.phone}" class="btn-call"><i class="fas fa-phone-alt"></i> إتصال بالزبون الآن</a>
                <button onclick="showConfirmModal('deleteOrder', '${id}')" class="btn-delete-order"><i class="fas fa-trash"></i> حذف الطلبية</button>
            </div>`;
        });
    }

    function renderProducts(products) {
        const list = document.getElementById('productsList'); list.innerHTML = "";
        Object.entries(products).forEach(([id, p]) => {
            list.innerHTML += `
            <div style="background:white; margin:10px 0; padding:15px; border-radius:20px; display:flex; align-items:center; gap:12px; box-shadow:0 5px 15px rgba(0,0,0,0.05);">
                <img src="${p.image || ''}" style="width:50px; height:50px; border-radius:12px; object-fit:cover;">
                <div style="flex:1"><b style="color:#1e3799;">${p.name}</b><br><small style="color:#2ecc71; font-weight:bold;">${p.price} دج</small></div>
                <button onclick="editProduct('${id}','${p.name}','${p.price}','${p.description}')" style="background:#f1c40f; color:white; border:none; padding:10px; border-radius:12px;"><i class="fas fa-edit"></i></button>
                <button onclick="showConfirmModal('deleteProduct', '${id}')" style="background:#ff4757; color:white; border:none; padding:10px; border-radius:12px;"><i class="fas fa-trash"></i></button>
            </div>`;
        });
    }

    window.showConfirmModal = (type, id) => {
        const modal = document.getElementById('customModal');
        const icon = document.getElementById('modalIcon');
        const title = document.getElementById('modalTitle');
        const text = document.getElementById('modalText');
        const btns = document.getElementById('modalBtns');
        modal.style.display = 'flex';

        if(type === 'download') {
            icon.innerHTML = "📲"; title.innerText = "تنزيل التطبيق";
            text.innerText = "احصل على تجربة أسرع وإشعارات فورية لكل طلبية جديدة!";
            btns.innerHTML = `<button class="main-action btn-add" style="margin:0; flex:1;" onclick="executeDownload()">تنزيل</button><button class="main-action btn-cancel" onclick="closeModal()">إلغاء</button>`;
        } else {
            icon.innerHTML = "⚠️"; icon.style.color = "#ff4757";
            title.innerText = "هل أنت متأكد؟";
            text.innerText = "سيتم حذف البيانات نهائياً من قاعدة البيانات.";
            btns.innerHTML = `<button class="main-action btn-confirm" onclick="finalDelete('${type}', '${id}')">نعم، احذف</button><button class="main-action btn-cancel" onclick="closeModal()">تراجع</button>`;
        }
    };

    window.finalDelete = (type, id) => {
        const path = type === 'deleteOrder' ? `orders/${id}` : `products/${id}`;
        remove(ref(db, `stores/${storeId}/${path}`)).then(() => {
            showSuccessMsg("تم الحذف بنجاح تام! ✨");
        });
    };

    window.showSuccessMsg = (msg) => {
        document.getElementById('modalIcon').innerHTML = "🎉"; 
        document.getElementById('modalIcon').style.color = "#2ecc71";
        document.getElementById('modalTitle').innerText = "تم بنجاح!";
        document.getElementById('modalText').innerText = msg;
        document.getElementById('modalBtns').innerHTML = `<button class="main-action" style="background:var(--green-grad); width:100%; margin:0;" onclick="closeModal()">ممتاز</button>`;
    };

    window.editProduct = (id, n, p, d) => {
        document.getElementById('editKey').value = id;
        document.getElementById('pName').value = n;
        document.getElementById('pPrice').value = p;
        document.getElementById('pDesc').value = d;
        document.getElementById('pModalTitle').innerText = "تعديل المنتج";
        openAddModal();
    };

    window.saveProductBtn.onclick = async () => {
        const k = document.getElementById('editKey').value, n = document.getElementById('pName').value, p = document.getElementById('pPrice').value, d = document.getElementById('pDesc').value, f = document.getElementById('pImage').files[0];
        if(!n || !p) return;
        let img = "";
        if(f) {
            const fd = new FormData(); fd.append("image", f);
            const res = await fetch("https://api.imgbb.com/1/upload?key=e48055a00c4440331de482c9a7b18e01", {method:"POST", body:fd});
            const j = await res.json(); img = j.data.url;
        }
        const data = {name:n, price:p, description:d};
        if(img) data.image = img;
        k ? update(ref(db, `stores/${storeId}/products/${k}`), data) : push(ref(db, `stores/${storeId}/products`), data);
        closeProductModal();
        showSuccessMsg("تم الحفظ بنجاح! ✅");
    };

    window.closeModal = () => document.getElementById('customModal').style.display = 'none';
    window.openAddModal = () => document.getElementById('productModal').style.display = 'flex';
    window.closeProductModal = () => { document.getElementById('productModal').style.display = 'none'; document.getElementById('editKey').value = ""; };
    window.toggleSec = (id) => document.getElementById(id).classList.toggle('hidden');
    window.logout = () => { localStorage.clear(); location.reload(); };
