<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | Future Site</title>
    <link rel="manifest" href="manifest.json"> 
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --blue-grad: linear-gradient(135deg, #1e3799 0%, #0984e3 100%);
            --success: #2ecc71;
            --danger: #e74c3c;
            --url-color: #6c5ce7;
            --accent: #00f2fe;
            --dark: #2d3436;
            --orange-grad: linear-gradient(135deg, #FF512F 0%, #DD2476 100%);
            --cloud-grad: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
        }

        body { font-family: 'Cairo', sans-serif; background-color: #f4f7f6; margin: 0; padding: 10px; padding-bottom: 50px; }
        .container { max-width: 500px; margin: auto; display: none; }
        
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #1e3799; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 1. الهيدر العلوي الاحترافي */
        .header-card { 
            background: var(--blue-grad); color: white; border-radius: 20px; 
            padding: 15px 20px; display: flex; justify-content: space-between; 
            align-items: center; margin-bottom: 12px; box-shadow: 0 8px 15px rgba(30, 55, 153, 0.2);
        }
        .logout-btn { background: rgba(255,255,255,0.2); color: white; border: 1.5px solid white; padding: 5px 15px; border-radius: 12px; cursor: pointer; font-weight: bold; }

        /* 2. زر السحابة (تنزيل التطبيق) */
        .cloud-btn {
            background: var(--cloud-grad); color: #1e3799; padding: 15px; 
            border-radius: 50px 50px 20px 20px; border: none; width: 100%; 
            margin-bottom: 12px; cursor: pointer; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; box-shadow: 0 8px 15px rgba(102, 166, 255, 0.3);
        }
        .cloud-btn i { font-size: 1.8rem; margin-bottom: 5px; }
        .cloud-btn span { font-weight: 900; font-size: 0.9rem; }

        /* 3. زر التواصل مع الإدارة */
        .admin-btn-new {
            background: var(--orange-grad); color: white; padding: 14px; border-radius: 18px; 
            font-weight: 900; border: none; width: 100%; margin-bottom: 12px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; gap: 10px;
            text-decoration: none; box-shadow: 0 8px 15px rgba(221, 36, 118, 0.25);
        }

        /* 4. مستطيل الرابط */
        .url-box {
            background: white; padding: 12px; border-radius: 18px; 
            border: 2px dashed var(--url-color); text-align: center; margin-bottom: 15px;
        }

        /* العداد الزمني */
        .timer-container {
            background: var(--dark); border: 2px solid var(--accent); border-radius: 20px;
            padding: 12px; margin-bottom: 20px; text-align: center; color: white;
        }
        .timer-flex { display: flex; justify-content: center; gap: 8px; }
        .timer-box { background: rgba(255,255,255,0.1); padding: 5px; border-radius: 10px; min-width: 45px; }
        .timer-val { display: block; font-size: 1rem; font-weight: 900; color: var(--accent); }
        .timer-label { font-size: 0.55rem; color: #aaa; }

        /* الأزرار الثلاثة الأساسية */
        .main-btn {
            width: 100%; padding: 15px; border-radius: 15px; border: none; 
            font-weight: 900; color: white; cursor: pointer; margin-bottom: 10px; 
            display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1rem;
        }
        .btn-orders { background: var(--dark); }
        .btn-add { background: var(--success); }
        .btn-manage { background: var(--blue-grad); }

        /* تنسيق الطلبية المحسن */
        .order-card { background: white; border-radius: 25px; margin-bottom: 15px; border: 1px solid #edf2f7; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; }
        .order-time { background: #f8fafc; padding: 10px 15px; font-size: 0.85rem; color: #1e3799; font-weight: 900; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .order-content { padding: 15px; }
        .p-name-tag { background: #eff6ff; color: #1e3799; padding: 10px; border-radius: 12px; font-weight: 900; font-size: 1.1rem; display: block; margin-bottom: 12px; border-right: 5px solid #1e3799; }
        .c-name { font-size: 1.2rem; font-weight: 900; color: var(--dark); margin-bottom: 8px; display: block; }
        .c-location { background: #f0fdf4; color: #16a34a; padding: 10px; border-radius: 12px; font-weight: 700; margin-bottom: 10px; font-size: 0.9rem; border: 1px dashed #16a34a; }
        .c-phone { font-size: 1.3rem; font-weight: 900; color: var(--url-color); text-align: center; display: block; margin: 10px 0; background: #f3f0ff; padding: 10px; border-radius: 15px; }
        
        .call-btn { background: var(--success); color: white; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px; border-radius: 15px; text-decoration: none; font-weight: 900; box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3); }
        .del-order-btn { background: #fff5f5; color: var(--danger); border: 1px solid #ffcccc; width: 100%; padding: 10px; margin-top: 10px; cursor: pointer; font-weight: bold; border-radius: 12px; }

        /* مودال الحذف الاحترافي (نعم/لا) */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 350px; background: white; padding: 25px; border-radius: 30px; z-index: 2000; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.25); animation: pop 0.3s ease; }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .confirm-del { background: var(--danger); color: white; border: none; padding: 12px; border-radius: 15px; font-weight: 900; flex: 1; cursor: pointer; }
        .cancel-del { background: #eee; color: #555; border: none; padding: 12px; border-radius: 15px; font-weight: 900; flex: 1; cursor: pointer; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 1000; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="loadingOverlay"><div class="loader"></div></div>

<div class="container" id="mainContainer">
    
    <div class="header-card">
        <span id="storeNameDisp" style="font-weight:900; font-size: 1.2rem;">...</span>
        <button class="logout-btn" onclick="logout()">خروج <i class="fas fa-sign-out-alt"></i></button>
    </div>

    <button class="cloud-btn" onclick="openModal('installModal')">
        <i class="fas fa-cloud-download-alt"></i>
        <span>تفعيل الإشعارات وتنزيل التطبيق</span>
    </button>

    <a href="https://wa.me/213561150865" class="admin-btn-new">
        <i class="fab fa-whatsapp"></i> التواصل مع الإدارة
    </a>

    <div class="url-box">
        <div id="storeUrlDisp" style="color:var(--url-color); font-weight:bold; font-size:0.85rem; margin-bottom:8px;">...</div>
        <button onclick="copyLink()" style="background:var(--url-color); color:white; border:none; padding:6px 15px; border-radius:8px; cursor:pointer; font-weight:900;">نسخ رابط المتجر</button>
    </div>

    <div class="timer-container">
        <div class="timer-flex">
            <div class="timer-box"><span class="timer-val" id="d">00</span><span class="timer-label">يوم</span></div>
            <div class="timer-box"><span class="timer-val" id="h">00</span><span class="timer-label">ساعة</span></div>
            <div class="timer-box"><span class="timer-val" id="m">00</span><span class="timer-label">دقيقة</span></div>
            <div class="timer-box"><span class="timer-val" id="s">00</span><span class="timer-label">ثانية</span></div>
        </div>
    </div>

    <button class="main-btn btn-orders" onclick="toggleSec('ordersSection')">
        <i class="fas fa-box"></i> الطلبيات الواردة
    </button>
    <div id="ordersSection" class="hidden"><div id="ordersList"></div></div>

    <button class="main-btn btn-add" onclick="openAddModal()">
        <i class="fas fa-plus-circle"></i> إضافة منتج جديد
    </button>

    <button class="main-btn btn-manage" onclick="toggleSec('manageSection')">
        <i class="fas fa-tasks"></i> إدارة المنتجات
    </button>
    <div id="manageSection" class="hidden"><div id="productsList"></div></div>
</div>

<div id="deleteOrderModal" class="modal">
    <div style="font-size: 50px; color: var(--danger); margin-bottom: 10px;"><i class="fas fa-trash-alt"></i></div>
    <h3 style="margin:0;">حذف الطلبية؟</h3>
    <p style="color: #666; font-size: 0.9rem;">هل أنت متأكد من حذف هذه الطلبية نهائياً؟</p>
    <div class="modal-btns">
        <button class="confirm-del" id="confirmDeleteBtn">نعم، حذف ✅</button>
        <button class="cancel-del" onclick="closeModals()">لا، إلغاء ❌</button>
    </div>
</div>

<div id="installModal" class="modal">
    <h3>تنزيل التطبيق</h3>
    <p>لتصلك تنبيهات الطلبيات فوراً</p>
    <button class="main-btn btn-add" onclick="startInstall()">نعم، تنزيل ✅</button>
</div>

<div id="copyModal" class="modal">
    <i class="fas fa-check-circle" style="font-size:40px; color:var(--success);"></i>
    <h3>تم النسخ بنجاح!</h3>
    <button class="main-btn btn-manage" onclick="closeModals()">رائع</button>
</div>

<div id="productModal" class="modal" style="max-width:400px;">
    <h3 id="modalTitle">إضافة منتج</h3>
    <input type="hidden" id="editKey">
    <input type="text" id="pName" placeholder="اسم المنتج" style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;">
    <input type="number" id="pPrice" placeholder="السعر" style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;">
    <textarea id="pDesc" placeholder="الوصف" style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;"></textarea>
    <input type="file" id="pImage" accept="image/*" style="margin-bottom:10px;">
    <button class="main-btn btn-add" id="saveProductBtn">حفظ المنتج</button>
    <button onclick="closeModals()" style="background:none; border:none; color:grey;">إلغاء</button>
</div>

<div class="overlay" id="overlay" onclick="closeModals()"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storeId = localStorage.getItem('myStoreId');

    function updateTimer() {
        const expiryDate = new Date("2026-04-01T00:00:00").getTime();
        const now = new Date().getTime();
        const gap = expiryDate - now;
        const second = 1000, minute = second * 60, hour = minute * 60, day = hour * 24;
        document.getElementById('d').innerText = Math.floor(gap / day);
        document.getElementById('h').innerText = Math.floor((gap % day) / hour);
        document.getElementById('m').innerText = Math.floor((gap % hour) / minute);
        document.getElementById('s').innerText = Math.floor((gap % minute) / second);
    }
    setInterval(updateTimer, 1000);

    if (!storeId) { window.location.href = 'index.html'; }

    onValue(ref(db, `stores/${storeId}`), (snapshot) => {
        if (snapshot.exists()) {
            document.getElementById('loadingOverlay').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
            document.getElementById('storeNameDisp').innerText = snapshot.val().name;
            document.getElementById('storeUrlDisp').innerText = "future-site.com/store.html?id=" + storeId;
        }
    });

    onValue(ref(db, `stores/${storeId}/orders`), snap => {
        const list = document.getElementById('ordersList'); list.innerHTML = "";
        if(snap.exists()) {
            Object.entries(snap.val()).reverse().forEach(([id, o]) => {
                list.innerHTML += `
                <div class="order-card">
                    <div class="order-time">
                        <span><i class="fas fa-calendar-alt"></i> ${o.date || 'اليوم'}</span>
                        <span>#${id.slice(-4)}</span>
                    </div>
                    <div class="order-content">
                        <span class="p-name-tag"><i class="fas fa-box"></i> ${o.productName}</span>
                        <span class="c-name"><i class="fas fa-user"></i> ${o.customerName}</span>
                        <div class="c-location">
                            <i class="fas fa-map-marker-alt"></i> ${o.customerState} - ${o.customerCity || 'البلدية'}
                        </div>
                        <span class="c-phone">${o.customerPhone}</span>
                        <a href="tel:${o.customerPhone}" class="call-btn"><i class="fas fa-phone-alt"></i> اتصل بالزبون</a>
                        <button class="del-order-btn" onclick="askDeleteOrder('${id}')">حذف الطلبية</button>
                    </div>
                </div>`;
            });
        } else { list.innerHTML = "<p style='text-align:center;'>لا توجد طلبيات بعد</p>"; }
    });

    onValue(ref(db, `stores/${storeId}/products`), snap => {
        const list = document.getElementById('productsList'); list.innerHTML = "";
        if(snap.exists()) {
            Object.entries(snap.val()).forEach(([id, p]) => {
                list.innerHTML += `
                <div style="display:flex; justify-content:space-between; align-items:center; background:white; padding:10px; border-radius:15px; margin-bottom:8px; border:1px solid #eee;">
                    <span style="font-weight:bold;">${p.name}</span>
                    <button onclick="editProduct('${id}','${p.name}','${p.price}','${p.description}')" style="background:orange; color:white; border:none; padding:5px 12px; border-radius:8px;">تعديل</button>
                </div>`;
            });
        }
    });

    window.saveProductBtn.onclick = async () => {
        const k = document.getElementById('editKey').value, n = document.getElementById('pName').value, p = document.getElementById('pPrice').value, d = document.getElementById('pDesc').value, f = document.getElementById('pImage').files[0];
        if(!n || !p) return alert("أكمل البيانات!");
        let img = "";
        if(f){
            const fd = new FormData(); fd.append("image", f);
            const res = await fetch("https://api.imgbb.com/1/upload?key=e48055a00c4440331de482c9a7b18e01", {method:"POST", body:fd});
            const j = await res.json(); img = j.data.url;
        }
        const data = { name: n, price: p, description: d }; if(img) data.image = img;
        if(k) update(ref(db, `stores/${storeId}/products/${k}`), data).then(() => closeModals());
        else push(ref(db, `stores/${storeId}/products`), data).then(() => closeModals());
    };

    window.openModal = (id) => { document.getElementById(id).style.display='block'; document.getElementById('overlay').style.display='block'; };
    window.closeModals = () => { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); document.getElementById('overlay').style.display='none'; };
    window.toggleSec = (id) => { document.getElementById(id).classList.toggle('hidden'); };
    window.copyLink = () => { navigator.clipboard.writeText(document.getElementById('storeUrlDisp').innerText).then(() => openModal('copyModal')); };
    window.logout = () => { localStorage.removeItem('myStoreId'); window.location.href = 'index.html'; };
    window.askDeleteOrder = (id) => { 
        openModal('deleteOrderModal'); 
        document.getElementById('confirmDeleteBtn').onclick = () => { remove(ref(db, `stores/${storeId}/orders/${id}`)).then(() => closeModals()); };
    };
    window.openAddModal = () => {
        document.getElementById('modalTitle').innerText = "إضافة منتج جديد";
        document.getElementById('editKey').value = ""; document.getElementById('pName').value = "";
        document.getElementById('pPrice').value = ""; document.getElementById('pDesc').value = "";
        openModal('productModal');
    };
</script>
</body>
</html>
