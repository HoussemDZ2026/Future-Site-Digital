<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --brand-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --gold-gradient: linear-gradient(135deg, #FFD700, #FDBB2D);
            --day-grad: linear-gradient(135deg, #11998e, #38ef7d);
            --week-grad: linear-gradient(135deg, #6a11cb, #2575fc);
            --month-grad: linear-gradient(135deg, #ee0979, #ff6a00);
            --success: #00b894;
            --danger: #ff7675;
            --bg-professional: #f1f5f9;
        }

        body { font-family: 'Cairo', sans-serif; background: var(--bg-professional); margin: 0; padding-bottom: 50px; color: #2d3436; }
        .container { max-width: 700px; margin: auto; padding: 15px; }

        .store-header-box { 
            background: var(--brand-gradient); padding: 50px 20px; 
            border-radius: 0 0 50px 50px; text-align: center; color: white; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); margin-bottom: 25px;
            border-bottom: 5px solid var(--gold-gradient);
        }
        .store-header-box h1 { margin: 0; font-size: 2.4rem; font-weight: 900; }

        .url-box { 
            background: white; padding: 18px; border-radius: 20px; 
            display: flex; align-items: center; justify-content: space-between; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transform: translateY(-40px); margin: 0 auto -20px auto; width: 90%;
        }

        .admin-btn-gold { 
            background: var(--gold-gradient); color: #000; text-decoration: none; 
            display: flex; align-items: center; justify-content: center; gap: 12px; 
            padding: 20px; border-radius: 20px; font-weight: 900; font-size: 1.1rem;
            margin: 20px 0 10px 0; box-shadow: 0 8px 20px rgba(253, 187, 45, 0.3); 
            border: none; cursor: pointer; transition: 0.3s;
        }

        .expiry-container {
            background: #1a1a1a; color: #fff; padding: 15px; border-radius: 20px; text-align: center; margin-bottom: 25px; border: 2px solid #333;
        }
        #expiryTimer { font-size: 1.4rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .reports-title { text-align: right; margin: 40px 0 20px; padding: 0 10px; border-right: 6px solid #2d3436; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .stat-card { padding: 20px 5px; border-radius: 25px; text-align: center; color: white; }
        .stat-card.day { background: var(--day-grad); }
        .stat-card.week { background: var(--week-grad); }
        .stat-card.month { background: var(--month-grad); }

        .card { background: white; border-radius: 25px; padding: 20px; margin-bottom: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); }
        
        .modal { 
            background: white; padding: 25px; border-radius: 30px; border: 3px solid var(--gold-gradient); 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 90%; max-width: 450px; z-index: 1000; box-shadow: 0 0 100px rgba(0,0,0,0.5);
            max-height: 90vh; overflow-y: auto;
        }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #ddd; font-family: 'Cairo'; box-sizing: border-box; background: #f9f9f9; }
        
        .hidden { display: none; }
        .btn-group { display: flex; gap: 8px; }
        .btn-main { flex: 1; padding: 14px; border-radius: 12px; border: none; font-weight: 900; cursor: pointer; }
        
        .timer-switch { 
            background: #f1f5f9; padding: 10px; border-radius: 12px; margin-bottom: 10px; 
            display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="store-header-box"><h1 id="storeName">تحميل...</h1></div>

<div class="container">
    <div class="url-box">
        <span id="storeUrl">رابط المتجر...</span>
        <button onclick="copyUrl()" style="background:none; border:none; color:#2a5298; cursor:pointer;"><i class="far fa-copy"></i></button>
    </div>

    <a href="https://wa.me/0561150865" class="admin-btn-gold"><i class="fab fa-whatsapp"></i> تواصل مع الإدارة</a>

    <div class="expiry-container">
        <span style="font-size: 0.8rem; color: #aaa;">صلاحية الرابط</span>
        <div id="expiryTimer">حساب الوقت...</div>
    </div>

    <div class="reports-title"><h2>تقارير المبيعات</h2></div>
    <div class="stats">
        <div class="stat-card day">اليوم<strong id="dayVal">0</strong></div>
        <div class="stat-card week">الأسبوع<strong id="weekVal">0</strong></div>
        <div class="stat-card month">الشهر<strong id="monthVal">0</strong></div>
    </div>

    <button class="admin-btn-gold" style="background: #2d3436; color:white; margin-top:30px;" onclick="toggleSection('ordersBox')">عرض الطلبيات</button>
    <div id="ordersBox" class="hidden"></div>

    <button class="admin-btn-gold" style="background: var(--success); color:white;" onclick="openAddModal()">إضافة منتج جديد</button>

    <div id="productForm" class="modal hidden">
        <h3 id="formTitle" style="text-align:center; margin-top:0;">إضافة منتج</h3>
        <input type="text" id="pTitle" placeholder="اسم المنتج">
        <input type="number" id="pPrice" placeholder="السعر">
        <textarea id="pDesc" placeholder="موصفات المنتج..."></textarea>
        
        <div class="timer-switch">
            <input type="checkbox" id="timerOn" style="width:auto; margin:0;" onchange="toggleTimerInput()">
            <span>تفعيل عداد زمني لهذا المنتج؟</span>
        </div>
        <input type="datetime-local" id="pTimerDate" class="hidden">

        <input type="file" id="pImg" accept="image/*">
        
        <button id="saveBtn" class="btn-main" style="background:var(--success); color:white; width:100%;">حفظ المنتج</button>
        <button onclick="closeModal()" style="width:100%; background:none; border:none; margin-top:10px; cursor:pointer; color:#999; font-weight:bold;">إلغاء</button>
    </div>

    <h3 style="margin-top:40px; border-right: 5px solid var(--success); padding-right:10px;">📦 إدارة المنتجات</h3>
    <div id="productsList"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove, update, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);
    const storeId = localStorage.getItem('myStoreId');
    let editItemId = null;

    onValue(ref(db, `stores/${storeId}`), (s) => {
        if(s.exists()){
            const data = s.val();
            document.getElementById('storeName').innerText = data.name;
            document.getElementById('storeUrl').innerText = window.location.origin + "/store.html?id=" + storeId;
            startCountdown(data.expiryDate || (Date.now() + 2592000000));
        }
    });

    onValue(ref(db, `stores/${storeId}/orders`), (snap) => {
        const box = document.getElementById('ordersBox');
        let total = 0;
        box.innerHTML = !snap.exists() ? '<p style="text-align:center;">لا توجد طلبيات</p>' : "";
        if(snap.exists()){
            Object.entries(snap.val()).reverse().forEach(([key, o]) => {
                total += parseFloat(o.productPrice || 0);
                box.innerHTML += `<div class="card"><strong>${o.customerName}</strong><br><small>${o.productName}</small><div class="btn-group" style="margin-top:10px;"><a href="tel:${o.customerPhone}" class="btn-main" style="background:var(--success); color:white; text-decoration:none; text-align:center;">إتصال</a><button onclick="deleteOrder('${key}')" class="btn-main" style="background:#fee; color:red;">حذف</button></div></div>`;
            });
        }
        document.getElementById('dayVal').innerText = total + " دج";
    });

    onValue(ref(db, `stores/${storeId}/products`), (snap) => {
        const list = document.getElementById('productsList'); list.innerHTML = "";
        if(snap.exists()){
            Object.entries(snap.val()).forEach(([key, p]) => {
                list.innerHTML += `
                <div class="card" style="display:flex; align-items:center; gap:15px;">
                    <img src="${p.image}" style="width:60px; height:60px; border-radius:12px; object-fit:cover;">
                    <div style="flex:1">
                        <strong>${p.name}</strong><br>
                        <b style="color:var(--success)">${p.price} دج</b>
                        ${p.timerDate ? '<br><small style="color:orange;"><i class="fas fa-stopwatch"></i> عداد مفعل</small>' : ''}
                    </div>
                    <div style="display:flex; gap:5px;">
                        <button onclick="prepareEdit('${key}', '${p.name.replace(/'/g, "\\'")}', '${p.price}', '${(p.description || '').replace(/'/g, "\\'")}', '${p.timerDate || ''}')" style="border:none; background:#f1f5f9; padding:10px; border-radius:10px; cursor:pointer;"><i class="fas fa-pen"></i></button>
                        <button onclick="deleteProduct('${key}')" style="border:none; background:#fff5f5; color:red; padding:10px; border-radius:10px; cursor:pointer;"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
            });
        }
    });

    window.toggleTimerInput = () => {
        const isChecked = document.getElementById('timerOn').checked;
        document.getElementById('pTimerDate').classList.toggle('hidden', !isChecked);
    };

    window.prepareEdit = (id, name, price, desc, tDate) => {
        editItemId = id;
        document.getElementById('pTitle').value = name;
        document.getElementById('pPrice').value = price;
        document.getElementById('pDesc').value = desc;
        
        if(tDate) {
            document.getElementById('timerOn').checked = true;
            document.getElementById('pTimerDate').value = tDate;
            document.getElementById('pTimerDate').classList.remove('hidden');
        } else {
            document.getElementById('timerOn').checked = false;
            document.getElementById('pTimerDate').classList.add('hidden');
        }

        document.getElementById('formTitle').innerText = "تعديل المنتج";
        document.getElementById('productForm').classList.remove('hidden');
    };

    document.getElementById('saveBtn').onclick = async () => {
        const name = document.getElementById('pTitle').value;
        const price = document.getElementById('pPrice').value;
        const description = document.getElementById('pDesc').value;
        const timerDate = document.getElementById('timerOn').checked ? document.getElementById('pTimerDate').value : null;
        const file = document.getElementById('pImg').files[0];
        
        if(!name || !price) return alert("أدخل الاسم والسعر");

        let data = { name, price, description, timerDate };
        if(file){
            const snap = await uploadBytes(sRef(storage, `p/${Date.now()}`), file);
            data.image = await getDownloadURL(snap.ref);
        }

        if(editItemId){
            await update(ref(db, `stores/${storeId}/products/${editItemId}`), data);
            alert("تم التعديل!");
        } else {
            if(!file) return alert("يرجى اختيار صورة");
            await push(ref(db, `stores/${storeId}/products`), {...data, timestamp: Date.now()});
            alert("تمت الإضافة!");
        }
        closeModal();
    };

    window.openAddModal = () => { 
        editItemId = null; 
        document.getElementById('pTitle').value = ""; 
        document.getElementById('pPrice').value = ""; 
        document.getElementById('pDesc').value = "";
        document.getElementById('timerOn').checked = false;
        document.getElementById('pTimerDate').value = "";
        document.getElementById('pTimerDate').classList.add('hidden');
        document.getElementById('formTitle').innerText = "إضافة منتج";
        document.getElementById('productForm').classList.remove('hidden'); 
    };

    window.closeModal = () => document.getElementById('productForm').classList.add('hidden');
    window.toggleSection = (id) => document.getElementById(id).classList.toggle('hidden');
    window.deleteOrder = (k) => confirm("حذف الطلب؟") && remove(ref(db, `stores/${storeId}/orders/${k}`));
    window.deleteProduct = (k) => confirm("حذف المنتج؟") && remove(ref(db, `stores/${storeId}/products/${k}`));
    window.copyUrl = () => { navigator.clipboard.writeText(document.getElementById('storeUrl').innerText); alert("تم النسخ!"); };

    function startCountdown(endTime) {
        const el = document.getElementById('expiryTimer');
        setInterval(() => {
            const diff = endTime - Date.now();
            if(diff <= 0) return el.innerText = "منتهي";
            const days = Math.floor(diff / 86400000);
            if(days >= 1) el.innerText = `باقي ${days} يوم`;
            else {
                const h = Math.floor((diff / 3600000) % 24);
                const m = Math.floor((diff / 60000) % 60);
                const s = Math.floor((diff / 1000) % 60);
                el.innerText = `${h}:${m}:${s}`;
                el.style.color = "red";
            }
        }, 1000);
    }
</script>
</body>
</html>
