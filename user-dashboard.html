<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --main-grad: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gold-grad: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            --danger-grad: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            --success-grad: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
            --link-card-grad: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }

        body { font-family: 'Cairo', sans-serif; background-color: #f0f2f5; margin: 0; padding-bottom: 50px; color: #333; }
        .container { max-width: 900px; margin: auto; padding: 15px; }

        .store-title-card { 
            background: var(--main-grad); color: white; padding: 30px; 
            border-radius: 25px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            margin-bottom: 25px; border: 3px solid #fff;
        }
        .store-title-card h1 { margin: 0; font-size: 2.2rem; font-weight: 900; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

        .link-section { 
            background: var(--link-card-grad); 
            padding: 25px; border-radius: 30px; text-align: center; 
            margin-bottom: 25px; box-shadow: 0 15px 35px rgba(30, 60, 114, 0.3);
            position: relative; overflow: hidden; border: 2px solid rgba(255,255,255,0.1);
        }
        .link-label { 
            font-weight: 900; color: #fff; margin-bottom: 15px; 
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-size: 1.2rem;
        }
        .link-label i { color: #f6d365; animation: rocket-move 2s infinite ease-in-out; }
        
        @keyframes rocket-move {
            0%, 100% { transform: translateY(0) rotate(-45deg); }
            50% { transform: translateY(-5px) rotate(-45deg); }
        }

        .link-box { 
            background: rgba(255, 255, 255, 0.1); padding: 15px; 
            border: 1px dashed rgba(255, 255, 255, 0.5); border-radius: 15px; 
            color: #fff; font-weight: bold; word-break: break-all; 
            margin-bottom: 15px; backdrop-filter: blur(5px);
        }

        .btn-copy-new {
            background: #fff; color: #1e3c72; border: none; 
            padding: 12px 35px; border-radius: 15px; 
            cursor: pointer; font-weight: 900; transition: 0.3s;
        }
        .btn-copy-new:active { transform: scale(0.95); }

        .expiry-box { background: #1a1a1a; color: #fff; padding: 15px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
        #expiryText { color: #f6d365; font-size: 1.2rem; font-weight: bold; }

        .admin-contact { background: var(--gold-grad); color: #000; padding: 18px; border-radius: 20px; text-align: center; font-weight: 900; text-decoration: none; display: block; margin-bottom: 20px; }

        .section-btn { width: 100%; padding: 18px; border-radius: 20px; border: none; font-weight: 900; cursor: pointer; font-size: 1.1rem; margin-bottom: 15px; color: white; transition: 0.3s; }
        .btn-orders { background: var(--main-grad); }
        .btn-add-product { background: var(--success-grad); }

        .order-card { 
            background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-right: 10px solid #764ba2;
        }
        .cust-name { color: #764ba2; font-size: 1.4rem; font-weight: 900; display: block; }
        .cust-phone { background: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 12px; display: block; text-align: center; font-size: 1.3rem; font-weight: 900; margin: 10px 0; text-decoration: none; }
        .order-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-call { background: var(--success-grad); color: white; padding: 12px; border-radius: 12px; text-align: center; text-decoration: none; font-weight: bold; }
        .btn-delete { background: var(--danger-grad); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; }

        .hidden { display: none; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; }
        .modal { background: white; padding: 25px; border-radius: 30px; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 92%; max-width: 500px; z-index: 2000; max-height: 90vh; overflow-y: auto; }

        input, textarea { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 15px; border: 1px solid #ddd; box-sizing: border-box; font-family: 'Cairo'; }
        .product-item { background: white; padding: 15px; border-radius: 20px; display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
        .product-item img { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; }

        @media (min-width: 768px) { .orders-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; } }
    </style>
</head>
<body>

<div class="container">
    <div class="store-title-card">
        <h1 id="storeNameDisplay">جاري التحميل...</h1>
    </div>

    <div class="link-section">
        <span class="link-label"><i class="fas fa-rocket"></i> رابط متجرك الاحترافي جاهز</span>
        <div class="link-box" id="storeUrl">...جاري جلب الرابط...</div>
        <button class="btn-copy-new" onclick="copyUrl()"><i class="far fa-copy"></i> نسخ الرابط المباشر</button>
    </div>

    <div class="expiry-box">⏳ مدة صلاحية المتجر:<br><span id="expiryText">--:--:--</span></div>

    <a href="https://wa.me/213561150865" class="admin-contact"><i class="fab fa-whatsapp"></i> تواصل مع الإدارة</a>

    <button class="section-btn btn-orders" onclick="toggleSection('ordersDisplay')">📦 عرض الطلبيات الواردة</button>
    <div id="ordersDisplay" class="hidden orders-grid"></div>

    <button class="section-btn btn-add-product" onclick="openModal()">➕ إضافة منتج جديد</button>
    <div id="productsList"></div>
</div>

<div id="modalOverlay" class="overlay hidden" onclick="closeModal()"></div>
<div id="productModal" class="modal hidden">
    <h2>إضافة منتج</h2>
    <input type="text" id="pName" placeholder="اسم المنتج">
    <input type="number" id="pPrice" placeholder="السعر">
    <textarea id="pDesc" placeholder="الوصف"></textarea>
    <input type="file" id="pImage" accept="image/*">
    <button id="saveBtn" class="section-btn btn-add-product">حفظ المنتج ✅</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove, update, push, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);

    // إصلاح جلب الآيدي
    const urlParams = new URLSearchParams(window.location.search);
    let storeId = urlParams.get('id') || localStorage.getItem('myStoreId');

    if (storeId) {
        localStorage.setItem('myStoreId', storeId);
        
        onValue(ref(db, `stores/${storeId}`), s => {
            if(s.exists()){
                const d = s.val();
                document.getElementById('storeNameDisplay').innerText = d.name;
                const repoName = window.location.pathname.split('/')[1]; 
                const fullUrl = window.location.origin + (window.location.hostname.includes('github.io') ? `/${repoName}/` : '/') + "store.html?id=" + storeId;
                document.getElementById('storeUrl').innerText = fullUrl;
                updateExpiry(d.expiryDate || d.expiryTimestamp);
            }
        });

        onValue(ref(db, `stores/${storeId}/orders`), snap => {
            const box = document.getElementById('ordersDisplay'); box.innerHTML = "";
            if(snap.exists()) Object.entries(snap.val()).reverse().forEach(([k, o]) => {
                box.innerHTML += `<div class="order-card"><span class="cust-name">${o.customerName}</span><a href="tel:${o.customerPhone}" class="cust-phone">${o.customerPhone}</a><div>📍 ${o.customerState} | 🏙️ ${o.customerAddress}</div><div style="margin:10px 0;">📦 <b>${o.productName}</b></div><div class="order-btns"><a href="tel:${o.customerPhone}" class="btn-call">إتصال</a><button onclick="delOrder('${k}')" class="btn-delete">حذف</button></div></div>`;
            });
        });

        onValue(ref(db, `stores/${storeId}/products`), snap => {
            const box = document.getElementById('productsList'); box.innerHTML = "";
            if(snap.exists()) Object.entries(snap.val()).forEach(([k, p]) => {
                box.innerHTML += `<div class="product-item"><img src="${p.image}"><div style="flex:1"><b>${p.name}</b><br><span style="color:green;">${p.price} دج</span></div><button onclick="delProd('${k}')" style="color:red; border:none; background:none;"><i class="fas fa-trash"></i></button></div>`;
            });
        });
    }

    window.copyUrl = () => { 
        navigator.clipboard.writeText(document.getElementById('storeUrl').innerText);
        const btn = document.querySelector('.btn-copy-new');
        btn.innerText = "تم النسخ ✅";
        setTimeout(() => btn.innerText = "نسخ الرابط المباشر", 2000);
    };

    window.updateExpiry = (end) => {
        setInterval(() => {
            const diff = end - Date.now();
            const el = document.getElementById('expiryText');
            if(diff <= 0) { el.innerText = "منتهي"; return; }
            const d = Math.floor(diff/86400000), h = Math.floor((diff%86400000)/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
            el.innerText = d >= 1 ? `باقي ${d} يوم و ${h} ساعة` : `${h}:${m}:${s}`;
        }, 1000);
    };

    window.delOrder = (k) => { if(confirm("حذف الطلبية؟")) remove(ref(db, `stores/${storeId}/orders/${k}`)); };
    window.delProd = (k) => { if(confirm("حذف المنتج؟")) remove(ref(db, `stores/${storeId}/products/${k}`)); };
    window.toggleSection = (id) => document.getElementById(id).classList.toggle('hidden');
    window.openModal = () => { document.getElementById('productModal').classList.remove('hidden'); document.getElementById('modalOverlay').classList.remove('hidden'); };
    window.closeModal = () => { document.getElementById('productModal').classList.add('hidden'); document.getElementById('modalOverlay').classList.add('hidden'); };

    document.getElementById('saveBtn').onclick = async () => {
        const file = document.getElementById('pImage').files[0];
        if(!file) return alert("اختر صورة للمنتج");
        const sR = sRef(storage, `products/${Date.now()}`);
        await uploadBytes(sR, file);
        const imgUrl = await getDownloadURL(sR);
        push(ref(db, `stores/${storeId}/products`), {
            name: document.getElementById('pName').value,
            price: document.getElementById('pPrice').value,
            description: document.getElementById('pDesc').value,
            image: imgUrl
        });
        closeModal();
    };
</script>
</body>
</html>
