<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم البريميوم | Future Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --neon-grad: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
            --royal-grad: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --order-btn-grad: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --dark-surface: #1a1a2e;
        }

        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; margin: 0; padding-bottom: 50px; }
        .container { max-width: 850px; margin: auto; padding: 15px; }

        /* 1. عداد الصلاحية المثير */
        .expiry-container {
            background: var(--dark-surface); border-radius: 25px; padding: 25px;
            text-align: center; color: #fff; margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); border: 2px solid #4facfe;
        }
        .expiry-title { font-size: 0.9rem; color: #4facfe; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; display: block; }
        .timer-grid { display: flex; justify-content: center; gap: 15px; }
        .timer-unit { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 15px; min-width: 60px; }
        .timer-num { font-size: 1.8rem; font-weight: 900; display: block; color: #fff; }
        .timer-label { font-size: 0.7rem; color: #aaa; }

        /* 2. مركز الدعم المخفي */
        .support-btn {
            background: #25D366; color: white; padding: 15px; border-radius: 20px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            text-decoration: none; font-weight: 900; box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3);
            margin-bottom: 25px; transition: 0.3s;
        }

        /* 3. تليجرام الاختياري */
        .tg-card { background: white; border-radius: 25px; padding: 20px; margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #0088cc; }
        input:checked + .slider:before { transform: translateX(24px); }

        /* 4. قسم الطلبيات الملون والمخفي */
        .order-toggle-btn {
            width: 100%; background: var(--order-btn-grad); color: white; border: none;
            padding: 20px; border-radius: 20px; font-weight: 900; font-size: 1.1rem;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; box-shadow: 0 8px 15px rgba(245, 87, 108, 0.3);
        }
        .order-content { 
            display: none; background: white; border-radius: 0 0 25px 25px; 
            padding: 20px; margin-top: -20px; margin-bottom: 20px; 
            border: 2px solid #f5576c; border-top: none;
        }
        .phone-display { 
            background: #2d3436; color: #00f2fe; font-size: 2.2rem; font-weight: 900; 
            text-align: center; padding: 15px; border-radius: 20px; margin: 15px 0;
            display: block; text-decoration: none; letter-spacing: 3px; 
        }

        /* 5. المودال */
        .modal { background: white; padding: 25px; border-radius: 30px; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 92%; max-width: 500px; z-index: 2000; box-shadow: 0 0 50px rgba(0,0,0,0.3); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; }
        .hidden { display: none; }
        input, textarea, select { width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #ddd; font-family: 'Cairo'; }
        .btn-main { width: 100%; padding: 18px; border-radius: 20px; border: none; font-weight: 900; cursor: pointer; color: white; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="expiry-container">
        <span class="expiry-title">الوقت المتبقي لصلاحية المتجر</span>
        <div class="timer-grid">
            <div class="timer-unit"><span id="days" class="timer-num">00</span><span class="timer-label">يوم</span></div>
            <div class="timer-unit"><span id="hours" class="timer-num">00</span><span class="timer-label">ساعة</span></div>
            <div class="timer-unit"><span id="mins" class="timer-num">00</span><span class="timer-label">دقيقة</span></div>
            <div class="timer-unit"><span id="secs" class="timer-num">00</span><span class="timer-label">ثانية</span></div>
        </div>
    </div>

    <a href="https://wa.me/213561150865" class="support-btn">
        <i class="fab fa-whatsapp" style="font-size: 1.5rem;"></i> مراسلة الدعم الفني وتفعيل المتجر
    </a>

    <div class="tg-card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin:0; color:#0088cc;"><i class="fab fa-telegram"></i> تنبيهات تليجرام</h3>
            <label class="switch">
                <input type="checkbox" id="tgToggle" onchange="toggleTgPanel()">
                <span class="slider"></span>
            </label>
        </div>
        <div id="tgPanel" class="hidden" style="margin-top:20px;">
            <input type="text" id="tgToken" placeholder="أدخل Bot Token">
            <input type="text" id="tgChatId" placeholder="أدخل Chat ID">
            <button onclick="saveTg()" class="btn-main" style="background:#0088cc; padding:10px;">حفظ الربط ✅</button>
        </div>
    </div>

    <h2 style="text-align: right; margin-right: 10px; color: #f5576c;">📦 إدارة الطلبيات</h2>
    <div id="ordersList"></div>

    <button onclick="openAddModal()" class="btn-main" style="background:var(--royal-grad); margin-top: 20px;">➕ إضافة منتج جديد</button>
    <div id="productsList"></div>
</div>

<div id="modalOverlay" class="overlay hidden" onclick="closeModal()"></div>
<div id="productModal" class="modal hidden">
    <h2 style="text-align:center;">إضافة منتج</h2>
    <input type="text" id="pName" placeholder="اسم المنتج">
    <input type="number" id="pPrice" placeholder="السعر (دج)">
    <textarea id="pDesc" placeholder="وصف المنتج..."></textarea>
    
    <div style="background:#f0f7ff; padding:15px; border-radius:15px; margin-bottom:15px;">
        <label style="font-weight:bold;"><input type="checkbox" id="pTimerCheck" onchange="document.getElementById('pTimerInput').classList.toggle('hidden')"> تفعيل عداد تنازلي للمنتج؟</label>
        <input type="datetime-local" id="pTimerInput" class="hidden" style="margin-top:10px;">
    </div>

    <input type="file" id="pImage" accept="image/*">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button id="saveBtn" class="btn-main" style="background:#2ecc71;">حفظ ✅</button>
        <button onclick="closeModal()" class="btn-main" style="background:#eee; color:#333;">إلغاء ❌</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storeId = localStorage.getItem('myStoreId');

    if (storeId) {
        // العداد الزمني الرئيسي للمتجر
        onValue(ref(db, `stores/${storeId}/expiryDate`), s => {
            if(s.exists()){
                const exp = new Date(s.val()).getTime();
                setInterval(() => {
                    const diff = exp - new Date().getTime();
                    if(diff <= 0) return;
                    document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
                    document.getElementById('hours').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    document.getElementById('mins').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    document.getElementById('secs').innerText = Math.floor((diff % (1000 * 60)) / 1000);
                }, 1000);
            }
        });

        // الطلبيات بنظام الأكورديون الملون
        onValue(ref(db, `stores/${storeId}/orders`), snap => {
            const box = document.getElementById('ordersList'); box.innerHTML = "";
            if(snap.exists()){
                Object.entries(snap.val()).reverse().forEach(([k, o]) => {
                    box.innerHTML += `
                    <div>
                        <button class="order-toggle-btn" onclick="toggleOrder('${k}')">
                            <span>👤 ${o.customerName}</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                        <div id="order-${k}" class="order-content">
                            <div style="font-size:0.9rem; color:#666; text-align:center;">رقم الهاتف (مريح للعين):</div>
                            <a href="tel:${o.customerPhone}" class="phone-display">${o.customerPhone}</a>
                            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px;">
                                <div style="background:#f8fafc; padding:10px; border-radius:12px; text-align:center;"><b>📍 الولاية:</b><br>${o.customerState}</div>
                                <div style="background:#f8fafc; padding:10px; border-radius:12px; text-align:center;"><b>🏙️ البلدية:</b><br>${o.customerAddress}</div>
                            </div>
                            <div style="background:#fff0f3; padding:15px; border-radius:15px; text-align:center; font-weight:900; color:#f5576c; border:1px solid #f5576c;">
                                🛒 المنتج المطلـوب: ${o.productName}
                            </div>
                            <div style="display:grid; grid-template-columns:3fr 1fr; gap:10px; margin-top:20px;">
                                <a href="tel:${o.customerPhone}" class="btn-main" style="background:#2ecc71; text-align:center; text-decoration:none; display:flex; align-items:center; justify-content:center;">إتصال الآن</a>
                                <button onclick="delOrder('${k}')" class="btn-main" style="background:#ff4d4d;"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    </div>`;
                });
            }
        });

        // جلب المنتجات
        onValue(ref(db, `stores/${storeId}/products`), snap => {
            const d = document.getElementById('productsList'); d.innerHTML = "";
            if(snap.exists()) Object.entries(snap.val()).forEach(([k, p]) => {
                d.innerHTML += `<div style="background:white; padding:15px; border-radius:20px; display:flex; align-items:center; gap:15px; margin-bottom:10px; border-left:10px solid #764ba2;">
                    <img src="${p.image}" style="width:50px; height:50px; border-radius:10px; object-fit:cover;">
                    <div style="flex:1"><b>${p.name}</b><br>${p.price} دج</div>
                    <button onclick="delProd('${k}')" style="color:red; background:none; border:none; cursor:pointer;"><i class="fas fa-trash"></i></button>
                </div>`;
            });
        });
    }

    // وظائف الواجهة
    window.toggleOrder = (id) => {
        const el = document.getElementById('order-'+id);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    };
    window.toggleTgPanel = () => document.getElementById('tgPanel').classList.toggle('hidden', !document.getElementById('tgToggle').checked);
    window.openAddModal = () => { document.getElementById('productModal').classList.remove('hidden'); document.getElementById('modalOverlay').classList.remove('hidden'); };
    window.closeModal = () => { document.getElementById('productModal').classList.add('hidden'); document.getElementById('modalOverlay').classList.add('hidden'); };
    
    window.delOrder = (id) => { if(confirm("حذف الطلب؟")) remove(ref(db, `stores/${storeId}/orders/${id}`)); };
    window.delProd = (id) => { if(confirm("حذف المنتج؟")) remove(ref(db, `stores/${storeId}/products/${id}`)); };

    window.saveTg = () => {
        update(ref(db, `stores/${storeId}/settings/telegram`), {
            token: document.getElementById('tgToken').value,
            chatId: document.getElementById('tgChatId').value
        }).then(() => alert("تم الحفظ ✅"));
    };

    window.saveBtn.onclick = async () => {
        const file = document.getElementById('pImage').files[0];
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        if(!file || !name) return alert("أكمل البيانات");

        window.saveBtn.disabled = true; window.saveBtn.innerText = "جاري الحفظ...";
        try {
            const fd = new FormData(); fd.append("image", file);
            const res = await fetch("https://api.imgbb.com/1/upload?key=e48055a00c4440331de482c9a7b18e01", { method: "POST", body: fd });
            const json = await res.json();
            await push(ref(db, `stores/${storeId}/products`), {
                name, price, image: json.data.url, description: document.getElementById('pDesc').value,
                timer: document.getElementById('pTimerCheck').checked ? document.getElementById('pTimerInput').value : null
            });
            closeModal();
        } catch(e) { alert("خطأ"); }
        window.saveBtn.disabled = false; window.saveBtn.innerText = "حفظ ✅";
    };
</script>
</body>
    </html>
