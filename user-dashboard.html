<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --blue-grad: linear-gradient(135deg, #1e3799 0%, #0984e3 100%);
            --time-bg: #1e272e;
            --success: #2ecc71;
            --danger: #e74c3c;
            --accent: #00f2fe;
            --tg-color: #0088cc;
            --url-color: #6c5ce7;
        }

        body { font-family: 'Cairo', sans-serif; background-color: #f1f2f6; margin: 0; padding: 15px; padding-bottom: 50px; }
        .container { max-width: 600px; margin: auto; }

        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .card-name { background: var(--blue-grad); color: white; text-align: center; border: none; position: relative; }
        
        /* أيقونة حالة التنبيهات */
        #notifStatus { position: absolute; left: 15px; top: 15px; font-size: 1.2rem; cursor: pointer; }

        .card-expiry { background: var(--time-bg); color: var(--accent); text-align: center; }
        .card-url { border: 2px solid var(--url-color); text-align: center; }
        .url-box { background: #f3f0ff; padding: 12px; border-radius: 12px; font-weight: 900; color: var(--url-color); margin-top: 8px; border: 1px dashed var(--url-color); word-break: break-all; position: relative; }
        .copy-btn { margin-top: 10px; background: var(--url-color); color: white; border: none; padding: 8px 20px; border-radius: 50px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }

        .report-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 15px 0; }
        .r-box { background: white; padding: 15px; border-radius: 20px; text-align: center; border-bottom: 4px solid var(--danger); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .r-val { font-size: 1.5rem; font-weight: 900; display: block; color: var(--danger); }
        .btn-reset-sm { background: #eee; border: none; padding: 3px 8px; border-radius: 5px; font-size: 0.65rem; cursor: pointer; margin-top: 5px; font-weight: bold; }

        .action-btn { width: 100%; padding: 18px; border-radius: 20px; border: none; font-weight: 900; color: white; cursor: pointer; margin-bottom: 12px; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; text-decoration: none; }

        .order-card { background: white; border-radius: 25px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid #eee; }
        .order-date { background: #f8f9fa; padding: 10px; text-align: center; font-size: 0.8rem; color: #666; border-bottom: 1px solid #eee; }
        .order-body { padding: 20px; }
        .customer-name { font-size: 1.6rem; font-weight: 900; color: #2d3436; margin-bottom: 10px; display: block; }
        .phone-display { background: #2d3436; color: var(--accent); font-size: 2.2rem; font-weight: 900; text-align: center; padding: 12px; border-radius: 15px; display: block; text-decoration: none; margin: 15px 0; letter-spacing: 2px; border: 2px solid var(--accent); }
        .location-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .location-badge { background: #f1f2f6; padding: 8px; border-radius: 10px; border-right: 4px solid #0984e3; font-weight: bold; text-align: center; font-size: 0.9rem; }

        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 92%; max-width: 450px; background: white; padding: 25px; border-radius: 30px; z-index: 2000; box-shadow: 0 15px 50px rgba(0,0,0,0.3); animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translate(-50%, -40%); opacity: 0; } to { transform: translate(-50%, -50%); opacity: 1; } }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 1000; }
        
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #ddd; font-family: 'Cairo'; box-sizing: border-box; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="card card-name">
        <i class="fas fa-bell-slash" id="notifStatus" onclick="requestNotif()" title="تفعيل التنبيهات"></i>
        <h1 id="storeName">جاري التحميل...</h1>
    </div>

    <div class="card card-url">
        <h4 style="margin:0; color:var(--url-color);"><i class="fas fa-link"></i> رابط المتجر</h4>
        <div class="url-box" id="storeUrl">...</div>
        <button class="copy-btn" onclick="copyLink()"><i class="fas fa-copy"></i> نسخ الرابط</button>
    </div>

    <div class="card card-expiry">
        <h4 style="margin:0; color:white;">⏳ صلاحية المتجر</h4>
        <div style="display:flex; justify-content:center; gap:8px; margin-top:10px; font-weight:900; font-size: 1.2rem;">
            <span id="d">00</span>ي : <span id="h">00</span>سا : <span id="m">00</span>د : <span id="s">00</span>ثا
        </div>
    </div>

    <a href="https://wa.me/213561150865" class="action-btn" style="background:var(--success); box-shadow: 0 5px 15px rgba(46,204,113,0.3);">
        <i class="fab fa-whatsapp"></i> التواصل مع الإدارة
    </a>

    <h3 style="text-align:center; color:var(--danger); font-weight:900;">📊 تقارير المبيعات</h3>
    <div class="report-grid">
        <div class="r-box"><small>اليوم</small><span class="r-val" id="sToday">0</span><button class="btn-reset-sm" onclick="resetS('today')">تصفير</button></div>
        <div class="r-box"><small>الأسبوع</small><span class="r-val" id="sWeek">0</span><button class="btn-reset-sm" onclick="resetS('week')">تصفير</button></div>
        <div class="r-box"><small>الشهر</small><span class="r-val" id="sMonth">0</span><button class="btn-reset-sm" onclick="resetS('month')">تصفير</button></div>
    </div>

    <button class="action-btn" style="background:var(--url-color);" onclick="toggleSection('ordersSection')"><i class="fas fa-shopping-basket"></i> الطلبيات الواردة</button>
    <div id="ordersSection" class="hidden"><div id="ordersList"></div></div>

    <button class="action-btn" style="background:var(--success);" onclick="openAddModal()"><i class="fas fa-plus-circle"></i> إضافة منتج جديد</button>

    <button class="action-btn" style="background:var(--blue-grad);" onclick="toggleSection('manageSection')"><i class="fas fa-edit"></i> إدارة المنتجات</button>
    <div id="manageSection" class="hidden" style="background:white; border-radius:20px; padding:10px; border:1px solid #ddd;"><div id="productsList"></div></div>
</div>

<div id="overlay" class="overlay" onclick="closeAllModals()"></div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storeId = localStorage.getItem('myStoreId');

    // تفعيل الـ Service Worker (المحرك)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(() => {
            console.log("PWA Active ✅");
        });
    }

    // وظيفة طلب الإذن للتنبيهات
    window.requestNotif = () => {
        Notification.requestPermission().then(perm => {
            if (perm === 'granted') {
                document.getElementById('notifStatus').className = "fas fa-bell";
                document.getElementById('notifStatus').style.color = "var(--accent)";
                new Notification("Future Site", { body: "تم تفعيل التنبيهات بنجاح! 🔔" });
            }
        });
    };

    if (storeId) {
        // التحقق من حالة التنبيهات عند التحميل
        if (Notification.permission === 'granted') {
            document.getElementById('notifStatus').className = "fas fa-bell";
            document.getElementById('notifStatus').style.color = "var(--accent)";
        }

        // مراقبة الطلبيات الجديدة للإشعار الفوري
        let initialLoad = true;
        onChildAdded(ref(db, `stores/${storeId}/orders`), (snap) => {
            if (!initialLoad) {
                const order = snap.val();
                if (Notification.permission === 'granted') {
                    new Notification("مبيعة جديدة! 📦", {
                        body: `الزبون: ${order.customerName}\nالمنتج: ${order.productName}`,
                        icon: "https://cdn-icons-png.flaticon.com/512/3081/3081559.png"
                    });
                    // تشغيل صوت تنبيه بسيط
                    const audio = new Audio('https://www.soundjay.com/buttons/sounds/button-3.mp3');
                    audio.play();
                }
            }
        });
        // تعطيل الإشعار عند التحميل الأول لكل الطلبيات القديمة
        setTimeout(() => { initialLoad = false; }, 3000);

        // [بقية كود جلب البيانات الإحصائية والمنتجات كما هو...]
        onValue(ref(db, `stores/${storeId}`), s => {
            if(s.exists()){
                const d = s.val();
                document.getElementById('storeName').innerText = d.name;
                document.getElementById('storeUrl').innerText = "future-site.com/" + storeId;
                document.getElementById('sToday').innerText = d.sales?.today || 0;
                document.getElementById('sWeek').innerText = d.sales?.week || 0;
                document.getElementById('sMonth').innerText = d.sales?.month || 0;
            }
        });

        onValue(ref(db, `stores/${storeId}/orders`), snap => {
            const list = document.getElementById('ordersList'); list.innerHTML = "";
            if(snap.exists()) Object.entries(snap.val()).reverse().forEach(([id, o]) => {
                list.innerHTML += `
                <div class="order-card">
                    <div class="order-date"><i class="far fa-clock"></i> ${o.date || 'طلب جديد'}</div>
                    <div class="order-body">
                        <div style="background:#eeebff; color:#6c5ce7; padding:5px 15px; border-radius:50px; font-weight:900; display:inline-block; margin-bottom:10px;">📦 ${o.productName}</div>
                        <span class="customer-name">👤 ${o.customerName}</span>
                        <a href="tel:${o.customerPhone}" class="phone-display">${o.customerPhone}</a>
                    </div>
                </div>`;
            });
        });
    }

    // [بقية الوظائف: copyLink, askDelete, saveBtn وغيرها...]
    window.copyLink = () => {
        const text = document.getElementById('storeUrl').innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert("تم نسخ الرابط بنجاح! ✅");
        });
    };
    window.toggleSection = (id) => { const el = document.getElementById(id); el.style.display = (el.style.display==='block'?'none':'block'); };
</script>
</body>
    </html>
