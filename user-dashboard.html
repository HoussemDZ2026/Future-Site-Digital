<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم البريميوم | Future Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --blue-grad: linear-gradient(135deg, #1e3799 0%, #0984e3 100%);
            --time-bg: #1e272e;
            --success: #2ecc71;
            --danger: #e74c3c;
            --accent: #00f2fe;
        }

        body { font-family: 'Cairo', sans-serif; background-color: #f1f2f6; margin: 0; padding: 15px; padding-bottom: 50px; }
        .container { max-width: 600px; margin: auto; }

        /* البطاقات الرئيسية */
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .card-name { background: var(--blue-grad); color: white; text-align: center; border: none; }
        .card-expiry { background: var(--time-bg); color: var(--accent); text-align: center; }

        /* أزرار العمليات */
        .action-btn { width: 100%; padding: 18px; border-radius: 20px; border: none; font-weight: 900; color: white; cursor: pointer; margin-bottom: 12px; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        /* تصميم الطلبية الاحترافي */
        .order-card {
            background: white; border-radius: 25px; padding: 0; overflow: hidden; margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid #eee;
        }
        .order-date { background: #f8f9fa; padding: 10px; text-align: center; font-size: 0.8rem; color: #666; border-bottom: 1px solid #eee; }
        .order-body { padding: 20px; }
        .prod-tag { background: #eeebff; color: #6c5ce7; padding: 5px 15px; border-radius: 50px; font-weight: 900; display: inline-block; margin-bottom: 10px; }
        .customer-name { font-size: 1.6rem; font-weight: 900; color: #2d3436; margin-bottom: 10px; display: block; }
        
        /* رقم الهاتف المريح للعين */
        .phone-display { 
            background: #2d3436; color: var(--accent); font-size: 2.2rem; font-weight: 900; 
            text-align: center; padding: 15px; border-radius: 15px; display: block; 
            text-decoration: none; margin: 15px 0; letter-spacing: 3px; border: 2px solid var(--accent);
        }
        
        .location-info { font-size: 1.1rem; color: #555; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .location-badge { background: #f1f2f6; padding: 8px 12px; border-radius: 10px; border-right: 4px solid #0984e3; flex: 1; }

        .order-footer { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; padding: 0 20px 20px; }
        .btn-call { background: var(--success); color: white; text-decoration: none; padding: 15px; border-radius: 15px; text-align: center; font-weight: 900; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-delete { background: var(--danger); color: white; border: none; border-radius: 15px; cursor: pointer; font-size: 1.2rem; }

        /* المودال مع العداد */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 92%; max-width: 500px; background: white; padding: 20px; border-radius: 30px; z-index: 2000; box-shadow: 0 0 50px rgba(0,0,0,0.4); }
        .mini-timer { background: var(--time-bg); color: var(--accent); padding: 5px; border-radius: 10px; font-size: 0.8rem; text-align: center; margin-bottom: 15px; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; }
        
        input, textarea { width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #ddd; font-family: 'Cairo'; box-sizing: border-box; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="card card-name"><h1 id="storeName">تحميل...</h1></div>

    <div class="card card-expiry">
        <h4 style="margin:0; color:white;">⏳ صلاحية المتجر</h4>
        <div style="display:flex; justify-content:center; gap:8px; margin-top:10px; font-weight:900; font-size: 1.2rem;">
            <span id="d">00</span>يوم : <span id="h">00</span>سا : <span id="m">00</span>د : <span id="s">00</span>ثا
        </div>
    </div>

    <button class="action-btn" style="background:#6c5ce7;" onclick="toggleDiv('ordersDiv')"><i class="fas fa-box-open"></i> الطلبيات الواردة</button>
    <div id="ordersDiv" class="hidden" style="display: none; margin-bottom: 20px;">
        <div id="ordersList"></div>
    </div>

    <button class="action-btn" style="background:#2ecc71;" onclick="openAddModal()"><i class="fas fa-plus-circle"></i> إضافة منتج جديد</button>
    
    <button class="action-btn" style="background:#0984e3;" onclick="toggleDiv('manageDiv')"><i class="fas fa-tasks"></i> إدارة المنتجات</button>
    <div id="manageDiv" class="hidden" style="display: none; background: white; border-radius: 20px; padding: 15px; border: 1px solid #ddd;">
        <div id="productsList"></div>
    </div>
</div>

<div id="overlay" class="overlay" onclick="closeModal()"></div>
<div id="productModal" class="modal">
    <div class="mini-timer">⏳ صلاحية المتجر المتبقية: <span id="md">0</span>ي <span id="mh">0</span>سا <span id="mm">0</span>د</div>
    <h3 id="modalTitle" style="text-align:center; margin-top:0;">إضافة منتج</h3>
    <input type="hidden" id="editKey">
    <input type="text" id="pName" placeholder="اسم المنتج">
    <input type="number" id="pPrice" placeholder="السعر (دج)">
    <textarea id="pDesc" rows="3" placeholder="وصف المنتج..."></textarea>
    <input type="file" id="pImage" accept="image/*">
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <button id="saveBtn" style="background:var(--success); color:white; border:none; padding:15px; border-radius:15px; font-weight:900;">حفظ ✅</button>
        <button onclick="closeModal()" style="background:#eee; border:none; padding:15px; border-radius:15px; font-weight:bold;">إلغاء</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storeId = localStorage.getItem('myStoreId');

    if (storeId) {
        // إدارة الوقت والبيانات الأساسية
        onValue(ref(db, `stores/${storeId}`), s => {
            if(s.exists()){
                const d = s.val();
                document.getElementById('storeName').innerText = d.name;
                
                setInterval(() => {
                    const diff = new Date(d.expiryDate).getTime() - new Date().getTime();
                    if(diff > 0){
                        const days = Math.floor(diff / 864e5);
                        const hours = Math.floor((diff % 864e5) / 36e5);
                        const mins = Math.floor((diff % 36e5) / 6e4);
                        const secs = Math.floor((diff % 6e4) / 1000);
                        
                        // تحديث العداد الرئيسي
                        document.getElementById('d').innerText = days;
                        document.getElementById('h').innerText = hours;
                        document.getElementById('m').innerText = mins;
                        document.getElementById('s').innerText = secs;

                        // تحديث العداد داخل المودال
                        document.getElementById('md').innerText = days;
                        document.getElementById('mh').innerText = hours;
                        document.getElementById('mm').innerText = mins;
                    }
                }, 1000);
            }
        });

        // قائمة الطلبيات المريحة للعين
        onValue(ref(db, `stores/${storeId}/orders`), snap => {
            const list = document.getElementById('ordersList'); list.innerHTML = "";
            if(snap.exists()){
                Object.entries(snap.val()).reverse().forEach(([id, o]) => {
                    list.innerHTML += `
                    <div class="order-card">
                        <div class="order-date"><i class="far fa-calendar-alt"></i> تاريخ الطلب: ${o.date || 'اليوم'}</div>
                        <div class="order-body">
                            <span class="prod-tag">📦 المنتج: ${o.productName}</span>
                            <span class="customer-name">👤 ${o.customerName}</span>
                            <a href="tel:${o.customerPhone}" class="phone-display">${o.customerPhone}</a>
                            <div class="location-info">
                                <div class="location-badge">📍 ${o.customerState}</div>
                                <div class="location-badge">🏙️ ${o.customerAddress}</div>
                            </div>
                        </div>
                        <div class="order-footer">
                            <a href="tel:${o.customerPhone}" class="btn-call"><i class="fas fa-phone-alt"></i> إتصال بالزبون</a>
                            <button class="btn-delete" onclick="deleteOrder('${id}')"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>`;
                });
            }
        });

        // إدارة المنتجات
        onValue(ref(db, `stores/${storeId}/products`), snap => {
            const list = document.getElementById('productsList'); list.innerHTML = "";
            if(snap.exists()){
                Object.entries(snap.val()).forEach(([id, p]) => {
                    list.innerHTML += `
                    <div style="display:flex; align-items:center; gap:12px; padding:10px; border-bottom:1px solid #eee;">
                        <img src="${p.image}" width="50" height="50" style="border-radius:10px; object-fit:cover;">
                        <div style="flex:1;"><b>${p.name}</b><br><small>${p.price} دج</small></div>
                        <button onclick="editProd('${id}', '${p.name}', '${p.price}', '${p.description}')" style="background:#f39c12; color:white; border:none; padding:8px; border-radius:8px;"><i class="fas fa-pen"></i></button>
                        <button onclick="deleteProd('${id}')" style="background:red; color:white; border:none; padding:8px; border-radius:8px;"><i class="fas fa-trash"></i></button>
                    </div>`;
                });
            }
        });
    }

    // وظائف الواجهة
    window.toggleDiv = (id) => { const el = document.getElementById(id); el.style.display = (el.style.display === 'block') ? 'none' : 'block'; };
    window.openAddModal = () => { document.getElementById('modalTitle').innerText="إضافة منتج"; document.getElementById('editKey').value=""; document.getElementById('productModal').style.display='block'; document.getElementById('overlay').style.display='block'; };
    window.editProd = (key, name, price, desc) => {
        document.getElementById('modalTitle').innerText="تعديل المنتج";
        document.getElementById('editKey').value = key;
        document.getElementById('pName').value = name;
        document.getElementById('pPrice').value = price;
        document.getElementById('pDesc').value = desc;
        document.getElementById('productModal').style.display='block';
        document.getElementById('overlay').style.display='block';
    };
    window.closeModal = () => { document.getElementById('productModal').style.display='none'; document.getElementById('overlay').style.display='none'; };
    window.deleteOrder = (id) => { if(confirm("حذف الطلبية؟")) remove(ref(db, `stores/${storeId}/orders/${id}`)); };
    window.deleteProd = (id) => { if(confirm("حذف المنتج؟")) remove(ref(db, `stores/${storeId}/products/${id}`)); };

    // الحفظ
    window.saveBtn.onclick = async () => {
        const key = document.getElementById('editKey').value;
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        const desc = document.getElementById('pDesc').value;
        const file = document.getElementById('pImage').files[0];
        if(!name || !price) return alert("أكمل البيانات");
        
        window.saveBtn.disabled = true;
        let img = "";
        if(file){
            const fd = new FormData(); fd.append("image", file);
            const res = await fetch("https://api.imgbb.com/1/upload?key=e48055a00c4440331de482c9a7b18e01", {method:"POST", body:fd});
            const j = await res.json(); img = j.data.url;
        }

        const pData = { name, price, description: desc };
        if(img) pData.image = img;

        if(key) update(ref(db, `stores/${storeId}/products/${key}`), pData).then(()=>closeModal());
        else { if(!img) return alert("اختر صورة"); push(ref(db, `stores/${storeId}/products`), pData).then(()=>closeModal()); }
        window.saveBtn.disabled = false;
    };
</script>
</body>
</html>
