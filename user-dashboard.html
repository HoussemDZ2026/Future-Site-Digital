<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --blue-grad: linear-gradient(135deg, #1e3799 0%, #0984e3 100%);
            --green-grad: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            --danger-grad: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            --cloud-grad: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            --accent: #6c5ce7;
            --dark: #2d3436;
        }

        body { font-family: 'Cairo', sans-serif; background-color: #f8f9fa; margin: 0; padding: 15px; padding-bottom: 60px; color: var(--dark); }
        .container { max-width: 500px; margin: auto; display: none; }
        
        /* Loader */
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #1e3799; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Header & Sections */
        .top-header { background: var(--blue-grad); color: white; border-radius: 25px; padding: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(30, 55, 153, 0.2); }
        .main-action { width: 100%; padding: 18px; border-radius: 20px; border: none; font-weight: 900; color: white; cursor: pointer; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 1.1rem; transition: 0.3s; }
        .main-action:active { transform: scale(0.95); }
        .btn-orders { background: var(--dark); }
        .btn-add { background: var(--blue-grad); }
        .btn-manage { background: #57606f; }
        .hidden { display: none; animation: slideDown 0.4s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* Order Card Style */
        .order-card { background: white; border-radius: 25px; padding: 20px; margin-bottom: 20px; border-top: 8px solid #0984e3; box-shadow: 0 10px 30px rgba(0,0,0,0.08); position: relative; }
        .order-date { display: inline-block; background: #f0f2f5; padding: 5px 12px; border-radius: 10px; font-size: 0.75rem; color: #777; font-weight: bold; margin-bottom: 15px; }
        .order-item-title { font-size: 1.2rem; font-weight: 900; color: var(--accent); margin-bottom: 5px; display: block; }
        .order-customer { font-size: 1rem; color: #333; margin-bottom: 15px; display: block; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .order-location { background: #fff9e6; color: #d35400; padding: 8px 15px; border-radius: 12px; font-weight: bold; font-size: 0.9rem; margin-bottom: 15px; display: inline-block; }
        .phone-display { background: #f1f2f6; padding: 15px; border-radius: 15px; text-align: center; font-size: 1.4rem; font-weight: 900; color: var(--dark); letter-spacing: 2px; margin-bottom: 15px; border: 1px dashed #ccc; }
        .call-btn { background: var(--green-grad); color: white; text-decoration: none; border-radius: 18px; display: flex; align-items: center; justify-content: center; height: 55px; font-weight: 900; font-size: 1.1rem; gap: 10px; box-shadow: 0 8px 20px rgba(46, 204, 113, 0.3); }
        .delete-btn-text { color: #ff4757; background: none; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; text-decoration: underline; }

        /* Modern Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 10000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: white; padding: 30px; border-radius: 35px; text-align: center; width: 100%; max-width: 400px; animation: modalIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes modalIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-icon { font-size: 60px; margin-bottom: 20px; }
        .modal-btns { display: flex; gap: 10px; margin-top: 25px; }
        .m-btn { flex: 1; padding: 15px; border-radius: 15px; border: none; font-weight: 900; cursor: pointer; font-family: 'Cairo'; }
        .m-confirm { background: var(--blue-grad); color: white; }
        .m-cancel { background: #f1f2f6; color: #777; }
        .m-delete { background: var(--danger-grad); color: white; }
    </style>
</head>
<body>

<div id="loadingOverlay"><div class="loader"></div><p>جاري تجهيز لوحتك...</p></div>

<div class="container" id="mainContainer">
    <div class="top-header">
        <div style="font-weight: 900;"><i class="fas fa-magic"></i> <span id="storeNameDisp">...</span></div>
        <button onclick="logout()" style="background:rgba(255,255,255,0.2); border:1px solid white; color:white; padding:6px 15px; border-radius:12px; cursor:pointer; font-weight:bold;">خروج</button>
    </div>

    <div style="background: white; padding: 15px; border-radius: 20px; margin-bottom: 20px; text-align: center; border: 2px dashed var(--accent);">
        <p id="storeUrlDisp" style="font-size: 0.8rem; color: var(--accent); font-weight: bold; margin-bottom: 10px;"></p>
        <button onclick="handleCopy()" class="main-action" style="background: var(--accent); margin-bottom: 0;">
            <i class="fas fa-copy"></i> نسخ رابط المتجر
        </button>
    </div>

    <button class="main-action" style="background: var(--cloud-grad);" onclick="showConfirmModal('download')">
        <i class="fas fa-cloud-download-alt"></i> تنزيل التطبيق واستقبال الإشعارات 🔔
    </button>

    <button class="main-action btn-orders" onclick="toggleSec('ordersSection')">
        <i class="fas fa-shopping-basket"></i> الطلبيات الواردة
    </button>
    <div id="ordersSection" class="hidden"><div id="ordersList"></div></div>

    <button class="main-action btn-add" onclick="openAddModal()">
        <i class="fas fa-plus-circle"></i> إضافة منتج جديد
    </button>

    <button class="main-action btn-manage" onclick="toggleSec('manageSection')">
        <i class="fas fa-tasks"></i> إدارة المنتجات
    </button>
    <div id="manageSection" class="hidden"><div id="productsList"></div></div>
</div>

<div id="customModal" class="modal">
    <div class="modal-content">
        <div id="modalIcon" class="modal-icon"></div>
        <h2 id="modalTitle" style="margin-bottom: 10px; font-weight: 900;"></h2>
        <p id="modalText" style="color: #666; margin-bottom: 20px;"></p>
        <div id="modalBtns" class="modal-btns"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storeId = localStorage.getItem('myStoreId');

    if (!storeId) window.location.href = 'index.html';

    // جلب البيانات وإيقاف التحميل
    onValue(ref(db, `stores/${storeId}`), (snap) => {
        document.getElementById('loadingOverlay').style.display = 'none';
        if (snap.exists()) {
            const data = snap.val();
            document.getElementById('mainContainer').style.display = 'block';
            document.getElementById('storeNameDisp').innerText = data.name;
            document.getElementById('storeUrlDisp').innerText = window.location.origin + "/store.html?id=" + storeId;
            renderOrders(data.orders);
            renderProducts(data.products);
        }
    });

    // عرض الطلبيات بالتصميم الجديد
    function renderOrders(orders) {
        const list = document.getElementById('ordersList'); list.innerHTML = "";
        if(!orders) { list.innerHTML = "<p style='text-align:center; padding:20px; color:#999;'>لا توجد طلبيات حالياً</p>"; return; }
        
        Object.entries(orders).reverse().forEach(([id, o]) => {
            list.innerHTML += `
                <div class="order-card">
                    <span class="order-date"><i class="far fa-calendar-alt"></i> وصل في: ${o.date || 'غير محدد'}</span>
                    <span class="order-item-title">${o.productName}</span>
                    <span class="order-customer"><i class="fas fa-user"></i> الزبون: ${o.customerName}</span>
                    <div class="order-location">
                        <i class="fas fa-map-marker-alt"></i> ${o.wilaya} - ${o.baladia}
                    </div>
                    <div class="phone-display">${o.phone}</div>
                    <a href="tel:${o.phone}" class="call-btn"><i class="fas fa-phone-alt"></i> إتصال بالزبون الآن</a>
                    <button class="delete-btn-text" onclick="showConfirmModal('order', '${id}')">حذف هذه الطلبية</button>
                </div>`;
        });
    }

    // عرض المنتجات
    function renderProducts(products) {
        const list = document.getElementById('productsList'); list.innerHTML = "";
        if(products) {
            Object.entries(products).forEach(([id, p]) => {
                list.innerHTML += `
                    <div style="background:white; margin:10px 0; padding:15px; border-radius:20px; display:flex; align-items:center; gap:15px; box-shadow:0 5px 15px rgba(0,0,0,0.05);">
                        <img src="${p.image || ''}" style="width:60px; height:60px; border-radius:12px; object-fit:cover;">
                        <div style="flex:1"><b>${p.name}</b><br><span style="color:var(--green-grad); font-weight:900;">${p.price} دج</span></div>
                        <button onclick="showConfirmModal('product', '${id}')" style="background:#fff1f2; color:#ff4757; border:none; padding:10px; border-radius:12px; cursor:pointer;"><i class="fas fa-trash"></i></button>
                    </div>`;
            });
        }
    }

    // نظام الرسائل والنوافذ الذكي
    window.showConfirmModal = (type, id = null) => {
        const modal = document.getElementById('customModal');
        const icon = document.getElementById('modalIcon');
        const title = document.getElementById('modalTitle');
        const text = document.getElementById('modalText');
        const btns = document.getElementById('modalBtns');
        
        modal.style.display = 'flex';
        btns.innerHTML = "";

        if(type === 'order' || type === 'product') {
            icon.innerHTML = "🗑️"; icon.style.color = "#ff4757";
            title.innerText = "هل أنت متأكد؟";
            text.innerText = type === 'order' ? "سيتم حذف هذه الطلبية نهائياً من سجلاتك." : "سيتم حذف هذا المنتج نهائياً من متجرك.";
            btns.innerHTML = `
                <button class="m-btn m-delete" onclick="executeDelete('${type}', '${id}')">نعم، حذف</button>
                <button class="m-btn m-cancel" onclick="closeModal()">إلغاء</button>`;
        } else if (type === 'download') {
            icon.innerHTML = "📲"; icon.style.color = "#00d2ff";
            title.innerText = "تنزيل التطبيق؟";
            text.innerText = "هل أنت متأكد من تنزيل التطبيق واستقبال إشعارات فورية لجميع الطلبيات؟";
            btns.innerHTML = `
                <button class="m-btn m-confirm" onclick="startDownload()">نعم، تنزيل</button>
                <button class="m-btn m-cancel" onclick="closeModal()">لا، لاحقاً</button>`;
        }
    };

    window.executeDelete = (type, id) => {
        const path = type === 'product' ? `stores/${storeId}/products/${id}` : `stores/${storeId}/orders/${id}`;
        remove(ref(db, path)).then(() => {
            showSuccess("تم الحذف بنجاح! ✨");
        });
    };

    window.handleCopy = () => {
        navigator.clipboard.writeText(document.getElementById('storeUrlDisp').innerText);
        showSuccess("تم نسخ رابط متجرك بنجاح! 📋✨");
    };

    window.startDownload = () => {
        closeModal();
        // محاكاة التنزيل الاحترافي
        showSuccess("بدأ تنزيل التطبيق على هاتفك.. تفقد الإشعارات! 🚀");
    };

    window.showSuccess = (msg) => {
        const modal = document.getElementById('customModal');
        document.getElementById('modalIcon').innerHTML = "✅";
        document.getElementById('modalTitle').innerText = "رائع!";
        document.getElementById('modalText').innerText = msg;
        document.getElementById('modalBtns').innerHTML = `<button class="m-btn m-confirm" onclick="closeModal()">ممتاز</button>`;
        modal.style.display = 'flex';
    };

    window.closeModal = () => document.getElementById('customModal').style.display = 'none';
    window.toggleSec = (id) => document.getElementById(id).classList.toggle('hidden');
    window.logout = () => { localStorage.removeItem('myStoreId'); window.location.href = 'index.html'; };
    window.openAddModal = () => { /* كود إضافة منتج كما هو سابقاً */ };
</script>
</body>
</html>
