<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3799">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --blue-grad: linear-gradient(135deg, #1e3799 0%, #0984e3 100%);
            --green-grad: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            --danger-grad: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            --gold-grad: linear-gradient(135deg, #f1c40f 0%, #f39c12 100%);
            --cloud-grad: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            --accent-neon: #00f2fe;
            --dark-card: #2d3436;
        }

        body { font-family: 'Cairo', sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; padding-bottom: 60px; }
        .container { max-width: 500px; margin: auto; display: block; }

        /* Loader */
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #1e3799; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Header Style */
        .top-header {
            background: var(--blue-grad); padding: 20px; border-radius: 25px; display: flex; 
            justify-content: space-between; align-items: center; margin-bottom: 25px; 
            box-shadow: 0 10px 20px rgba(30, 55, 153, 0.2); position: relative; overflow: hidden;
        }

        /* Timer */
        .timer-section { background: #1a1a2e; border-radius: 25px; padding: 15px; margin-bottom: 20px; text-align: center; border: 2px solid var(--accent-neon); }
        .timer-grid { display: flex; justify-content: center; gap: 8px; margin-top: 8px; }
        .timer-box { background: rgba(255,255,255,0.1); padding: 8px; border-radius: 12px; min-width: 50px; border-bottom: 3px solid var(--accent-neon); }
        .timer-num { display: block; font-size: 1.1rem; font-weight: 900; color: #fff; }
        .timer-label { display: block; font-size: 0.6rem; color: #aaa; }

        .activation-card { background: var(--gold-grad); color: #fff; padding: 20px; border-radius: 25px; text-align: center; margin-bottom: 20px; text-decoration: none; display: block; animation: pulse 2s infinite; font-weight: bold; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .main-action { width: 100%; padding: 18px; border-radius: 22px; border: none; font-weight: 900; color: white; cursor: pointer; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 1rem; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-orders { background: var(--dark-card); }
        .btn-add { background: var(--blue-grad); }
        .btn-manage { background: #57606f; }
        
        .url-box { background: white; padding: 15px; border-radius: 25px; border: 2px dashed #6c5ce7; text-align: center; margin-bottom: 20px; }
        .hidden { display: none; }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 10000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: white; padding: 30px; border-radius: 35px; text-align: center; width: 100%; max-width: 400px; border: 2px solid #fff; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        input, textarea { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 15px; border: 1px solid #ddd; font-family: 'Cairo'; box-sizing: border-box; }

        /* Order Card - التصميم الجديد المذهل */
        .order-card { 
            background: white; border-radius: 30px; padding: 20px; margin-bottom: 25px; 
            border-right: 10px solid #0984e3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            position: relative; overflow: hidden;
        }
        .order-date { background: #f1f2f6; color: #57606f; padding: 5px 15px; border-radius: 50px; font-size: 0.75rem; font-weight: bold; display: inline-block; margin-bottom: 15px; }
        .order-title { color: #1e3799; font-size: 1.3rem; font-weight: 900; margin: 10px 0; display: block; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .info-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; color: #2d3436; }
        .info-row i { color: #0984e3; width: 20px; text-align: center; }
        .info-label { font-size: 0.8rem; color: #636e72; margin-left: auto; }
        .info-value { font-weight: 700; font-size: 1rem; }
        
        .phone-badge { 
            background: #e1f5fe; color: #0288d1; padding: 12px; border-radius: 20px; 
            text-align: center; font-size: 1.4rem; font-weight: 900; margin: 15px 0;
            letter-spacing: 2px; border: 2px dashed #0288d1;
        }
        
        .btn-call { 
            background: var(--green-grad); color: white; text-decoration: none; 
            border-radius: 20px; display: flex; align-items: center; justify-content: center; 
            height: 60px; font-weight: 900; gap: 12px; font-size: 1.1rem;
            box-shadow: 0 8px 20px rgba(46, 204, 113, 0.4); transition: 0.3s;
        }
        .btn-call:active { transform: scale(0.95); }
        
        .btn-delete-order { 
            width: 100%; margin-top: 15px; border: none; background: rgba(255, 71, 87, 0.1); 
            color: #ff4757; padding: 10px; border-radius: 15px; cursor: pointer; 
            font-weight: bold; font-size: 0.9rem; transition: 0.3s;
        }
    </style>
</head>
<body>

<div id="loadingOverlay"><div class="loader"></div><p style="margin-top:15px; font-weight:900; color:#1e3799;">جاري تحميل متجرك...</p></div>

<div class="container">
    <div class="top-header">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div style="background: rgba(255,255,255,0.2); width: 45px; height: 45px; border-radius: 15px; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-store-alt" style="color: white; font-size: 1.4rem;"></i>
            </div>
            <div>
                <span style="display: block; font-size: 0.7rem; color: rgba(255,255,255,0.8);">لوحة تحكم</span>
                <span id="storeNameDisp" style="display: block; font-size: 1.2rem; font-weight: 900; color: white;">متجري</span>
            </div>
        </div>
        <button onclick="logout()" style="background: #ff4757; color: white; border: none; padding: 10px 18px; border-radius: 15px; font-weight: 900; cursor: pointer;">خروج</button>
    </div>

    <div class="timer-section">
        <span style="color:var(--accent-neon); font-size:0.8rem; font-weight:900;">⌛ متبقي على صلاحية الرابط:</span>
        <div class="timer-grid">
            <div class="timer-box"><span class="timer-num" id="days">00</span><span class="timer-label">يوم</span></div>
            <div class="timer-box"><span class="timer-num" id="hours">00</span><span class="timer-label">ساعة</span></div>
            <div class="timer-box"><span class="timer-num" id="minutes">00</span><span class="timer-label">دقيقة</span></div>
            <div class="timer-box"><span class="timer-num" id="seconds">00</span><span class="timer-label">ثانية</span></div>
        </div>
    </div>

    <a href="https://wa.me/213561150865" class="activation-card">
        <h3><i class="fab fa-whatsapp"></i> تفعيل المتجر الآن</h3>
        <p>ارفع القيود وابدأ استقبال الطلبات</p>
    </a>

    <div class="url-box">
        <div id="storeUrlDisp" style="font-size: 0.8rem; color: #6c5ce7; font-weight: bold; margin-bottom: 12px; word-break: break-all;">جاري التحميل...</div>
        <button onclick="handleCopy()" class="main-action" style="background: #6c5ce7; margin-bottom: 0;">نسخ رابط المتجر</button>
    </div>

    <button class="main-action" style="background: var(--cloud-grad);" onclick="showConfirmModal('download')">
        <i class="fas fa-bell"></i> تنزيل التطبيق واستقبال الإشعارات 🔔
    </button>

    <button class="main-action btn-orders" onclick="toggleSec('ordersSection')"><i class="fas fa-shopping-basket"></i> الطلبيات الواردة</button>
    <div id="ordersSection" class="hidden"><div id="ordersList"></div></div>

    <button class="main-action btn-add" onclick="openAddModal()"><i class="fas fa-plus-circle"></i> إضافة منتج جديد</button>

    <button class="main-action btn-manage" onclick="toggleSec('manageSection')"><i class="fas fa-tasks"></i> إدارة المنتجات</button>
    <div id="manageSection" class="hidden"><div id="productsList"></div></div>
</div>

<div id="productModal" class="modal">
    <div class="modal-content">
        <h2 id="pModalTitle" style="font-weight: 900; color: #1e3799;">بيانات المنتج</h2>
        <input type="hidden" id="editKey">
        <input type="text" id="pName" placeholder="اسم المنتج">
        <input type="number" id="pPrice" placeholder="سعر المنتج">
        <textarea id="pDesc" rows="3" placeholder="وصف المنتج"></textarea>
        <input type="file" id="pImage" accept="image/*">
        <div style="display: flex; gap: 10px;">
            <button class="main-action btn-add" id="saveProductBtn" style="flex: 2; margin-bottom:0;">تأكيد</button>
            <button class="main-action" onclick="closeProductModal()" style="flex: 1; background:#eee; color:#333; margin-bottom:0;">تراجع</button>
        </div>
    </div>
</div>

<div id="customModal" class="modal">
    <div class="modal-content">
        <div id="modalIcon" style="font-size: 60px; margin-bottom: 15px;"></div>
        <h3 id="modalTitle" style="font-weight: 900; font-size: 1.5rem;"></h3>
        <p id="modalText" style="color: #636e72; line-height: 1.6; margin-bottom: 25px;"></p>
        <div id="modalBtns" style="display: flex; gap: 12px;"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storeId = localStorage.getItem('myStoreId');

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').then(reg => {
                if (Notification.permission !== 'granted') Notification.requestPermission();
            });
        });
    }

    let lastOrderCount = -1; 

    onValue(ref(db, `stores/${storeId}`), (snap) => {
        document.getElementById('loadingOverlay').style.display = 'none';
        if (snap.exists()) {
            const data = snap.val();
            document.getElementById('storeNameDisp').innerText = data.name;
            document.getElementById('storeUrlDisp').innerText = window.location.origin + window.location.pathname.replace('user-dashboard.html', 'store.html') + "?id=" + storeId;
            
            const orders = data.orders || {};
            const currentCount = Object.keys(orders).length;
            if (lastOrderCount !== -1 && currentCount > lastOrderCount) sendLocalNotification();
            lastOrderCount = currentCount;

            renderOrders(orders);
            renderProducts(data.products);
        }
    });

    function sendLocalNotification() {
        if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 300]);
        const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        audio.play().catch(e => {});
        if (Notification.permission === 'granted') {
            new Notification("طلبية جديدة! 🔔", { body: "لديك طلب جديد في متجرك، تحقق منه الآن.", icon: "https://cdn-icons-png.flaticon.com/512/3135/3135715.png" });
        }
    }

    // إدارة الطلبيات - التنسيق الجديد
    function renderOrders(orders) {
        const list = document.getElementById('ordersList'); 
        list.innerHTML = "";
        if(Object.keys(orders).length === 0) {
            list.innerHTML = "<p style='text-align:center; color:#999; padding:20px;'>لا توجد طلبيات حالياً</p>";
            return;
        }
        
        Object.entries(orders).reverse().forEach(([id, o]) => {
            list.innerHTML += `
                <div class="order-card">
                    <div class="order-date"><i class="far fa-clock"></i> ${o.date || 'غير محدد'}</div>
                    <span class="order-title"><i class="fas fa-box-open"></i> ${o.productName}</span>
                    
                    <div class="info-row">
                        <i class="fas fa-user-tag"></i>
                        <span class="info-value">${o.customerName}</span>
                    </div>

                    <div class="info-row">
                        <i class="fas fa-map-marker-alt"></i>
                        <span class="info-value">${o.wilaya || 'غير مذكورة'} - ${o.baladia || ''}</span>
                    </div>

                    <div class="phone-badge">${o.phone}</div>

                    <a href="tel:${o.phone}" class="btn-call">
                        <i class="fas fa-phone-alt"></i> إتصال بالزبون الآن
                    </a>

                    <button onclick="showConfirmModal('order', '${id}')" class="btn-delete-order">
                        <i class="fas fa-trash-alt"></i> حذف هذه الطلبية من القائمة
                    </button>
                </div>`;
        });
    }

    // النوافذ المنبثقة الجذابة
    window.showConfirmModal = (type, id = null) => {
        const modal = document.getElementById('customModal');
        const btns = document.getElementById('modalBtns');
        modal.style.display = 'flex';
        
        if(type === 'download') {
            document.getElementById('modalIcon').innerHTML = "📲";
            document.getElementById('modalTitle').innerText = "تنزيل التطبيق؟";
            document.getElementById('modalTitle').style.color = "#1e3799";
            document.getElementById('modalText').innerText = "ثبت التطبيق لتصلك الإشعارات فوراً مثل WhatsApp!";
            btns.innerHTML = `<button class="main-action" style="background:var(--blue-grad); flex:1; margin-bottom:0;" onclick="executeDownload()">نعم، تثبيت</button><button class="main-action" style="background:#eee; color:#333; flex:1; margin-bottom:0;" onclick="closeModal()">ليس الآن</button>`;
        } else {
            // نافذة الحذف المثيرة
            document.getElementById('modalIcon').innerHTML = "⚠️";
            document.getElementById('modalTitle').innerText = "هل أنت متأكد؟";
            document.getElementById('modalTitle').style.color = "#ff4757";
            document.getElementById('modalText').innerText = "أنت على وشك حذف هذه الطلبية نهائياً من سجلاتك. لا يمكنك التراجع!";
            btns.innerHTML = `
                <button class="main-action" style="background:var(--danger-grad); flex:1; margin-bottom:0; box-shadow:0 5px 15px rgba(255,71,87,0.3);" onclick="executeDelete('${type}','${id}')">نعم، احذفها</button>
                <button class="main-action" style="background:#f1f2f6; color:#333; flex:1; margin-bottom:0;" onclick="closeModal()">إلغاء</button>`;
        }
    };

    window.executeDelete = (type, id) => {
        const path = type === 'product' ? `stores/${storeId}/products/${id}` : `stores/${storeId}/orders/${id}`;
        remove(ref(db, path)).then(() => {
            closeModal();
            showSuccess("تم حذف البيانات بنجاح تام! ✨");
        });
    };

    window.showSuccess = (msg) => {
        document.getElementById('modalIcon').innerHTML = "🎉";
        document.getElementById('modalTitle').innerText = "تمت العملية!";
        document.getElementById('modalTitle').style.color = "#2ecc71";
        document.getElementById('modalText').innerText = msg;
        document.getElementById('modalBtns').innerHTML = `<button onclick="closeModal()" class="main-action" style="background:var(--green-grad); width:100%; margin-bottom:0; box-shadow:0 5px 15px rgba(46,204,113,0.3);">ممتاز، شكراً</button>`;
        document.getElementById('customModal').style.display = 'flex';
    };

    // الوظائف الأساسية المتبقية
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
    
    window.executeDownload = async () => {
        closeModal();
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt = null;
        } else {
            alert("التطبيق مثبت بالفعل أو استخدم 'Add to Home Screen' من إعدادات المتصفح.");
        }
    };

    window.handleCopy = () => {
        navigator.clipboard.writeText(document.getElementById('storeUrlDisp').innerText);
        showSuccess("تم نسخ رابط متجرك! شاركه مع زبائنك الآن 📋");
    };

    function renderProducts(products) {
        const list = document.getElementById('productsList'); list.innerHTML = "";
        if(products) {
            Object.entries(products).forEach(([id, p]) => {
                list.innerHTML += `
                    <div style="background:white; margin:10px 0; padding:12px; border-radius:20px; display:flex; align-items:center; gap:12px; box-shadow:0 5px 15px rgba(0,0,0,0.05);">
                        <img src="${p.image || ''}" style="width:50px; height:50px; border-radius:10px; object-fit:cover;">
                        <div style="flex:1"><b>${p.name}</b><br><small style="color:#27ae60; font-weight:bold;">${p.price} دج</small></div>
                        <button onclick="editProduct('${id}','${p.name}','${p.price}','${p.description}')" style="background:#f39c12; color:white; border:none; padding:10px; border-radius:12px;"><i class="fas fa-edit"></i></button>
                        <button onclick="showConfirmModal('product', '${id}')" style="background:#ff4757; color:white; border:none; padding:10px; border-radius:12px;"><i class="fas fa-trash"></i></button>
                    </div>`;
            });
        }
    }

    window.saveProductBtn.onclick = async () => {
        const k = document.getElementById('editKey').value;
        const n = document.getElementById('pName').value;
        const p = document.getElementById('pPrice').value;
        const d = document.getElementById('pDesc').value;
        const f = document.getElementById('pImage').files[0];
        if(!n || !p) { alert("يرجى إدخال الاسم والسعر"); return; }
        
        let imgUrl = "";
        if(f){
            const fd = new FormData(); fd.append("image", f);
            const res = await fetch("https://api.imgbb.com/1/upload?key=e48055a00c4440331de482c9a7b18e01", {method:"POST", body:fd});
            const j = await res.json(); imgUrl = j.data.url;
        }
        const prodData = { name: n, price: p, description: d };
        if(imgUrl) prodData.image = imgUrl;
        k ? update(ref(db, `stores/${storeId}/products/${k}`), prodData) : push(ref(db, `stores
