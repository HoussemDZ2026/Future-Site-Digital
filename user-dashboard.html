<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المتجر الاحترافية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --brand-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --gold-gradient: linear-gradient(135deg, #FFD700, #FDBB2D);
            --wa-grad: linear-gradient(135deg, #25d366, #128c7e);
            --day-grad: linear-gradient(135deg, #11998e, #38ef7d);
            --success: #00b894;
            --danger: #ff7675;
            --bg: #f1f5f9;
        }

        body { font-family: 'Cairo', sans-serif; background: var(--bg); margin: 0; padding-bottom: 50px; color: #2d3436; }
        .container { max-width: 700px; margin: auto; padding: 15px; }

        .store-header-box { 
            background: var(--brand-gradient); padding: 50px 20px; 
            border-radius: 0 0 50px 50px; text-align: center; color: white; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); margin-bottom: 25px;
            border-bottom: 5px solid var(--gold-gradient);
        }
        .store-header-box h1 { margin: 0; font-size: 2.2rem; font-weight: 900; }

        /* --- تصميم بطاقة الطلبية الاحترافية --- */
        .order-card {
            background: white; border-radius: 25px; padding: 20px; margin-bottom: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08); border-right: 10px solid #3498db;
            position: relative;
        }

        .cust-name { 
            font-size: 1.4rem; font-weight: 900; color: #2c3e50; 
            background: #eef2f7; padding: 8px 15px; border-radius: 12px;
            display: inline-block; margin-bottom: 12px; width: 100%; box-sizing: border-box;
        }

        .phone-badge { 
            background: var(--wa-grad); color: white; 
            padding: 12px; border-radius: 15px; font-weight: 900; font-size: 1.3rem;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            text-decoration: none; margin: 15px 0; box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
        }

        .location-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .loc-box { background: #f8f9fa; padding: 10px; border-radius: 12px; text-align: center; border: 1px solid #eee; }
        .loc-box span { display: block; font-size: 0.75rem; color: #888; font-weight: bold; }
        .loc-box strong { color: #2c3e50; font-size: 1rem; }

        .prod-tag { 
            background: #fff3cd; color: #856404; padding: 12px; border-radius: 12px;
            font-weight: 900; border: 1px dashed #ffeeba; margin-bottom: 15px;
            display: flex; align-items: center; gap: 10px;
        }

        /* --- إدارة المنتجات --- */
        .prod-item { 
            background: white; padding: 15px; border-radius: 20px; display: flex; 
            align-items: center; gap: 15px; margin-bottom: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); 
        }
        .btn-edit { background: #3498db; color: white; border: none; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; }
        .btn-del { background: var(--danger); color: white; border: none; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; }

        .modal { background: white; padding: 25px; border-radius: 30px; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 92%; max-width: 450px; z-index: 1000; box-shadow: 0 0 100px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto; }
        .hidden { display: none; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #ddd; font-family: 'Cairo'; box-sizing: border-box; font-weight: bold; }
        
        .admin-btn { background: var(--gold-gradient); color: black; border: none; padding: 15px; border-radius: 15px; font-weight: 900; width: 100%; cursor: pointer; margin-top: 10px; display: block; text-align: center; text-decoration: none; }
    </style>
</head>
<body>

<div class="store-header-box"><h1 id="storeName">تحميل...</h1></div>

<div class="container">
    
    <div style="background: white; border-radius: 25px; padding: 20px; margin-bottom: 25px; border: 2px solid #25d366;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <i class="fab fa-whatsapp" style="color: #25d366; font-size: 1.5rem;"></i>
                <strong>تنبيهات الواتساب</strong>
            </div>
            <button onclick="document.getElementById('waArea').classList.toggle('hidden')" style="background:#eee; border:none; padding:5px 10px; border-radius:8px;">إعدادات</button>
        </div>
        <div id="waArea" class="hidden">
            <input type="number" id="waPhone" placeholder="رقم الواتساب (213...)">
            <input type="text" id="waApiKey" placeholder="API Key">
            <button onclick="saveWaSettings()" class="admin-btn">حفظ وتفعيل</button>
        </div>
    </div>

    <h2 style="margin: 25px 0 15px;"><i class="fas fa-shopping-basket"></i> الطلبيات المستلمة</h2>
    <div id="ordersDisplay"></div>

    <hr style="margin: 40px 0; border: 1px solid #ddd;">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>🛒 منتجاتك</h2>
        <button onclick="openAddModal()" style="background:var(--success); color:white; border:none; padding:10px 20px; border-radius:12px; font-weight:900; cursor:pointer;">+ إضافة جديد</button>
    </div>
    <div id="productsDisplay"></div>
</div>

<div id="productModal" class="modal hidden">
    <h3 id="modalTitle" style="text-align: center;">إضافة منتج</h3>
    <input type="text" id="pTitle" placeholder="اسم المنتج">
    <input type="number" id="pPrice" placeholder="السعر (دج)">
    <textarea id="pDesc" placeholder="وصف المنتج"></textarea>
    <input type="file" id="pImg" accept="image/*">
    <button id="submitBtn" class="admin-btn" style="background:var(--success); color:white;">حفظ البيانات</button>
    <button onclick="closeModal()" style="width:100%; background:none; border:none; margin-top:10px; color:#999; cursor:pointer;">إغلاق</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove, update, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);
    const storeId = localStorage.getItem('myStoreId') || "-O-D-S-1"; // تأكد من الـ ID الخاص بك هنا
    let editId = null;

    // جلب اسم المتجر
    onValue(ref(db, `stores/${storeId}`), s => { if(s.exists()) document.getElementById('storeName').innerText = s.val().name; });

    // عرض الطلبيات
    onValue(ref(db, `stores/${storeId}/orders`), snap => {
        const box = document.getElementById('ordersDisplay');
        box.innerHTML = !snap.exists() ? '<p style="text-align:center;">لا توجد طلبيات</p>' : "";
        if(snap.exists()){
            Object.entries(snap.val()).reverse().forEach(([key, o]) => {
                box.innerHTML += `
                <div class="order-card">
                    <div class="cust-name"><i class="fas fa-user-circle"></i> ${o.customerName}</div>
                    <div class="location-grid">
                        <div class="loc-box"><span>الولاية</span><strong>${o.customerState}</strong></div>
                        <div class="loc-box"><span>البلدية</span><strong>${o.customerAddress}</strong></div>
                    </div>
                    <div class="prod-tag"><i class="fas fa-shopping-bag"></i> ${o.productName} (الكمية: ${o.quantity || 1})</div>
                    <a href="tel:${o.customerPhone}" class="phone-badge">
                        <i class="fas fa-phone-alt"></i> إتصال بالزبون: ${o.customerPhone}
                    </a>
                    <div style="text-align: left;">
                        <button onclick="deleteOrder('${key}')" style="background:none; border:none; color:red; cursor:pointer;"><i class="fas fa-trash-alt"></i> حذف</button>
                    </div>
                </div>`;
            });
        }
    });

    // عرض المنتجات
    onValue(ref(db, `stores/${storeId}/products`), snap => {
        const box = document.getElementById('productsDisplay'); box.innerHTML = "";
        if(snap.exists()){
            Object.entries(snap.val()).forEach(([key, p]) => {
                box.innerHTML += `
                <div class="prod-item">
                    <img src="${p.image}" style="width:65px; height:65px; border-radius:15px; object-fit:cover;">
                    <div style="flex:1"><strong>${p.name}</strong><br><span style="color:var(--success); font-weight:900;">${p.price} دج</span></div>
                    <div style="display:flex; gap:8px;">
                        <button class="btn-edit" onclick="prepareEdit('${key}', '${p.name}', '${p.price}', '${p.description || ''}')"><i class="fas fa-edit"></i></button>
                        <button class="btn-del" onclick="deleteProduct('${key}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
            });
        }
    });

    // الدوال الوظيفية
    window.deleteOrder = (k) => confirm("حذف الطلب؟") && remove(ref(db, `stores/${storeId}/orders/${k}`));
    window.deleteProduct = (k) => confirm("حذف المنتج؟") && remove(ref(db, `stores/${storeId}/products/${k}`));
    
    window.prepareEdit = (id, name, price, desc) => {
        editId = id;
        document.getElementById('modalTitle').innerText = "تعديل المنتج";
        document.getElementById('pTitle').value = name;
        document.getElementById('pPrice').value = price;
        document.getElementById('pDesc').value = desc;
        document.getElementById('productModal').classList.remove('hidden');
    };

    window.openAddModal = () => { editId = null; document.getElementById('productModal').classList.remove('hidden'); };
    window.closeModal = () => document.getElementById('productModal').classList.add('hidden');

    document.getElementById('submitBtn').onclick = async () => {
        const name = document.getElementById('pTitle').value, price = document.getElementById('pPrice').value,
              desc = document.getElementById('pDesc').value, file = document.getElementById('pImg').files[0];
        if(!name || !price) return alert("الاسم والسعر مطلوبان");

        let data = { name, price, description: desc };
        if(file){
            const snap = await uploadBytes(sRef(storage, `p/${Date.now()}`), file);
            data.image = await getDownloadURL(snap.ref);
        }

        if(editId) await update(ref(db, `stores/${storeId}/products/${editId}`), data);
        else await push(ref(db, `stores/${storeId}/products`), {...data, timestamp: Date.now()});
        closeModal();
    };

    window.saveWaSettings = () => {
        const n = document.getElementById('waPhone').value, k = document.getElementById('waApiKey').value;
        update(ref(db, `stores/${storeId}/settings/whatsapp`), { number: n, apiKey: k, active: true }).then(() => alert("تم التفعيل ✅"));
    };
</script>
</body>
</html>
