<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --main-grad: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gold-grad: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            --danger-grad: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            --success-grad: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
            --tg-grad: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%);
        }

        body { font-family: 'Cairo', sans-serif; background-color: #f0f2f5; margin: 0; padding-bottom: 50px; color: #333; }
        .container { max-width: 900px; margin: auto; padding: 15px; }

        /* اسم المتجر - جذاب وملون */
        .store-title-card { 
            background: var(--main-grad); color: white; padding: 30px; 
            border-radius: 25px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            margin-bottom: 25px; border: 3px solid #fff;
        }
        .store-title-card h1 { margin: 0; font-size: 2.5rem; font-weight: 900; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

        /* رابط المتجر */
        .link-section { background: white; padding: 20px; border-radius: 20px; text-align: center; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .link-label { font-weight: 700; color: #764ba2; margin-bottom: 10px; display: block; }
        .link-box { background: #f8f9fa; padding: 12px; border: 2px dashed #764ba2; border-radius: 12px; color: #2193b0; font-weight: bold; word-break: break-all; margin-bottom: 10px; }

        /* مدة الصلاحية */
        .expiry-box { background: #1a1a1a; color: #fff; padding: 15px; border-radius: 15px; text-align: center; font-weight: bold; margin-bottom: 20px; }
        #expiryText { color: #f6d365; font-size: 1.2rem; }

        /* تواصل مع الإدارة */
        .admin-contact { background: var(--gold-grad); color: #000; padding: 18px; border-radius: 20px; text-align: center; font-weight: 900; text-decoration: none; display: block; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(253,160,133,0.4); }

        /* التليجرام */
        .telegram-config { background: white; padding: 20px; border-radius: 25px; border: 2px solid #2193b0; margin-bottom: 25px; }
        .btn-how { background: #eee; border: none; padding: 5px 10px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }

        /* الطلبيات الواردة */
        .section-btn { width: 100%; padding: 18px; border-radius: 20px; border: none; font-weight: 900; cursor: pointer; font-size: 1.1rem; margin-bottom: 15px; color: white; transition: 0.3s; }
        .btn-orders { background: var(--main-grad); }
        
        .order-card { 
            background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-right: 10px solid #764ba2;
        }
        .cust-name { color: #764ba2; font-size: 1.4rem; font-weight: 900; margin-bottom: 10px; display: block; }
        .cust-phone { background: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 12px; display: block; text-align: center; font-size: 1.3rem; font-weight: 900; margin-bottom: 10px; text-decoration: none; }
        .location-badge { display: inline-block; padding: 8px 15px; border-radius: 10px; background: #fff3cd; color: #856404; font-weight: 700; margin: 5px; }

        .order-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn-call { background: var(--success-grad); color: white; padding: 12px; border-radius: 12px; text-align: center; text-decoration: none; font-weight: bold; }
        .btn-delete { background: var(--danger-grad); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* إضافة منتج */
        .btn-add-product { background: var(--success-grad); }
        .modal { background: white; padding: 25px; border-radius: 30px; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 92%; max-width: 500px; z-index: 2000; box-shadow: 0 0 50px rgba(0,0,0,0.3); max-height: 90vh; overflow-y: auto; }
        .hidden { display: none; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; }

        input, textarea { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 15px; border: 1px solid #ddd; box-sizing: border-box; font-family: 'Cairo'; }
        
        /* قائمة المنتجات */
        .product-item { background: white; padding: 15px; border-radius: 20px; display: flex; align-items: center; gap: 15px; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .product-item img { width: 70px; height: 70px; border-radius: 15px; object-fit: cover; }

        @media (min-width: 768px) {
            .orders-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="store-title-card">
        <h1 id="storeNameDisplay">...</h1>
    </div>

    <div class="link-section">
        <span class="link-label">🔗 رابط متجرك الخاص:</span>
        <div class="link-box" id="storeUrl">جاري التحميل...</div>
        <button onclick="copyUrl()" style="background:var(--main-grad); color:white; border:none; padding:10px 20px; border-radius:10px; cursor:pointer; font-weight:bold;">نسخ الرابط</button>
    </div>

    <div class="expiry-box">
        ⏳ مدة صلاحية الرابط:<br>
        <span id="expiryText">--:--:--</span>
    </div>

    <a href="https://wa.me/213561150865" class="admin-contact">
        <i class="fab fa-whatsapp"></i> تواصل مع الإدارة (تفعيل / طلب خدمة)
    </a>

    <div class="telegram-config">
        <h3 style="color:#2193b0; margin-top:0;"><i class="fab fa-telegram"></i> استلام الطلبيات عبر تليجرام</h3>
        <button class="btn-how" onclick="alert('1. ابحث عن @BotFather وانشئ بوت.\n2. انسخ الـ Token.\n3. ابحث عن @userinfobot للحصول على ID الخاص بك.')">كيف أفعل الخاصية؟</button>
        <div style="margin-top:15px;">
            <label><input type="checkbox" id="tgActive"> تفعيل التليجرام</label>
            <input type="text" id="tgToken" placeholder="أدخل توكن البوت (Bot Token)">
            <input type="text" id="tgChatId" placeholder="أدخل آيدي الدردشة (Chat ID)">
            <button onclick="saveTg()" style="width:100%; background:#2193b0; color:white; border:none; padding:10px; border-radius:10px; font-weight:bold;">حفظ إعدادات التنبيه</button>
        </div>
    </div>

    <button class="section-btn btn-orders" onclick="toggleSection('ordersDisplay')">📦 عرض الطلبيات الواردة (إخفاء/إظهار)</button>
    <div id="ordersDisplay" class="hidden orders-grid"></div>

    <button class="section-btn btn-add-product" onclick="openModal()">➕ إضافة منتج جديد للمتجر</button>

    <h2 style="margin-top:30px;">🏷️ المنتجات الحالية</h2>
    <div id="productsList"></div>
</div>

<div id="modalOverlay" class="overlay hidden" onclick="closeModal()"></div>
<div id="productModal" class="modal hidden">
    <h2 id="modalTitle">إضافة منتج جديد</h2>
    <input type="text" id="pName" placeholder="اسم المنتج">
    <input type="number" id="pPrice" placeholder="سعر المنتج (دج)">
    <textarea id="pDesc" placeholder="وصف ومواصفات المنتج..." rows="4"></textarea>
    
    <div style="background:#f8f9fa; padding:10px; border-radius:12px; margin-bottom:15px;">
        <label><input type="checkbox" id="hasTimer" onchange="document.getElementById('timerInput').classList.toggle('hidden')"> إضافة عداد تنازلي؟</label>
        <input type="datetime-local" id="timerInput" class="hidden" style="margin-top:10px;">
    </div>

    <label>تحميل صورة المنتج:</label>
    <input type="file" id="pImage" accept="image/*">
    
    <button id="saveBtn" class="section-btn btn-add-product">تأكيد وحفظ المنتج ✅</button>
    <button onclick="closeModal()" style="width:100%; background:none; border:none; color:999; cursor:pointer;">إلغاء</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove, update, push, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);
    const storeId = localStorage.getItem('myStoreId');

    let isEdit = false; let editKey = null;

    // جلب بيانات المتجر
    onValue(ref(db, `stores/${storeId}`), s => {
        if(s.exists()){
            const d = s.val();
            document.getElementById('storeNameDisplay').innerText = d.name;
            document.getElementById('storeUrl').innerText = window.location.origin + "/store.html?id=" + storeId;
            updateTimer(d.expiryDate || d.expiryTimestamp);
        }
    });

    // تحديث عداد الصلاحية حسب طلبك (أيام أو ساعات/دقائق)
    function updateTimer(end) {
        const el = document.getElementById('expiryText');
        setInterval(() => {
            const diff = end - Date.now();
            if(diff <= 0) { el.innerText = "منتهي"; return; }
            
            const days = Math.floor(diff / 86400000);
            const hrs = Math.floor((diff % 86400000) / 3600000);
            const mins = Math.floor((diff % 3600000) / 60000);
            const secs = Math.floor((diff % 60000) / 1000);

            if(days >= 1) {
                el.innerText = `باقي ${days} يوم و ${hrs} ساعة`;
            } else {
                el.innerText = `${hrs}:${mins}:${secs}`;
            }
        }, 1000);
    }

    // إعدادات التليجرام
    window.saveTg = () => {
        update(ref(db, `stores/${storeId}/settings/telegram`), {
            active: document.getElementById('tgActive').checked,
            token: document.getElementById('tgToken').value,
            chatId: document.getElementById('tgChatId').value
        }).then(() => alert("تم حفظ الإعدادات بنجاح!"));
    };

    onValue(ref(db, `stores/${storeId}/settings/telegram`), s => {
        if(s.exists()){
            const d = s.val();
            document.getElementById('tgActive').checked = d.active;
            document.getElementById('tgToken').value = d.token || "";
            document.getElementById('tgChatId').value = d.chatId || "";
        }
    });

    // الطلبيات
    onValue(ref(db, `stores/${storeId}/orders`), snap => {
        const box = document.getElementById('ordersDisplay'); box.innerHTML = "";
        if(snap.exists()){
            Object.entries(snap.val()).reverse().forEach(([key, o]) => {
                box.innerHTML += `
                <div class="order-card">
                    <span class="cust-name">${o.customerName}</span>
                    <a href="tel:${o.customerPhone}" class="cust-phone">${o.customerPhone}</a>
                    <div>
                        <span class="location-badge">📍 ${o.customerState}</span>
                        <span class="location-badge">🏙️ ${o.customerAddress}</span>
                    </div>
                    <div style="margin-top:10px; font-weight:bold;">📦 المنتج: ${o.productName}</div>
                    <div class="order-btns">
                        <a href="tel:${o.customerPhone}" class="btn-call"><i class="fas fa-phone"></i> إتصال</a>
                        <button onclick="delOrder('${key}')" class="btn-delete"><i class="fas fa-trash"></i> حذف</button>
                    </div>
                </div>`;
            });
        }
    });

    // إدارة المنتجات
    onValue(ref(db, `stores/${storeId}/products`), snap => {
        const box = document.getElementById('productsList'); box.innerHTML = "";
        if(snap.exists()){
            Object.entries(snap.val()).forEach(([key, p]) => {
                box.innerHTML += `
                <div class="product-item">
                    <img src="${p.image}">
                    <div style="flex:1"><b>${p.name}</b><br><span style="color:green;">${p.price} دج</span></div>
                    <button onclick="editProd('${key}')" style="background:none; border:none; color:blue; font-size:1.2rem;"><i class="fas fa-edit"></i></button>
                    <button onclick="delProd('${key}')" style="background:none; border:none; color:red; font-size:1.2rem;"><i class="fas fa-trash"></i></button>
                </div>`;
            });
        }
    });

    // وظائف الأزرار
    window.delOrder = (k) => confirm("حذف الطلبية؟") && remove(ref(db, `stores/${storeId}/orders/${k}`));
    window.delProd = (k) => confirm("حذف المنتج؟") && remove(ref(db, `stores/${storeId}/products/${k}`));
    window.toggleSection = (id) => document.getElementById(id).classList.toggle('hidden');
    window.copyUrl = () => { navigator.clipboard.writeText(document.getElementById('storeUrl').innerText); alert("تم نسخ الرابط!"); };
    
    window.openModal = () => { 
        isEdit = false; document.getElementById('modalTitle').innerText = "إضافة منتج جديد";
        document.getElementById('productModal').classList.remove('hidden'); 
        document.getElementById('modalOverlay').classList.remove('hidden');
    };
    window.closeModal = () => { document.getElementById('productModal').classList.add('hidden'); document.getElementById('modalOverlay').classList.add('hidden'); };

    window.editProd = (key) => {
        isEdit = true; editKey = key;
        get(ref(db, `stores/${storeId}/products/${key}`)).then(s => {
            const p = s.val();
            document.getElementById('pName').value = p.name;
            document.getElementById('pPrice').value = p.price;
            document.getElementById('pDesc').value = p.description || "";
            document.getElementById('modalTitle').innerText = "تعديل المنتج";
            document.getElementById('productModal').classList.remove('hidden');
            document.getElementById('modalOverlay').classList.remove('hidden');
        });
    };

    document.getElementById('saveBtn').onclick = async () => {
        const data = {
            name: document.getElementById('pName').value,
            price: document.getElementById('pPrice').value,
            description: document.getElementById('pDesc').value,
            timerDate: document.getElementById('hasTimer').checked ? document.getElementById('timerInput').value : null
        };
        const file = document.getElementById('pImage').files[0];
        if(file) {
            const sRefChild = sRef(storage, `products/${Date.now()}`);
            await uploadBytes(sRefChild, file);
            data.image = await getDownloadURL(sRefChild);
        }

        if(isEdit) update(ref(db, `stores/${storeId}/products/${editKey}`), data);
        else push(ref(db, `stores/${storeId}/products`), data);
        
        closeModal();
    };
</script>
</body>
    </html>
