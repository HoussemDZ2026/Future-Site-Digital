<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --brand-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --whatsapp-color: #25d366;
            --order-purple: #6c5ce7;
            --danger: #ff4757;
            --success: #27ae60;
            --bg-body: #f4f7f6;
        }

        body { font-family: 'Cairo', sans-serif; background: var(--bg-body); margin: 0; padding-bottom: 50px; }
        .container { max-width: 900px; margin: auto; padding: 15px; }

        /* كارد اسم المتجر */
        .store-name-card { background: var(--brand-gradient); padding: 30px; border-radius: 25px; text-align: center; color: #fff; margin-bottom: 15px; box-shadow: 0 10px 20px rgba(30, 60, 114, 0.2); }
        .store-name-card h1 { margin: 0; font-size: 2rem; font-weight: 900; }

        /* التقارير والإحصائيات */
        .reports-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .report-item { background: white; padding: 15px 10px; border-radius: 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .report-item span { font-size: 0.8rem; color: #666; display: block; }
        .report-item strong { font-size: 1rem; color: var(--success); display: block; margin-top: 5px; }

        /* كارد الرابط وصلاحية المتجر */
        .status-card { background: white; padding: 20px; border-radius: 22px; margin-bottom: 20px; border: 1px solid #eee; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
        .expiry-timer { background: #fff5f5; color: #c0392b; padding: 10px; border-radius: 15px; font-weight: bold; font-size: 0.9rem; margin-top: 10px; border: 1px dashed #feb2b2; display: inline-block; width: 100%; box-sizing: border-box; transition: 0.3s; }
        
        .btn-copy-link { background: #2a5298; color: white; border: none; padding: 12px; border-radius: 15px; cursor: pointer; font-weight: 900; width: 100%; margin-top: 10px; }

        /* التواصل مع الإدارة */
        .admin-contact { background: var(--whatsapp-color); color: white; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; border-radius: 20px; font-weight: 900; margin-bottom: 20px; }

        /* --- تصميم الطلبية الاحترافي الجديد --- */
        .order-card { 
            background: white; 
            border-radius: 25px; 
            padding: 20px; 
            margin-bottom: 20px; 
            border-right: 10px solid var(--order-purple); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            position: relative;
            overflow: hidden;
        }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .order-time { font-size: 0.75rem; color: #999; font-weight: bold; }
        
        .customer-info-box { margin-bottom: 15px; }
        .cust-name { font-size: 1.3rem; font-weight: 900; color: #2c3e50; display: block; margin-bottom: 5px; }
        
        .phone-display { 
            font-size: 1.6rem; 
            font-weight: 900; 
            color: #1e3c72; 
            display: block; 
            margin: 10px 0; 
            background: #eef2f7; 
            border: 2px solid #d1d9e6; 
            padding: 10px; 
            border-radius: 15px; 
            text-align: center; 
            letter-spacing: 2px;
            text-shadow: 1px 1px 0px white;
        }
        
        .geo-tags { display: flex; gap: 8px; margin-bottom: 15px; }
        .badge-geo { padding: 6px 14px; border-radius: 10px; font-size: 0.8rem; font-weight: 700; }

        .product-ordered { 
            background: #fdf2ff; 
            padding: 15px; 
            border-radius: 18px; 
            margin-bottom: 20px; 
            border: 1px dashed var(--order-purple);
        }
        .product-ordered small { color: #8e44ad; font-weight: bold; display: block; margin-bottom: 4px; }
        .product-ordered strong { color: #2c3e50; font-size: 1.1rem; }

        /* أزرار الإجراءات */
        .order-actions { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; }
        
        .btn-call { 
            background: #27ae60; 
            color: white; 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            border-radius: 15px; 
            font-weight: 900; 
            font-size: 1rem;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
        }
        .btn-call:hover { background: #2ecc71; transform: translateY(-2px); }

        .btn-copy { background: #3498db; color: white; border: none; border-radius: 15px; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .btn-delete { background: #fff0f0; color: #ff4757; border: 1px solid #ffeaea; width: 50px; height: 50px; border-radius: 15px; cursor: pointer; transition: 0.3s; }
        .btn-delete:hover { background: #ff4757; color: white; }

        /* الأزرار العامة */
        .btn-main { width: 100%; padding: 16px; border: none; border-radius: 18px; font-weight: 900; cursor: pointer; margin-bottom: 15px; font-size: 1rem; }
        input, select, textarea { width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 15px; border: 1px solid #ddd; font-family: 'Cairo'; box-sizing: border-box; font-size: 1rem; outline: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="store-name-card">
        <h1 id="displayStoreName">...</h1>
    </div>

    <div class="reports-grid">
        <div class="report-item"><span>مبيعات اليوم</span><strong id="daySales">0 دج</strong></div>
        <div class="report-item"><span>مبيعات الأسبوع</span><strong id="weekSales">0 دج</strong></div>
        <div class="report-item"><span>مبيعات الشهر</span><strong id="monthSales">0 دج</strong></div>
    </div>
    
    <button class="btn-main" style="background:#34495e; color:white; margin-bottom: 25px;" onclick="exportReport()">
        <i class="fas fa-file-download"></i> تحميل تقرير المبيعات (CSV)
    </button>

    <div class="status-card">
        <span style="font-size: 0.85rem; color: #666;">رابط متجرك المباشر:</span>
        <div id="storeUrl" style="font-weight:bold; color:#2a5298; margin: 5px 0; word-break: break-all;">جاري التحميل...</div>
        <button class="btn-copy-link" onclick="copyUrl()"><i class="fas fa-link"></i> نسخ الرابط</button>
        <div id="expiryBox" class="expiry-timer"><i class="fas fa-hourglass-half"></i> مدة الصلاحية: <span id="daysRemaining">--</span> يوم متبقي</div>
    </div>

    <a href="https://wa.me/213561150865" target="_blank" class="admin-contact"><i class="fab fa-whatsapp"></i> تواصل مع الإدارة (حسام)</a>

    <button class="btn-main" style="background:var(--order-purple); color:white; font-size: 1.1rem; border-bottom: 4px solid #5849c4;" onclick="toggleSection('ordersBox')">
        <i class="fas fa-shopping-basket"></i> عرض الطلبيات الواردة
    </button>
    <div id="ordersBox" class="hidden">
        <div id="ordersList"></div>
    </div>

    <button class="btn-main" style="background:#27ae60; color:white;" onclick="toggleSection('productFormBox')">
        <i class="fas fa-plus-circle"></i> إضافة منتج جديد
    </button>
    
    <div id="productFormBox" class="hidden" style="background:white; padding:25px; border-radius:25px; margin-bottom:20px;">
        <input type="text" id="pName" placeholder="اسم المنتج">
        <input type="number" id="pPrice" placeholder="السعر دج">
        <textarea id="pDescription" placeholder="مواصفات وتفاصيل المنتج..."></textarea>
        <label style="display:flex; align-items:center; gap:10px; margin-bottom:15px; font-weight:bold; cursor:pointer;">
            <input type="checkbox" id="useTimer" onchange="document.getElementById('timerInput').classList.toggle('hidden')"> إضافة عداد تنازلي
        </label>
        <div id="timerInput" class="hidden"><input type="datetime-local" id="pTimerValue"></div>
        <div class="upload-area" onclick="document.getElementById('pFile').click()">
            <i class="fas fa-cloud-upload-alt" style="font-size:2.5rem; color:var(--order-purple);"></i>
            <p>اختر صورة المنتج</p>
            <input type="file" id="pFile" accept="image/*" class="hidden">
        </div>
        <button class="btn-main" style="background:var(--order-purple); color:white;" onclick="handleSaveProduct()">حفظ ونشر</button>
    </div>

    <div style="background:white; padding:20px; border-radius:25px; border:1px solid #eee;">
        <h3 style="margin-top:0;">📦 منتجاتك الحالية:</h3>
        <div id="productsList"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);
    const storeId = localStorage.getItem('myStoreId');

    // جلب الطلبيات وعرضها بتصميم احترافي
    onValue(ref(db, `stores/${storeId}/orders`), (snap) => {
        const list = document.getElementById('ordersList'); list.innerHTML = "";
        let todayTotal = 0, weekTotal = 0, monthTotal = 0;
        const now = new Date();

        if(snap.exists()){
            Object.entries(snap.val()).reverse().forEach(([key, o]) => {
                const orderPrice = parseFloat(o.productPrice) || 0;
                const orderDate = new Date(o.timestamp || Date.now());

                if(orderDate.toDateString() === now.toDateString()) todayTotal += orderPrice;
                if((now - orderDate) / (1000 * 60 * 60 * 24) <= 7) weekTotal += orderPrice;
                if(orderDate.getMonth() === now.getMonth()) monthTotal += orderPrice;

                list.innerHTML += `
                <div class="order-card">
                    <div class="order-header">
                        <span class="order-time"><i class="far fa-calendar-alt"></i> ${o.date || '---'}</span>
                        <span style="background:#f1f2f6; padding:4px 10px; border-radius:8px; font-size:0.7rem; font-weight:900;">#ID-${key.substring(0,5)}</span>
                    </div>
                    
                    <div class="customer-info-box">
                        <span class="cust-name"><i class="fas fa-user-circle"></i> ${o.customerName}</span>
                        <span class="phone-display">${o.customerPhone}</span>
                    </div>

                    <div class="geo-tags">
                        <span class="badge-geo" style="background:#fff3cd; color:#856404;"><i class="fas fa-map-marker-alt"></i> ${o.customerState}</span>
                        <span class="badge-geo" style="background:#e1f5fe; color:#01579b;"><i class="fas fa-city"></i> ${o.customerCity}</span>
                    </div>

                    <div class="product-ordered">
                        <small>المنتج المطلوب:</small>
                        <strong>${o.productName}</strong>
                    </div>

                    <div class="order-actions">
                        <a href="tel:${o.customerPhone}" class="btn-call">
                            <i class="fas fa-phone-alt"></i> إتصال
                        </a>
                        <button onclick="copyToClipboard('${o.customerPhone}')" class="btn-copy">
                             نسخ الرقم
                        </button>
                        <button onclick="deleteOrder('${key}')" class="btn-delete">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>`;
            });
        }
        document.getElementById('daySales').innerText = todayTotal + " دج";
        document.getElementById('weekSales').innerText = weekTotal + " دج";
        document.getElementById('monthSales').innerText = monthTotal + " دج";
    });

    // الدوال المساعدة
    window.toggleSection = (id) => {
        const el = document.getElementById(id);
        el.classList.toggle('hidden');
    };
    
    window.copyToClipboard = (num) => { 
        navigator.clipboard.writeText(num); 
        alert("تم نسخ رقم الزبون: " + num); 
    };

    window.deleteOrder = (key) => { 
        if(confirm("هل أنت متأكد من حذف هذه الطلبية نهائياً؟")) {
            remove(ref(db, `stores/${storeId}/orders/${key}`));
        }
    };

    // بقية دوال المنتجات (بقيت كما هي تماماً)
    onValue(ref(db, `stores/${storeId}/products`), (snap) => {
        const list = document.getElementById('productsList'); list.innerHTML = "";
        if(snap.exists()){
            Object.entries(snap.val()).forEach(([key, p]) => {
                list.innerHTML += `
                <div class="product-item">
                    <div style="display:flex; align-items:center; gap:15px;">
                        <img src="${p.image}" class="p-img">
                        <div><strong>${p.name}</strong><br><span style="color:#27ae60; font-weight:bold;">${p.price} دج</span></div>
                    </div>
                    <div style="display:flex; gap:10px;">
                        <button onclick="deleteProduct('${key}')" class="btn-icon" style="background:#fff0f0; color:red;"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
            });
        }
    });

    window.deleteProduct = (key) => { if(confirm("حذف المنتج؟")) remove(ref(db, `stores/${storeId}/products/${key}`)); };
    
    onValue(ref(db, `stores/${storeId}`), (snap) => {
        if(snap.exists()){
            const data = snap.val();
            document.getElementById('displayStoreName').innerText = data.name;
            document.getElementById('storeUrl').innerText = window.location.origin + "/store.html?id=" + storeId;
        }
    });
</script>
</body>
</html>
