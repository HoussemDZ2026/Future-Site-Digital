<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --main-grad: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gold-grad: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            --danger-grad: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            --success-grad: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
            --link-box-grad: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }

        body { font-family: 'Cairo', sans-serif; background-color: #f0f2f5; margin: 0; padding-bottom: 50px; color: #333; }
        .container { max-width: 900px; margin: auto; padding: 15px; }

        .store-title-card { 
            background: var(--main-grad); color: white; padding: 30px; 
            border-radius: 25px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            margin-bottom: 25px; border: 3px solid #fff;
        }
        .store-title-card h1 { margin: 0; font-size: 2.2rem; font-weight: 900; }

        /* --- مستطيل الرابط الاحترافي --- */
        .link-section { 
            background: var(--link-box-grad); padding: 30px 20px; border-radius: 30px; 
            text-align: center; margin-bottom: 25px; box-shadow: 0 15px 35px rgba(30, 60, 114, 0.4);
            border: 2px solid rgba(255,255,255,0.1);
        }
        .link-label { font-weight: 900; color: #fff; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.2rem; }
        .link-label i { color: #f6d365; animation: rocket-fly 2s infinite ease-in-out; }
        @keyframes rocket-fly { 0%, 100% { transform: translateY(0) rotate(-45deg); } 50% { transform: translateY(-8px) rotate(-45deg); } }
        .link-box { background: rgba(255, 255, 255, 0.1); padding: 18px; border: 2px dashed rgba(255, 255, 255, 0.4); border-radius: 18px; color: #fff; font-weight: bold; word-break: break-all; margin-bottom: 20px; backdrop-filter: blur(10px); }
        .btn-copy-new { background: #fff; color: #1e3c72; border: none; padding: 14px 40px; border-radius: 15px; cursor: pointer; font-weight: 900; transition: 0.3s; box-shadow: 0 8px 15px rgba(0,0,0,0.2); }
        .btn-copy-new:hover { background: #f6d365; color: #000; transform: translateY(-3px); }

        /* --- تصميم كارت الطلبية المطور --- */
        .order-card { 
            background: white; border-radius: 25px; padding: 20px; margin-bottom: 20px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.06); border-right: 12px solid #764ba2;
            position: relative;
        }
        .order-time { font-size: 0.8rem; color: #777; background: #f0f2f5; padding: 4px 10px; border-radius: 8px; display: inline-block; margin-bottom: 12px; font-weight: bold; }
        .cust-name { color: #764ba2; font-size: 1.5rem; font-weight: 900; margin-bottom: 10px; display: block; }
        .cust-phone-box { background: #e8f5e9; color: #2e7d32; padding: 12px; border-radius: 15px; display: block; text-align: center; font-size: 1.4rem; font-weight: 900; text-decoration: none; border: 1px solid #c8e6c9; margin-bottom: 12px; }
        .location-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .loc-tag { padding: 6px 12px; border-radius: 10px; font-size: 0.9rem; font-weight: 700; }
        .tag-state { background: #fff3cd; color: #856404; }
        .tag-city { background: #e3f2fd; color: #1565c0; }
        .order-prod-name { background: #f3e5f5; color: #7b1fa2; padding: 10px; border-radius: 12px; font-weight: 900; margin-bottom: 15px; text-align: center; }

        /* --- نافذة الحذف الجذابة --- */
        .confirm-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 9999; backdrop-filter: blur(8px);
            justify-content: center; align-items: center;
        }
        .confirm-box {
            background: white; padding: 30px; border-radius: 30px; text-align: center;
            max-width: 400px; width: 90%; animation: popIn 0.3s ease-out;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .confirm-box i { font-size: 60px; color: #ff0844; margin-bottom: 15px; }
        .confirm-box h3 { font-weight: 900; margin-bottom: 10px; }
        .confirm-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .btn-yes { background: var(--danger-grad); color: white; border: none; padding: 15px; border-radius: 15px; font-weight: 900; cursor: pointer; }
        .btn-no { background: #f0f2f5; color: #333; border: none; padding: 15px; border-radius: 15px; font-weight: 900; cursor: pointer; }

        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .expiry-box { background: #1a1a1a; color: #fff; padding: 15px; border-radius: 15px; text-align: center; font-weight: bold; margin-bottom: 20px; }
        #expiryText { color: #f6d365; font-size: 1.2rem; }

        .telegram-config { background: white; padding: 20px; border-radius: 25px; border: 2px solid #2193b0; margin-bottom: 25px; }
        .tg-btn-toggle { flex: 1; padding: 12px; border-radius: 12px; border: none; color: white; font-weight: 900; cursor: pointer; transition: 0.3s; }
        
        .section-btn { width: 100%; padding: 18px; border-radius: 20px; border: none; font-weight: 900; cursor: pointer; font-size: 1.1rem; margin-bottom: 15px; color: white; }
        .btn-orders { background: var(--main-grad); }
        .btn-add-product { background: var(--success-grad); }

        .modal { background: white; padding: 25px; border-radius: 30px; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 92%; max-width: 500px; z-index: 2000; box-shadow: 0 0 50px rgba(0,0,0,0.3); max-height: 90vh; overflow-y: auto; }
        .hidden { display: none; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; }
        
        input, textarea { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 15px; border: 1px solid #ddd; box-sizing: border-box; font-family: 'Cairo'; }
        .product-item { background: white; padding: 15px; border-radius: 20px; display: flex; align-items: center; gap: 15px; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .product-item img { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; }
    </style>
</head>
<body>

<div class="container">
    <div id="deleteConfirmModal" class="confirm-overlay">
        <div class="confirm-box">
            <i class="fas fa-trash-alt"></i>
            <h3>هل أنت متأكد؟</h3>
            <p>لا يمكنك التراجع عن حذف هذه الطلبية بعد تأكيدك.</p>
            <div class="confirm-btns">
                <button id="confirmDeleteBtn" class="btn-yes">نعم، حذف ✅</button>
                <button onclick="closeDeleteModal()" class="btn-no">لا، إلغاء ❌</button>
            </div>
        </div>
    </div>

    <div class="store-title-card">
        <h1 id="storeNameDisplay">جاري التحميل...</h1>
    </div>

    <div class="link-section">
        <span class="link-label"><i class="fas fa-rocket"></i> رابط متجرك الاحترافي جاهز</span>
        <div class="link-box" id="storeUrl">...</div>
        <button class="btn-copy-new" onclick="copyUrl()"><i class="far fa-copy"></i> نسخ الرابط المباشر</button>
    </div>

    <div class="expiry-box">⏳ صلاحية المتجر: <span id="expiryText">--:--:--</span></div>

    <div class="telegram-config">
        <h3 style="color:#2193b0; margin-top:0;"><i class="fab fa-telegram"></i> تنبيهات تليجرام</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button onclick="toggleTgUI(true)" class="tg-btn-toggle" style="background: var(--success-grad);">تفعيل ✅</button>
            <button onclick="toggleTgUI(false)" class="tg-btn-toggle" style="background: var(--danger-grad);">إلغاء ❌</button>
        </div>
        <div id="tgDetails" class="hidden">
            <div style="background: #f0faff; padding: 12px; border-radius: 12px; margin-bottom: 15px; border-right: 4px solid #2193b0; font-size: 0.85rem;">
                <b>💡 كيفية التفعيل:</b><br>
                1. أنشئ بوت من @BotFather وانسخ الـ Token.<br>
                2. احصل على الـ ID الخاص بك من @userinfobot.
            </div>
            <input type="text" id="tgToken" placeholder="أدخل API Token">
            <input type="text" id="tgChatId" placeholder="أدخل Chat ID">
            <button onclick="saveTg()" style="width:100%; background:#2d3436; color:white; border:none; padding:15px; border-radius:15px; font-weight:bold; cursor:pointer;">حفظ الإعدادات 💾</button>
        </div>
        <input type="checkbox" id="tgActive" class="hidden">
    </div>

    <button class="section-btn btn-orders" onclick="toggleSection('ordersDisplay')">📦 عرض الطلبيات الواردة</button>
    <div id="ordersDisplay" class="hidden"></div>

    <button class="section-btn btn-add-product" onclick="openModal()">➕ إضافة منتج جديد</button>
    <div id="productsList"></div>
</div>

<div id="modalOverlay" class="overlay hidden" onclick="closeModal()"></div>
<div id="productModal" class="modal hidden">
    <h2 id="modalTitle">إضافة منتج</h2>
    <input type="text" id="pName" placeholder="اسم المنتج">
    <input type="number" id="pPrice" placeholder="السعر">
    <textarea id="pDesc" placeholder="الوصف..."></textarea>
    
    <div style="background:#f8f9fa; padding:10px; border-radius:12px; margin-bottom:15px;">
        <label><input type="checkbox" id="hasTimer" onchange="document.getElementById('timerInput').classList.toggle('hidden')"> إضافة عداد تنازلي؟</label>
        <input type="datetime-local" id="timerInput" class="hidden" style="margin-top:10px;">
    </div>

    <input type="file" id="pImage" accept="image/*">
    <button id="saveBtn" class="section-btn btn-add-product">حفظ المنتج ✅</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove, update, push, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);
    const storeId = localStorage.getItem('myStoreId');

    let isEdit = false; let editKey = null;
    let orderToDeleteId = null;

    if (storeId) {
        onValue(ref(db, `stores/${storeId}`), s => {
            if(s.exists()){
                const d = s.val();
                document.getElementById('storeNameDisplay').innerText = d.name;
                const repoName = window.location.pathname.split('/')[1]; 
                const fullUrl = window.location.origin + (window.location.hostname.includes('github.io') ? `/${repoName}/` : '/') + "store.html?id=" + storeId;
                document.getElementById('storeUrl').innerText = fullUrl;
                updateExpiry(d.expiryDate || d.expiryTimestamp);
            }
        });

        onValue(ref(db, `stores/${storeId}/settings/telegram`), s => {
            if(s.exists()){
                const d = s.val();
                document.getElementById('tgActive').checked = d.active;
                document.getElementById('tgToken').value = d.token || "";
                document.getElementById('tgChatId').value = d.chatId || "";
                if(d.active) document.getElementById('tgDetails').classList.remove('hidden');
            }
        });

        onValue(ref(db, `stores/${storeId}/orders`), snap => {
            const box = document.getElementById('ordersDisplay'); box.innerHTML = "";
            if(snap.exists()) Object.entries(snap.val()).reverse().forEach(([k, o]) => {
                const dateStr = o.timestamp ? new Date(o.timestamp).toLocaleString('ar-DZ') : 'وقت غير معروف';
                box.innerHTML += `
                <div class="order-card">
                    <div class="order-time"><i class="far fa-clock"></i> ${dateStr}</div>
                    <span class="cust-name">${o.customerName}</span>
                    <a href="tel:${o.customerPhone}" class="cust-phone-box"><i class="fas fa-phone-alt"></i> ${o.customerPhone}</a>
                    <div class="location-grid">
                        <span class="loc-tag tag-state">📍 الولاية: ${o.customerState || '---'}</span>
                        <span class="loc-tag tag-city">🏙️ البلدية: ${o.customerAddress || '---'}</span>
                    </div>
                    <div class="order-prod-name">🛒 المنتج: ${o.productName}</div>
                    <button onclick="askDeleteOrder('${k}')" style="width:100%; padding:12px; border:none; background:var(--danger-grad); color:white; border-radius:12px; font-weight:900; cursor:pointer;"><i class="fas fa-trash"></i> حذف هذه الطلبية</button>
                </div>`;
            });
        });

        onValue(ref(db, `stores/${storeId}/products`), snap => {
            const box = document.getElementById('productsList'); box.innerHTML = "";
            if(snap.exists()) Object.entries(snap.val()).forEach(([k, p]) => {
                box.innerHTML += `<div class="product-item"><img src="${p.image}"><div style="flex:1"><b>${p.name}</b></div><button onclick="editProd('${k}')" style="color:blue; border:none; background:none; cursor:pointer;"><i class="fas fa-edit"></i></button><button onclick="delProd('${k}')" style="color:red; border:none; background:none; cursor:pointer;"><i class="fas fa-trash"></i></button></div>`;
            });
        });
    }

    // --- نظام الحذف الجديد ---
    window.askDeleteOrder = (id) => {
        orderToDeleteId = id;
        document.getElementById('deleteConfirmModal').style.display = 'flex';
    };
    window.closeDeleteModal = () => {
        document.getElementById('deleteConfirmModal').style.display = 'none';
        orderToDeleteId = null;
    };
    document.getElementById('confirmDeleteBtn').onclick = () => {
        if(orderToDeleteId) {
            remove(ref(db, `stores/${storeId}/orders/${orderToDeleteId}`))
            .then(() => closeDeleteModal());
        }
    };

    window.toggleTgUI = (show) => {
        document.getElementById('tgDetails').classList.toggle('hidden', !show);
        document.getElementById('tgActive').checked = show;
        if(!show) saveTg();
    };

    window.saveTg = () => {
        update(ref(db, `stores/${storeId}/settings/telegram`), {
            active: document.getElementById('tgActive').checked,
            token: document.getElementById('tgToken').value,
            chatId: document.getElementById('tgChatId').value
        }).then(() => alert("تم التحديث بنجاح!"));
    };

    window.editProd = (key) => {
        isEdit = true; editKey = key;
        get(ref(db, `stores/${storeId}/products/${key}`)).then(s => {
            const p = s.val();
            document.getElementById('pName').value = p.name;
            document.getElementById('pPrice').value = p.price;
            document.getElementById('pDesc').value = p.description || "";
            document.getElementById('modalTitle').innerText = "تعديل المنتج";
            openModal();
        });
    };

    window.delProd = (k) => { if(confirm("حذف المنتج؟")) remove(ref(db, `stores/${storeId}/products/${k}`)); };

    window.saveBtn.onclick = async () => {
        const data = { 
            name: document.getElementById('pName').value, 
            price: document.getElementById('pPrice').value, 
            description: document.getElementById('pDesc').value,
            timerDate: document.getElementById('hasTimer').checked ? document.getElementById('timerInput').value : null 
        };
        const file = document.getElementById('pImage').files[0];
        if(file) {
            const sR = sRef(storage, `products/${Date.now()}`);
            await uploadBytes(sR, file);
            data.image = await getDownloadURL(sR);
        }
        if(isEdit) update(ref(db, `stores/${storeId}/products/${editKey}`), data);
        else push(ref(db, `stores/${storeId}/products`), data);
        closeModal();
    };

    window.updateExpiry = (end) => {
        setInterval(() => {
            const diff = end - Date.now();
            const el = document.getElementById('expiryText');
            if(diff <= 0) { el.innerText = "منتهي"; return; }
            const d = Math.floor(diff/86400000), h = Math.floor((diff%86400000)/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
            el.innerText = `${d} يوم و ${h}:${m}:${s}`;
        }, 1000);
    };
    window.copyUrl = () => { navigator.clipboard.writeText(document.getElementById('storeUrl').innerText); alert("تم النسخ!"); };
    window.toggleSection = (id) => document.getElementById(id).classList.toggle('hidden');
    window.openModal = () => { document.getElementById('productModal').classList.remove('hidden'); document.getElementById('modalOverlay').classList.remove('hidden'); };
    window.closeModal = () => { document.getElementById('productModal').classList.add('hidden'); document.getElementById('modalOverlay').classList.add('hidden'); isEdit=false; document.getElementById('modalTitle').innerText="إضافة منتج"; };
</script>
</body>
</html>
