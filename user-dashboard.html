<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --brand-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --gold-gradient: linear-gradient(135deg, #FFD700, #FDBB2D);
            --day-grad: linear-gradient(135deg, #11998e, #38ef7d);
            --week-grad: linear-gradient(135deg, #6a11cb, #2575fc);
            --month-grad: linear-gradient(135deg, #ee0979, #ff6a00);
            --success: #00b894;
            --danger: #ff7675;
            --bg-professional: #f1f5f9;
        }

        body { font-family: 'Cairo', sans-serif; background: var(--bg-professional); margin: 0; padding-bottom: 50px; color: #2d3436; }
        .container { max-width: 700px; margin: auto; padding: 15px; }

        .store-header-box { 
            background: var(--brand-gradient); padding: 50px 20px; 
            border-radius: 0 0 50px 50px; text-align: center; color: white; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); margin-bottom: 25px;
            border-bottom: 5px solid var(--gold-gradient);
        }
        .store-header-box h1 { margin: 0; font-size: 2.4rem; font-weight: 900; }

        .url-box { 
            background: white; padding: 18px; border-radius: 20px; 
            display: flex; align-items: center; justify-content: space-between; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transform: translateY(-40px); margin: 0 auto -20px auto; width: 90%;
        }
        .url-box span { color: #2a5298; font-weight: 700; font-size: 0.9rem; word-break: break-all; }

        .admin-btn-gold { 
            background: var(--gold-gradient); color: #000; text-decoration: none; 
            display: flex; align-items: center; justify-content: center; gap: 12px; 
            padding: 20px; border-radius: 20px; font-weight: 900; font-size: 1.1rem;
            margin: 20px 0 10px 0; box-shadow: 0 8px 20px rgba(253, 187, 45, 0.3); 
            border: none; cursor: pointer; transition: 0.3s;
        }

        /* تصميم عداد صلاحية الرابط */
        .expiry-container {
            background: #1a1a1a;
            color: #fff;
            padding: 15px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 25px;
            border: 2px solid #333;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .expiry-label { font-size: 0.8rem; color: #aaa; margin-bottom: 5px; display: block; }
        #expiryTimer { 
            font-size: 1.4rem; 
            font-weight: 900; 
            color: var(--gold-gradient);
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(253, 187, 45, 0.3);
        }
        .timer-urgent { animation: pulse-red 1s infinite; }
        @keyframes pulse-red { 
            0% { opacity: 1; } 50% { opacity: 0.5; color: #ff7675; -webkit-text-fill-color: #ff7675; } 100% { opacity: 1; }
        }

        .reports-title { text-align: right; margin: 40px 0 20px; padding: 0 10px; border-right: 6px solid #2d3436; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .stat-card { padding: 20px 5px; border-radius: 25px; text-align: center; color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .stat-card.day { background: var(--day-grad); }
        .stat-card.week { background: var(--week-grad); }
        .stat-card.month { background: var(--month-grad); }
        
        .card { background: white; border-radius: 30px; padding: 25px; margin-bottom: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.04); }
        .modal { background: white; padding: 30px; border-radius: 30px; border: 3px solid var(--gold-gradient); margin-bottom: 25px; }
        input, textarea { width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 15px; border: 1px solid #e2e8f0; font-family: 'Cairo'; background: #f8fafc; box-sizing: border-box; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="store-header-box">
    <h1 id="storeName">تحميل...</h1>
</div>

<div class="container">
    <div class="url-box">
        <span id="storeUrl">رابط المتجر الخاص بك</span>
        <button onclick="copyUrl()" style="background:none; border:none; color:#2a5298; cursor:pointer;"><i class="far fa-copy"></i></button>
    </div>

    <a href="https://wa.me/0561150865" class="admin-btn-gold">
        <i class="fab fa-whatsapp"></i> تواصل مع الإدارة (Future Site)
    </a>

    <div class="expiry-container">
        <span class="expiry-label"><i class="fas fa-clock"></i> صلاحية رابط المتجر</span>
        <div id="expiryTimer">جاري حساب الوقت...</div>
    </div>

    <div class="reports-title">
        <h2><i class="fas fa-chart-pie"></i> تقارير المبيعات</h2>
    </div>
    <div class="stats">
        <div class="stat-card day"><span>اليوم</span><strong id="dayVal">0</strong></div>
        <div class="stat-card week"><span>الأسبوع</span><strong id="weekVal">0</strong></div>
        <div class="stat-card month"><span>الشهر</span><strong id="monthVal">0</strong></div>
    </div>

    <button class="admin-btn-gold" style="background: #2d3436; color:white; margin-top:40px;" onclick="toggleSection('ordersBox')">
        <i class="fas fa-shopping-basket"></i> الطلبيات الواردة
    </button>
    <div id="ordersBox" class="hidden"></div>

    <button class="admin-btn-gold" style="background: var(--success); color:white;" onclick="openAddModal()">
        <i class="fas fa-plus-circle"></i> إضافة منتج جديد
    </button>

    <div id="productForm" class="modal hidden">
        <h3 id="formTitle" style="text-align:center; font-weight:900;">إضافة منتج</h3>
        <input type="text" id="pTitle" placeholder="اسم المنتج">
        <input type="number" id="pPrice" placeholder="السعر">
        <textarea id="pDesc" placeholder="موصفات المنتج..."></textarea>
        <input type="file" id="pImg" accept="image/*">
        <button id="saveBtn" class="btn-main" style="background:var(--success); color:white; width:100%; padding: 15px; border-radius: 15px; border:none; font-weight: 900;">تأكيد وحفظ</button>
        <button onclick="closeModal()" style="width:100%; background:none; border:none; color:#aaa; margin-top:10px; cursor:pointer;">إلغاء</button>
    </div>

    <h3 style="margin-top:50px; border-right: 6px solid var(--success); padding-right: 15px; font-weight: 900;">📦 إدارة المنتجات</h3>
    <div id="productsList"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove, update, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);
    const storeId = localStorage.getItem('myStoreId');
    let editItemId = null;

    // جلب بيانات المتجر وتاريخ انتهاء الصلاحية
    onValue(ref(db, `stores/${storeId}`), (s) => {
        if(s.exists()){
            const data = s.val();
            document.getElementById('storeName').innerText = data.name;
            document.getElementById('storeUrl').innerText = window.location.origin + "/store.html?id=" + storeId;
            
            // تفعيل العداد الزمني (نفترض وجود حقل expiryDate في قاعدة البيانات)
            // إذا لم يوجد، سنضع تاريخاً افتراضياً (بعد 30 يوم من الآن) للتجربة
            const expiryDate = data.expiryDate || (Date.now() + (30 * 24 * 60 * 60 * 1000));
            startCountdown(expiryDate);
        }
    });

    function startCountdown(endTime) {
        const timerElement = document.getElementById('expiryTimer');
        
        const updateTimer = () => {
            const now = Date.now();
            const diff = endTime - now;

            if (diff <= 0) {
                timerElement.innerText = "انتهت صلاحية الرابط";
                timerElement.style.color = "#ff7675";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            if (days >= 1) {
                // عرض بالأيام إذا كان أكثر من يوم
                timerElement.innerText = `باقي ${days} يوم`;
                timerElement.classList.remove('timer-urgent');
            } else {
                // عرض بالساعات والدقائق والثواني إذا كان أقل من يوم
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((diff % (1000 * 60)) / 1000);
                
                timerElement.innerText = `${hours}:${mins}:${secs}`;
                timerElement.classList.add('timer-urgent'); // إضافة تأثير النبض
                timerElement.style.direction = "ltr"; // لضمان ظهور الوقت بشكل صحيح
                timerElement.style.display = "inline-block";
            }
        };

        setInterval(updateTimer, 1000);
        updateTimer();
    }

    // بقية وظائف Firebase (Orders, Products) تظل كما هي في الكود السابق...
    onValue(ref(db, `stores/${storeId}/orders`), (snap) => {
        const box = document.getElementById('ordersBox');
        let sums = {day:0, week:0, month:0};
        const now = new Date();
        if(!snap.exists()){
            box.innerHTML = `<div class="empty-state"><p>لا توجد طلبيات حالياً..</p></div>`;
        } else {
            box.innerHTML = "";
            Object.entries(snap.val()).reverse().forEach(([key, o]) => {
                const p = parseFloat(o.productPrice) || 0;
                const d = new Date(o.timestamp);
                if(d.toDateString() === now.toDateString()) sums.day += p;
                box.innerHTML += `<div class="card"><strong>${o.customerName}</strong><span class="phone-display">${o.customerPhone}</span><div class="btn-group"><a href="tel:${o.customerPhone}" class="btn-main btn-call">إتصال</a><button onclick="deleteOrder('${key}')" class="btn-main btn-delete">حذف</button></div></div>`;
            });
        }
        document.getElementById('dayVal').innerText = sums.day;
    });

    onValue(ref(db, `stores/${storeId}/products`), (snap) => {
        const list = document.getElementById('productsList'); list.innerHTML = "";
        if(snap.exists()){
            Object.entries(snap.val()).forEach(([key, p]) => {
                list.innerHTML += `
                <div class="card" style="display:flex; align-items:center; gap:15px;">
                    <img src="${p.image}" style="width:60px; height:60px; border-radius:15px; object-fit:cover;">
                    <div style="flex:1"><strong>${p.name}</strong><br><span>${p.price} دج</span></div>
                    <button onclick="prepareEdit('${key}', '${p.name}', '${p.price}', '${p.description || ''}')" style="background:none; border:none; cursor:pointer;"><i class="fas fa-pen"></i></button>
                    <button onclick="deleteProduct('${key}')" style="background:none; border:none; color:red; cursor:pointer;"><i class="fas fa-trash"></i></button>
                </div>`;
            });
        }
    });

    // وظائف النافذة المنبثقة والنسخ
    window.toggleSection = (id) => document.getElementById(id).classList.toggle('hidden');
    window.copyUrl = () => { navigator.clipboard.writeText(document.getElementById('storeUrl').innerText); alert("تم نسخ الرابط! 🚀"); };
    window.openAddModal = () => { editItemId = null; document.getElementById('productForm').classList.remove('hidden'); };
    window.closeModal = () => document.getElementById('productForm').classList.add('hidden');
    window.deleteOrder = (k) => remove(ref(db, `stores/${storeId}/orders/${k}`));
    window.deleteProduct = (k) => remove(ref(db, `stores/${storeId}/products/${k}`));

</script>
</body>
    </html>
