<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | Future Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --blue-grad: linear-gradient(135deg, #1e3799 0%, #0984e3 100%);
            --success: #2ecc71;
            --danger: #e74c3c;
            --url-color: #6c5ce7;
            --accent: #00f2fe;
            --dark: #2d3436;
        }

        body { font-family: 'Cairo', sans-serif; background-color: #f8f9fa; margin: 0; padding: 10px; padding-bottom: 50px; }
        .container { max-width: 500px; margin: auto; display: none; }
        
        /* شاشة التحميل */
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #1e3799; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* الأزرار العلوية */
        .app-download-btn {
            background: linear-gradient(90deg, #ff0080, #7928ca); color: white; padding: 15px; border-radius: 50px; 
            font-weight: 900; border: none; width: 100%; margin-bottom: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 10px 20px rgba(121, 40, 202, 0.2);
        }

        .header-card { background: var(--blue-grad); color: white; border-radius: 20px; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .logout-btn { background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 5px 12px; border-radius: 10px; cursor: pointer; }

        /* بطاقة الطلبية الجديدة والمحسنة */
        .order-card { 
            background: white; border-radius: 20px; margin-bottom: 15px; border: 1px solid #edf2f7; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.02); overflow: hidden;
        }
        .order-time { background: #f1f5f9; padding: 8px 15px; font-size: 0.8rem; color: #64748b; font-weight: bold; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; }
        .order-content { padding: 15px; }
        .info-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .info-label { font-size: 0.8rem; color: #94a3b8; min-width: 70px; }
        .info-value { font-weight: 700; color: var(--dark); }
        .product-tag { background: #eff6ff; color: #2563eb; padding: 4px 10px; border-radius: 8px; font-weight: 900; display: inline-block; margin-bottom: 10px; }
        .location-tag { background: #f0fdf4; color: #16a34a; padding: 4px 10px; border-radius: 8px; font-weight: 700; }
        
        .call-btn { background: var(--success); color: white; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: 12px; text-decoration: none; font-weight: 900; margin-top: 10px; }
        .del-order-btn { background: #fff5f5; color: var(--danger); border: none; width: 100%; padding: 10px; margin-top: 5px; cursor: pointer; font-weight: bold; }

        /* النوافذ المنبثقة (Modals) */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 350px; background: white; padding: 25px; border-radius: 25px; z-index: 2000; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); animation: pop 0.3s ease; }
        @keyframes pop { from { transform: translate(-50%, -50%) scale(0.8); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 1000; }
        
        .btn-confirm { background: var(--success); color: white; border: none; padding: 12px 25px; border-radius: 12px; font-weight: 900; cursor: pointer; }
        .btn-cancel { background: #f1f2f6; color: #555; border: none; padding: 12px 25px; border-radius: 12px; font-weight: 900; cursor: pointer; margin-right: 10px; }
        .btn-danger-confirm { background: var(--danger); color: white; border: none; padding: 12px 25px; border-radius: 12px; font-weight: 900; cursor: pointer; }

        /* تنسيقات إضافية */
        .url-container { background: white; padding: 15px; border-radius: 20px; border: 2px dashed var(--url-color); text-align: center; margin-bottom: 15px; }
        .action-btn { width: 100%; padding: 14px; border-radius: 15px; border: none; font-weight: 900; color: white; cursor: pointer; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .hidden { display: none; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 10px; font-family: 'Cairo'; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="loadingOverlay"><div class="loader"></div></div>

<div class="container" id="mainContainer">
    <button class="app-download-btn" onclick="openModal('installModal')">
        <i class="fas fa-cloud-download-alt"></i> تفعيل الإشعارات وتنزيل التطبيق
    </button>

    <div class="header-card">
        <span id="storeNameDisp" style="font-weight:900;">متجري</span>
        <button class="logout-btn" onclick="logout()">خروج <i class="fas fa-sign-out-alt"></i></button>
    </div>

    <div class="url-container">
        <div id="storeUrlDisp" style="color:var(--url-color); font-weight:bold; margin-bottom:10px; font-size:0.9rem;">...</div>
        <button class="action-btn" style="background:var(--url-color); padding:8px;" onclick="copyLink()">
            <i class="fas fa-copy"></i> نسخ رابط المتجر
        </button>
    </div>

    <button class="action-btn" style="background:var(--dark);" onclick="toggleSec('ordersSection')">
        <i class="fas fa-box"></i> الطلبيات الواردة
    </button>
    <div id="ordersSection"><div id="ordersList"></div></div>

    <button class="action-btn" style="background:var(--success);" onclick="openAddModal()">
        <i class="fas fa-plus-circle"></i> إضافة منتج جديد
    </button>

    <button class="action-btn" style="background:var(--blue-grad);" onclick="toggleSec('manageSection')">
        <i class="fas fa-tasks"></i> إدارة المنتجات
    </button>
    <div id="manageSection" class="hidden"><div id="productsList"></div></div>
</div>

<div id="installModal" class="modal">
    <div style="font-size: 40px; color: var(--url-color);"><i class="fas fa-mobile-alt"></i></div>
    <h3>تنزيل التطبيق</h3>
    <p>هل أنت متأكد من تنزيل التطبيق على هاتفك وتفعيل الإشعارات لكل الطلبيات؟</p>
    <button class="btn-confirm" onclick="startInstall()">نعم، تنزيل ✅</button>
    <button class="btn-cancel" onclick="closeModals()">لا ❌</button>
</div>

<div id="copyModal" class="modal">
    <div style="font-size: 40px; color: var(--success);"><i class="fas fa-check-circle"></i></div>
    <h3>تم النسخ!</h3>
    <p>تم نسخ رابط متجرك الخاص بنجاح، يمكنك الآن مشاركته مع زبائنك.</p>
    <button class="btn-confirm" onclick="closeModals()">رائع ✅</button>
</div>

<div id="deleteOrderModal" class="modal">
    <div style="font-size: 40px; color: var(--danger);"><i class="fas fa-trash-alt"></i></div>
    <h3>حذف الطلبية؟</h3>
    <p>هل أنت متأكد من حذف هذه الطلبية نهائياً؟ لا يمكن التراجع عن هذا.</p>
    <button class="btn-danger-confirm" id="confirmDeleteBtn">نعم، حذف 🗑️</button>
    <button class="btn-cancel" onclick="closeModals()">إلغاء</button>
</div>

<div id="productModal" class="modal" style="max-width:400px;">
    <h3 id="modalTitle">إضافة منتج</h3>
    <input type="hidden" id="editKey">
    <input type="text" id="pName" placeholder="اسم المنتج">
    <input type="number" id="pPrice" placeholder="السعر (دج)">
    <textarea id="pDesc" rows="3" placeholder="وصف المنتج"></textarea>
    <input type="file" id="pImage" accept="image/*">
    <button class="btn-confirm" id="saveProductBtn" style="width:100%;">حفظ المنتج ✅</button>
    <button class="btn-cancel" onclick="closeModals()" style="width:100%; margin-top:10px;">إلغاء</button>
</div>

<div class="overlay" id="overlay" onclick="closeModals()"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storeId = localStorage.getItem('myStoreId');

    if (!storeId) { window.location.href = 'index.html'; }

    // جلب البيانات
    onValue(ref(db, `stores/${storeId}`), (snapshot) => {
        if (snapshot.exists()) {
            const data = snapshot.val();
            document.getElementById('loadingOverlay').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
            document.getElementById('storeNameDisp').innerText = data.name;
            document.getElementById('storeUrlDisp').innerText = "future-site.com/store.html?id=" + storeId;
        }
    });

    // عرض الطلبيات بتنسيق جميل
    onValue(ref(db, `stores/${storeId}/orders`), snap => {
        const list = document.getElementById('ordersList'); list.innerHTML = "";
        if(snap.exists()) {
            Object.entries(snap.val()).reverse().forEach(([id, o]) => {
                list.innerHTML += `
                <div class="order-card">
                    <div class="order-time">
                        <span><i class="far fa-calendar-alt"></i> ${o.date || 'اليوم'}</span>
                        <span>ID: #${id.slice(-4)}</span>
                    </div>
                    <div class="order-content">
                        <div class="product-tag"><i class="fas fa-shopping-bag"></i> ${o.productName}</div>
                        <div class="info-row">
                            <span class="info-label">الزبون:</span>
                            <span class="info-value">${o.customerName}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">العنوان:</span>
                            <span class="location-tag"><i class="fas fa-map-marker-alt"></i> ${o.customerState} - ${o.customerCity || ''}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">الهاتف:</span>
                            <span class="info-value" style="color:var(--url-color);">${o.customerPhone}</span>
                        </div>
                        <a href="tel:${o.customerPhone}" class="call-btn">
                            <i class="fas fa-phone-alt"></i> اتصل بالزبون الآن
                        </a>
                        <button class="del-order-btn" onclick="askDeleteOrder('${id}')">
                            <i class="fas fa-trash"></i> حذف هذه الطلبية
                        </button>
                    </div>
                </div>`;
            });
        } else { list.innerHTML = "<p style='text-align:center; padding:20px;'>لا توجد طلبيات بعد</p>"; }
    });

    // عرض المنتجات في الإدارة
    onValue(ref(db, `stores/${storeId}/products`), snap => {
        const list = document.getElementById('productsList'); list.innerHTML = "";
        if(snap.exists()) {
            Object.entries(snap.val()).forEach(([id, p]) => {
                list.innerHTML += `
                <div style="display:flex; align-items:center; background:white; padding:10px; border-radius:15px; margin-bottom:10px; gap:10px; border:1px solid #eee;">
                    <img src="${p.image || ''}" width="50" height="50" style="border-radius:10px; object-fit:cover;">
                    <div style="flex:1;">
                        <div style="font-weight:bold;">${p.name}</div>
                        <div style="color:var(--success); font-size:0.8rem;">${p.price} دج</div>
                    </div>
                    <button onclick="editProduct('${id}','${p.name}','${p.price}','${p.description}')" style="background:#f39c12; color:white; border:none; padding:8px; border-radius:8px;"><i class="fas fa-edit"></i></button>
                    <button onclick="askDeleteProd('${id}')" style="background:var(--danger); color:white; border:none; padding:8px; border-radius:8px;"><i class="fas fa-trash"></i></button>
                </div>`;
            });
        }
    });

    // وظيفة حفظ/تعديل المنتج (تم إصلاحها)
    window.saveProductBtn.onclick = async () => {
        const k = document.getElementById('editKey').value;
        const n = document.getElementById('pName').value;
        const p = document.getElementById('pPrice').value;
        const d = document.getElementById('pDesc').value;
        const f = document.getElementById('pImage').files[0];

        if(!n || !p) return alert("أدخل بيانات المنتج!");
        
        let imgUrl = "";
        if(f){
            const fd = new FormData(); fd.append("image", f);
            const res = await fetch("https://api.imgbb.com/1/upload?key=e48055a00c4440331de482c9a7b18e01", {method:"POST", body:fd});
            const j = await res.json(); imgUrl = j.data.url;
        }

        const productData = { name: n, price: p, description: d };
        if(imgUrl) productData.image = imgUrl;

        if(k) { // تعديل
            update(ref(db, `stores/${storeId}/products/${k}`), productData).then(() => closeModals());
        } else { // إضافة جديد
            push(ref(db, `stores/${storeId}/products`), productData).then(() => closeModals());
        }
    };

    // الوظائف المساعدة
    window.openModal = (id) => { document.getElementById(id).style.display='block'; document.getElementById('overlay').style.display='block'; };
    window.closeModals = () => { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); document.getElementById('overlay').style.display='none'; };
    window.toggleSec = (id) => { document.getElementById(id).classList.toggle('hidden'); };
    
    window.copyLink = () => {
        navigator.clipboard.writeText(document.getElementById('storeUrlDisp').innerText).then(() => {
            openModal('copyModal');
        });
    };

    window.askDeleteOrder = (id) => {
        openModal('deleteOrderModal');
        document.getElementById('confirmDeleteBtn').onclick = () => {
            remove(ref(db, `stores/${storeId}/orders/${id}`)).then(() => closeModals());
        };
    };

    window.openAddModal = () => {
        document.getElementById('modalTitle').innerText = "إضافة منتج جديد";
        document.getElementById('editKey').value = "";
        document.getElementById('pName').value = "";
        document.getElementById('pPrice').value = "";
        document.getElementById('pDesc').value = "";
        openModal('productModal');
    };

    window.editProduct = (id, name, price, desc) => {
        document.getElementById('modalTitle').innerText = "تعديل المنتج";
        document.getElementById('editKey').value = id;
        document.getElementById('pName').value = name;
        document.getElementById('pPrice').value = price;
        document.getElementById('pDesc').value = desc;
        openModal('productModal');
    };

    window.logout = () => { localStorage.removeItem('myStoreId'); window.location.href = 'index.html'; };

    // تنزيل التطبيق
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
    window.startInstall = async () => {
        closeModals();
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt = null;
        } else {
            alert("التطبيق متاح للتثبيت عبر المتصفح (اضغط على الثلاث نقاط ثم Install App)");
        }
    };
</script>
</body>
    </html>
