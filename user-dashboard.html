<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --brand-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364); /* تدرج غامق وفخم */
            --gold-gradient: linear-gradient(135deg, #FFD700, #FDBB2D); /* أصفر ذهبي مثير */
            --day-grad: linear-gradient(135deg, #11998e, #38ef7d);
            --week-grad: linear-gradient(135deg, #6a11cb, #2575fc);
            --month-grad: linear-gradient(135deg, #ee0979, #ff6a00);
            --success: #00b894;
            --danger: #ff7675;
            --bg-professional: #f1f5f9; /* اللون الرمادي الاحترافي المقترح */
        }

        body { font-family: 'Cairo', sans-serif; background: var(--bg-professional); margin: 0; padding-bottom: 50px; color: #2d3436; }
        .container { max-width: 700px; margin: auto; padding: 15px; }

        /* مستطيل اسم المتجر - تصميم ملكي */
        .store-header-box { 
            background: var(--brand-gradient); padding: 50px 20px; 
            border-radius: 0 0 50px 50px; text-align: center; color: white; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); margin-bottom: 25px;
            border-bottom: 5px solid var(--gold-gradient);
        }
        .store-header-box h1 { margin: 0; font-size: 2.4rem; font-weight: 900; letter-spacing: 1px; }

        /* مستطيل الرابط الجذاب */
        .url-box { 
            background: white; padding: 18px; border-radius: 20px; 
            display: flex; align-items: center; justify-content: space-between; 
            border: none; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transform: translateY(-40px); margin-bottom: -20px; width: 90%; margin-right: auto; margin-left: auto;
        }
        .url-box span { color: #2a5298; font-weight: 700; font-size: 0.9rem; word-break: break-all; }

        /* زر الإدارة الأصفر المثير */
        .admin-btn-gold { 
            background: var(--gold-gradient); color: #000; text-decoration: none; 
            display: flex; align-items: center; justify-content: center; gap: 12px; 
            padding: 20px; border-radius: 20px; font-weight: 900; font-size: 1.1rem;
            margin: 20px 0; box-shadow: 0 8px 20px rgba(253, 187, 45, 0.3); 
            border: none; cursor: pointer; transition: 0.3s;
        }
        .admin-btn-gold:hover { transform: scale(1.02); }

        /* عنوان تقارير المبيعات */
        .reports-title {
            text-align: right; margin: 40px 0 20px; padding: 0 10px;
            border-right: 6px solid #2d3436;
        }
        .reports-title h2 { margin: 0; color: #2d3436; font-size: 1.6rem; font-weight: 900; }

        /* الإحصائيات الملونة العائمة */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .stat-card { padding: 20px 5px; border-radius: 25px; text-align: center; color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.1); transition: 0.3s; }
        .stat-card.day { background: var(--day-grad); }
        .stat-card.week { background: var(--week-grad); }
        .stat-card.month { background: var(--month-grad); }
        .stat-card strong { font-size: 1.5rem; display: block; margin: 5px 0; font-weight: 900; }
        .reset-btn { background: rgba(255,255,255,0.25); border: none; color: white; font-size: 0.7rem; padding: 5px 12px; border-radius: 10px; cursor: pointer; font-weight: bold; }

        /* بطاقة الطلبية والمنتج - White Floating */
        .card { background: white; border-radius: 30px; padding: 25px; margin-bottom: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.02); }
        .phone-display { background: #f8fafc; display: block; text-align: center; padding: 15px; border-radius: 20px; font-size: 1.8rem; font-weight: 900; margin: 15px 0; color: #1e293b; border: 1px solid #e2e8f0; }
        
        .btn-group { display: flex; gap: 10px; }
        .btn-main { flex: 1; padding: 16px; border-radius: 18px; border: none; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
        .btn-call { background: var(--success); color: white; }
        .btn-delete { background: #fff5f5; color: var(--danger); border: 1px solid #ffe3e3; }

        /* رسالة لا توجد طلبيات */
        .empty-state { text-align: center; padding: 50px 20px; background: white; border-radius: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.02); margin-top: 20px; border: 2px dashed #cbd5e0; }
        
        /* المودال */
        .modal { background: white; padding: 30px; border-radius: 30px; border: 3px solid var(--gold-gradient); margin-bottom: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 15px; border: 1px solid #e2e8f0; font-family: 'Cairo'; background: #f8fafc; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="store-header-box">
    <h1 id="storeName">تحميل...</h1>
</div>

<div class="container">
    <div class="url-box">
        <span id="storeUrl">رابط المتجر الخاص بك</span>
        <button onclick="copyUrl()" style="background:none; border:none; color:#2a5298; cursor:pointer; font-size: 1.2rem;"><i class="far fa-copy"></i></button>
    </div>

    <a href="https://wa.me/213561150865" class="admin-btn-gold">
        <i class="fab fa-whatsapp" style="font-size: 1.5rem;"></i> تواصل مع الإدارة (Future Site)
    </a>

    <div class="reports-title">
        <h2><i class="fas fa-chart-pie"></i> تقارير المبيعات</h2>
    </div>
    <div class="stats">
        <div class="stat-card day"><span>اليوم</span><strong id="dayVal">0</strong><button class="reset-btn" onclick="resetStat('day')">تصفير</button></div>
        <div class="stat-card week"><span>الأسبوع</span><strong id="weekVal">0</strong><button class="reset-btn" onclick="resetStat('week')">تصفير</button></div>
        <div class="stat-card month"><span>الشهر</span><strong id="monthVal">0</strong><button class="reset-btn" onclick="resetStat('month')">تصفير</button></div>
    </div>

    <button class="admin-btn-gold" style="background: #2d3436; color:white; margin-top:40px;" onclick="toggleSection('ordersBox')">
        <i class="fas fa-shopping-basket"></i> الطلبيات الواردة
    </button>
    <div id="ordersBox" class="hidden"></div>

    <button class="admin-btn-gold" style="background: var(--success); color:white;" onclick="openAddModal()">
        <i class="fas fa-plus-circle"></i> إضافة منتج جديد
    </button>

    <div id="productForm" class="modal hidden">
        <h3 id="formTitle" style="text-align:center; font-weight:900;">إضافة منتج</h3>
        <input type="text" id="pTitle" placeholder="اسم المنتج">
        <input type="number" id="pPrice" placeholder="السعر">
        <input type="file" id="pImg" accept="image/*">
        <label style="display:block; margin:10px 0; font-weight:700;"><input type="checkbox" id="timerOn" onchange="document.getElementById('timerDate').classList.toggle('hidden')"> هل تريد تفعيل عداد زمني؟</label>
        <input type="datetime-local" id="timerDate" class="hidden">
        <button id="saveBtn" class="btn-main" style="background:var(--success); color:white; width:100%; margin-top:10px;">تأكيد وحفظ</button>
        <button onclick="closeModal()" class="btn-main" style="background:#f1f5f9; color:#64748b; width:100%; margin-top:10px;">إلغاء</button>
    </div>

    <h3 style="margin-top:50px; border-right: 6px solid var(--success); padding-right: 15px; font-weight: 900;">📦 إدارة المنتجات</h3>
    <div id="productsList"></div>
</div>

<script type="module">
    // ... (نفس كود الـ JavaScript الخاص بك دون تغيير لضمان عمل الوظائف)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove, update, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);
    const storeId = localStorage.getItem('myStoreId');
    let editItemId = null; // لتمكين التعديل

    onValue(ref(db, `stores/${storeId}`), (s) => {
        if(s.exists()){
            document.getElementById('storeName').innerText = s.val().name;
            document.getElementById('storeUrl').innerText = window.location.origin + "/store.html?id=" + storeId;
        }
    });

    onValue(ref(db, `stores/${storeId}/orders`), (snap) => {
        const box = document.getElementById('ordersBox');
        let sums = {day:0, week:0, month:0};
        const now = new Date();
        if(!snap.exists()){
            box.innerHTML = `<div class="empty-state"><i class="fas fa-couch" style="font-size:3rem; color:#cbd5e0;"></i><p style="margin-top:15px;">لا توجد طلبيات حالياً.. استرخِ قليلاً!</p></div>`;
        } else {
            box.innerHTML = "";
            Object.entries(snap.val()).reverse().forEach(([key, o]) => {
                const p = parseFloat(o.productPrice) || 0;
                const d = new Date(o.timestamp);
                if(d.toDateString() === now.toDateString()) sums.day += p;
                box.innerHTML += `
                <div class="card">
                    <strong style="color:#2d3436; font-size:1.2rem;">${o.customerName}</strong>
                    <span class="phone-display">${o.customerPhone}</span>
                    <p style="font-size:0.9rem; color:#636e72;">📍 ${o.customerState} | 🏙️ ${o.customerCity}<br>📦 ${o.productName}</p>
                    <div class="btn-group">
                        <a href="tel:${o.customerPhone}" class="btn-main btn-call"><i class="fas fa-phone-alt"></i> إتصال سريع</a>
                        <button onclick="deleteOrder('${key}')" class="btn-main btn-delete"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
            });
        }
        document.getElementById('dayVal').innerText = sums.day;
    });

    onValue(ref(db, `stores/${storeId}/products`), (snap) => {
        const list = document.getElementById('productsList'); list.innerHTML = "";
        if(snap.exists()){
            Object.entries(snap.val()).forEach(([key, p]) => {
                list.innerHTML += `
                <div class="card" style="display:flex; align-items:center; gap:20px; padding:15px;">
                    <img src="${p.image}" style="width:70px; height:70px; border-radius:20px; object-fit:cover; box-shadow: 0 5px 10px rgba(0,0,0,0.1);">
                    <div style="flex:1"><strong>${p.name}</strong><br><span style="color:var(--success); font-weight:900;">${p.price}</span></div>
                    <div style="display:flex; gap:8px;">
                        <button onclick="prepareEdit('${key}', '${p.name}', '${p.price}')" style="border:none; background:#f1f5f9; padding:12px; border-radius:15px; cursor:pointer;"><i class="fas fa-pen" style="color:#2d3436;"></i></button>
                        <button onclick="deleteProduct('${key}')" style="border:none; background:#fff5f5; color:red; padding:12px; border-radius:15px; cursor:pointer;"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
            });
        }
    });

    window.prepareEdit = (id, name, price) => {
        editItemId = id;
        document.getElementById('pTitle').value = name;
        document.getElementById('pPrice').value = price;
        document.getElementById('formTitle').innerText = "تعديل منتج";
        document.getElementById('productForm').classList.remove('hidden');
    };

    document.getElementById('saveBtn').onclick = async () => {
        const name = document.getElementById('pTitle').value;
        const price = document.getElementById('pPrice').value;
        const file = document.getElementById('pImg').files[0];
        if(!name || !price) return alert("يرجى ملء الاسم والسعر");

        let updateData = { name, price };
        if(file){
            const sPath = sRef(storage, `products/${Date.now()}_${file.name}`);
            const up = await uploadBytes(sPath, file);
            updateData.image = await getDownloadURL(up.ref);
        }

        if(editItemId){
            await update(ref(db, `stores/${storeId}/products/${editItemId}`), updateData);
            alert("تم التعديل بنجاح");
        } else {
            if(!updateData.image) return alert("يرجى اختيار صورة للمنتج الجديد");
            await push(ref(db, `stores/${storeId}/products`), {...updateData, timestamp: Date.now()});
            alert("تمت الإضافة بنجاح");
        }
        closeModal();
    };

    window.toggleSection = (id) => document.getElementById(id).classList.toggle('hidden');
    window.copyUrl = () => { navigator.clipboard.writeText(document.getElementById('storeUrl').innerText); alert("تم نسخ الرابط! انشره الآن 🚀"); };
    window.deleteOrder = (k) => { if(confirm("حذف الطلبية؟")) remove(ref(db, `stores/${storeId}/orders/${k}`)); };
    window.deleteProduct = (k) => { if(confirm("حذف المنتج نهائياً؟")) remove(ref(db, `stores/${storeId}/products/${k}`)); };
    window.openAddModal = () => { editItemId = null; document.getElementById('formTitle').innerText = "إضافة منتج"; document.getElementById('productForm').classList.remove('hidden'); };
    window.closeModal = () => { document.getElementById('productForm').classList.add('hidden'); };
</script>
</body>
    </html>
