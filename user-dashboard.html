<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --brand-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --whatsapp-color: #25d366;
            --order-purple: #6c5ce7;
            --danger: #ff4757;
            --success: #27ae60;
            --bg-body: #f4f7f6;
        }

        body { font-family: 'Cairo', sans-serif; background: var(--bg-body); margin: 0; padding-bottom: 50px; color: #2c3e50; }
        .container { max-width: 1000px; margin: auto; padding: 15px; }

        /* الهيدر */
        .store-name-card { background: var(--brand-gradient); padding: 30px; border-radius: 25px; text-align: center; color: #fff; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(30, 60, 114, 0.2); }
        .store-name-card h1 { margin: 0; font-size: clamp(1.5rem, 5vw, 2.2rem); font-weight: 900; }

        /* شبكة التقارير */
        .reports-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .report-item { background: white; padding: 20px; border-radius: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .report-item span { font-size: 0.9rem; color: #7f8c8d; display: block; }
        .report-item strong { font-size: 1.2rem; color: var(--success); display: block; margin-top: 8px; }

        /* بطاقة الطلبية - تصميم متجاوب */
        .order-card { 
            background: white; 
            border-radius: 25px; 
            padding: 20px; 
            margin-bottom: 20px; 
            border-right: 12px solid var(--order-purple); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
        }
        .order-card:hover { transform: scale(1.01); }

        .order-header { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .cust-name { font-size: 1.4rem; font-weight: 900; color: #1e3c72; display: block; }
        
        .phone-display { 
            font-size: 1.8rem; 
            font-weight: 900; 
            color: #2c3e50; 
            display: block; 
            margin: 15px 0; 
            background: #f8f9fa; 
            border: 2px solid #e9ecef; 
            padding: 12px; 
            border-radius: 20px; 
            text-align: center; 
            letter-spacing: 2px;
        }

        .geo-info { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .badge-geo { padding: 8px 16px; border-radius: 12px; font-size: 0.9rem; font-weight: 700; display: flex; align-items: center; gap: 5px; }

        .product-box { background: #f4f0ff; padding: 15px; border-radius: 20px; border: 1px dashed var(--order-purple); margin-bottom: 20px; }
        .product-box small { color: #6c5ce7; font-weight: bold; }
        .product-box div { font-size: 1.1rem; font-weight: 700; margin-top: 5px; }

        /* أزرار الإجراءات */
        .order-actions { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); 
            gap: 10px; 
        }

        .btn-action { 
            padding: 14px; 
            border-radius: 15px; 
            border: none; 
            font-weight: 900; 
            cursor: pointer; 
            text-decoration: none; 
            text-align: center; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            transition: 0.3s;
            font-size: 0.95rem;
        }

        .btn-call { background: #27ae60; color: white; box-shadow: 0 4px 10px rgba(39,174,96,0.3); }
        .btn-wa { background: #25d366; color: white; box-shadow: 0 4px 10px rgba(37,211,102,0.3); }
        .btn-copy { background: #3498db; color: white; }
        .btn-del { background: #fff0f0; color: #ff4757; max-width: 60px; }

        /* تحسينات للشاشات الصغيرة */
        @media (max-width: 500px) {
            .order-actions { grid-template-columns: 1fr 1fr; }
            .btn-del { grid-column: span 2; max-width: 100%; }
            .phone-display { font-size: 1.5rem; }
        }

        .hidden { display: none; }
        .btn-main { width: 100%; padding: 18px; border-radius: 20px; border: none; font-weight: 900; font-size: 1.1rem; cursor: pointer; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="store-name-card">
        <h1 id="displayStoreName">...</h1>
    </div>

    <div class="reports-grid">
        <div class="report-item"><span>اليوم</span><strong id="daySales">0 دج</strong></div>
        <div class="report-item"><span>الأسبوع</span><strong id="weekSales">0 دج</strong></div>
        <div class="report-item"><span>الشهر</span><strong id="monthSales">0 دج</strong></div>
    </div>

    <button class="btn-main" style="background:var(--order-purple); color:white; box-shadow: 0 6px 15px rgba(108, 92, 231, 0.3);" onclick="toggleSection('ordersBox')">
        <i class="fas fa-inbox"></i> الطلبيات الواردة
    </button>

    <div id="ordersBox" class="hidden">
        <div id="ordersList"></div>
    </div>

    <button class="btn-main" style="background:var(--success); color:white;" onclick="toggleSection('productFormBox')">
        <i class="fas fa-plus-circle"></i> إضافة منتج جديد
    </button>
    <div id="productFormBox" class="hidden" style="background:white; padding:20px; border-radius:25px; margin-bottom:20px;">
        <input type="text" id="pName" placeholder="اسم المنتج" style="width:100%; padding:15px; margin-bottom:10px; border-radius:15px; border:1px solid #ddd;">
        <input type="number" id="pPrice" placeholder="السعر دج" style="width:100%; padding:15px; margin-bottom:10px; border-radius:15px; border:1px solid #ddd;">
        <button class="btn-main" style="background:var(--order-purple); color:white;" onclick="handleSaveProduct()">نشر المنتج</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storeId = localStorage.getItem('myStoreId');

    onValue(ref(db, `stores/${storeId}/orders`), (snap) => {
        const list = document.getElementById('ordersList'); 
        list.innerHTML = "";
        let totals = { day: 0, week: 0, month: 0 };
        const now = new Date();

        if(snap.exists()){
            Object.entries(snap.val()).reverse().forEach(([key, o]) => {
                const price = parseFloat(o.productPrice) || 0;
                const date = new Date(o.timestamp || Date.now());

                if(date.toDateString() === now.toDateString()) totals.day += price;
                if((now - date) / (1000 * 60 * 60 * 24) <= 7) totals.week += price;
                if(date.getMonth() === now.getMonth()) totals.month += price;

                // تنظيف رقم الهاتف للواتساب (حذف المسافات)
                const cleanPhone = o.customerPhone.replace(/\s/g, '');

                list.innerHTML += `
                <div class="order-card">
                    <div class="order-header">
                        <span class="cust-name"><i class="fas fa-user-tie"></i> ${o.customerName}</span>
                        <span style="color:#95a5a6; font-size:0.8rem; font-weight:bold;">${o.date || ''}</span>
                    </div>

                    <span class="phone-display">${o.customerPhone}</span>

                    <div class="geo-info">
                        <span class="badge-geo" style="background:#fff3cd; color:#856404;"><i class="fas fa-map-marker-alt"></i> ${o.customerState}</span>
                        <span class="badge-geo" style="background:#e1f5fe; color:#01579b;"><i class="fas fa-city"></i> ${o.customerCity}</span>
                    </div>

                    <div class="product-box">
                        <small>الطلب المختار:</small>
                        <div>${o.productName} - <span style="color:var(--success)">${o.productPrice} دج</span></div>
                    </div>

                    <div class="order-actions">
                        <a href="tel:${cleanPhone}" class="btn-action btn-call"><i class="fas fa-phone"></i> إتصال</a>
                        <a href="https://wa.me/${cleanPhone.startsWith('0') ? '213' + cleanPhone.substring(1) : cleanPhone}" target="_blank" class="btn-action btn-wa"><i class="fab fa-whatsapp"></i> واتساب</a>
                        <button onclick="copyToClipboard('${o.customerPhone}')" class="btn-action btn-copy">نسخ</button>
                        <button onclick="deleteOrder('${key}')" class="btn-action btn-del"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
            });
        }
        document.getElementById('daySales').innerText = totals.day + " دج";
        document.getElementById('weekSales').innerText = totals.week + " دج";
        document.getElementById('monthSales').innerText = totals.month + " دج";
    });

    window.toggleSection = (id) => document.getElementById(id).classList.toggle('hidden');
    window.copyToClipboard = (n) => { navigator.clipboard.writeText(n); alert("تم نسخ الرقم!"); };
    window.deleteOrder = (k) => { if(confirm("حذف الطلبية؟")) remove(ref(db, `stores/${storeId}/orders/${k}`)); };
</script>
</body>
</html>
