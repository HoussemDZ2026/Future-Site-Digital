<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --blue-grad: linear-gradient(135deg, #1e3799 0%, #0984e3 100%);
            --green-grad: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            --danger-grad: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            --cloud-grad: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            --timer-bg: #1a1a2e;
            --accent-neon: #00f2fe;
            --dark: #2d3436;
        }

        body { font-family: 'Cairo', sans-serif; background-color: #f0f2f5; margin: 0; padding: 10px; padding-bottom: 50px; }
        .container { max-width: 500px; margin: auto; display: none; }
        
        /* Loader Fix */
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #1e3799; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .top-header { background: var(--blue-grad); color: white; border-radius: 20px; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .timer-section { background: var(--timer-bg); border-radius: 25px; padding: 15px; margin-bottom: 20px; text-align: center; border: 2px solid var(--accent-neon); box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }
        .timer-grid { display: flex; justify-content: center; gap: 10px; }
        .timer-box { background: rgba(255,255,255,0.05); padding: 8px; border-radius: 12px; min-width: 55px; border-bottom: 3px solid var(--accent-neon); }
        .timer-num { display: block; font-size: 1.2rem; font-weight: 900; color: #fff; }
        .timer-label { display: block; font-size: 0.6rem; color: #aaa; }

        .cloud-card { background: var(--cloud-grad); color: white; padding: 18px; border-radius: 20px; text-align: center; margin-bottom: 12px; cursor: pointer; border: none; width: 100%; box-shadow: 0 8px 15px rgba(58, 123, 213, 0.3); }
        .whatsapp-admin { background: var(--green-grad); color: white; padding: 15px; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 12px; text-decoration: none; font-weight: 900; margin-bottom: 15px; }
        
        .url-box { background: white; padding: 15px; border-radius: 20px; border: 2px dashed #6c5ce7; text-align: center; margin-bottom: 20px; }
        .main-action { width: 100%; padding: 16px; border-radius: 18px; border: none; font-weight: 900; color: white; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1rem; }
        .btn-orders { background: var(--dark); }
        .btn-add { background: var(--blue-grad); }
        .btn-manage { background: #57606f; }

        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 380px; background: white; padding: 30px; border-radius: 35px; z-index: 2000; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.3); transition: 0.3s; }
        .modal.active { display: block; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 1000; }
        .hidden { display: none; }
        
        .order-card { background: white; border-radius: 20px; padding: 15px; margin-bottom: 15px; border-right: 5px solid #0984e3; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .prod-item { background: white; padding: 12px; border-radius: 18px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; border: 1px solid #eee; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #ddd; font-family: 'Cairo'; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="loadingOverlay"><div class="loader"></div><p>جاري تحميل متجرك...</p></div>

<div class="container" id="mainContainer">
    <div class="top-header">
        <div style="font-weight: 900;"><i class="fas fa-magic"></i> <span id="storeNameDisp">...</span></div>
        <button onclick="logout()" style="background:rgba(255,255,255,0.2); border:1px solid white; color:white; padding:4px 12px; border-radius:8px; cursor:pointer;">خروج</button>
    </div>

    <div class="timer-section">
        <span style="color:var(--accent-neon); font-size:0.8rem; font-weight:900;">⏳ صلاحية الرابط تنتهي بعد:</span>
        <div class="timer-grid">
            <div class="timer-box"><span class="timer-num" id="days">00</span><span class="timer-label">يوم</span></div>
            <div class="timer-box"><span class="timer-num" id="hours">00</span><span class="timer-label">ساعة</span></div>
            <div class="timer-box"><span class="timer-num" id="minutes">00</span><span class="timer-label">دقيقة</span></div>
            <div class="timer-box"><span class="timer-num" id="seconds">00</span><span class="timer-label">ثانية</span></div>
        </div>
    </div>

    <button class="cloud-card" onclick="openConfirmModal('installModal')">
        <i class="fas fa-cloud-download-alt"></i><b> تثبيت التطبيق واستقبال الإشعارات 🔔</b>
    </button>

    <a href="https://wa.me/213561150865" class="whatsapp-admin">
        <i class="fab fa-whatsapp"></i> التواصل مع الإدارة (دعم فني)
    </a>

    <div class="url-box">
        <div id="storeUrlDisp" style="color:#6c5ce7; font-weight:bold; margin-bottom:10px; font-size: 0.8rem; word-break: break-all;">...</div>
        <button onclick="copyLink()" style="background:#6c5ce7; color:white; border:none; padding:10px; border-radius:12px; font-weight:900; cursor:pointer; width: 100%;">نسخ الرابط</button>
    </div>

    <button class="main-action btn-orders" onclick="toggleSec('ordersSection')"><i class="fas fa-shopping-basket"></i> الطلبيات الواردة</button>
    <div id="ordersSection" class="hidden"><div id="ordersList" style="padding:10px"></div></div>

    <button class="main-action btn-add" onclick="openAddModal()"><i class="fas fa-plus-circle"></i> إضافة منتج جديد</button>

    <button class="main-action btn-manage" onclick="toggleSec('manageSection')"><i class="fas fa-tasks"></i> إدارة المنتجات</button>
    <div id="manageSection" class="hidden"><div id="productsList"></div></div>
</div>

<div id="installModal" class="modal">
    <div class="modal-title">تثبيت التطبيق؟</div>
    <p>لتلقي إشعارات الطلبيات فوراً على هاتفك.</p>
    <button class="main-action btn-add" onclick="executeInstall()">نعم، تثبيت</button>
    <button class="main-action" style="background:#eee; color:#333" onclick="closeModals()">إلغاء</button>
</div>

<div id="productModal" class="modal">
    <h3 id="modalTitle">بيانات المنتج</h3>
    <input type="hidden" id="editKey">
    <input type="text" id="pName" placeholder="اسم المنتج">
    <input type="number" id="pPrice" placeholder="السعر">
    <textarea id="pDesc" rows="3" placeholder="الوصف"></textarea>
    <input type="file" id="pImage" accept="image/*">
    <button class="main-action btn-add" id="saveProductBtn">حفظ المعلومات</button>
    <button class="main-action" style="background:#eee; color:#333" onclick="closeModals()">إلغاء</button>
</div>

<div class="overlay" id="overlay" onclick="closeModals()"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storeId = localStorage.getItem('myStoreId');

    if (!storeId) { window.location.href = 'index.html'; }

    // جلب بيانات المتجر وإيقاف الـ Loader
    onValue(ref(db, `stores/${storeId}`), (snap) => {
        document.getElementById('loadingOverlay').style.display = 'none';
        if (snap.exists()) {
            const data = snap.val();
            document.getElementById('mainContainer').style.display = 'block';
            document.getElementById('storeNameDisp').innerText = data.name;
            document.getElementById('storeUrlDisp').innerText = window.location.origin + "/store.html?id=" + storeId;
            
            renderProducts(data.products);
            renderOrders(data.orders);
        }
    });

    function renderProducts(products) {
        const list = document.getElementById('productsList'); list.innerHTML = "";
        if(products) {
            Object.entries(products).forEach(([id, p]) => {
                list.innerHTML += `<div class="prod-item">
                    <img src="${p.image || ''}" style="width:55px; height:55px; border-radius:10px; object-fit:cover;">
                    <div style="flex:1"><h4>${p.name}</h4><span style="color:green; font-weight:bold">${p.price} دج</span></div>
                    <button onclick="editProduct('${id}','${p.name}','${p.price}','${p.description}')" style="background:#f39c12; color:white; border:none; padding:8px; border-radius:10px;"><i class="fas fa-edit"></i></button>
                    <button onclick="askDelete('${id}', 'prod')" style="background:#e74c3c; color:white; border:none; padding:8px; border-radius:10px;"><i class="fas fa-trash"></i></button>
                </div>`;
            });
        }
    }

    function renderOrders(orders) {
        const list = document.getElementById('ordersList'); list.innerHTML = "";
        if(orders) {
            Object.entries(orders).forEach(([id, o]) => {
                list.innerHTML += `<div class="order-card">
                    <span style="font-size:0.7rem; color:#999;">${o.date || 'اليوم'}</span><br>
                    <b>المنتج: ${o.productName}</b><br>
                    <b>الزبون: ${o.customerName}</b><br>
                    <b>العنوان: ${o.wilaya}</b><br>
                    <div style="background:#f8f9fa; padding:10px; border-radius:12px; margin:10px 0; text-align:center; font-weight:900; font-size:1.2rem;">${o.phone}</div>
                    <a href="tel:${o.phone}" style="background:var(--green-grad); color:white; text-decoration:none; border-radius:15px; display:flex; align-items:center; justify-content:center; height:50px; font-weight:900;">إتصال بالزبون</a>
                    <button onclick="askDelete('${id}', 'order')" style="width:100%; margin-top:10px; border:none; background:none; color:red; cursor:pointer;">حذف الطلبية</button>
                </div>`;
            });
        } else { list.innerHTML = "<p style='text-align:center; color:#999'>لا توجد طلبيات</p>"; }
    }

    window.saveProductBtn.onclick = async () => {
        const k = document.getElementById('editKey').value, n = document.getElementById('pName').value, p = document.getElementById('pPrice').value, d = document.getElementById('pDesc').value, f = document.getElementById('pImage').files[0];
        if(!n || !p) return alert("املاً البيانات");
        
        let imgUrl = "";
        if(f){
            const fd = new FormData(); fd.append("image", f);
            const res = await fetch("https://api.imgbb.com/1/upload?key=e48055a00c4440331de482c9a7b18e01", {method:"POST", body:fd});
            const j = await res.json(); imgUrl = j.data.url;
        }
        const prodData = { name: n, price: p, description: d }; if(imgUrl) prodData.image = imgUrl;
        const op = k ? update(ref(db, `stores/${storeId}/products/${k}`), prodData) : push(ref(db, `stores/${storeId}/products`), prodData);
        op.then(() => { closeModals(); alert("تم حفظ المنتج بنجاح!"); });
    };

    window.askDelete = (id, type) => {
        if(confirm("هل أنت متأكد من الحذف؟")){
            const path = type === 'prod' ? `stores/${storeId}/products/${id}` : `stores/${storeId}/orders/${id}`;
            remove(ref(db, path)).then(() => alert("تم الحذف بنجاح"));
        }
    };

    window.copyLink = () => { navigator.clipboard.writeText(document.getElementById('storeUrlDisp').innerText); alert("تم نسخ رابط المتجر ✅"); };
    window.toggleSec = (id) => document.getElementById(id).classList.toggle('hidden');
    window.openConfirmModal = (id) => { document.getElementById('overlay').style.display='block'; document.getElementById(id).classList.add('active'); };
    window.closeModals = () => { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); document.getElementById('overlay').style.display='none'; };
    window.logout = () => { localStorage.removeItem('myStoreId'); window.location.href = 'index.html'; };
    window.openAddModal = () => { document.getElementById('modalTitle').innerText = "إضافة منتج"; document.getElementById('editKey').value = ""; openConfirmModal('productModal'); };
    window.editProduct = (id, name, price, desc) => {
        document.getElementById('modalTitle').innerText = "تعديل المنتج";
        document.getElementById('editKey').value = id; document.getElementById('pName').value = name;
        document.getElementById('pPrice').value = price; document.getElementById('pDesc').value = desc;
        openConfirmModal('productModal');
    };

    // Countdown Logic (30 March 2026)
    const target = new Date("2026-03-30T00:00:00").getTime();
    setInterval(() => {
        const now = new Date().getTime(); const diff = target - now;
        document.getElementById('days').innerText = Math.floor(diff / 86400000).toString().padStart(2,'0');
        document.getElementById('hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2,'0');
        document.getElementById('minutes').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2,'0');
        document.getElementById('seconds').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2,'0');
    }, 1000);
</script>
</body>
    </html>
