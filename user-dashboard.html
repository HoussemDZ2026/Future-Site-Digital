<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية المذهلة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --brand-gradient: linear-gradient(45deg, #ff00cc, #3333ff);
            --gold-gradient: linear-gradient(135deg, #f1c40f, #f39c12);
            --link-bg: #eef2f7;
            --success: #27ae60;
            --danger: #e74c3c;
            --primary: #2c3e50;
        }

        body { font-family: 'Cairo', sans-serif; background: #f4f7f6; margin: 0; padding-bottom: 50px; }
        .container { max-width: 700px; margin: auto; padding: 15px; }

        /* مستطيل اسم المتجر المميز */
        .store-header-box { 
            background: var(--brand-gradient); 
            padding: 40px 20px; 
            border-radius: 0 0 40px 40px; 
            text-align: center; 
            color: white; 
            box-shadow: 0 15px 35px rgba(51, 51, 255, 0.2); 
            margin-bottom: 25px;
        }
        .store-header-box h1 { margin: 0; font-size: 2.2rem; font-weight: 900; text-shadow: 2px 2px 10px rgba(0,0,0,0.2); }

        /* مستطيل الرابط الجذاب */
        .url-box { 
            background: white; 
            padding: 15px; 
            border-radius: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border: 2px solid #3333ff; 
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .url-box span { color: #3333ff; font-weight: bold; font-size: 0.85rem; word-break: break-all; }

        /* زر الإدارة الأصفر المثير */
        .admin-btn { 
            background: var(--gold-gradient); 
            color: #000; 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px; 
            padding: 20px; 
            border-radius: 25px; 
            font-weight: 900; 
            font-size: 1.1rem;
            margin: 20px 0; 
            box-shadow: 0 10px 20px rgba(243, 156, 18, 0.4); 
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }
        .admin-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(243, 156, 18, 0.5); }

        /* الإحصائيات */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 15px 5px; border-radius: 20px; text-align: center; border: 1px solid #eee; }
        .stat-card strong { font-size: 1.4rem; color: var(--primary); display: block; }
        .reset-btn { background: #fdf0f0; border: none; color: var(--danger); font-size: 0.7rem; padding: 5px 10px; border-radius: 8px; cursor: pointer; margin-top: 5px; }

        /* بطاقات الطلبيات والمنتجات */
        .card { background: white; border-radius: 25px; padding: 20px; margin-bottom: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); }
        .phone-display { background: #f8f9fa; display: block; text-align: center; padding: 10px; border-radius: 15px; font-size: 1.6rem; font-weight: 900; margin: 10px 0; border: 1px solid #eee; }
        
        .btn-group { display: flex; gap: 8px; margin-top: 15px; }
        .btn-main { flex: 1; padding: 12px; border-radius: 15px; border: none; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; text-decoration: none; }
        .btn-edit { background: #eef2f7; color: var(--primary); }
        .btn-delete { background: #fee; color: var(--danger); }
        .btn-call { background: var(--success); color: white; }

        /* فورم الإضافة والتعديل */
        .modal { background: white; padding: 20px; border-radius: 25px; margin-bottom: 20px; border: 2px solid var(--gold-gradient); }
        input, select { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #ddd; font-family: 'Cairo'; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="store-header-box">
    <h1 id="storeName">جاري التحميل...</h1>
</div>

<div class="container">
    <div class="url-box">
        <span id="storeUrl">رابط المتجر يظهر هنا</span>
        <button onclick="copyUrl()" style="background:none; border:none; color:#3333ff; cursor:pointer;"><i class="far fa-copy"></i></button>
    </div>

    <a href="https://wa.me/213561150865" class="admin-btn">
        <i class="fab fa-whatsapp"></i> تواصل مع الإدارة (Future Site)
    </a>

    <div class="stats">
        <div class="stat-card"><span>اليوم</span><strong id="dayVal">0</strong><button class="reset-btn" onclick="resetStat('day')">تصفير</button></div>
        <div class="stat-card"><span>الأسبوع</span><strong id="weekVal">0</strong><button class="reset-btn" onclick="resetStat('week')">تصفير</button></div>
        <div class="stat-card"><span>الشهر</span><strong id="monthVal">0</strong><button class="reset-btn" onclick="resetStat('month')">تصفير</button></div>
    </div>

    <button class="admin-btn" style="background: var(--primary); color:white;" onclick="toggleSection('ordersBox')">📋 عرض الطلبيات الواردة</button>
    <div id="ordersBox" class="hidden"></div>

    <button class="admin-btn" style="background: var(--success); color:white;" onclick="openAddModal()">➕ إضافة منتج جديد</button>
    
    <div id="productForm" class="modal hidden">
        <h3 id="formTitle">إضافة منتج</h3>
        <input type="text" id="pTitle" placeholder="اسم المنتج">
        <input type="number" id="pPrice" placeholder="السعر">
        <input type="file" id="pImg" accept="image/*">
        
        <label style="display:block; margin:10px 0;"><input type="checkbox" id="timerOn" onchange="document.getElementById('timerDate').classList.toggle('hidden')"> تفعيل عداد زمني؟</label>
        <input type="datetime-local" id="timerDate" class="hidden">
        
        <button id="saveBtn" class="btn-main" style="background:var(--success); color:white; width:100%;">حفظ المنتج</button>
        <button onclick="closeModal()" class="btn-main" style="background:#eee; width:100%; margin-top:5px;">إلغاء</button>
    </div>

    <h3 style="margin-top:30px;">📦 إدارة منتجاتك:</h3>
    <div id="productsList"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove, update, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);
    const storeId = localStorage.getItem('myStoreId');
    let editKey = null;

    // جلب البيانات الأساسية
    onValue(ref(db, `stores/${storeId}`), (s) => {
        if(s.exists()){
            document.getElementById('storeName').innerText = s.val().name;
            document.getElementById('storeUrl').innerText = window.location.origin + "/store.html?id=" + storeId;
        }
    });

    // جلب المنتجات مع زر التعديل
    onValue(ref(db, `stores/${storeId}/products`), (snap) => {
        const list = document.getElementById('productsList'); list.innerHTML = "";
        if(snap.exists()){
            Object.entries(snap.val()).forEach(([key, p]) => {
                list.innerHTML += `
                <div class="card" style="display:flex; align-items:center; gap:15px;">
                    <img src="${p.image}" style="width:60px; height:60px; border-radius:15px; object-fit:cover;">
                    <div style="flex:1">
                        <strong>${p.name}</strong><br>
                        <span style="color:var(--success)">${p.price}</span>
                    </div>
                    <div style="display:flex; gap:5px;">
                        <button onclick="openEditModal('${key}', '${p.name}', '${p.price}')" style="border:none; background:#eef2f7; padding:8px; border-radius:10px;"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteProduct('${key}')" style="border:none; background:#fee; color:red; padding:8px; border-radius:10px;"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
            });
        }
    });

    // جلب الطلبيات
    onValue(ref(db, `stores/${storeId}/orders`), (snap) => {
        const box = document.getElementById('ordersBox'); box.innerHTML = "";
        let sums = {day:0, week:0, month:0};
        const now = new Date();
        if(snap.exists()){
            Object.entries(snap.val()).reverse().forEach(([key, o]) => {
                const p = parseFloat(o.productPrice) || 0;
                const d = new Date(o.timestamp);
                if(d.toDateString() === now.toDateString()) sums.day += p;
                box.innerHTML += `
                <div class="card">
                    <strong>${o.customerName}</strong>
                    <span class="phone-display">${o.customerPhone}</span>
                    <div style="font-size:0.8rem; color:#666;">📍 ${o.customerState} | 📦 ${o.productName}</div>
                    <div class="btn-group">
                        <a href="tel:${o.customerPhone}" class="btn-main btn-call"><i class="fas fa-phone"></i> إتصال</a>
                        <button onclick="deleteOrder('${key}')" class="btn-main btn-delete">حذف</button>
                    </div>
                </div>`;
            });
        }
        document.getElementById('dayVal').innerText = sums.day;
    });

    // وظائف المودال (إضافة/تعديل)
    window.openAddModal = () => { editKey = null; document.getElementById('productForm').classList.remove('hidden'); document.getElementById('formTitle').innerText="إضافة منتج"; };
    window.openEditModal = (key, name, price) => { 
        editKey = key; 
        document.getElementById('pTitle').value = name; 
        document.getElementById('pPrice').value = price;
        document.getElementById('productForm').classList.remove('hidden'); 
        document.getElementById('formTitle').innerText="تعديل المنتج";
    };
    window.closeModal = () => document.getElementById('productForm').classList.add('hidden');

    window.deleteProduct = (k) => { if(confirm("حذف المنتج؟")) remove(ref(db, `stores/${storeId}/products/${k}`)); };
    window.deleteOrder = (k) => { if(confirm("حذف الطلب؟")) remove(ref(db, `stores/${storeId}/orders/${k}`)); };
    window.copyUrl = () => { navigator.clipboard.writeText(document.getElementById('storeUrl').innerText); alert("تم نسخ الرابط"); };

    document.getElementById('saveBtn').onclick = async () => {
        const name = document.getElementById('pTitle').value;
        const price = document.getElementById('pPrice').value;
        const file = document.getElementById('pImg').files[0];
        
        let data = { name, price };
        if(file){
            const snap = await uploadBytes(sRef(storage, `p/${Date.now()}`), file);
            data.image = await getDownloadURL(snap.ref);
        }

        if(editKey) await update(ref(db, `stores/${storeId}/products/${editKey}`), data);
        else await push(ref(db, `stores/${storeId}/products`), {...data, timestamp: Date.now()});
        
        alert("تم الحفظ!"); closeModal();
    };

    window.toggleSection = (id) => document.getElementById(id).classList.toggle('hidden');
</script>
</body>
        </html>
