<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --blue-grad: linear-gradient(135deg, #1e3799 0%, #0984e3 100%);
            --time-bg: #1e272e;
            --success: #2ecc71;
            --danger: #e74c3c;
            --accent: #00f2fe;
            --url-color: #6c5ce7;
        }

        body { font-family: 'Cairo', sans-serif; background-color: #f1f2f6; margin: 0; padding: 15px; padding-bottom: 50px; }
        .container { max-width: 600px; margin: auto; }

        /* الكروت */
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .card-name { background: var(--blue-grad); color: white; text-align: center; border: none; position: relative; }
        #notifStatus { position: absolute; left: 15px; top: 15px; font-size: 1.2rem; cursor: pointer; }

        /* رابط المتجر */
        .card-url { border: 2px solid var(--url-color); text-align: center; }
        .url-box { background: #f3f0ff; padding: 12px; border-radius: 12px; font-weight: 900; color: var(--url-color); margin-top: 8px; border: 1px dashed var(--url-color); word-break: break-all; }
        .copy-btn { margin-top: 10px; background: var(--url-color); color: white; border: none; padding: 10px 25px; border-radius: 50px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }

        /* الأزرار العامة */
        .action-btn { width: 100%; padding: 18px; border-radius: 20px; border: none; font-weight: 900; color: white; cursor: pointer; margin-bottom: 12px; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; transition: 0.3s; }
        .action-btn:active { transform: scale(0.98); }

        /* كرت الطلبية */
        .order-card { background: white; border-radius: 25px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid #eee; }
        .order-date { background: #f8f9fa; padding: 10px; text-align: center; font-size: 0.8rem; color: #666; }
        .order-body { padding: 20px; }
        .customer-name { font-size: 1.4rem; font-weight: 900; color: #2d3436; display: block; }
        .phone-display { background: #2d3436; color: var(--accent); font-size: 1.8rem; font-weight: 900; text-align: center; padding: 10px; border-radius: 15px; display: block; text-decoration: none; margin: 15px 0; border: 2px solid var(--accent); }

        /* النوافذ المنبثقة (Modals) */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 400px; background: white; padding: 25px; border-radius: 30px; z-index: 2000; box-shadow: 0 20px 60px rgba(0,0,0,0.4); animation: pop 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        @keyframes pop { from { transform: translate(-50%, -60%) scale(0.8); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 1000; }
        
        .success-icon { width: 60px; height: 60px; background: #dcfce7; color: #16a34a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 15px; }

        input, textarea { width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #ddd; font-family: 'Cairo'; box-sizing: border-box; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="card card-name">
        <i class="fas fa-bell-slash" id="notifStatus" onclick="requestNotif()"></i>
        <h1 id="storeName" style="margin:0">جاري التحميل...</h1>
    </div>

    <div class="card card-url">
        <h4 style="margin:0; color:var(--url-color);"><i class="fas fa-link"></i> رابط المتجر</h4>
        <div class="url-box" id="storeUrl">...</div>
        <button class="copy-btn" onclick="copyLink()"><i class="fas fa-copy"></i> نسخ الرابط</button>
    </div>

    <h3 style="text-align:center; color:var(--danger); font-weight:900;">📊 تقارير المبيعات</h3>
    <div class="report-grid" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px;">
        <div class="r-box" style="background:white; padding:10px; border-radius:15px; text-align:center; border-bottom:4px solid var(--danger);">
            <small>اليوم</small><span class="r-val" id="sToday" style="display:block; font-size:1.5rem; font-weight:900; color:var(--danger);">0</span>
        </div>
        <div class="r-box" style="background:white; padding:10px; border-radius:15px; text-align:center; border-bottom:4px solid var(--danger);">
            <small>الأسبوع</small><span class="r-val" id="sWeek" style="display:block; font-size:1.5rem; font-weight:900; color:var(--danger);">0</span>
        </div>
        <div class="r-box" style="background:white; padding:10px; border-radius:15px; text-align:center; border-bottom:4px solid var(--danger);">
            <small>الشهر</small><span class="r-val" id="sMonth" style="display:block; font-size:1.5rem; font-weight:900; color:var(--danger);">0</span>
        </div>
    </div>

    <button class="action-btn" style="background:var(--url-color);" onclick="toggleSection('ordersSection')"><i class="fas fa-shopping-basket"></i> الطلبيات الواردة</button>
    <div id="ordersSection" class="hidden"><div id="ordersList"></div></div>

    <button class="action-btn" style="background:var(--success);" onclick="openAddModal()"><i class="fas fa-plus-circle"></i> إضافة منتج جديد</button>

    <button class="action-btn" style="background:var(--blue-grad);" onclick="toggleSection('manageSection')"><i class="fas fa-edit"></i> إدارة المنتجات</button>
    <div id="manageSection" class="hidden"><div id="productsList" style="background:white; border-radius:20px; padding:10px;"></div></div>
</div>

<div id="copyModal" class="modal">
    <div class="success-icon"><i class="fas fa-check-circle"></i></div>
    <h2 style="text-align:center; margin:0; color:#16a34a;">تم النسخ!</h2>
    <p style="text-align:center; color:#666; margin:10px 0 20px;">رابط متجرك جاهز الآن للمشاركة مع زبائنك.</p>
    <button onclick="closeModal('copyModal')" style="width:100%; background:#16a34a; color:white; border:none; padding:12px; border-radius:15px; font-weight:900; cursor:pointer;">رائع ✅</button>
</div>

<div id="productModal" class="modal">
    <h3 id="modalTitle" style="text-align:center;">إضافة منتج</h3>
    <input type="hidden" id="editKey">
    <input type="text" id="pName" placeholder="اسم المنتج">
    <input type="number" id="pPrice" placeholder="السعر (دج)">
    <textarea id="pDesc" rows="3" placeholder="وصف المنتج..."></textarea>
    <input type="file" id="pImage" accept="image/*">
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <button id="saveBtn" style="background:var(--success); color:white; border:none; padding:12px; border-radius:15px; font-weight:900;">حفظ</button>
        <button onclick="closeModal('productModal')" style="background:#eee; border:none; border-radius:15px;">إلغاء</button>
    </div>
</div>

<div id="overlay" class="overlay" onclick="closeAllModals()"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storeId = localStorage.getItem('myStoreId');

    if (storeId) {
        // جلب بيانات المتجر
        onValue(ref(db, `stores/${storeId}`), s => {
            if(s.exists()){
                const d = s.val();
                document.getElementById('storeName').innerText = d.name;
                document.getElementById('storeUrl').innerText = "future-site.com/" + storeId;
                document.getElementById('sToday').innerText = d.sales?.today || 0;
                document.getElementById('sWeek').innerText = d.sales?.week || 0;
                document.getElementById('sMonth').innerText = d.sales?.month || 0;
            }
        });

        // عرض الطلبيات (مع أزرار الاتصال والحذف)
        onValue(ref(db, `stores/${storeId}/orders`), snap => {
            const list = document.getElementById('ordersList'); list.innerHTML = "";
            if(snap.exists()) Object.entries(snap.val()).reverse().forEach(([id, o]) => {
                list.innerHTML += `
                <div class="order-card">
                    <div class="order-date">🗓️ ${o.date || 'طلب جديد'}</div>
                    <div class="order-body">
                        <small style="color:var(--url-color); font-weight:bold;">📦 المنتج: ${o.productName}</small>
                        <span class="customer-name">👤 ${o.customerName}</span>
                        <a href="tel:${o.customerPhone}" class="phone-display">${o.customerPhone}</a>
                        <div style="display:grid; grid-template-columns: 3fr 1fr; gap:10px;">
                            <a href="tel:${o.customerPhone}" style="background:var(--success); color:white; text-decoration:none; padding:15px; border-radius:15px; text-align:center; font-weight:900;"><i class="fas fa-phone"></i> إتصال الآن</a>
                            <button onclick="deleteItem('orders/${id}')" style="background:var(--danger); color:white; border:none; border-radius:15px; cursor:pointer;"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>`;
            });
        });

        // عرض المنتجات (إدارة المنتجات)
        onValue(ref(db, `stores/${storeId}/products`), snap => {
            const list = document.getElementById('productsList'); list.innerHTML = "";
            if(snap.exists()) Object.entries(snap.val()).forEach(([id, p]) => {
                list.innerHTML += `
                <div style="display:flex; align-items:center; gap:10px; padding:10px; border-bottom:1px solid #eee;">
                    <img src="${p.image}" width="50" height="50" style="border-radius:10px; object-fit:cover;">
                    <div style="flex:1;"><b>${p.name}</b><br><small>${p.price} دج</small></div>
                    <button onclick="editP('${id}','${p.name}','${p.price}','${p.description}')" style="background:#f39c12; color:white; border:none; padding:8px; border-radius:8px;"><i class="fas fa-pen"></i></button>
                    <button onclick="deleteItem('products/${id}')" style="background:red; color:white; border:none; padding:8px; border-radius:8px;"><i class="fas fa-trash"></i></button>
                </div>`;
            });
        });
    }

    // وظيفة نسخ الرابط
    window.copyLink = () => {
        const text = document.getElementById('storeUrl').innerText;
        navigator.clipboard.writeText(text).then(() => {
            document.getElementById('copyModal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        });
    };

    // وظائف التحكم بالنوافذ
    window.closeModal = (id) => { document.getElementById(id).style.display = 'none'; document.getElementById('overlay').style.display = 'none'; };
    window.closeAllModals = () => { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); document.getElementById('overlay').style.display='none'; };
    window.toggleSection = (id) => { document.getElementById(id).classList.toggle('hidden'); };
    
    // إدارة المنتجات
    window.openAddModal = () => { 
        document.getElementById('modalTitle').innerText="إضافة منتج"; 
        document.getElementById('editKey').value=""; 
        document.getElementById('productModal').style.display='block'; 
        document.getElementById('overlay').style.display='block'; 
    };

    window.editP = (k, n, p, d) => {
        document.getElementById('modalTitle').innerText="تعديل المنتج";
        document.getElementById('editKey').value=k;
        document.getElementById('pName').value=n;
        document.getElementById('pPrice').value=p;
        document.getElementById('pDesc').value=d;
        document.getElementById('productModal').style.display='block';
        document.getElementById('overlay').style.display='block';
    };

    window.deleteItem = (path) => {
        if(confirm("هل أنت متأكد من الحذف؟")) remove(ref(db, `stores/${storeId}/${path}`));
    };

    // حفظ المنتج (إضافة أو تعديل)
    document.getElementById('saveBtn').onclick = async () => {
        const k = document.getElementById('editKey').value, n = document.getElementById('pName').value, p = document.getElementById('pPrice').value, d = document.getElementById('pDesc').value, f = document.getElementById('pImage').files[0];
        if(!n || !p) return alert("الرجاء إدخال الاسم والسعر");
        
        document.getElementById('saveBtn').disabled = true;
        document.getElementById('saveBtn').innerText = "جاري الحفظ...";
        
        let img = "";
        if(f){
            const fd = new FormData(); fd.append("image", f);
            const res = await fetch("https://api.imgbb.com/1/upload?key=e48055a00c4440331de482c9a7b18e01", {method:"POST", body:fd});
            const j = await res.json(); img = j.data.url;
        }

        const data = { name:n, price:p, description:d };
        if(img) data.image = img;

        if(k) update(ref(db, `stores/${storeId}/products/${k}`), data).then(()=>closeModal('productModal'));
        else {
            if(!img) { alert("يجب اختيار صورة للمنتج الجديد"); document.getElementById('saveBtn').disabled = false; return; }
            push(ref(db, `stores/${storeId}/products`), data).then(()=>closeModal('productModal'));
        }
        document.getElementById('saveBtn').disabled = false;
        document.getElementById('saveBtn').innerText = "حفظ";
    };

    // التنبيهات
    window.requestNotif = () => {
        Notification.requestPermission().then(p => { if(p==='granted') alert("تم تفعيل التنبيهات! 🔔"); });
    };
</script>
</body>
        </html>
