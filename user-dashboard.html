<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3799">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --blue-grad: linear-gradient(135deg, #1e3799 0%, #0984e3 100%);
            --green-grad: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            --danger-grad: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            --gold-grad: linear-gradient(135deg, #f1c40f 0%, #f39c12 100%);
            --cloud-grad: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            --accent-neon: #00f2fe;
            --dark-card: #2d3436;
        }

        body { font-family: 'Cairo', sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; padding-bottom: 60px; }
        .container { max-width: 500px; margin: auto; display: block; }

        /* شاشة القفل الذكية */
        #smartLock { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: white; z-index: 100000; display: none; 
            flex-direction: column; align-items: center; justify-content: center; 
            text-align: center; padding: 20px;
        }

        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #1e3799; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .top-header { background: var(--blue-grad); padding: 20px; border-radius: 25px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; box-shadow: 0 10px 20px rgba(30, 55, 153, 0.2); position: relative; overflow: hidden; }
        .timer-section { background: #1a1a2e; border-radius: 25px; padding: 15px; margin-bottom: 20px; text-align: center; border: 2px solid var(--accent-neon); }
        .timer-grid { display: flex; justify-content: center; gap: 8px; margin-top: 8px; }
        .timer-box { background: rgba(255,255,255,0.1); padding: 8px; border-radius: 12px; min-width: 50px; border-bottom: 3px solid var(--accent-neon); }
        .timer-num { display: block; font-size: 1.1rem; font-weight: 900; color: #fff; }
        .timer-label { display: block; font-size: 0.6rem; color: #aaa; }

        .activation-card { background: var(--gold-grad); color: #fff; padding: 20px; border-radius: 25px; text-align: center; margin-bottom: 20px; text-decoration: none; display: block; animation: pulse 2s infinite; font-weight: bold; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .main-action { width: 100%; padding: 18px; border-radius: 22px; border: none; font-weight: 900; color: white; cursor: pointer; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 1rem; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-family: 'Cairo'; }
        .btn-orders { background: var(--dark-card); }
        .btn-add { background: var(--blue-grad); }
        .btn-manage { background: #57606f; }
        
        .url-box { background: white; padding: 15px; border-radius: 25px; border: 2px dashed #6c5ce7; text-align: center; margin-bottom: 20px; }
        .hidden { display: none; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 10000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: white; padding: 30px; border-radius: 35px; text-align: center; width: 100%; max-width: 400px; border: 2px solid #fff; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        input, textarea { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 15px; border: 1px solid #ddd; font-family: 'Cairo'; box-sizing: border-box; }

        .order-card { background: white; border-radius: 30px; padding: 20px; margin-bottom: 25px; border-right: 10px solid #0984e3; box-shadow: 0 15px 35px rgba(0,0,0,0.08); position: relative; overflow: hidden; }
        .order-date { background: #f1f2f6; color: #57606f; padding: 5px 15px; border-radius: 50px; font-size: 0.75rem; font-weight: bold; display: inline-block; margin-bottom: 15px; }
        .order-title { color: #1e3799; font-size: 1.3rem; font-weight: 900; margin: 10px 0; display: block; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .info-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; color: #2d3436; }
        .info-row i { color: #0984e3; width: 20px; text-align: center; }
        .phone-badge { background: #e1f5fe; color: #0288d1; padding: 12px; border-radius: 20px; text-align: center; font-size: 1.4rem; font-weight: 900; margin: 15px 0; letter-spacing: 2px; border: 2px dashed #0288d1; }
        .btn-call { background: var(--green-grad); color: white; text-decoration: none; border-radius: 20px; display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 900; gap: 12px; font-size: 1.1rem; box-shadow: 0 8px 20px rgba(46, 204, 113, 0.4); }
        .btn-delete-order { width: 100%; margin-top: 15px; border: none; background: rgba(255, 71, 87, 0.1); color: #ff4757; padding: 10px; border-radius: 15px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="smartLock">
    <i class="fas fa-user-shield" style="font-size: 80px; color: #ff4757; margin-bottom: 20px;"></i>
    <h1 style="font-weight: 900; color: #1e3799;">تنبيه من الإدارة</h1>
    <p id="lockMessage" style="color: #636e72; font-size: 1.1rem; max-width: 300px;">عذراً، قام المدير حسام بإيقاف متجرك مؤقتاً أو انتهت مدة الصلاحية.</p>
    <a href="https://wa.me/213561150865" style="background:#25d366; color:white; padding:15px 30px; border-radius:15px; text-decoration:none; font-weight:bold; margin-top:30px; display:inline-block; box-shadow: 0 10px 20px rgba(37,211,102,0.2);">تواصل مع المدير لتفعيل الرابط</a>
</div>

<div id="loadingOverlay"><div class="loader"></div><p style="margin-top:15px; font-weight:900; color:#1e3799;">جاري فحص حالة المتجر...</p></div>

<div class="container" id="mainApp" style="display: none;">
    <div class="top-header">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div style="background: rgba(255,255,255,0.2); width: 45px; height: 45px; border-radius: 15px; display: flex; align-items: center; justify-content: center;"><i class="fas fa-store-alt" style="color: white; font-size: 1.4rem;"></i></div>
            <div><span style="display: block; font-size: 0.7rem; color: rgba(255,255,255,0.8);">لوحة تحكم</span><span id="storeNameDisp" style="display: block; font-size: 1.2rem; font-weight: 900; color: white;">متجري</span></div>
        </div>
        <button onclick="logout()" style="background: #ff4757; color: white; border: none; padding: 10px 18px; border-radius: 15px; font-weight: 900; cursor: pointer;">خروج</button>
    </div>

    <div class="timer-section">
        <span style="color:var(--accent-neon); font-size:0.8rem; font-weight:900;">⌛ متبقي على صلاحية الرابط:</span>
        <div class="timer-grid">
            <div class="timer-box"><span class="timer-num" id="days">00</span><span class="timer-label">يوم</span></div>
            <div class="timer-box"><span class="timer-num" id="hours">00</span><span class="timer-label">ساعة</span></div>
            <div class="timer-box"><span class="timer-num" id="minutes">00</span><span class="timer-label">دقيقة</span></div>
            <div class="timer-box"><span class="timer-num" id="seconds">00</span><span class="timer-label">ثانية</span></div>
        </div>
    </div>

    <div class="url-box">
        <div id="storeUrlDisp" style="font-size: 0.8rem; color: #6c5ce7; font-weight: bold; margin-bottom: 12px; word-break: break-all;">جاري التحميل...</div>
        <button onclick="handleCopy()" class="main-action" style="background: #6c5ce7; margin-bottom: 0;">نسخ رابط المتجر</button>
    </div>

    <button class="main-action btn-orders" onclick="toggleSec('ordersSection')"><i class="fas fa-shopping-basket"></i> الطلبيات الواردة</button>
    <div id="ordersSection" class="hidden"><div id="ordersList"></div></div>

    <button class="main-action btn-add" onclick="openAddModal()"><i class="fas fa-plus-circle"></i> إضافة منتج جديد</button>
    <button class="main-action btn-manage" onclick="toggleSec('manageSection')"><i class="fas fa-tasks"></i> إدارة المنتجات</button>
    <div id="manageSection" class="hidden"><div id="productsList"></div></div>
</div>

<div id="productModal" class="modal">
    <div class="modal-content">
        <h2 id="pModalTitle" style="font-weight: 900; color: #1e3799;">بيانات المنتج</h2>
        <input type="hidden" id="editKey">
        <input type="text" id="pName" placeholder="اسم المنتج">
        <input type="number" id="pPrice" placeholder="سعر المنتج">
        <textarea id="pDesc" rows="3" placeholder="وصف المنتج"></textarea>
        <input type="file" id="pImage" accept="image/*">
        <div style="display: flex; gap: 10px;">
            <button class="main-action btn-add" id="saveProductBtn" style="flex: 2; margin-bottom:0;">تأكيد</button>
            <button class="main-action" onclick="closeProductModal()" style="flex: 1; background:#eee; color:#333; margin-bottom:0;">تراجع</button>
        </div>
    </div>
</div>

<div id="customModal" class="modal">
    <div class="modal-content">
        <div id="modalIcon" style="font-size: 60px; margin-bottom: 15px;"></div>
        <h3 id="modalTitle" style="font-weight: 900;"></h3>
        <p id="modalText"></p>
        <div id="modalBtns" style="display: flex; gap: 12px;"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storeId = localStorage.getItem('myStoreId');

    let timerInterval = null;
    let lastOrderCount = -1;

    // --- محرك الذكاء الإصطناعي للمراقبة والمزامنة ---
    onValue(ref(db, `stores/${storeId}`), (snap) => {
        document.getElementById('loadingOverlay').style.display = 'none';
        
        if (snap.exists()) {
            const data = snap.val();
            const now = Date.now();
            const expiry = Number(data.expiryDate) || 0;
            const status = String(data.status || 'active').toLowerCase().trim();

            // 1. الذكاء الفوري في القفل
            if (status === "stopped" || (expiry > 0 && now > expiry)) {
                if (timerInterval) clearInterval(timerInterval);
                document.getElementById('mainApp').style.display = 'none';
                document.getElementById('smartLock').style.display = 'flex';
                return; // إيقاف كل شيء آخر
            } else {
                document.getElementById('mainApp').style.display = 'block';
                document.getElementById('smartLock').style.display = 'none';
            }

            // 2. مزامنة البيانات والوقت
            document.getElementById('storeNameDisp').innerText = data.name;
            document.getElementById('storeUrlDisp').innerText = window.location.origin + "/store.html?id=" + storeId;
            
            if (expiry > 0) startSmartTimer(expiry);

            // 3. إدارة الطلبات والمنتجات
            const orders = data.orders || {};
            if (lastOrderCount !== -1 && Object.keys(orders).length > lastOrderCount) {
                playNotifSound();
            }
            lastOrderCount = Object.keys(orders).length;
            renderOrders(orders);
            renderProducts(data.products || {});
        }
    });

    function startSmartTimer(targetTime) {
        if (timerInterval) clearInterval(timerInterval);
        
        const updateTimer = () => {
            const diff = targetTime - Date.now();
            if (diff <= 0) {
                clearInterval(timerInterval);
                location.reload(); // الذكاء في إعادة التحميل لتفعيل القفل
                return;
            }
            document.getElementById('days').innerText = Math.floor(diff/86400000).toString().padStart(2,'0');
            document.getElementById('hours').innerText = Math.floor((diff%86400000)/3600000).toString().padStart(2,'0');
            document.getElementById('minutes').innerText = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
            document.getElementById('seconds').innerText = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
        };
        updateTimer();
        timerInterval = setInterval(updateTimer, 1000);
    }

    // --- بقية وظائف كودك الأصلية للحفاظ على كل الميزات ---
    window.toggleSec = (id) => document.getElementById(id).classList.toggle('hidden');
    window.logout = () => { localStorage.clear(); location.reload(); };
    window.handleCopy = () => {
        navigator.clipboard.writeText(document.getElementById('storeUrlDisp').innerText);
        showSuccess("تم نسخ الرابط! انشره الآن 📋");
    };

    function renderOrders(orders) {
        const list = document.getElementById('ordersList'); list.innerHTML = "";
        Object.entries(orders).reverse().forEach(([id, o]) => {
            list.innerHTML += `<div class="order-card">
                <div class="order-date"><i class="far fa-clock"></i> ${o.date || ''}</div>
                <span class="order-title">${o.productName}</span>
                <div class="info-row"><i class="fas fa-user"></i><span class="info-value">${o.customerName}</span></div>
                <div class="phone-badge">${o.phone}</div>
                <a href="tel:${o.phone}" class="btn-call"><i class="fas fa-phone-alt"></i> إتصال بالزبون</a>
                <button onclick="deleteOrder('${id}')" class="btn-delete-order">حذف الطلبية</button>
            </div>`;
        });
    }

    function renderProducts(products) {
        const list = document.getElementById('productsList'); list.innerHTML = "";
        Object.entries(products).forEach(([id, p]) => {
            list.innerHTML += `<div style="background:white; margin:10px 0; padding:12px; border-radius:20px; display:flex; align-items:center; gap:12px;">
                <img src="${p.image || ''}" style="width:50px; height:50px; border-radius:10px; object-fit:cover;">
                <div style="flex:1"><b>${p.name}</b><br><small>${p.price} دج</small></div>
                <button onclick="remove(ref(db, 'stores/${storeId}/products/${id}'))" style="background:#ff4757; color:white; border:none; padding:10px; border-radius:12px;"><i class="fas fa-trash"></i></button>
            </div>`;
        });
    }

    window.deleteOrder = (id) => remove(ref(db, `stores/${storeId}/orders/${id}`));
    window.openAddModal = () => document.getElementById('productModal').style.display = 'flex';
    window.closeProductModal = () => document.getElementById('productModal').style.display = 'none';

    window.saveProductBtn.onclick = async () => {
        const n = document.getElementById('pName').value, p = document.getElementById('pPrice').value, d = document.getElementById('pDesc').value, f = document.getElementById('pImage').files[0];
        if(!n || !p) return alert("أدخل البيانات");
        let imgUrl = "";
        if(f){
            const fd = new FormData(); fd.append("image", f);
            const res = await fetch("https://api.imgbb.com/1/upload?key=e48055a00c4440331de482c9a7b18e01", {method:"POST", body:fd});
            const j = await res.json(); imgUrl = j.data.url;
        }
        push(ref(db, `stores/${storeId}/products`), { name: n, price: p, description: d, image: imgUrl });
        closeProductModal();
    };

    function playNotifSound() {
        new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play().catch(()=>{});
    }

    window.showSuccess = (msg) => {
        const m = document.getElementById('customModal');
        document.getElementById('modalIcon').innerHTML = "✅";
        document.getElementById('modalTitle').innerText = "نجاح";
        document.getElementById('modalText').innerText = msg;
        document.getElementById('modalBtns').innerHTML = `<button onclick="closeModal()" class="main-action" style="background:var(--green-grad); width:100%;">ممتاز</button>`;
        m.style.display = 'flex';
    };
    window.closeModal = () => document.getElementById('customModal').style.display = 'none';
</script>
</body>
    </html>
