<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --blue-grad: linear-gradient(135deg, #1e3799 0%, #0984e3 100%);
            --time-grad: linear-gradient(45deg, #2c3e50, #000000);
            --success: #2ecc71;
            --danger: #e74c3c;
            --url-color: #6c5ce7;
            --accent: #00f2fe;
            --neon-anim: linear-gradient(90deg, #ff0080, #7928ca, #ff0080);
        }

        body { font-family: 'Cairo', sans-serif; background-color: #f1f2f6; margin: 0; padding: 10px; padding-bottom: 50px; }
        .container { max-width: 600px; margin: auto; }

        /* زر تحميل التطبيق المتحرك */
        .app-download-btn {
            background: var(--neon-anim);
            background-size: 200% auto;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 50px;
            font-weight: 900;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            box-shadow: 0 10px 20px rgba(121, 40, 202, 0.3);
            animation: shine 3s linear infinite, bounce 2s infinite;
        }

        @keyframes shine { to { background-position: 200% center; } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        /* الكروت */
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: 1px solid #eee; position: relative; }
        
        .header-card { 
            background: var(--blue-grad); 
            color: white; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 25px;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 8px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.3s;
        }
        .logout-btn:hover { background: var(--danger); }

        /* زر الإدارة */
        .admin-contact { background: #ff9f43; color: white; padding: 15px; border-radius: 20px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 900; margin-bottom: 12px; box-shadow: 0 4px 12px rgba(255,159,67,0.3); }

        /* عداد الصلاحية */
        .expiry-card { background: var(--time-grad); color: white; border-radius: 20px; padding: 15px; text-align: center; margin-bottom: 15px; border: 2px solid var(--accent); }
        .timer-grid { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
        .timer-unit { background: rgba(255,255,255,0.1); padding: 8px; border-radius: 10px; min-width: 45px; }
        .timer-val { display: block; font-size: 1.2rem; font-weight: 900; color: var(--accent); }
        .timer-label { font-size: 0.6rem; opacity: 0.8; }

        /* الطلبيات */
        .order-card { background: white; border-radius: 25px; overflow: hidden; margin-bottom: 20px; border: 1px solid #eee; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .order-header { background: #f8f9fa; padding: 10px; font-size: 0.8rem; color: #666; display: flex; justify-content: space-between; }
        .order-body { padding: 20px; }
        .loc-badge { background: #eef2ff; color: #4338ca; padding: 5px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; margin-left: 5px; }

        /* النوافذ */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 400px; background: white; padding: 25px; border-radius: 30px; z-index: 2000; box-shadow: 0 25px 60px rgba(0,0,0,0.4); animation: pop 0.3s ease-out; }
        @keyframes pop { from { transform: translate(-50%, -60%) scale(0.9); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 1000; }
        
        .input-group { position: relative; margin-bottom: 12px; }
        .input-group i { position: absolute; right: 12px; top: 12px; color: #aaa; }
        .input-group input, .input-group textarea { width: 100%; padding: 10px 35px 10px 10px; border-radius: 12px; border: 2px solid #eee; font-family: 'Cairo'; box-sizing: border-box; }

        .action-btn { width: 100%; padding: 16px; border-radius: 20px; border: none; font-weight: 900; color: white; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1rem; text-decoration: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <a href="#" class="app-download-btn">
        <i class="fas fa-mobile-alt"></i> نزل تطبيق Future Site على هاتفك الآن
    </a>

    <div class="card header-card">
        <h2 id="storeName" style="margin:0; font-size: 1.2rem;">جاري التحميل...</h2>
        <button class="logout-btn" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> خروج
        </button>
    </div>

    <a href="https://wa.me/213561150865" class="admin-contact">
        <i class="fab fa-whatsapp"></i> تفعيل المتجر أو طلب تمديد الصلاحية
    </a>

    <div class="card" style="text-align:center; border:2px solid var(--url-color);">
        <h4 style="margin:0; color:var(--url-color);">رابط متجرك</h4>
        <div id="storeUrl" style="background:#f3f0ff; padding:10px; border-radius:10px; margin-top:5px; font-weight:900; word-break:break-all;">...</div>
        <button onclick="copyLink()" style="margin-top:10px; background:var(--url-color); color:white; border:none; padding:8px 20px; border-radius:50px; cursor:pointer; font-weight:bold;">نسخ الرابط</button>
    </div>

    <div class="expiry-card">
        <h4 style="margin:0;"><i class="fas fa-hourglass-half"></i> مدة صلاحية المتجر</h4>
        <div class="timer-grid">
            <div class="timer-unit"><span id="days" class="timer-val">00</span><span class="timer-label">يوم</span></div>
            <div class="timer-unit"><span id="hours" class="timer-val">00</span><span class="timer-label">ساعة</span></div>
            <div class="timer-unit"><span id="mins" class="timer-val">00</span><span class="timer-label">دقيقة</span></div>
            <div class="timer-unit"><span id="secs" class="timer-val">00</span><span class="timer-label">ثانية</span></div>
        </div>
    </div>

    <button class="action-btn" style="background:var(--url-color);" onclick="toggleSection('ordersSection')"><i class="fas fa-shopping-basket"></i> الطلبيات الواردة</button>
    <div id="ordersSection" class="hidden"><div id="ordersList"></div></div>

    <button class="action-btn" style="background:var(--success);" onclick="openAddModal()"><i class="fas fa-plus-circle"></i> إضافة منتج جديد</button>

    <button class="action-btn" style="background:var(--blue-grad);" onclick="toggleSection('manageSection')"><i class="fas fa-edit"></i> إدارة المنتجات</button>
    <div id="manageSection" class="hidden"><div id="productsList" style="background:white; border-radius:20px; padding:10px;"></div></div>
</div>

<div id="productModal" class="modal">
    <h3 id="modalTitle" style="text-align:center;">إضافة منتج</h3>
    <input type="hidden" id="editKey">
    <div class="input-group"><i class="fas fa-tag"></i><input type="text" id="pName" placeholder="اسم المنتج"></div>
    <div class="input-group"><i class="fas fa-money-bill-wave"></i><input type="number" id="pPrice" placeholder="السعر"></div>
    <div class="input-group"><i class="fas fa-align-left"></i><textarea id="pDesc" rows="3" placeholder="الوصف..."></textarea></div>
    <input type="file" id="pImage" accept="image/*" style="margin-bottom:15px;">
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <button id="saveBtn" style="background:var(--success); color:white; border:none; padding:12px; border-radius:15px; font-weight:900;">تأكيد ✅</button>
        <button onclick="closeAllModals()" style="background:#eee; padding:12px; border-radius:15px;">إلغاء</button>
    </div>
</div>

<div id="deleteModal" class="modal" style="text-align:center;">
    <h2 style="color:var(--danger)">هل أنت متأكد؟</h2>
    <p>سيتم حذف البيانات نهائياً.</p>
    <div style="display:flex; justify-content:center; gap:10px;">
        <button id="btnConfirmDel" style="background:var(--danger); color:white; border:none; padding:10px 25px; border-radius:15px; font-weight:900;">نعم، احذف</button>
        <button onclick="closeAllModals()" style="background:#eee; padding:10px 25px; border-radius:15px;">إلغاء</button>
    </div>
</div>

<div id="overlay" class="overlay" onclick="closeAllModals()"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storeId = localStorage.getItem('myStoreId');

    if (!storeId) { window.location.href = "login.html"; } // حماية: إذا لم يسجل دخول يرجع للبداية

    if (storeId) {
        onValue(ref(db, `stores/${storeId}`), s => {
            if(s.exists()){
                const d = s.val();
                document.getElementById('storeName').innerText = "متجر: " + d.name;
                document.getElementById('storeUrl').innerText = "future-site.com/" + storeId;
                
                setInterval(() => {
                    const diff = new Date(d.expiryDate).getTime() - new Date().getTime();
                    if(diff > 0){
                        document.getElementById('days').innerText = String(Math.floor(diff / 864e5)).padStart(2, '0');
                        document.getElementById('hours').innerText = String(Math.floor((diff % 864e5) / 36e5)).padStart(2, '0');
                        document.getElementById('mins').innerText = String(Math.floor((diff % 36e5) / 6e4)).padStart(2, '0');
                        document.getElementById('secs').innerText = String(Math.floor((diff % 6e4) / 1000)).padStart(2, '0');
                    }
                }, 1000);
            }
        });

        onValue(ref(db, `stores/${storeId}/orders`), snap => {
            const list = document.getElementById('ordersList'); list.innerHTML = "";
            if(snap.exists()) Object.entries(snap.val()).reverse().forEach(([id, o]) => {
                list.innerHTML += `
                <div class="order-card">
                    <div class="order-header"><span>📅 ${o.date || 'اليوم'}</span> <span>🆔 #${id.slice(-4)}</span></div>
                    <div class="order-body">
                        <strong>📦 ${o.productName}</strong><br>
                        <span style="font-size:1.2rem; font-weight:900;">👤 ${o.customerName}</span><br>
                        <span class="loc-badge">📍 ${o.customerState}</span><span class="loc-badge">🏘️ ${o.customerAddress}</span>
                        <a href="tel:${o.customerPhone}" style="background:#222; color:var(--accent); display:block; text-align:center; padding:10px; border-radius:12px; font-size:1.5rem; font-weight:900; text-decoration:none; margin:15px 0; border:1px solid var(--accent);">${o.customerPhone}</a>
                        <div style="display:grid; grid-template-columns: 3fr 1fr; gap:10px;">
                            <a href="tel:${o.customerPhone}" style="background:var(--success); color:white; text-decoration:none; padding:12px; border-radius:15px; text-align:center; font-weight:900;">إتصال</a>
                            <button onclick="askDelete('orders/${id}', 'الطلبية')" style="background:var(--danger); color:white; border:none; border-radius:15px;"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>`;
            });
        });

        onValue(ref(db, `stores/${storeId}/products`), snap => {
            const list = document.getElementById('productsList'); list.innerHTML = "";
            if(snap.exists()) Object.entries(snap.val()).forEach(([id, p]) => {
                list.innerHTML += `<div style="display:flex; align-items:center; gap:10px; padding:10px; border-bottom:1px solid #eee;">
                    <img src="${p.image}" width="40" height="40" style="border-radius:8px;">
                    <div style="flex:1;"><b>${p.name}</b></div>
                    <button onclick="editP('${id}','${p.name}','${p.price}','${p.description}')" style="background:#f39c12; color:white; border:none; padding:8px; border-radius:8px;"><i class="fas fa-pen"></i></button>
                    <button onclick="askDelete('products/${id}', 'المنتج')" style="background:red; color:white; border:none; padding:8px; border-radius:8px;"><i class="fas fa-trash"></i></button>
                </div>`;
            });
        });
    }

    // وظيفة الخروج
    window.logout = () => {
        if(confirm("هل تريد تسجيل الخروج؟")) {
            localStorage.removeItem('myStoreId');
            window.location.href = "index.html"; // أو اسم صفحة تسجيل الدخول لديك
        }
    };

    // الوظائف المساعدة
    window.copyLink = () => { navigator.clipboard.writeText(document.getElementById('storeUrl').innerText); alert("تم النسخ!"); };
    window.toggleSection = (id) => { document.getElementById(id).classList.toggle('hidden'); };
    window.closeAllModals = () => { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); document.getElementById('overlay').style.display='none'; };
    window.openAddModal = () => { document.getElementById('modalTitle').innerText="إضافة منتج"; document.getElementById('editKey').value=""; document.getElementById('productModal').style.display='block'; document.getElementById('overlay').style.display='block'; };
    
    window.editP = (k, n, p, d) => {
        document.getElementById('modalTitle').innerText="تعديل المنتج";
        document.getElementById('editKey').value=k; document.getElementById('pName').value=n;
        document.getElementById('pPrice').value=p; document.getElementById('pDesc').value=d;
        document.getElementById('productModal').style.display='block'; document.getElementById('overlay').style.display='block';
    };

    window.askDelete = (path, type) => {
        window.pathToDelete = path;
        document.getElementById('deleteModal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    };

    document.getElementById('btnConfirmDel').onclick = () => {
        remove(ref(db, `stores/${storeId}/${window.pathToDelete}`)).then(() => closeAllModals());
    };

    window.saveBtn.onclick = async () => {
        const k = document.getElementById('editKey').value, n = document.getElementById('pName').value, p = document.getElementById('pPrice').value, d = document.getElementById('pDesc').value, f = document.getElementById('pImage').files[0];
        if(!n || !p) return alert("أدخل البيانات");
        window.saveBtn.disabled = true;
        let img = "";
        if(f){
            const fd = new FormData(); fd.append("image", f);
            const res = await fetch("https://api.imgbb.com/1/upload?key=e48055a00c4440331de482c9a7b18e01", {method:"POST", body:fd});
            const j = await res.json(); img = j.data.url;
        }
        const data = { name:n, price:p, description:d }; if(img) data.image = img;
        if(k) update(ref(db, `stores/${storeId}/products/${k}`), data).then(()=>closeAllModals());
        else { if(!img) return alert("ارفع صورة"); push(ref(db, `stores/${storeId}/products`), data).then(()=>closeAllModals()); }
        window.saveBtn.disabled = false;
    };
</script>
</body>
</html>
