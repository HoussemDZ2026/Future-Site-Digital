<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3799">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --blue-grad: linear-gradient(135deg, #1e3799 0%, #0984e3 100%);
            --green-grad: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            --danger-grad: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            --cloud-grad: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            --royal-grad: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            --copy-grad: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            --accent-neon: #00f2fe;
        }

        body { font-family: 'Cairo', sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; padding-bottom: 60px; }
        .container { max-width: 500px; margin: auto; }

        /* الهيدر */
        .top-header { background: var(--blue-grad); padding: 20px; border-radius: 25px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(30, 55, 153, 0.2); }
        
        /* الأزرار الرئيسية */
        .main-action { width: 100%; padding: 18px; border-radius: 22px; border: none; font-weight: 900; color: white; cursor: pointer; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 1rem; transition: 0.3s; font-family: 'Cairo'; text-decoration: none; box-sizing: border-box; }
        .btn-copy { background: var(--copy-grad); border: 2px solid #fff; }
        .btn-download { background: var(--cloud-grad); border: 2px solid #fff; }
        .btn-support { background: var(--royal-grad); }
        .btn-orders { background: #2d3436; transition: all 0.3s ease; }
        .btn-orders.active { background: #ff4757; transform: scale(0.98); }
        .btn-add { background: var(--blue-grad); }
        .btn-manage { background: #57606f; }

        /* قسم الطلبيات */
        #ordersSection { transition: all 0.5s ease; overflow: hidden; }
        
        /* بطاقة الطلبية المحسنة */
        .order-card { 
            background: white; border-radius: 25px; padding: 20px; margin-bottom: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); position: relative; 
            border-top: 8px solid #0984e3; animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .order-date { font-size: 0.8rem; color: #7f8c8d; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
        .order-product { background: #f1f2f6; padding: 10px; border-radius: 12px; margin-bottom: 15px; border-right: 4px solid #1e3799; }
        .order-product b { color: #1e3799; font-size: 1.1rem; }

        .customer-info { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .cust-name { font-size: 1.2rem; font-weight: 900; color: #2d3436; }
        .cust-location { color: #6c5ce7; font-size: 0.9rem; font-weight: bold; background: #efedff; padding: 5px 12px; border-radius: 8px; width: fit-content; }

        .phone-display { 
            display: block; background: #fffbe6; color: #d48806; border: 2px dashed #ffe58f; 
            padding: 12px; border-radius: 15px; text-align: center; font-size: 1.5rem; 
            font-weight: 900; margin-bottom: 15px; letter-spacing: 2px;
        }

        .order-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-call { background: var(--green-grad); color: white; text-decoration: none; border-radius: 15px; display: flex; align-items: center; justify-content: center; height: 50px; font-weight: bold; }
        .btn-delete-order { background: #fff1f2; color: #ff4757; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; font-family: 'Cairo'; }

        /* رسالة لا يوجد طلبيات */
        .no-orders { text-align: center; padding: 40px 20px; background: white; border-radius: 25px; color: #95a5a6; }

        /* المودالات */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 10000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: white; padding: 30px; border-radius: 35px; text-align: center; width: 100%; max-width: 350px; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="smartLock" class="hidden">
    <div style="text-align: center; padding: 50px;">
        <i class="fas fa-user-lock" style="font-size: 80px; color: #ff4757;"></i>
        <h1 style="font-weight: 900;">المتجر متوقف</h1>
        <p>يرجى التواصل مع الإدارة للتفعيل.</p>
    </div>
</div>

<div class="container" id="mainAppContent">
    <div class="top-header">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div style="background: rgba(255,255,255,0.2); width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center;"><i class="fas fa-store" style="color: white;"></i></div>
            <span id="storeNameDisp" style="color: white; font-weight: 900;">جاري التحميل...</span>
        </div>
        <button onclick="logout()" style="background:none; border: 1px solid white; color: white; padding: 5px 15px; border-radius: 10px;">خروج</button>
    </div>

    <button class="main-action btn-copy" onclick="copyStoreLink()"><i class="fas fa-link"></i> نسخ رابط المتجر</button>
    
    <button class="main-action btn-orders" id="toggleOrdersBtn" onclick="toggleOrders()">
        <i class="fas fa-shopping-basket"></i> 
        <span id="ordersBtnText">عرض طلبيات الوردة</span>
    </button>

    <div id="ordersSection" class="hidden">
        <div id="ordersList"></div>
    </div>

    <hr style="border: 0; height: 1px; background: #eee; margin: 20px 0;">

    <button class="main-action btn-add" onclick="openAddModal()"><i class="fas fa-plus-circle"></i> إضافة منتج جديد</button>
    <button class="main-action btn-manage" onclick="toggleSec('manageSection')"><i class="fas fa-tasks"></i> إدارة المنتجات</button>
    <div id="manageSection" class="hidden"><div id="productsList"></div></div>
</div>

<div id="customModal" class="modal">
    <div class="modal-content">
        <div id="modalIcon" style="font-size: 60px; margin-bottom: 15px;"></div>
        <h3 id="modalTitle" style="margin: 10px 0; font-weight: 900;"></h3>
        <p id="modalText" style="color: #7f8c8d; margin-bottom: 25px;"></p>
        <div id="modalBtns" style="display: flex; gap: 10px;"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storeId = localStorage.getItem('myStoreId');

    if(!storeId) window.location.href = "index.html";

    let currentOrders = {};

    // جلب بيانات المتجر
    onValue(ref(db, `stores/${storeId}`), (snap) => {
        if (snap.exists()) {
            const data = snap.val();
            document.getElementById('storeNameDisp').innerText = data.name;
            currentOrders = data.orders || {};
            renderOrders(currentOrders);
            // تحديث قائمة المنتجات أيضاً
            renderProducts(data.products || {});
        }
    });

    // تبديل عرض الطلبيات
    window.toggleOrders = () => {
        const sec = document.getElementById('ordersSection');
        const btn = document.getElementById('toggleOrdersBtn');
        const btnText = document.getElementById('ordersBtnText');
        
        if(sec.classList.contains('hidden')) {
            sec.classList.remove('hidden');
            btn.classList.add('active');
            btnText.innerText = "إخفاء الطلبيات";
        } else {
            sec.classList.add('hidden');
            btn.classList.remove('active');
            btnText.innerText = "عرض طلبيات الوردة";
        }
    };

    // عرض الطلبيات
    function renderOrders(orders) {
        const list = document.getElementById('ordersList');
        const entries = Object.entries(orders);
        
        if(entries.length === 0) {
            list.innerHTML = `
                <div class="no-orders">
                    <i class="fas fa-box-open" style="font-size: 50px; display: block; margin-bottom: 10px; color: #dfe6e9;"></i>
                    <p>لا يوجد طلبيات حالياً في متجرك</p>
                </div>`;
            return;
        }

        list.innerHTML = "";
        entries.reverse().forEach(([id, o]) => {
            // تنسيق رقم الهاتف ليصبح مقروءاً (06 00 00 00 00)
            const formattedPhone = o.phone ? o.phone.replace(/(\d{2})(?=\d)/g, '$1 ') : '---';
            
            list.innerHTML += `
            <div class="order-card">
                <div class="order-date"><i class="far fa-calendar-alt"></i> وصل في: ${o.date || 'غير محدد'}</div>
                <div class="order-product">
                    <small>المنتج المطلوب:</small><br>
                    <b>${o.productName}</b>
                </div>
                <div class="customer-info">
                    <span class="cust-name"><i class="fas fa-user"></i> ${o.customerName}</span>
                    <span class="cust-location"><i class="fas fa-map-marker-alt"></i> ${o.wilaya} - ${o.baladia}</span>
                </div>
                <div class="phone-display">${formattedPhone}</div>
                <div class="order-actions">
                    <a href="tel:${o.phone}" class="btn-call"><i class="fas fa-phone-alt"></i> إتصال</a>
                    <button onclick="confirmDeleteOrder('${id}')" class="btn-delete-order"><i class="fas fa-trash-alt"></i> حذف</button>
                </div>
            </div>`;
        });
    }

    // تأكيد الحذف بنافذة جذابة
    window.confirmDeleteOrder = (orderId) => {
        const modal = document.getElementById('customModal');
        const btns = document.getElementById('modalBtns');
        
        document.getElementById('modalIcon').innerHTML = "🗑️";
        document.getElementById('modalIcon').style.color = "#ff4757";
        document.getElementById('modalTitle').innerText = "هل أنت متأكد؟";
        document.getElementById('modalText').innerText = "سيتم حذف هذه الطلبية نهائياً من القائمة ولا يمكنك التراجع.";
        
        btns.innerHTML = `
            <button class="main-action" style="background:#ff4757; margin:0; flex:2;" onclick="executeDeleteOrder('${orderId}')">نعم، احذف</button>
            <button class="main-action" style="background:#eee; color:#333; margin:0; flex:1;" onclick="closeModal()">إلغاء</button>
        `;
        
        modal.style.display = 'flex';
    };

    // تنفيذ الحذف
    window.executeDeleteOrder = (id) => {
        remove(ref(db, `stores/${storeId}/orders/${id}`)).then(() => {
            showSuccessMessage();
        });
    };

    function showSuccessMessage() {
        const modal = document.getElementById('customModal');
        document.getElementById('modalIcon').innerHTML = "✨";
        document.getElementById('modalIcon').style.color = "#2ecc71";
        document.getElementById('modalTitle').innerText = "تم بنجاح";
        document.getElementById('modalText').innerText = "تم حذف الطلبية بنجاح من نظامك.";
        document.getElementById('modalBtns').innerHTML = `
            <button class="main-action" style="background:var(--green-grad); width:100%; margin:0;" onclick="closeModal()">ممتاز</button>
        `;
    }

    // بقية الدوال (إضافة منتج، نسخ الرابط، إلخ)
    window.closeModal = () => document.getElementById('customModal').style.display = 'none';
    
    window.copyStoreLink = () => {
        const link = `https://future-site-digital.netlify.app/store.html?id=${storeId}`;
        navigator.clipboard.writeText(link).then(() => {
            alert("تم نسخ رابط متجرك!");
        });
    };

    // دالة عرض المنتجات الموجودة سابقاً
    function renderProducts(products) {
        const list = document.getElementById('productsList'); 
        list.innerHTML = "";
        Object.entries(products).forEach(([id, p]) => {
            list.innerHTML += `
            <div style="background:white; margin:10px 0; padding:15px; border-radius:20px; display:flex; align-items:center; gap:12px; box-shadow:0 5px 15px rgba(0,0,0,0.05);">
                <img src="${p.image || ''}" style="width:50px; height:50px; border-radius:12px; object-fit:cover;">
                <div style="flex:1"><b style="color:#1e3799;">${p.name}</b><br><small style="color:#2ecc71;">${p.price} دج</small></div>
                <button onclick="confirmDeleteProduct('${id}')" style="background:#ff4757; color:white; border:none; padding:10px; border-radius:10px;"><i class="fas fa-trash"></i></button>
            </div>`;
        });
    }

    window.toggleSec = (id) => document.getElementById(id).classList.toggle('hidden');
    window.logout = () => { localStorage.clear(); window.location.href = "index.html"; };
</script>

</body>
            </html>
