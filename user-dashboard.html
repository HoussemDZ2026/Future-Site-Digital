<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | Future Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --brand-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --gold-gradient: linear-gradient(135deg, #FFD700, #FDBB2D);
            --wa-grad: linear-gradient(135deg, #25d366, #128c7e);
            --success: #00b894;
            --danger: #ff7675;
            --bg: #f1f5f9;
        }

        body { font-family: 'Cairo', sans-serif; background: var(--bg); margin: 0; padding-bottom: 50px; color: #2d3436; }
        .container { max-width: 700px; margin: auto; padding: 15px; }

        .store-header-box { 
            background: var(--brand-gradient); padding: 50px 20px; 
            border-radius: 0 0 50px 50px; text-align: center; color: white; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); margin-bottom: 25px;
            border-bottom: 5px solid var(--gold-gradient);
        }
        .store-header-box h1 { margin: 0; font-size: 2.2rem; font-weight: 900; }

        .url-box { 
            background: white; padding: 18px; border-radius: 20px; 
            display: flex; align-items: center; justify-content: space-between; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transform: translateY(-40px); margin: 0 auto -20px auto; width: 90%;
        }

        .expiry-container { background: #1a1a1a; color: #fff; padding: 15px; border-radius: 20px; text-align: center; margin-bottom: 25px; border: 2px solid #333; }
        #expiryTimer { font-size: 1.4rem; font-weight: 900; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* أزرار الطلبيات المستلمة */
        .toggle-orders-btn {
            background: #2d3436; color: white; border: none; padding: 15px; border-radius: 15px;
            width: 100%; font-weight: 900; font-size: 1.1rem; cursor: pointer; margin: 20px 0;
            display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s;
        }
        .toggle-orders-btn:active { transform: scale(0.98); }

        /* بطاقة الطلبية */
        .order-card {
            background: white; border-radius: 25px; padding: 20px; margin-bottom: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08); border-right: 10px solid #3498db;
        }
        .cust-name { font-size: 1.4rem; font-weight: 900; color: #2c3e50; background: #eef2f7; padding: 8px 15px; border-radius: 12px; display: inline-block; width:100%; box-sizing: border-box; }
        .phone-badge { background: var(--wa-grad); color: white; padding: 12px; border-radius: 15px; font-weight: 900; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; gap: 12px; text-decoration: none; margin: 15px 0; }
        .location-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .loc-box { background: #f8f9fa; padding: 10px; border-radius: 12px; text-align: center; border: 1px solid #eee; }
        .prod-tag { background: #fff3cd; color: #856404; padding: 12px; border-radius: 12px; font-weight: 900; border: 1px dashed #ffeeba; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }

        /* المنتجات */
        .prod-item { background: white; padding: 15px; border-radius: 20px; display: flex; align-items: center; gap: 15px; margin-bottom: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .btn-edit { background: #3498db; color: white; border: none; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; }
        .btn-del { background: var(--danger); color: white; border: none; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; }

        .modal { background: white; padding: 25px; border-radius: 30px; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 92%; max-width: 450px; z-index: 1000; box-shadow: 0 0 100px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto; }
        .hidden { display: none; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #ddd; font-family: 'Cairo'; box-sizing: border-box; font-weight: bold; }
        
        .admin-btn-gold { background: var(--gold-gradient); color: #000; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 18px; border-radius: 20px; font-weight: 900; margin: 10px 0; border: none; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

<div class="store-header-box"><h1 id="storeName">تحميل...</h1></div>

<div class="container">
    <div class="url-box">
        <span id="storeUrl" style="font-size: 0.8rem; font-weight: bold; color: #2a5298; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 80%;">رابط المتجر...</span>
        <button onclick="copyUrl()" style="background:none; border:none; color:#2a5298; cursor:pointer; font-size: 1.2rem;"><i class="far fa-copy"></i></button>
    </div>

    <div class="expiry-container">
        <span style="font-size: 0.8rem; color: #aaa;">حالة تفعيل المتجر</span>
        <div id="expiryTimer">جاري الفحص...</div>
    </div>

    <a href="https://wa.me/213561150865" class="admin-btn-gold"><i class="fab fa-whatsapp"></i> تواصل مع الإدارة (الدعم الفني)</a>

    <button class="toggle-orders-btn" onclick="toggleOrders()">
        <i class="fas fa-box-open"></i> 
        <span id="orderBtnText">إظهار الطلبيات المستلمة</span>
    </button>
    <div id="ordersDisplay" class="hidden"></div>

    <hr style="margin: 40px 0; border: 1px solid #ddd;">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>🛒 منتجاتك المعروضة</h2>
        <button onclick="openAddModal()" style="background:var(--success); color:white; border:none; padding:10px 20px; border-radius:12px; font-weight:900; cursor:pointer;">+ إضافة منتج</button>
    </div>
    <div id="productsDisplay"></div>
</div>

<div id="productModal" class="modal hidden">
    <h3 id="modalTitle" style="text-align: center;">إضافة منتج</h3>
    <input type="text" id="pTitle" placeholder="اسم المنتج">
    <input type="number" id="pPrice" placeholder="السعر (دج)">
    <textarea id="pDesc" placeholder="وصف المنتج"></textarea>
    
    <div style="background:#f9f9f9; padding:10px; border-radius:12px; margin-bottom:10px; border:1px solid #eee;">
        <label style="font-size: 0.8rem; font-weight: bold; color: #555;">تفعيل عداد تنازلي؟ (اختياري)</label>
        <input type="datetime-local" id="pTimerDate" style="margin-top:5px;">
    </div>

    <input type="file" id="pImg" accept="image/*">
    <button id="submitBtn" class="admin-btn-gold" style="background:var(--success); color:white;">حفظ البيانات</button>
    <button onclick="closeModal()" style="width:100%; background:none; border:none; margin-top:10px; color:#999; cursor:pointer;">إغلاق</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove, update, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCdnCI1cKdR4wvU2Y_cnw9essx1MYgA2w",
        authDomain: "futuresite-74037.firebaseapp.com",
        databaseURL: "https://futuresite-74037-default-rtdb.firebaseio.com",
        projectId: "futuresite-74037",
        storageBucket: "futuresite-74037.firebasestorage.app",
        appId: "1:643691438622:web:78f958cb5ba52a6069c40f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);
    const storeId = localStorage.getItem('myStoreId');
    let editId = null;

    // جلب بيانات المتجر والرابط
    onValue(ref(db, `stores/${storeId}`), (s) => {
        if(s.exists()){
            const data = s.val();
            document.getElementById('storeName').innerText = data.name;
            let currentPath = window.location.pathname;
            let directory = currentPath.substring(0, currentPath.lastIndexOf('/'));
            const finalUrl = `${window.location.origin}${directory}/store.html?id=${storeId}`;
            document.getElementById('storeUrl').innerText = finalUrl;
            
            startExpiryTimer(data.expiryDate || data.expiryTimestamp || 0);
        }
    });

    // تبديل عرض الطلبيات
    window.toggleOrders = () => {
        const box = document.getElementById('ordersDisplay');
        const btnText = document.getElementById('orderBtnText');
        if(box.classList.contains('hidden')) {
            box.classList.remove('hidden');
            btnText.innerText = "إخفاء الطلبيات";
        } else {
            box.classList.add('hidden');
            btnText.innerText = "إظهار الطلبيات المستلمة";
        }
    };

    // عرض الطلبيات
    onValue(ref(db, `stores/${storeId}/orders`), snap => {
        const box = document.getElementById('ordersDisplay');
        box.innerHTML = !snap.exists() ? '<p style="text-align:center; padding: 20px;">لا توجد طلبيات بعد</p>' : "";
        if(snap.exists()){
            Object.entries(snap.val()).reverse().forEach(([key, o]) => {
                box.innerHTML += `
                <div class="order-card">
                    <div class="cust-name"><i class="fas fa-user-circle"></i> ${o.customerName}</div>
                    <div class="location-grid">
                        <div class="loc-box"><span>الولاية</span><strong>${o.customerState}</strong></div>
                        <div class="loc-box"><span>البلدية</span><strong>${o.customerAddress}</strong></div>
                    </div>
                    <div class="prod-tag"><i class="fas fa-shopping-bag"></i> ${o.productName}</div>
                    <a href="tel:${o.customerPhone}" class="phone-badge">
                        <i class="fas fa-phone-alt"></i> إتصال: ${o.customerPhone}
                    </a>
                    <button onclick="deleteOrder('${key}')" style="background:none; border:none; color:red; cursor:pointer;"><i class="fas fa-trash-alt"></i> حذف الطلب</button>
                </div>`;
            });
        }
    });

    // عرض المنتجات
    onValue(ref(db, `stores/${storeId}/products`), snap => {
        const box = document.getElementById('productsDisplay'); box.innerHTML = "";
        if(snap.exists()){
            Object.entries(snap.val()).forEach(([key, p]) => {
                box.innerHTML += `
                <div class="prod-item">
                    <img src="${p.image}" style="width:65px; height:65px; border-radius:15px; object-fit:cover;">
                    <div style="flex:1"><strong>${p.name}</strong><br><span style="color:var(--success); font-weight:900;">${p.price} دج</span></div>
                    <div style="display:flex; gap:8px;">
                        <button class="btn-edit" onclick="prepareEdit('${key}', '${p.name}', '${p.price}', '${p.description || ''}', '${p.timerDate || ''}')"><i class="fas fa-edit"></i></button>
                        <button class="btn-del" onclick="deleteProduct('${key}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
            });
        }
    });

    // عداد الصلاحية المتطور
    function startExpiryTimer(endTime) {
        const el = document.getElementById('expiryTimer');
        setInterval(() => {
            const diff = endTime - Date.now();
            if(diff <= 0) { el.innerText = "منتهي الصلاحية"; return; }
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            if (days >= 1) {
                el.innerText = `باقي: ${days} يوم و ${hours} ساعة`;
            } else {
                // عرض الساعات والدقائق والثواني إذا كان أقل من يوم
                el.innerText = `باقي: ${hours} سا : ${minutes} د : ${seconds} ث`;
                el.style.color = "#ff7675"; // تلوين الوقت بالأحمر للتنبيه
            }
        }, 1000);
    }

    // بقية الدوال (الحذف، الإضافة، النسخ)
    window.deleteOrder = (k) => confirm("حذف الطلب؟") && remove(ref(db, `stores/${storeId}/orders/${k}`));
    window.deleteProduct = (k) => confirm("حذف المنتج؟") && remove(ref(db, `stores/${storeId}/products/${k}`));
    window.copyUrl = () => { navigator.clipboard.writeText(document.getElementById('storeUrl').innerText); alert("تم النسخ! ✅"); };
    window.closeModal = () => document.getElementById('productModal').classList.add('hidden');
    window.openAddModal = () => { editId = null; document.getElementById('productModal').classList.remove('hidden'); };
    window.prepareEdit = (id, name, price, desc, tDate) => {
        editId = id;
        document.getElementById('modalTitle').innerText = "تعديل المنتج";
        document.getElementById('pTitle').value = name;
        document.getElementById('pPrice').value = price;
        document.getElementById('pDesc').value = desc;
        document.getElementById('pTimerDate').value = tDate;
        document.getElementById('productModal').classList.remove('hidden');
    };

    document.getElementById('submitBtn').onclick = async () => {
        const name = document.getElementById('pTitle').value, price = document.getElementById('pPrice').value,
              desc = document.getElementById('pDesc').value, tDate = document.getElementById('pTimerDate').value,
              file = document.getElementById('pImg').files[0];
        if(!name || !price) return alert("أدخل البيانات الأساسية");
        let data = { name, price, description: desc, timerDate: tDate };
        if(file){
            const snap = await uploadBytes(sRef(storage, `p/${Date.now()}`), file);
            data.image = await getDownloadURL(snap.ref);
        }
        if(editId) await update(ref(db, `stores/${storeId}/products/${editId}`), data);
        else await push(ref(db, `stores/${storeId}/products`), {...data, timestamp: Date.now()});
        closeModal();
    };
</script>
</body>
</html>
